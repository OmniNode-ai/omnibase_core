---
# Rule values of the hook-writes check (OMN-21433, plan task T2.6).
#
# A pre-commit hook checks and refuses; it never rewrites the files it was given.
# The rule is the handler `HandlerHookWrites`; every value it judges by is here.
# Add a signal or a rewriting hook id by editing this file, never the handler.
#
# signals: regular expressions searched in the hook's command text (its `entry`
#   followed by its `args`). A signal fires when `pattern` matches and `unless`
#   (when present) does not.
# rewriting_hooks: hook ids from remote repositories that rewrite files by design.
#   The id is a finding unless one of `check_only_args` is among the hook's args.
signals:
  - id: ruff-format-writes
    pattern: '\bruff\s+format\b'
    unless: '(?<![\w-])--(?:check|diff)\b'
    reason: ruff format rewrites the files it is given unless it runs with --check or --diff
  - id: fix-flag
    pattern: '(?<![\w-])--fix\b'
    unless: '(?<![\w-])--no-fix\b'
    reason: a --fix flag makes the tool rewrite the files it is given
  - id: write-flag
    pattern: '\s--(?:write|in-place|inplace)\b'
    reason: a --write or --in-place flag makes the tool rewrite the files it is given
  - id: in-place-edit
    pattern: '\b(?:sed|perl)\b[^|;&]*\s-[A-Za-z]*i'
    reason: sed -i and perl -i edit the named files in place
  - id: remove-files
    pattern: '\brm\s+(?:-[A-Za-z]+\s+)*+(?![\\"'']*\$|/tmp/|/dev/)'
    reason: rm deletes files outside a temporary directory the entry itself created
  - id: git-index-or-tree-write
    pattern: '\bgit\s+(?:add|rm|mv|restore)\b'
    reason: git add, rm, mv and restore change the index or the working tree
rewriting_hooks:
  - id: end-of-file-fixer
    reason: pre-commit-hooks rewrites the final newline
  - id: trailing-whitespace
    reason: pre-commit-hooks strips trailing whitespace
  - id: mixed-line-ending
    check_only_args: ["--fix=no"]
    reason: pre-commit-hooks rewrites line endings unless --fix=no
  - id: fix-byte-order-marker
    reason: pre-commit-hooks strips the byte order marker
  - id: fix-encoding-pragma
    reason: pre-commit-hooks rewrites the encoding pragma
  - id: pretty-format-json
    check_only_args: ["--no-autofix"]
    reason: pre-commit-hooks rewrites json files unless --no-autofix
  - id: requirements-txt-fixer
    reason: pre-commit-hooks sorts requirements files in place
  - id: double-quote-string-fixer
    reason: pre-commit-hooks rewrites string quotes
  - id: yamlfmt
    check_only_args: ["-lint"]
    reason: yamlfmt rewrites yaml files unless it runs with -lint
  - id: black
    check_only_args: ["--check", "--diff"]
    reason: black rewrites python files unless it runs with --check or --diff
  - id: isort
    check_only_args: ["--check", "--check-only", "--diff"]
    reason: isort rewrites imports unless it runs with --check or --diff
  - id: ruff-format
    check_only_args: ["--check", "--diff"]
    reason: ruff-format rewrites python files unless it runs with --check or --diff
  - id: prettier
    check_only_args: ["--check"]
    reason: prettier rewrites files unless it runs with --check
