---
# SPDX-FileCopyrightText: 2025 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
# onex-allow-file-todo-marker OMN-13480 reason="workflow validates TODO marker policy; marker strings are scanner input"

# stale-todo-gate.yml
#
# CI gate: check that TODO/FIXME/HACK comments in changed Python files
# do not reference Linear tickets in terminal states (Done/Canceled).
#
# Copy this file to .github/workflows/stale-todo-gate.yml in each repo.
#
# Requires: LINEAR_API_KEY as an org/repo secret.
# Graceful degradation: if LINEAR_API_KEY is unset, the check is skipped
# (exit 0) with a visible warning.
#
# Implements OMN-5688.

name: Stale TODO Gate

on:
  pull_request:
    branches: [main, dev]

jobs:
  occ-preflight:
    # Poller, not a re-emitter (OMN-15112 collapse-to-one-producer): this job
    # does NOT call the reusable occ-preflight.yml workflow. It polls the ONE
    # canonical "occ-preflight / eligibility" check-run -- produced solely by
    # call-occ-preflight.yml, the repo's single unconditional-on-every-PR
    # caller -- via the Checks API, and blocks/fails this workflow's downstream
    # job accordingly. Copied from the pattern omnimarket and omniclaude already
    # run safely to avoid re-emitting the shared context name from every
    # workflow file that needs to gate on it (GH Actions `needs:` cannot cross
    # workflow files, so each file still needs its own gate -- but the gate
    # does not have to be its own duplicate emission of the reusable workflow).
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-15112: desynchronize same-PR pollers across workflow files (GH
          # Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and
          # exhaust the shared per-repo GitHub App installation rate-limit
          # bucket (same rationale as omnimarket's OMN-14343).
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # GH Actions runs `run:` steps under `bash -e {0}` by default --
            # that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear
            # an inherited -e. A bare `response="$(gh api ...)"; status=$?`
            # would therefore abort the whole step on ANY gh api failure
            # before status is ever checked, silently defeating the retry
            # logic below. Using the command substitution as the condition of
            # this `if` is the errexit-safe form -- bash does not trigger -e
            # for a command that is part of an if/while/until condition,
            # regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  stale-todo-gate:
    needs: occ-preflight
    if: always()
    name: Stale TODO Gate
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}

    steps:
      # OMN-15112 vector-5 fix: `needs: occ-preflight` alone lets GitHub's
      # implicit `success()`-over-needs skip this job when occ-preflight
      # fails/cancels, and a skipped job satisfies branch protection as
      # passing. `if: always()` above stops the skip; this step is the other
      # required half — it explicitly fails the job when occ-preflight did
      # not succeed, so the job's own conclusion is FAILURE, never a
      # decorative pass.
      - name: Fail when OCC preflight fails
        if: needs.occ-preflight.result != 'success'
        run: |
          echo "::error::occ-preflight result was ${{ needs.occ-preflight.result }}; refusing to run Stale TODO Gate."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for stale TODOs in changed files
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # --- Graceful degradation ---
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::warning::LINEAR_API_KEY not set -- stale-TODO gate skipped"
            exit 0
          fi

          # --- Collect changed .py files ---
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- '*.py' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed -- nothing to check."
            exit 0
          fi

          # --- Extract unique OMN-XXXX ticket IDs from TODO comments ---
          TICKET_IDS=""
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            # Match TODO(OMN-1234), FIXME(OMN-1234), HACK(OMN-1234) in comments
            IDS=$(grep -oE '#.*\b(TODO|FIXME|HACK)\(OMN-[0-9]+\)' "$file" 2>/dev/null \
              | grep -oE 'OMN-[0-9]+' || true)
            if [ -n "$IDS" ]; then
              TICKET_IDS="$TICKET_IDS"$'\n'"$IDS"
            fi
          done <<< "$CHANGED_FILES"

          UNIQUE_IDS=$(echo "$TICKET_IDS" | sort -u | grep -v '^$' || true)
          if [ -z "$UNIQUE_IDS" ]; then
            echo "No TODO ticket references found in changed files -- clean."
            exit 0
          fi

          echo "Found ticket references: $(echo "$UNIQUE_IDS" | tr '\n' ' ')"

          # --- Query Linear for ticket states ---
          # Build a filter query to batch-check all ticket IDs
          STALE_TICKETS=""
          STALE_COUNT=0

          while IFS= read -r TICKET_ID; do
            [ -z "$TICKET_ID" ] && continue

            # Validate format
            if ! echo "$TICKET_ID" | grep -qE '^OMN-[0-9]+$'; then
              continue
            fi

            RESPONSE=$(curl -s --max-time 15 -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"{ issue(id: \\\"$TICKET_ID\\\") { identifier title state { name type } } }\"}" \
              2>&1)

            STATE_TYPE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issue = data.get('data', {}).get('issue')
          if issue:
              print(issue.get('state', {}).get('type', ''))
          else:
              print('NOT_FOUND')
          " 2>/dev/null || echo "UNKNOWN")

            STATE_NAME=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issue = data.get('data', {}).get('issue')
          if issue:
              print(issue.get('state', {}).get('name', ''))
          else:
              print('')
          " 2>/dev/null || echo "")

            TITLE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issue = data.get('data', {}).get('issue')
          if issue:
              print(issue.get('title', ''))
          else:
              print('')
          " 2>/dev/null || echo "")

            # Terminal states: COMPLETED or CANCELED (using Linear's state type field)
            if echo "$STATE_TYPE" | grep -qiE '^(completed|canceled|cancelled)$'; then
              STALE_COUNT=$((STALE_COUNT + 1))
              STALE_TICKETS="${STALE_TICKETS}  - ${TICKET_ID} (${STATE_NAME}): ${TITLE}"$'\n'

              # Find which files reference this ticket
              while IFS= read -r file; do
                [ -f "$file" ] || continue
                LOCATIONS=$(grep -n "TODO.*${TICKET_ID}\|FIXME.*${TICKET_ID}\|HACK.*${TICKET_ID}" "$file" 2>/dev/null || true)
                if [ -n "$LOCATIONS" ]; then
                  while IFS= read -r loc; do
                    STALE_TICKETS="${STALE_TICKETS}    ${file}:${loc}"$'\n'
                  done <<< "$LOCATIONS"
                fi
              done <<< "$CHANGED_FILES"
            fi
          done <<< "$UNIQUE_IDS"

          if [ "$STALE_COUNT" -gt 0 ]; then
            echo ""
            echo "::error::Found ${STALE_COUNT} stale TODO(s) referencing closed/canceled tickets:"
            echo ""
            echo "$STALE_TICKETS"
            echo ""
            echo "These TODOs reference tickets that are already Done or Canceled."
            echo "Either remove the TODO or create a new ticket for the remaining work."
            exit 1
          fi

          echo "All ${UNIQUE_IDS_COUNT:-$(echo "$UNIQUE_IDS" | wc -l | tr -d ' ')} TODO ticket references are active -- clean."
