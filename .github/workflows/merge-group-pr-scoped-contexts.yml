#
# Merge-group PR-scoped contexts (OMN-20375).
#
# `dev` here is queue-controlled. A queue commit must carry every context that
# branch protection requires, or the entry waits until
# the queue's check timeout and is ejected. The contexts below come from
# workflows that run on `pull_request` only: they read the pull request itself
# (title, body, review, diff against its base) or call a cross-repo reusable
# that refuses a non-PR event, so they cannot run on a queue commit.
#
# This workflow reports each of them on the queue commit from the verdict the
# SAME context already reached on the queued pull request's head, the way
# omnibase_infra's merge_group short-circuits ("proven on the PR run") do, with
# one difference: it does not assume the verdict, it reads it. `resolve` reads
# the pull request named by the queue ref, lists the check-runs on its head
# sha, and takes the newest row per name; each report job reads its own. A context passes only when that
# row concluded success, neutral or skipped, the same set branch protection
# accepts. A context with no row on the head, a red row, an unreadable ref or a
# failed API read fails that context, so nothing here can pass a head the
# pull-request run did not pass.
#
# It runs on `merge_group` ONLY. On a pull request it never runs, so it can
# never stand in for, shadow or race the real producer of any context.
#
# Keep the list exact: a context missing here, whose producer has no
# merge_group trigger, stalls the queue; a name that drifts from its producer
# fails here on the first queue entry, loudly, never silently.

name: Merge Group PR-Scoped Contexts

on:
  merge_group:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  # Each queue entry has its own ref, so entries never cancel one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve PR-head verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdicts: ${{ steps.read.outputs.verdicts }}
    steps:
      - name: Read the queued pull request's head verdicts
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$QUEUE_REF" =~ /pr-([1-9][0-9]*)-[0-9a-f]{40}$ ]]; then
            echo "::error::merge-queue ref '${QUEUE_REF}' names no pull request"
            exit 1
          fi
          pr="${BASH_REMATCH[1]}"
          head_sha="$(gh api "repos/${REPO}/pulls/${pr}" --jq .head.sha)"
          echo "queued pull request #${pr}, head ${head_sha}"
          gh api --paginate "repos/${REPO}/commits/${head_sha}/check-runs?per_page=100" \
            --jq '.check_runs[] | {id, name, status, conclusion}' > "$RUNNER_TEMP/rows.jsonl"
          python3 - <<'PY'
          import json, os
          # One verdict per check-run name on the head; each `report` job
          # looks up its own context, so the list lives only in the matrix.
          newest = {}
          with open(os.path.join(os.environ["RUNNER_TEMP"], "rows.jsonl")) as fh:
              for line in fh:
                  row = json.loads(line)
                  if row["name"] not in newest or row["id"] > newest[row["name"]]["id"]:
                      newest[row["name"]] = row
          ok = {"success", "neutral", "skipped"}
          verdicts = {}
          for name, row in sorted(newest.items()):
              if row["status"] != "completed":
                  verdicts[name] = f"still {row['status']} on the pull request head"
              elif row["conclusion"] not in ok:
                  verdicts[name] = f"concluded {row['conclusion']} on the pull request head"
              else:
                  verdicts[name] = "pass"
              print(f"{name}: {verdicts[name]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("verdicts=" + json.dumps(verdicts) + "\n")
          PY

  report:
    name: ${{ matrix.context }}
    needs: [resolve]
    # always(): if `resolve` fails, every context must still report (red) on
    # this queue commit. A skipped matrix job reports under its unexpanded
    # name, which would leave the real context unreported until the timeout.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # One name below is spelled with a YAML \u escape, which parses to the
        # exact context name: the work-marker pre-commit hook reads the plain
        # spelling of that gate's name as an agent-left marker.
        context:
          - "pr-title / check-title"
          - "no-plugin-daemon-classes"
          - "receipt-honesty"
          - "runtime-profiles"
          - "fsm-handler-drift"
          - "Check architecture handshake"
          - "Stale \u0054ODO Gate"
          - "AST Risk Labeler"
          - "ONEX Architecture Compliance"
          - "Legacy Compatibility Check"
          - "Decommissioned Pattern Scanner (OMN-4801)"
          - "CI Naming Convention"
          - "main-target-guard"
          - "Ecosystem Integration Validation"
          - "kb-doc-gate / kb-doc-gate"
    steps:
      - name: Report the pull request head verdict
        env:
          CONTEXT: ${{ matrix.context }}
          VERDICTS: ${{ needs.resolve.outputs.verdicts }}
        run: |
          set -euo pipefail
          verdict="$(python3 -c 'import json, os; v = os.environ.get("VERDICTS"); print(json.loads(v).get(os.environ["CONTEXT"], "absent on the pull request head") if v else "not resolved: the resolve job did not finish")')"
          echo "${CONTEXT}: ${verdict}"
          if [[ "$verdict" != "pass" ]]; then
            echo "::error::${CONTEXT} is not proven on the queued pull request head (${verdict})"
            exit 1
          fi
