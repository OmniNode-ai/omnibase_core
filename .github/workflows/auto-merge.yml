# SPDX-License-Identifier: MIT
#
# OMN-6571: Automatically enable auto-merge on every PR opened
# by jonahgabriel. Ensures PRs do not sit idle in the merge queue waiting
# for manual enrollment.
#
# OMN-7786: Re-trigger on review and check_suite events so the workflow
# re-attempts auto-merge after CodeRabbit review finishes and branch
# protection gates clear. Silent continue-on-error removed; "already
# enqueued" races are tolerated but real failures surface.
#
# OMN-9398: Add explicit enqueuePullRequest step after arming auto-merge.
# Arming auto-merge (gh pr merge --auto) is not the same as enqueuing —
# the PR sits armed but idle until enqueuePullRequest is called. This was
# the root cause of the #869 incident (1hr idle → ejected → manual rescue).
#
# OMN-10602: Guard check_suite fanout. check_suite fires on every CI run
# completion (all workflows, all branches), flooding the Actions queue with
# runs that immediately no-op because there is no PR context. The pre-check
# job resolves the PR number cheaply (no checkout, no Python setup) and
# outputs skip=true for suites with no associated PR or for non-default-branch
# targets. The main job depends on pre-check and is skipped entirely when
# skip=true. A concurrency group per PR cancels redundant queued runs so
# only the most-recent check_suite completion for a given PR actually runs.
#
# OMN-13214: Arming auto-merge is NOT the same as enqueuing. During the
# 2026-06-17 dev wave, CLEAN + all-required-green + armed PRs sat OUTSIDE the
# merge queue for hours and each needed a manual enqueuePullRequest to land.
# Two fixes here: (1) the "Enable auto-merge" step previously passed bare
# `--auto --squash`, but dev is queue-controlled, so an explicit method is
# REJECTED ("The merge strategy for dev is set by the merge queue") and the PR
# is NEVER enqueued. Use bare `--auto` and let the queue pick the method.
# (2) The old "Force enqueue" step did not verify the PR actually entered the
# queue. This workflow now (a) arms bare --auto, (b) runs gh pr update-branch
# first on strict-update repos when the PR is BEHIND, (c) explicitly calls
# enqueuePullRequest, and (d) VERIFIES the PR actually entered the queue —
# failing loudly if a green+armed PR is not enqueued, so the gap surfaces
# instead of stalling silently. The classify/verify decision logic is
# unit-tested in scripts/ci/merge_queue_enqueue.py.
#
# OMN-17875 (2026-09-04): THE ARMING TOKEN MUST BE `secrets.CROSS_REPO_PAT`,
# NOT `secrets.GITHUB_TOKEN`. GitHub's auto-merge system performs the eventual
# squash merge as whatever identity ARMED it; when that identity is the default
# `GITHUB_TOKEN`, GitHub's documented Actions-recursion prevention fires no
# `push` event for the resulting commit on `dev`. Every push-triggered dev
# workflow was therefore silently starved on every PR that landed through this
# job. Ported from omnibase_infra#3178 (merged 2026-09-04T12:32:53Z), which
# root-caused this on the sibling repo.
#
#   Measured 2026-09-04T15:20-15:25Z on THIS repo, over the 30 most recently
#   merged dev PRs (#1613-#1645). Bot-merged dev commits got ZERO push-event
#   runs; human-merged ones got 12-14:
#     1bd884e57 (#1645, app/github-actions) -> 0 push runs
#     5d6da6f50 (#1640, bot)                -> 0
#     dbdb93a2c (#1639, bot)                -> 0
#     38d4ba830 (#1638, bot)                -> 0
#     f338525bf (#1635, bot)                -> 0
#     fc20d0869 (#1633, bot)                -> 0
#     d191ffb22 (#1643, jonahgabriel)       -> 12
#     a3c3184e0 (#1634, jonahgabriel)       -> 14
#     4edb9e596 (#1632, jonahgabriel)       -> 12
#   Query:
#     gh api "repos/OmniNode-ai/omnibase_core/actions/runs?head_sha=<oid>&event=push" --jq .total_count
#   Totals over that window: 20 bot merges, ALL 20 with zero dev-branch push
#   runs; 10 jonahgabriel merges, all 12-14.
#
#   Two of those bot merges (31e44e9db #1621, 9b8b5704b #1615) report
#   total_count 2, but those two runs are Release + "Propagate config across
#   downstream repos" on head_branch v0.47.1 / v0.47.0 with actor
#   jonahgabriel — TAG pushes that happen to share the commit, not dev-branch
#   pushes. Dev-branch suppression is 20 of 20.
#
#   `head_sha` MUST be the full 40-char oid. An abbreviated SHA matches
#   nothing and returns a false `total_count: 0` — that false zero is what
#   initially made these two look like clean bot merges (CLAUDE.md rule 16:
#   an empty result is not evidence of absence; prove a zero with a positive
#   control, here the 12-14 counts on the human merges).
#
# WHAT WAS SKIPPED (push-on-dev workflows in this repo): ci.yml,
# security-scan.yml, cross-repo-validation.yml, precommit-parity-gate.yml,
# receipt-honesty.yml, omni-standards-compliance.yml, check-db-ownership.yml,
# check-handshake.yml, check-llm-refs-drift.yml,
# validator-fsm-handler-drift.yml, validator-no-plugin-daemon-classes.yml,
# validator-runtime-profiles.yml, plus propagate-config.yml (push, path-
# filtered, no branch filter).
#
#   release.yml is NOT in the skipped set: its only push trigger is
#   `tags: ['v[0-9]*.[0-9]*.[0-9]*']` with no `branches:` key, so a dev merge
#   never fires it regardless of merger identity.
#
# WHY A PAT AND NOT A GITHUB APP TOKEN (OMN-16373): the org-wide CROSS_REPO_PAT
# retirement moved other call sites to a short-lived `onexbot-occ-writer` App
# installation token. That substitution does NOT work here. A controlled probe
# on 2026-08-22 (branch test/omn16373-suppression-probe-1, since deleted)
# isolated the identities against a push-triggered marker workflow:
#   - CONTROL (ambient `jonahgabriel` auth): commit fd534b2a -> marker workflow
#     FIRED (run 32562988366, event=push, conclusion=success).
#   - APP TOKEN (onexbot-occ-writer[bot]): commit 38ffe1f4 on the same branch
#     -> marker workflow did NOT fire; zero event=push runs at that head_sha.
# App-token-authored pushes suppress push-triggered runs on this org exactly
# like GITHUB_TOKEN-authored ones, so migrating this site to the App token
# would reintroduce this defect on a different credential. omninode_infra's
# own auto-merge.yml is the precedent: it kept CROSS_REPO_PAT for this exact
# reason (OMN-15769, then re-affirmed by OMN-16373) and its dev merges have
# never suffered this suppression.
#
# NO NEW CREDENTIAL IS MINTED. `CROSS_REPO_PAT` is an existing org secret with
# `visibility: all` (readback 2026-09-04T15:19Z:
# `gh api orgs/OmniNode-ai/actions/secrets/CROSS_REPO_PAT` ->
# {"name":"CROSS_REPO_PAT","created_at":"2026-03-03T19:03:03Z",
# "visibility":"all"}), and this repo ALREADY consumes it in ci.yml,
# release.yml, propagate-config.yml, publish-downstream-pin-bump.yml,
# cr-thread-gate.yml, cr-thread-gate-caller.yml and dependency-cascade.yml.
#
# NO FALLBACK EXPRESSION (`|| secrets.GITHUB_TOKEN`) is used: a fallback would
# restore the defect silently on any run where the PAT is unavailable, which is
# precisely the invisible-failure shape this ticket exists to remove.
#
# SCOPE OF THE SWAP: only the two steps in the `auto-merge` job that MUTATE
# merge state carry the PAT — `Enable auto-merge`, which arms the squash merge,
# and `Enqueue armed PR and verify it entered the queue`, which both pushes a
# branch update (`gh pr update-branch`) and hands the merge to a queue
# (`enqueuePullRequest`). The read-only `Resolve PR number and author without
# checkout` step in the `pre-check` job stays on `GITHUB_TOKEN` — it only runs
# `gh pr view` / `gh api` reads and creates no commit, so the suppression
# mechanism cannot apply to it. Enforced by
# tests/unit/validation/test_auto_merge_workflow_shape.py.
name: Auto-Merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge on"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One active run per PR (or per dispatch invocation). Cancels the queued
  # run when a newer check_suite completion arrives for the same PR, keeping
  # only the latest attempt in flight.
  group: auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event.check_suite.pull_requests[0].number || github.event.check_suite.id }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    uses: ./.github/workflows/occ-preflight.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  pre-check:
    needs: occ-preflight
    name: Resolve PR (fanout guard)
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      actor: ${{ steps.resolve.outputs.actor }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve PR number and author without checkout
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PAYLOAD: ${{ github.event.pull_request.number }}
          PR_AUTHOR_FROM_PAYLOAD: ${{ github.event.pull_request.user.login }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              PR="$PR_FROM_PAYLOAD"
              ACTOR="${PR_AUTHOR_FROM_PAYLOAD:-$(gh pr view "$PR" --repo "$GH_REPO" --json author --jq '.author.login')}"
              echo "pr=$PR" >> "$GITHUB_OUTPUT"
              echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              PR="$PR_FROM_DISPATCH"
              ACTOR="$(gh pr view "$PR" --repo "$GH_REPO" --json author --jq '.author.login')"
              echo "pr=$PR" >> "$GITHUB_OUTPUT"
              echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            check_suite)
              DEFAULT_BRANCH="$(gh repo view "$GH_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
              PR=""
              while IFS= read -r candidate_pr; do
                [ -z "$candidate_pr" ] && continue
                candidate_base="$(gh pr view "$candidate_pr" --repo "$GH_REPO" --json baseRefName --jq '.baseRefName')"
                if [ "$candidate_base" = "$DEFAULT_BRANCH" ]; then
                  PR="$candidate_pr"
                  break
                fi
              done < <(echo "$CHECK_SUITE_PRS" | jq -r 'if type == "array" then .[]?.number else empty end')
              if [ -z "$PR" ]; then
                echo "check_suite has no PR targeting '$DEFAULT_BRANCH'; skipping"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "pr=" >> "$GITHUB_OUTPUT"
                echo "actor=" >> "$GITHUB_OUTPUT"
              else
                ACTOR="$(gh pr view "$PR" --repo "$GH_REPO" --json author --jq '.author.login')"
                echo "pr=$PR" >> "$GITHUB_OUTPUT"
                echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "unsupported event: $EVENT_NAME; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "pr=" >> "$GITHUB_OUTPUT"
              echo "actor=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  auto-merge:
    name: Enable Auto-Merge
    needs: [occ-preflight, pre-check]
    if: needs.occ-preflight.result == 'success' && (needs.pre-check.outputs.skip != 'true' && needs.pre-check.outputs.actor == 'jonahgabriel')
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    steps:
      - uses: actions/checkout@v7

      # OMN-16288: this job previously re-resolved OCC eligibility here by
      # fetching onex_change_control@heads/main and re-running
      # validator_occ_merge_eligibility against that checkout. Nothing
      # promotes OCC's own contracts dev->main (Tier-1 excluded from
      # nightly-promote per OMN-15067), so OCC main is thousands of commits
      # stale and that step failed permanently with eligible:false /
      # missing_contract for every recently-minted ticket contract (e.g.
      # OMN-16280, run 32359138410) -- it never once passed once main drifted
      # this far, and it never gated arming: the `auto-merge` job here already
      # requires `needs.occ-preflight.result == 'success'` (line 148 `if:`),
      # and that occ-preflight job (line 69) calls the SAME reusable
      # (occ-preflight.yml) that resolves OCC state from the PR body's
      # Evidence-Source pin -- the pattern omnibase_infra and omnimarket's
      # call-occ-preflight.yml already use, and the one context that is a
      # required status check here ("occ-preflight / eligibility"). The
      # heads/main re-check was a pure, broken duplicate of an
      # already-required, already-passed check; this job now simply trusts
      # that check's conclusion via the existing `needs:`/`if:` gate above
      # instead of re-running its own resolution. The Python/uv setup steps
      # that only existed to run that duplicate check are removed with it.

      - name: Enable auto-merge
        env:
          # OMN-17875: MUST be CROSS_REPO_PAT. GitHub completes an armed
          # auto-merge as the arming identity, and GITHUB_TOKEN-authored
          # commits fire no `push` event — that starved every push-on-dev
          # workflow (ci.yml, security-scan.yml, cross-repo-validation.yml and
          # nine more) on all 20 bot-armed dev merges in the sampled window,
          # while the 10 human merges alongside them got 12-14 runs each. An
          # onexbot-occ-writer App token is NOT a substitute: it suppresses
          # identically (OMN-16373 probe). Do not "modernise" this back to
          # GITHUB_TOKEN or an App token.
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.pre-check.outputs.pr }}
        run: |
          set -euo pipefail
          # OMN-13138/13214: on a queue-controlled branch the merge method is
          # set by the merge queue, so passing an explicit --squash is
          # rejected ("The merge strategy for dev is set by the merge queue")
          # and the PR is NEVER enqueued (sits CLEAN + auto-merge armed
          # forever). Try bare --auto first so that regime keeps working if a
          # queue returns.
          #
          # OMN-16507: dev is NOT currently queue-controlled (registry-wide
          # verify 2026-08-24, omni_home/CLAUDE.md), and gh's CLI refuses a
          # method-less --auto when run non-interactively even on a
          # squash-only repo ("--merge, --rebase, or --squash required when
          # not running interactively") — this failed on every PR (e.g.
          # omnibase_core#1588, OMN-16347). Retry with --squash (the repo's
          # one enabled method, verified squash-only) only on that specific
          # gh-CLI-side error, so the queue-controlled branch above is
          # untouched if a queue reappears. Arming alone does not enqueue —
          # the explicit enqueue + verify step below closes that gap. Do NOT
          # exit here on success.
          if output=$(gh pr merge "$PR" --repo "$GH_REPO" --auto 2>&1); then
            echo "auto-merge enabled: $output"
          elif echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
            echo "auto-merge not newly enabled (expected): $output"
          elif echo "$output" | grep -qiE "required when not running interactively"; then
            echo "bare --auto rejected (no active merge queue): $output"
            if output=$(gh pr merge "$PR" --repo "$GH_REPO" --auto --squash 2>&1); then
              echo "auto-merge enabled (squash): $output"
            elif echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
              echo "auto-merge not newly enabled (expected): $output"
            else
              echo "auto-merge failed: $output"
              exit 1
            fi
          else
            echo "auto-merge failed: $output"
            exit 1
          fi

      - name: Enqueue armed PR and verify it entered the queue
        env:
          # OMN-17875: this step MUTATES merge state twice — `gh pr
          # update-branch` pushes a merge commit onto the PR head branch, and
          # `enqueuePullRequest` hands the eventual merge to a merge queue.
          # Both land commits attributed to this token, so it carries the same
          # non-suppressing identity as the arming step above. (This repo has
          # no merge queue on dev today — registry-wide verify 2026-08-24 — so
          # the enqueue path exits early; the PAT here is for the
          # update-branch push and for the day a queue returns.)
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.pre-check.outputs.pr }}
        run: |
          set -euo pipefail
          OWNER="${GH_REPO%/*}"
          NAME="${GH_REPO#*/}"

          classify() {
            python3 scripts/ci/merge_queue_enqueue.py classify \
              --pr-json "$1" --strict-update "$2"
          }

          # Is the target (default) branch strict-update? On strict repos a BEHIND
          # PR cannot enqueue until its branch is updated.
          DEFAULT_BRANCH="$(gh repo view "$GH_REPO" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          STRICT="$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}/protection/required_status_checks" \
            --jq '.strict' 2>/dev/null || echo "false")"
          [ "$STRICT" = "true" ] || STRICT="false"
          echo "strict-update on '${DEFAULT_BRANCH}': ${STRICT}"

          fetch_pr() {
            # isInMergeQueue is only on the GraphQL PullRequest object, NOT a
            # `gh pr view --json` field, so fetch PR state via GraphQL.
            # shellcheck disable=SC2016  # $owner/$name/$number are GraphQL vars, not shell vars
            gh api graphql \
              -f owner="$OWNER" \
              -f name="$NAME" \
              -F number="$PR" \
              -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      isInMergeQueue
                      mergeStateStatus
                      mergeable
                      autoMergeRequest {
                        enabledAt
                      }
                    }
                  }
                }' \
              --jq '.data.repository.pullRequest'
          }

          PR_JSON="$(fetch_pr)"
          ACTION="$(classify "$PR_JSON" "$STRICT")"
          echo "classified action: ${ACTION}"

          case "$ACTION" in
            already_queued)
              echo "PR #${PR} already in the merge queue — nothing to do."
              exit 0
              ;;
            wait)
              echo "PR #${PR} is not enqueueable yet (BLOCKED/DIRTY/DRAFT/UNKNOWN); will re-fire on next event."
              exit 0
              ;;
            blocked)
              echo "::warning::PR #${PR} in an unrecognised merge state: $(printf '%s' "$PR_JSON" | jq -r '.mergeStateStatus'). Not enqueuing."
              exit 0
              ;;
            update_branch_then_enqueue)
              echo "PR #${PR} is BEHIND on a strict-update repo — updating branch before enqueue."
              if ! gh pr update-branch "$PR" --repo "$GH_REPO" 2>&1; then
                echo "::warning::update-branch reported no change or a benign error; continuing."
              fi
              echo "update-branch issued; the resulting check run re-fires this workflow when CI is green."
              exit 0
              ;;
            enqueue)
              : # fall through to enqueue below
              ;;
            *)
              echo "::error::unexpected action '${ACTION}' from classifier"
              exit 1
              ;;
          esac

          PR_ID="$(gh api graphql -f query='{repository(owner:"'"$OWNER"'",name:"'"$NAME"'"){pullRequest(number:'"$PR"'){id}}}' --jq '.data.repository.pullRequest.id')"
          if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
            echo "::error::could not resolve PR node id for #${PR}"
            exit 1
          fi

          # shellcheck disable=SC2016  # $prId is a GraphQL variable, not a shell var
          if enq_out=$(gh api graphql -f query='mutation($prId:ID!){enqueuePullRequest(input:{pullRequestId:$prId}){mergeQueueEntry{position}}}' -f prId="$PR_ID" 2>&1); then
            echo "enqueue issued: ${enq_out}"
          else
            if echo "$enq_out" | grep -qiE "merge queue (is )?not enabled|does not have a merge queue|merge_queue_not_enabled"; then
              echo "repo has no merge queue — arming auto-merge is sufficient: ${enq_out}"
              exit 0
            fi
            if echo "$enq_out" | grep -qiE "already (in|enqueued|queued)|in the merge queue"; then
              echo "benign enqueue race (already queued): ${enq_out}"
            else
              echo "::error::enqueuePullRequest failed for #${PR}: ${enq_out}"
              exit 1
            fi
          fi

          # OMN-13214 ENFORCEMENT: verify the PR actually entered the queue.
          # Poll briefly — GitHub may take a few seconds to reflect the entry.
          for attempt in 1 2 3 4 5; do
            sleep 6
            PR_AFTER="$(fetch_pr)"
            if python3 scripts/ci/merge_queue_enqueue.py verify --pr-json "$PR_AFTER"; then
              echo "VERIFIED: PR #${PR} is in the merge queue."
              exit 0
            fi
            echo "not yet in queue (attempt ${attempt}/5); state=$(printf '%s' "$PR_AFTER" | jq -r '.mergeStateStatus')"
          done

          echo "::error::PR #${PR} is green + armed but did NOT enter the merge queue after enqueue (OMN-13214 armed-but-not-enqueued). Manual intervention required."
          exit 1
