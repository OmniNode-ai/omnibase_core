#
# Reusable PR title check for OmniNode repositories (OMN-17427).
#
# Repositories of the same type run the same CI from omnibase_core: this is the
# one copy of the title check that omnibase_core, omnimarket, omnibase_infra,
# omnimemory and omniintelligence each carried inline. It runs omnimarket's
# node_pr_title_check_compute from a pinned published release installed with
# --no-deps as a tool. No checkout: the decision reads only the event's title
# and author. The node exits 0 (admit), 1 (refuse) or 2 (malformed request).
#
# Usage in a caller repo (the caller job id `pr-title` and this file's job id
# `check-title` compose the required context `pr-title / check-title`, so
# branch protection does not move):
#
#   jobs:
#     pr-title:
#       permissions:
#         contents: read
#       uses: OmniNode-ai/omnibase_core/.github/workflows/pr-title-check.yml@<full sha>
#       with:
#         omnimarket-version: "0.4.310"
#
# A caller that also triggers on merge_group gets the same context there: the
# title was decided on the pull request before enqueue, so that run accepts.

name: PR Title Check

on:
  workflow_call:
    inputs:
      omnimarket-version:
        description: Published omnimarket release that carries node_pr_title_check_compute.
        required: true
        type: string

jobs:
  check-title:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]'))
      }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Accept merge-group title check
        if: github.event_name == 'merge_group'
        run: |
          echo "PR title validation is enforced on pull_request opened/edited before enqueue."

      - name: Install uv
        if: github.event_name != 'merge_group'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Check PR title for ticket reference
        if: github.event_name != 'merge_group'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OMNIMARKET_VERSION: ${{ inputs.omnimarket-version }}
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr-title-check"
          uv venv --quiet --python 3.12 "${venv}"
          # The node imports only pydantic, so omnimarket's own dependency tree is not installed.
          uv pip install --quiet --python "${venv}/bin/python" --no-deps "omnimarket==${OMNIMARKET_VERSION}"
          uv pip install --quiet --python "${venv}/bin/python" "pydantic>=2.11"
          "${venv}/bin/python" -I -c 'import json, os; print(json.dumps({"title": os.environ["PR_TITLE"], "author": os.environ["PR_AUTHOR"]}))' \
            | "${venv}/bin/python" -I -m omnimarket.nodes.node_pr_title_check_compute
