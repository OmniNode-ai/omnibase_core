# OMN-6912

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  pr-title:
    uses: OmniNode-ai/onex_change_control/.github/workflows/pr-title-check-reusable.yml@6ee1ebdb88514c91ab9017db41a575fc9e5dc674  # OCC sha already pinned at ci.yml (OMN-14887); OMN-20001
    permissions:
      pull-requests: read
