#
# OMN-10422 (Wave 5): Caller — re-scan skip-gate bypass tokens at merge_group entry.
#
# Invokes the omniclaude-hosted reusable workflow on pull_request and merge_group.
# On merge_group, the reusable workflow resolves the PR via head SHA and asserts
# exactly-one-PR (invariant I10). Cache is not reused across events (invariant I9).
#
# Required-status-check name: `scan / reject-skip-gate-token`
#
# OMN-20074 (OCC retirement S6 part 1): the pinned reusable no longer runs the
# change-control preflight as a nested job and the scan no longer waits on it
# (omniclaude#2540), so this caller stops producing
# `call-reject-skip-token / occ-preflight / eligibility`. That context leaves
# dev branch protection in the same cut-over window. S6 part 2 (OMN-20074)
# removes this file's local `occ-preflight` job and the scan's dependency on it.
# Wire via: Settings → Branches → main → Require status checks → add the check name above.

name: Reject skip-gate bypass tokens

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read
  pull-requests: read

jobs:
  call-reject-skip-token:
    uses: OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@dev-20261024003136-bdfb38684f2b # Dev-merge tag (OMN-21495).
    # OMN-17427: the pinned scanner reads this repository with github.token.
