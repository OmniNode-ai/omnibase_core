#
# OMN-10422 (Wave 5): Caller — re-scan skip-gate bypass tokens at merge_group entry.
#
# Invokes the omniclaude-hosted reusable workflow on pull_request and merge_group.
# On merge_group, the reusable workflow resolves the PR via head SHA and asserts
# exactly-one-PR (invariant I10). Cache is not reused across events (invariant I9).
#
# Required-status-check name: `scan / reject-skip-gate-token`
#
# OMN-20074 (OCC retirement S6 preparation): the pinned reusable no longer runs
# the change-control preflight as a nested job and the scan no longer waits on
# it (omniclaude#2540), so this caller stops producing
# `call-reject-skip-token / occ-preflight / eligibility`; the change-control
# verdict stays enforced by the standalone `occ-preflight / eligibility` context
# until the cut-over. This file's local `occ-preflight` job and the scan job's
# `needs: occ-preflight` / `if: always()` stay unchanged: part 2 of S6 deletes
# OCC callers; not this change.
# Wire via: Settings → Branches → main → Require status checks → add the check name above.

name: Reject skip-gate bypass tokens

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    uses: ./.github/workflows/occ-preflight.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  call-reject-skip-token:
    needs: occ-preflight
    if: always()
    uses: OmniNode-ai/omniclaude/.github/workflows/reject-deploy-gate-skip.yml@4358450ccbba0cee11e390208dd0b8b1728e94ab # OMN-20074: omniclaude#2540 squash on omniclaude dev; the scan runs with no nested change-control preflight
    secrets: inherit
