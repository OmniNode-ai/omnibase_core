---
# No Unguarded Git Subprocess — test git-environment isolation gate [OMN-14891]
#
# Canonical CI gate for `omnibase_core.validators.no_unguarded_git_subprocess`.
# Required status check context (once flipped): "no-unguarded-git-subprocess".
#
# The job id/name is deliberately unique ("no-unguarded-git-subprocess"), NOT the
# shared "validate" used by some of core's other validator workflows. GitHub
# surfaces the check-run context as the bare job name, so a shared name collides
# across unrelated workflows and cannot be made a required status check without
# forcing all of them. This mirrors validator-no-plugin-daemon-classes.yml
# (OMN-13309 / OMN-13284).
#
# THE DEFECT THIS GATES
# ---------------------
# Git exports GIT_DIR / GIT_WORK_TREE / GIT_INDEX_FILE / GIT_COMMON_DIR into the
# environment of every hook it runs, and those variables OVERRIDE both `cwd=` and
# `git -C`. So when pytest runs as a subprocess of the repo's own pre-push hook, a
# fixture doing `subprocess.run(["git", "init"], cwd=tmp_path)` re-initialises the
# REAL invoking worktree instead of tmp_path.
#
# Observed twice, log-proven:
#   * 2026-07-20 (OMN-14891) — the shared canonical clone's .git/config gained
#     `core.bare = true` plus a bogus `[user] t / t@t.t` block; 6707 lines of
#     phantom staged deletions entered the real index; an amend committed that
#     index as a 6668-file / 1.4M-line deletion.
#   * 2026-07-21 (OMN-14863) — recurred; fixture commits wrote f.txt / file.txt
#     into the real index.
# `$OMNI_HOME/<repo>/.git/config` is shared by every worktree of that repo, so one
# session's test run corrupts every concurrent session in a sibling worktree.
#
# Rationale (Operating Rule #5, "enforcement not detection"): OMN-14744 fixed one
# file in omnibase_infra by hand and the class recurred in a different repo across
# five different files. The systemic remedy is the session-level os.environ scrub
# in tests/conftest.py; this workflow is what stops the shape being reintroduced.
# A pre-commit-only check is advisory — it does not block a PR that bypassed local
# hooks.
#
# Related: OMN-14892 (index corruption under the same full-suite run),
#          OMN-14744 (the per-file precedent that did not hold).
#
# This workflow runs:
#   1. unit pytest for the validator (incl. its live self-scan of tests/)
#   2. pytest for the git-environment isolation regression (the RED-proven pair)
#   3. a standalone self-scan of the tests/ tree; must exit 0

name: No Unguarded Git Subprocess

on:
  push:
    branches: [main, develop, dev, "hotfix/**"]
  pull_request:
    branches: [main, develop, dev]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.3"

concurrency:
  group: no-unguarded-git-subprocess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # Poller, not a re-emitter (OMN-15112 collapse-to-one-producer): this job
    # does NOT call the reusable occ-preflight.yml workflow. It polls the ONE
    # canonical "occ-preflight / eligibility" check-run -- produced solely by
    # call-occ-preflight.yml, the repo's single unconditional-on-every-PR
    # caller -- via the Checks API, and blocks/fails this workflow's downstream
    # job accordingly. Copied from the pattern omnimarket and omniclaude already
    # run safely to avoid re-emitting the shared context name from every
    # workflow file that needs to gate on it (GH Actions `needs:` cannot cross
    # workflow files, so each file still needs its own gate -- but the gate
    # does not have to be its own duplicate emission of the reusable workflow).
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-15112: desynchronize same-PR pollers across workflow files (GH
          # Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and
          # exhaust the shared per-repo GitHub App installation rate-limit
          # bucket (same rationale as omnimarket's OMN-14343).
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # GH Actions runs `run:` steps under `bash -e {0}` by default --
            # that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear
            # an inherited -e. A bare `response="$(gh api ...)"; status=$?`
            # would therefore abort the whole step on ANY gh api failure
            # before status is ever checked, silently defeating the retry
            # logic below. Using the command substitution as the condition of
            # this `if` is the errexit-safe form -- bash does not trigger -e
            # for a command that is part of an if/while/until condition,
            # regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  no-unguarded-git-subprocess:
    needs: occ-preflight
    name: no-unguarded-git-subprocess
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout omnibase_core
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      # The regression test shells out to git, so CI needs an identity for the
      # decoy repos it creates in tmp_path.
      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email "ci@omninode.ai"
          git config --global user.name "OmniNode CI"

      - name: Run no-unguarded-git-subprocess unit tests
        run: |
          uv run pytest \
            tests/unit/validators/test_no_unguarded_git_subprocess.py \
            -v

      - name: Run git-environment isolation regression
        run: |
          uv run pytest \
            tests/unit/test_git_env_isolation.py \
            -v

      - name: Self-scan omnibase_core tests/
        run: uv run python -m omnibase_core.validators.no_unguarded_git_subprocess tests/
