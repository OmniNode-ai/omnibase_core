# SPDX-License-Identifier: MIT
#
# Dependency Cascade Workflow (OMN-2751, OMN-19998)
#
# Opens dependency-bump PRs in downstream repos when a foundation package is
# released. Each downstream repo gets a PR that pins the package at its newest
# DEV MERGE TAG (`dev-<UTC YYYYMMDDHHMMSS>-<sha12>`, made by the package's own
# dev-merge-tag.yml on every dev push) as a `[tool.uv.sources]` git source and
# re-locks. RULING 2026-10-29T01:50:26Z (OMN-21433): first-party dependencies
# iterate on dev merge tags, not on releases. The cascade used to wait for the
# RELEASED version on the index and write an exact `==X.Y.Z` pin or a registry
# lock entry; the downstream `internal-sibling-pins` job refuses that where the
# package already carries a newer dev merge tag (OMN-21282), so every bump PR
# the cascade opened went red on its own Quality Gate. No step of this workflow
# resolves, waits for or writes a released version any more.
#
# Downstream mapping:
#   omnibase_core  -> omnibase_infra, omniintelligence, omnimemory, omniclaude, omninode_infra
#   omnibase_spi   -> omnibase_infra, omniintelligence, omnimemory, omniclaude
#   omnibase_infra -> omniintelligence, omnimemory, omniclaude
#
# This workflow is reusable so that omnibase_core and omnibase_spi can also call
# it from their own release workflows.
name: Dependency Cascade

on:
  workflow_call:
    inputs:
      package:
        description: 'Package whose dev merge tag is pinned (e.g. omnibase_infra)'
        required: true
        type: string
      version:
        description: >-
          Released version that triggered the cascade (e.g. v0.11.0). Optional
          and informational (OMN-19998): it is validated when given and never
          written as a pin, never waited for on the index. The pin is the
          newest dev merge tag of the package.
        required: false
        default: ''
        type: string
      ticket:
        description: >-
          OMN ticket that closed the release being cascaded (OMN-16286).
          Threaded verbatim into the PR title/branch/body of every downstream
          bump PR this workflow opens so Receipt-Gate's identity binding
          (title <-> branch <-> Evidence-Ticket) resolves honestly. Must be
          the SAME ticket paired with `evidence_source` below.
        required: true
        type: string
      evidence_source:
        description: >-
          Evidence-Source value (OCC#<n> or a merged OCC commit SHA) that
          already proved the released package version (OMN-16286). Optional
          since OMN-14355: the change-control companion mint that produced it
          is retired (OMN-20074), and no bump PR body carries it (OMN-18202).
          An empty value is accepted; a non-empty one is still validated.
        required: false
        default: ''
        type: string
    secrets:
      # OMN-16373: CROSS_REPO_PAT retired. The caller now passes through the
      # onexbot-occ-writer GitHub App credentials (org secrets
      # ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY); this workflow mints a
      # short-lived installation token per downstream repo instead of using
      # a long-lived PAT.
      onexbot-occ-app-id:
        description: "onexbot-occ-writer GitHub App id (org secret ONEXBOT_OCC_APP_ID)"
        required: false
      onexbot-occ-private-key:
        description: "onexbot-occ-writer GitHub App private key (org secret ONEXBOT_OCC_PRIVATE_KEY)"
        required: false
  workflow_dispatch:
    inputs:
      package:
        description: 'Package whose dev merge tag is pinned (e.g. omnibase_infra)'
        required: true
        type: string
      version:
        description: 'Released version that triggered the cascade (e.g. v0.11.0). Optional and informational (OMN-19998): never written as a pin; the pin is the newest dev merge tag.'
        required: false
        default: ''
        type: string
      ticket:
        description: 'OMN ticket that closed the release being cascaded (OMN-16286), e.g. OMN-15449.'
        required: true
        type: string
      evidence_source:
        description: 'Evidence-Source that already proved the release (OMN-16286), e.g. OCC#6695. Optional (OMN-14355).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute Downstream Matrix
    # OMNI_RUNNER_SELECTOR_V1 behind the private-caller guard (OMN-21280): a public caller always gets ubuntu-latest
    runs-on: ${{ github.event.repository.private && ( (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]') || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]')) ) || 'ubuntu-latest' }}
    outputs:
      repos: ${{ steps.matrix.outputs.repos }}
    steps:
      - name: Determine downstream repos
        id: matrix
        run: |
          PACKAGE="${{ inputs.package }}"

          case "$PACKAGE" in
            omnibase_core)
              REPOS='["omnibase_infra", "omniintelligence", "omnimemory", "omniclaude", "omninode_infra"]'
              ;;
            omnibase_spi)
              REPOS='["omnibase_infra", "omniintelligence", "omnimemory", "omniclaude"]'
              ;;
            omnibase_infra)
              REPOS='["omniintelligence", "omnimemory", "omniclaude"]'
              ;;
            *)
              echo "ERROR: Unknown foundation package: $PACKAGE"
              echo "Expected one of: omnibase_core, omnibase_spi, omnibase_infra"
              exit 1
              ;;
          esac

          echo "repos=$REPOS" >> $GITHUB_OUTPUT
          echo "Downstream repos for $PACKAGE: $REPOS"

  open-bump-pr:
    name: Bump ${{ matrix.repo }}
    needs: compute-matrix
    # OMNI_RUNNER_SELECTOR_V1 behind the private-caller guard (OMN-21280): a public caller always gets ubuntu-latest
    runs-on: ${{ github.event.repository.private && ( (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]') || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]')) ) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.compute-matrix.outputs.repos) }}
    steps:
      - name: Check onexbot-occ-writer App credentials are configured
        id: token_check
        env:
          APP_ID: ${{ secrets.onexbot-occ-app-id }}
          APP_PRIVATE_KEY: ${{ secrets.onexbot-occ-private-key }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::ONEXBOT_OCC_APP_ID / ONEXBOT_OCC_PRIVATE_KEY are not configured. Skipping dependency bump for ${{ matrix.repo }}." \
              "Provision the onexbot-occ-writer App org secrets to enable automated dependency cascades."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      # OMN-16373: mint a short-lived onexbot-occ-writer App installation
      # token, scoped to the one downstream repo this matrix leg touches.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.onexbot-occ-app-id }}
          private-key: ${{ secrets.onexbot-occ-private-key }}
          owner: OmniNode-ai
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout downstream repo
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OmniNode-ai/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Set up uv
        if: steps.token_check.outputs.has_token == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.12'

      # OMN-17427: job log 118551249071 shows omninode_infra's uv lock
      # fetching private omnibase_internal from uv's cache without credentials;
      # app-token covers only the downstream repo. Probe git sources outside
      # the checkout and mint read access only for private sources. Public
      # sources get no token, so legs with only public git sources are unchanged.
      - name: Find private OmniNode git sources (OMN-17427)
        id: git_sources
        if: steps.token_check.outputs.has_token == 'true'
        env:
          REPO_NAME: ${{ matrix.repo }}
          # OMN-19998: the bumped package's own repository is a git source of
          # the lock this run writes, so its tags and its commit are read too.
          PACKAGE_REPO: ${{ inputs.package }}
        run: |
          sources=$(
            {
              for file in pyproject.toml uv.lock; do
                if [ -f "$file" ]; then
                  grep -Eo 'git\+https://github\.com/OmniNode-ai/[A-Za-z0-9._-]+|git[[:space:]]*=[[:space:]]*"https://github\.com/OmniNode-ai/[A-Za-z0-9._-]+' "$file" || true
                fi
              done | sed -E 's@^.*https://github\.com/OmniNode-ai/@@; s/\.git$//'
              if [[ "$PACKAGE_REPO" =~ ^[A-Za-z0-9_-]+$ ]]; then
                printf '%s\n' "$PACKAGE_REPO"
              fi
            } | LC_ALL=C sort -u
          )
          private_repos=()
          while IFS= read -r name; do
            if [ -z "$name" ] || [ "$name" = "$REPO_NAME" ]; then
              continue
            fi
            if (
              cd "${RUNNER_TEMP:-/tmp}"
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= ls-remote --exit-code "https://github.com/OmniNode-ai/${name}" HEAD >/dev/null 2>&1
            ); then
              echo "CASCADE-GIT-SOURCE name=${name} access=public"
            else
              echo "CASCADE-GIT-SOURCE name=${name} access=private"
              private_repos+=("$name")
            fi
          done <<< "$sources"
          repos=$(IFS=','; echo "${private_repos[*]}")
          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

      - name: Mint read token for private git sources (OMN-17427)
        id: git-source-token
        if: steps.token_check.outputs.has_token == 'true' && steps.git_sources.outputs.repos != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.onexbot-occ-app-id }}
          private-key: ${{ secrets.onexbot-occ-private-key }}
          owner: OmniNode-ai
          repositories: ${{ steps.git_sources.outputs.repos }}
          permission-contents: read

      - name: Set branch and PR variables
        if: steps.token_check.outputs.has_token == 'true'
        id: vars
        env:
          # OMN-16286 (CodeRabbit finding, zizmor template-injection): these
          # four inputs are threaded from release.yml's grep-extracted
          # Evidence-Ticket/Evidence-Source pair, which is less trusted than
          # a hardcoded workflow literal. Binding them through `env:` (a real
          # process environment variable) instead of interpolating
          # `${{ inputs.X }}` directly into this run body's bash text is the
          # actual injection fix -- `env:` values are never template-expanded
          # into the script, so they cannot terminate the shell context no
          # matter what characters they contain. The explicit pattern
          # validation below is defense-in-depth on top of that: only a
          # value that already matches the documented safe shape for that
          # field is allowed to flow into the branch name / PR title / PR
          # body built in later steps.
          RAW_VERSION: ${{ inputs.version }}
          RAW_PACKAGE: ${{ inputs.package }}
          RAW_TICKET: ${{ inputs.ticket }}
          RAW_EVIDENCE_SOURCE: ${{ inputs.evidence_source }}
          GIT_SOURCE_TOKEN: ${{ steps.git-source-token.outputs.token }}
          GIT_SOURCE_REPOS: ${{ steps.git_sources.outputs.repos }}
        run: |
          export LC_ALL=C
          RELEASE="${RAW_VERSION#v}"
          PACKAGE="$RAW_PACKAGE"
          TICKET="$RAW_TICKET"
          EVIDENCE_SOURCE="$RAW_EVIDENCE_SOURCE"

          if ! [[ "$PACKAGE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::OMN-16286: inputs.package '${PACKAGE}' does not match the safe package-name pattern ^[A-Za-z0-9_-]+\$."
            exit 1
          fi
          # OMN-19998: the released version is informational only. It is
          # validated when given and is never the pin.
          if [ -n "$RELEASE" ] && ! [[ "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.+-]*)?$ ]]; then
            echo "::error::OMN-16286: inputs.version '${RELEASE}' does not match the safe SemVer-ish pattern."
            exit 1
          fi
          if ! [[ "$TICKET" =~ ^OMN-[0-9]+$ ]]; then
            echo "::error::OMN-16286: inputs.ticket '${TICKET}' does not match the required ^OMN-[0-9]+\$ pattern."
            exit 1
          fi
          if [ -n "$EVIDENCE_SOURCE" ] && ! [[ "$EVIDENCE_SOURCE" =~ ^(OCC#[0-9]+|[0-9a-fA-F]{7,40})$ ]]; then
            echo "::error::OMN-16286: inputs.evidence_source '${EVIDENCE_SOURCE}' does not match the required OCC#<n> or <hex-sha> pattern."
            exit 1
          fi

          # OMN-19998: resolve the newest dev merge tag of the package from its
          # own tags (RULING 2026-10-29T01:50:26Z, OMN-21433). The tag name is
          # dev-<UTC YYYYMMDDHHMMSS>-<sha12>; the fixed-width stamp makes the
          # greatest name the newest merge. The tag exists in git before this
          # runs, so there is no index propagation to wait for.
          # The org URL comes from the run's own context (GITHUB_SERVER_URL,
          # GITHUB_REPOSITORY_OWNER), the same value the downstream git source
          # must carry.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY_OWNER}/${PACKAGE}.git"
          auth_args=()
          if [ -n "${GIT_SOURCE_TOKEN:-}" ] && [[ ",${GIT_SOURCE_REPOS:-}," == *",${PACKAGE},"* ]]; then
            auth=$(printf 'x-access-token:%s' "$GIT_SOURCE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            auth_args=(-c "http.${url}.extraheader=AUTHORIZATION: basic ${auth}")
          fi
          if ! refs=$(GIT_TERMINAL_PROMPT=0 git ${auth_args[@]+"${auth_args[@]}"} -c credential.helper= ls-remote --tags "$url" 'refs/tags/dev-*'); then
            echo "::error::OMN-19998: cannot list the tags of ${url}."
            exit 1
          fi
          DEV_TAG=""
          while IFS=$'\t' read -r _sha ref; do
            name="${ref#refs/tags/}"
            name="${name%'^{}'}"
            if [[ "$name" =~ ^dev-[0-9]{14}-[0-9a-f]{12}$ ]]; then
              if [ -z "$DEV_TAG" ] || [[ "$name" > "$DEV_TAG" ]]; then
                DEV_TAG="$name"
              fi
            fi
          done <<< "$refs"
          if [ -z "$DEV_TAG" ]; then
            echo "::error::OMN-19998: ${url} carries no dev merge tag (dev-<UTC YYYYMMDDHHMMSS>-<sha12>) to pin."
            exit 1
          fi
          # A tag object is peeled to the commit it names; a lightweight tag is the commit.
          TAG_SHA=$(printf '%s\n' "$refs" | awk -v want="refs/tags/${DEV_TAG}^{}" '$2 == want { print $1 }')
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(printf '%s\n' "$refs" | awk -v want="refs/tags/${DEV_TAG}" '$2 == want { print $1 }')
          fi
          if ! [[ "$TAG_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "${TAG_SHA:0:12}" != "${DEV_TAG##*-}" ]; then
            echo "::error::OMN-19998: dev merge tag ${DEV_TAG} names commit '${TAG_SHA}', which does not match the sha12 in the tag."
            exit 1
          fi
          echo "CASCADE-DEV-TAG package=${PACKAGE} tag=${DEV_TAG} sha=${TAG_SHA} release=${RELEASE:-none}"

          # Use hyphenated package name for the branch (PyPI convention)
          PKG_HYPHEN="${PACKAGE//_/-}"
          # OMN-16286: the branch name must itself carry the ticket token --
          # Receipt-Gate's identity binding checks title, branch, and
          # Evidence-Ticket all reference the same OMN-<n> (case-insensitive,
          # token-bounded match).
          TICKET_SLUG="$(printf '%s' "$TICKET" | tr '[:upper:]' '[:lower:]')"
          BRANCH="automation/bump-${PKG_HYPHEN}-${DEV_TAG}-${TICKET_SLUG}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          # `version` is the cascade provenance block's required-version field
          # (OMN-18235): it now carries the dev merge tag the bump pins.
          echo "version=$DEV_TAG" >> $GITHUB_OUTPUT
          echo "tag_sha=$TAG_SHA" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "pkg_hyphen=$PKG_HYPHEN" >> $GITHUB_OUTPUT
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "ticket=$TICKET" >> $GITHUB_OUTPUT
          echo "evidence_source=$EVIDENCE_SOURCE" >> $GITHUB_OUTPUT

      - name: Create branch
        if: steps.token_check.outputs.has_token == 'true'
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"

      # OMN-19998 (RULING 2026-10-29T01:50:26Z, OMN-21433): write the package's
      # newest dev merge tag as the downstream source pin,
      #   <pkg> = { git = "https://github.com/OmniNode-ai/<repo>.git", tag = "<dev tag>" }
      # which is exactly the shape the downstream dependency-provenance gate
      # exempts and the internal-sibling-pins job allows. The source line is
      # the cascade's own input, so the old "is this dependency movable"
      # guard, which refused every git source, no longer applies; the
      # verification step after the lock proves the lock landed on the tag.
      # An exact `==X.Y.Z` requirement on the package is relaxed to a range
      # that keeps its floor: this workflow writes no release pin.
      # `--no-project` keeps uv from syncing or re-locking the downstream
      # project (OMN-17427).
      - name: Pin dev merge tag source (OMN-19998)
        if: steps.token_check.outputs.has_token == 'true'
        env:
          PKG_HYPHEN: ${{ steps.vars.outputs.pkg_hyphen }}
          PACKAGE: ${{ steps.vars.outputs.package }}
          DEV_TAG: ${{ steps.vars.outputs.version }}
        run: |
          echo "Pinning ${PKG_HYPHEN} at dev merge tag ${DEV_TAG}"

          uv run --no-project python - <<'PYEOF'
          import os
          import re
          import sys
          import tomllib

          pkg = os.environ["PKG_HYPHEN"]
          repo = os.environ["PACKAGE"]
          tag = os.environ["DEV_TAG"]


          def fail(message):
              print(f"::error::OMN-19998: {message}")
              sys.exit(1)


          def normalize(name):
              return re.sub(r"[-_.]+", "-", name.strip().strip("\"'").lower())


          if not re.fullmatch(r"dev-[0-9]{14}-[0-9a-f]{12}", tag):
              fail(f"{tag!r} is not a dev merge tag (dev-<UTC YYYYMMDDHHMMSS>-<sha12>).")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", repo):
              fail(f"{repo!r} is not a safe repository name.")

          url = "/".join(
              (
                  os.environ["GITHUB_SERVER_URL"],
                  os.environ["GITHUB_REPOSITORY_OWNER"],
                  f"{repo}.git",
              )
          )
          entry = f'{pkg} = {{ git = "{url}", tag = "{tag}" }}\n'
          text = open("pyproject.toml").read()

          for header in re.findall(r"^\[tool\.uv\.sources\.([^\]]+)\]", text, re.M):
              if normalize(header) == normalize(pkg):
                  fail(
                      f"[tool.uv.sources.{header}] is a sub-table; rewrite it to an "
                      "inline table by hand before the cascade can pin it."
                  )

          lines = text.splitlines(keepends=True)
          header_at = next(
              (i for i, line in enumerate(lines)
               if re.match(r"^\[tool\.uv\.sources\]\s*(#.*)?$", line)),
              None,
          )
          if header_at is None:
              if lines and not lines[-1].endswith("\n"):
                  lines[-1] += "\n"
              lines += ["\n", "[tool.uv.sources]\n", entry]
          else:
              end = next(
                  (i for i in range(header_at + 1, len(lines))
                   if lines[i].startswith("[")),
                  len(lines),
              )
              hit = None
              for i in range(header_at + 1, end):
                  match = re.match(r"^([A-Za-z0-9_.\"'-]+)\s*=", lines[i])
                  if match and normalize(match.group(1)) == normalize(pkg):
                      if not re.match(r"^[^=]+=\s*\{.*\}\s*(#.*)?$", lines[i]):
                          fail(f"the {pkg} source is not a one-line inline table: {lines[i].strip()}")
                      hit = i
                      break
              if hit is None:
                  lines.insert(header_at + 1, entry)
              else:
                  lines[hit] = entry
          text = "".join(lines)

          # An exact `==X.Y.Z` requirement is a release pin: keep its floor and
          # cap it at the next minor, the range shape the downstream repos use.
          name_re = re.escape(pkg).replace(r"\-", "[-_.]")

          def relax(match):
              major, minor, patch = (int(part) for part in match.group(2, 3, 4))
              return f'"{match.group(1)}>={major}.{minor}.{patch},<{major}.{minor + 1}.0"'

          text = re.sub(
              r'"(' + name_re + r')==([0-9]+)\.([0-9]+)\.([0-9]+)"', relax, text
          )

          sources = tomllib.loads(text).get("tool", {}).get("uv", {}).get("sources", {})
          pinned = [v for k, v in sources.items() if normalize(k) == normalize(pkg)]
          if pinned != [{"git": url, "tag": tag}]:
              fail(f"pyproject.toml does not hold exactly the {pkg} dev tag source: {pinned}")
          if re.search(r'"' + name_re + r'==', text):
              fail(f"an exact {pkg}== requirement is still in pyproject.toml")
          open("pyproject.toml", "w").write(text)
          print(f"CASCADE-DEV-TAG-PIN package={pkg} tag={tag}")
          PYEOF

      # OMN-16517 (docs/plans/2026-08-23-cloud-ci-offload-plan.md Stage 1):
      # sanitized generator environment. This step previously ran `uv lock`
      # with NO UV_* env sanitization at all -- on 2026-08-23 a bot-generated
      # `uv lock` on this exact code path baked 783 `source = { registry =
      # ... }` lines into onex_change_control/uv.lock pointing at the
      # Tailscale-only devpi mirror omninode-pc.tail75df5e.ts.net:3141
      # (OMN-16162), breaking `uv sync --locked` on every runner without
      # tailnet access. Per uv's own documented precedence
      # (docs.astral.sh/uv/concepts/configuration-files/: "settings provided
      # via environment variables take precedence over persistent
      # configuration"; docs.astral.sh/uv/concepts/indexes/: the default
      # index is "always treated as lowest priority"), an ambient `UV_INDEX`
      # env var on the runner always outranks a repo-level index pin --
      # which is exactly why S1-3's pyproject.toml pin (onex_change_control)
      # is a DIFFERENT, narrower defense (runner-level *user* config only)
      # and cannot substitute for sanitizing this step's own environment.
      #
      # Deliberately NOT `--index` (the ADDITIONAL-index flag) -- it adds a
      # higher-priority index and sanitizes nothing; `--default-index` pins
      # the actual default/lowest-priority index this step resolves against.
      - name: Upgrade lockfile
        if: steps.token_check.outputs.has_token == 'true'
        env:
          BUMP_PACKAGE: ${{ steps.vars.outputs.package }}
          PKG_HYPHEN: ${{ steps.vars.outputs.pkg_hyphen }}
          DEV_TAG: ${{ steps.vars.outputs.version }}
          REPO_NAME: ${{ matrix.repo }}
          GIT_SOURCE_TOKEN: ${{ steps.git-source-token.outputs.token }}
          GIT_SOURCE_REPOS: ${{ steps.git_sources.outputs.repos }}
          # Explicitly cleared so no ambient runner-level mirror config
          # (env var OR user/project uv.toml, once --no-config is also
          # passed below) can leak into a lock this workflow commits.
          UV_INDEX: ""
          UV_DEFAULT_INDEX: ""
          UV_INDEX_URL: ""
          UV_EXTRA_INDEX_URL: ""
        run: |
          # OMN-17427: pass repo-scoped auth to git fetches from uv's cache.
          if [ -n "${GIT_SOURCE_TOKEN:-}" ] && [ -n "${GIT_SOURCE_REPOS:-}" ]; then
            auth=$(printf 'x-access-token:%s' "$GIT_SOURCE_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::${auth}"
            n=0
            IFS=',' read -r -a git_source_repos <<< "$GIT_SOURCE_REPOS"
            for name in "${git_source_repos[@]}"; do
              for suffix in "" ".git"; do
                export "GIT_CONFIG_KEY_${n}=http.https://github.com/OmniNode-ai/${name}${suffix}.extraheader"
                export "GIT_CONFIG_VALUE_${n}=AUTHORIZATION: basic ${auth}"
                n=$((n + 1))
              done
            done
            export GIT_CONFIG_COUNT="$n"
            echo "CASCADE-GIT-SOURCE-AUTH repos=${GIT_SOURCE_REPOS}"
          fi

          # Re-lock the package against the dev tag source the previous step
          # wrote. The tag is a git ref that exists already, so uv resolves it
          # in one pass: no index wait, no retry. A failure of uv is the
          # failure of the leg (an unsatisfiable range, an unreadable source).
          #
          # --no-config: ignore any ambient uv.toml (user- or
          # workspace-level) on the runner -- the sanitized env vars above
          # only clear the ENV channel, not a config-file channel.
          # --default-index: pin the actual public index this resolution
          # uses for the other dependencies.
          uv lock --no-config --default-index https://pypi.org/simple --upgrade-package "$PKG_HYPHEN"

          # Check if anything changed in either file -- a pin-only bump with
          # no lockfile delta (or vice versa) is still a real change to land.
          if git diff --quiet uv.lock pyproject.toml; then
            echo "SKIP=true" >> $GITHUB_ENV
            echo "No lockfile/pin changes -- the next step verifies ${REPO_NAME} already locks the target dev tag"
          else
            echo "SKIP=false" >> $GITHUB_ENV
            echo "Lockfile/pin updated to ${BUMP_PACKAGE} dev merge tag ${DEV_TAG}"
          fi

      # OMN-16926 / OMN-19998: a no-diff lock is "already on the target" only
      # when uv.lock records exactly the dev merge tag and the commit it names.
      # Anything else (a registry entry, an older tag, another commit) fails
      # the leg rather than reporting a skip.
      - name: Verify locked source is the target dev tag (OMN-19998)
        if: steps.token_check.outputs.has_token == 'true'
        env:
          PKG_HYPHEN: ${{ steps.vars.outputs.pkg_hyphen }}
          PACKAGE: ${{ steps.vars.outputs.package }}
          DEV_TAG: ${{ steps.vars.outputs.version }}
          TAG_SHA: ${{ steps.vars.outputs.tag_sha }}
          REPO_NAME: ${{ matrix.repo }}
        run: |
          uv run --no-project python - <<'PYEOF'
          import os
          import re
          import sys
          import tomllib

          pkg = os.environ["PKG_HYPHEN"]
          repo = os.environ["PACKAGE"]
          tag = os.environ["DEV_TAG"]
          sha = os.environ["TAG_SHA"]
          target_repo = os.environ["REPO_NAME"]

          def normalize(name):
              return re.sub(r"[-_.]+", "-", name.lower())

          try:
              with open("./uv.lock", "rb") as lockfile:
                  lock = tomllib.load(lockfile)
          except (OSError, tomllib.TOMLDecodeError) as exc:
              print(f"::error::Cannot read uv.lock for {pkg} in {target_repo}: {exc}")
              sys.exit(1)

          package = next(
              (entry for entry in lock.get("package", [])
               if normalize(entry["name"]) == normalize(pkg)),
              None,
          )
          if package is None:
              print(f"::error::Package {pkg} is not in uv.lock for {target_repo}; expected dev tag {tag}.")
              sys.exit(1)

          server = os.environ["GITHUB_SERVER_URL"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          expected = f"{server}/{owner}/{repo}.git?tag={tag}#{sha}"
          source = package.get("source")
          locked = source.get("git") if isinstance(source, dict) else None
          if locked == expected:
              print(f"CASCADE-LOCKED-SOURCE-OK package={pkg} tag={tag} sha={sha} repo={target_repo}")
              sys.exit(0)

          print(f"CASCADE-LOCKED-SOURCE-MISMATCH package={pkg} locked={source} target={expected} repo={target_repo}")
          print(f"::error::{pkg} in {target_repo} locks {source}, target {expected}: the lock did not land on the dev merge tag (a cap or override the pin step did not control), so this leg is not on the dev tag.")
          sys.exit(1)
          PYEOF

      - name: Commit and push
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false'
        env:
          BUMP_PACKAGE: ${{ steps.vars.outputs.package }}
          RESOLVED: ${{ steps.vars.outputs.version }}
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          # OMN-18273: commit as the App this job already authenticates as, not as
          # the generic actions identity — the push is an App-token push, so the
          # two disagreeing was itself misleading about who made the change.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git add uv.lock pyproject.toml
          git commit -m "chore(deps): bump ${BUMP_PACKAGE} to ${RESOLVED}" \
            -m "Automated dependency cascade from ${{ github.repository }}: pins dev merge tag ${RESOLVED}." \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "$BRANCH"

      - name: Open pull request
        id: open_pr
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ matrix.repo }}
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          # Check if a PR already exists for this branch
          EXISTING=$(gh pr list \
            --repo "OmniNode-ai/${REPO_NAME}" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -gt 0 ]; then
            echo "PR already exists for branch ${BRANCH} -- skipping"
            exit 0
          fi

          # OMN-18202 AC1: this body carries NO evidence ticket/source stamp.
          # It used to re-cite the RELEASING PR's own companion verbatim, which
          # binds no receipt to THIS PR: occ-preflight resolves the stamped
          # change-control commit and fails with pr_ticket_mismatch, and no
          # rerun clears it. Nor can it be repaired later: the downstream
          # autobind stamp writer refuses to replace a stamp naming a MERGED
          # companion (OMN-18089), and the release's companion always is.
          # Live on the 0.47.23 wave (omniclaude#2338, omnimemory#533).
          # The downstream repo's own OCC autobind mints a companion bound to
          # this PR and PATCHes the stamp in, so it is the only writer.
          # omnibase_infra's copy of this generator got the same fix (#3998).
          gh pr create \
            --repo "OmniNode-ai/${REPO_NAME}" \
            --title "chore(deps): bump ${{ steps.vars.outputs.pkg_hyphen }} to ${{ steps.vars.outputs.version }} (${{ steps.vars.outputs.ticket }})" \
            --body "$(cat <<'PREOF'
          ## Summary

          Automated dependency bump: pins `${{ steps.vars.outputs.package }}` at its newest dev merge tag `${{ steps.vars.outputs.version }}` (RULING 2026-10-29T01:50:26Z: first-party dependencies iterate on dev merge tags, not on releases).

          - Sets the `[tool.uv.sources]` git source of `${{ steps.vars.outputs.package }}` to that dev merge tag
          - Updates `uv.lock` via `uv lock --upgrade-package ${{ steps.vars.outputs.pkg_hyphen }}`
          - Relaxes an exact `==X.Y.Z` requirement on the package to a range, when this repo had one
          - No other source code changes

          ## Cascade provenance (OMN-16286, OMN-18202)

          This PR carries no dedicated testing of its own beyond this repo's own
          CI running against the new lockfile. It deliberately carries no
          evidence stamp of its own at creation: this repo's OCC autobind mints
          a companion bound to THIS PR's own commit and adds the stamp once
          that companion exists (OMN-18202 AC1). The upstream dev merge tag
          this bump pins is the version field below (it carries the dev merge
          tag, not a release):

          - Source repo: `OmniNode-ai/${{ steps.vars.outputs.package }}`
          - Released version: `${{ steps.vars.outputs.version }}`

          ## Triggered by

          Release workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Test plan

          - [ ] CI passes (lockfile resolution is valid)
          - [ ] Downstream tests pass with the dev merge tag
          PREOF
          )" \
            --head "$BRANCH" \
            --base dev
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Verify no foreign Evidence-Source stamp was emitted (OMN-18202)
        # Only a PR THIS run created. A PR found already open may predate the
        # fix and carry a stamp this run did not write.
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'false' && steps.open_pr.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_NAME: ${{ matrix.repo }}
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          # Read back the PR this run just opened and fail the cascade run if
          # its body carries an evidence ticket/source line. The generator
          # never writes one, so any occurrence is a companion bound to a
          # DIFFERENT PR, which is the pr_ticket_mismatch shape removed above.
          BODY=$(gh pr view "$BRANCH" \
            --repo "OmniNode-ai/${REPO_NAME}" \
            --json body --jq '.body')
          if printf '%s\n' "$BODY" | grep -qE '^Evidence-(Ticket|Source):'; then
            echo "::error::OMN-18202: the cascade opened a bump PR on OmniNode-ai/${REPO_NAME} (branch ${BRANCH}) whose body already carries an evidence ticket/source line. The generator must never emit one; the downstream repo's own occ-autobind is the only writer of that field."
            exit 1
          fi
          echo "OK: no foreign evidence stamp on the PR this run opened."

      - name: Skip summary
        if: steps.token_check.outputs.has_token == 'true' && env.SKIP == 'true'
        env:
          REPO_NAME: ${{ matrix.repo }}
          BUMP_PACKAGE: ${{ steps.vars.outputs.package }}
          RESOLVED: ${{ steps.vars.outputs.version }}
        run: |
          echo "### Skipped: ${REPO_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${REPO_NAME} already locks ${BUMP_PACKAGE} at dev merge tag ${RESOLVED} (verified against uv.lock)." >> $GITHUB_STEP_SUMMARY
          echo "No lockfile changes needed." >> $GITHUB_STEP_SUMMARY
