#
# Reusable internal sibling pin check for OmniNode repositories (OMN-19998).
#
# RULINGs 2026-10-16T07:34:18Z and 2026-10-16T09:35:49Z: internal siblings are
# consumed from the dev merge tag (dev-<UTC YYYYMMDDHHMMSS>-<sha12>, made by
# dev-merge-tag.yml on every dev push), not from a release, and "it becomes
# part of the process, not up to for somebody to remember". This job runs
# HandlerInternalSiblingPins from this repository's own checkout against the
# CALLER's pyproject.toml and refuses, for every internal sibling in
# src/omnibase_core/validation/contracts/first_party_ref.validation.yaml that the caller
# declares:
#
#   missing_source  no [tool.uv.sources] entry (uv sync resolves a release)
#   bare_sha        a rev, or a direct URL ref, that is a commit sha
#   release_tag     a tag or ref such as v0.47.48
#   branch          a branch, or a git source with no ref
#   not_dev_tag     any other ref or a non-git source
#   wrong_repo      a git source that is not the sibling's own repository
#   release_pin     an exact == version (keep a range for external installs)
#   stale_pin       a tag trails newest by more than either contract bound
#   unverifiable_pin a sibling tag inventory or pinned tag cannot be verified
#
# Staleness is evaluated by default against live sibling tags. Each dev merge
# tag represents one merge; merge-count and UTC timestamp-gap bounds come only
# from the packaged contract. A stale pin must move to the newest dev tag.
#
# The contract is read from the pinned checkout, so a caller cannot widen it.
# A caller adopts the check in the same pull request that converts its pins,
# and marks "Internal Sibling Pins" required on its landing branch.
#
# Usage in a caller repo:
#
#   jobs:
#     internal-sibling-pins:
#       name: Internal Sibling Pins
#       uses: OmniNode-ai/omnibase_core/.github/workflows/internal-sibling-pins.yml@<dev-merge-tag>
#
# The validator version is the caller's pin: omnibase-core-ref defaults to
# github.job_workflow_sha, the sha of this file as the caller pinned it.
#
# tests/unit/validation/first_party_ref/test_runtime_first_party_ref.py pins the trigger,
# the hosted runner and the command this job runs.
name: Internal Sibling Pins

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the validator runtime.
        required: false
        type: string
        default: "3.12"
      uv-version:
        description: uv version for the validator runtime.
        required: false
        type: string
        default: "0.8.3"
      omnibase-core-ref:
        description: >-
          omnibase_core ref containing the validator. Empty means the sha this
          workflow file was called at.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  internal-sibling-pins:
    name: Internal Sibling Pins
    # GitHub-hosted by literal: omnibase_core is public and CI runners are for
    # private repositories only (RULING 2026-10-16T07:07:09Z, OMN-19998); the
    # job reads one TOML file.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false

      - name: Checkout omnibase_core validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OmniNode-ai/omnibase_core
          ref: ${{ inputs['omnibase-core-ref'] || github.job_workflow_sha }}
          path: omnibase_core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ inputs['uv-version'] }}

      - name: Install the validator
        working-directory: omnibase_core
        env:
          UV_HTTP_TIMEOUT: ${{ vars.UV_HTTP_TIMEOUT || '600' }}
        run: |
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            uv sync --locked --no-dev && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::uv sync failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((10 * attempt))
          done

      - name: Internal sibling pins
        working-directory: omnibase_core
        run: |
          uv run --no-sync python -m omnibase_core.nodes.node_first_party_tag_inventory_effect.runtime_first_party_ref \
            --root "$GITHUB_WORKSPACE/target" \
            --report-json "$GITHUB_WORKSPACE/internal-sibling-pins-report.json"
