name: Release Dry Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to simulate (e.g. v0.20.0)'
        required: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.12'
      - name: Build only (no publish)
        run: uv build
      - name: Verify artifacts
        run: |
          ls dist/*.whl dist/*.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz
