#
# KB Doc Gate — manual caller. OMN-17172 (fleet rollout; OMN-16589 built the gate).
#
# MIGRATED INTO ci.yml (OMN-16589): the pull-request caller now lives there as
# job id `kb-doc-gate`, preserving the live required dev context byte-for-byte
# as `kb-doc-gate / kb-doc-gate` while permanently closing this standalone
# file's pull-request-workflow-budget waiver. This file remains available only
# for manual/ad-hoc invocation, with a distinct job id so a dispatch cannot
# produce a duplicate required context.
#
# Canonical docs live in the knowledge-base repo. The gate keeps this repo's
# markdown inside the operator-approved set: root README.md, root CLAUDE.md or
# anything under .claude/, CHANGELOG*.md, LICENSE*, root SECURITY.md,
# .github/**, skills|commands|agents/**, and tests/**/{fixtures,data,golden}/**.
# Everything else is documentation that must leave.
#
# mode: diff — fails a PR that ADDS or MODIFIES markdown outside that set.
# Deletions always pass (that is the migration doing its job), and a rename is
# judged on its destination. Flip this repo to 'strict' (fails if ANY markdown
# outside the set EXISTS on the branch) by adding a .kb-doc-gate.yaml at this
# repo's root containing 'mode: strict', once this repo's KB Wave-4 migration
# lands and its residual doc count reaches zero. Doing it earlier blocks every
# unrelated PR against the existing sprawl.
#
# Validator + reusable workflow live in omniclaude. The immutable caller pin is
# still the validator version's single source of truth: the reusable checks its
# validator out at github.job_workflow_sha, i.e. the caller's pinned SHA.

name: KB Doc Gate

on:
  workflow_dispatch: {}

jobs:
  manual-kb-doc-gate:
    uses: OmniNode-ai/omniclaude/.github/workflows/kb-doc-gate-reusable.yml@a58fb5eab5ae66a8e7fcb7f6bcac8c3e48632ee1
    with:
      mode: diff
