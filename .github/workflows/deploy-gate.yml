#
# Wave D CI gate: runtime-change PRs must cite a ticket with deploy evidence.
# Ticket: OMN-8912 | DGM-Phase6 (OMN-9734): thin caller — validator lives in omniclaude.
# Ref points at @main; omniclaude PR #1418 merged 2026-04-25 and the prior pinned SHA
# (16d9355f) is on a deleted branch and unreachable to Actions cross-repo `uses:` (OMN-9892).
#
# Required status check: "deploy-gate"
# Must pass before merging to main on all repos with runtime code.

name: Deploy Gate

on:
  pull_request:
    branches: [main, develop, dev]
  merge_group:
    branches: [main, develop, dev]

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gate:
    uses: OmniNode-ai/omniclaude/.github/workflows/deploy-gate-reusable.yml@beffbe1c3a85d42cefd261a18a2eaa1c27756071  # omniclaude, sha-pinned (OMN-20001); bump = consumer PR
    with:
      # OMN-20074: read the cited ticket's contract from this repository's
      # contracts/OMN-<n>.yaml at the pull request head, not onex_change_control.
      # The reusable at the old pin hardcoded the onex_change_control checkout and
      # ignored contracts-dir, so a core PR touching runtime paths could only pass
      # with an OCC companion. Same pin and input as omnibase_infra's caller.
      contract-source: caller
