#
# Shadow test-selection metrics harvester (OMN-14342).
#
# Stage 2 of the two-stage durable store (Option A). CI's shadow-compare job
# uploads an ephemeral `shadow-record-<run_id>` artifact on every dev PR. This
# workflow runs in the trusted base-repo context after CI completes, downloads
# that record, and appends it (dedup by repo+head_sha+pr_number) to an
# append-only NDJSON on the dedicated `ci-shadow-metrics` orphan branch — a
# durable, replayable log per the deterministic-truth doctrine, with no CI->LAN
# coupling and no external infra/secrets. Promote to a Postgres projection later
# if query volume justifies.
name: Shadow Metrics Harvest

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: shadow-metrics-harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: Harvest shadow records
    runs-on: ubuntu-latest
    # Harvest only from PR-triggered CI runs (the shadow record only exists there);
    # workflow_dispatch is allowed for manual backfill.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.event == 'pull_request'
    steps:
      # OMN-18273: this job used to clone and push the metrics branch with the
      # default workflow token, committing as an invented harvester identity that
      # resolves to no GitHub account. Mint the onexbot-occ-writer installation
      # token instead. No `|| secrets.GITHUB_TOKEN` fallback: a fallback silently
      # restores the mis-attributed push while the job still reports success.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: omnibase_core
          permission-contents: write

      - name: Checkout product branch (for the append script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          # The metrics branch is cloned below through an explicit credentialed
          # URL. A persisted basic-auth header here would override that URL's
          # credential and push as the workflow token instead.
          persist-credentials: false

      - name: Download shadow record(s) from the triggering run
        if: github.event_name == 'workflow_run'
        continue-on-error: true # a run with no shadow record (docs-only PR) is normal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: shadow-record-*
          path: records

      - name: Append records to ci-shadow-metrics NDJSON
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NDJSON_PATH: shadow_metrics.ndjson
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          records=(records/**/*.json)
          if [ ${#records[@]} -eq 0 ]; then
            echo "No shadow records to harvest (nothing uploaded by the triggering run)."
            exit 0
          fi

          # Keep an absolute path to the append script before we clone the
          # orphan branch into a subdirectory.
          APPEND_SCRIPT="$PWD/scripts/ci/shadow_metrics_append.py"
          RECORDS_DIR="$PWD/records"

          AUTH="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$AUTH" ci-shadow-metrics >/dev/null 2>&1; then
            git clone --branch ci-shadow-metrics --single-branch "$AUTH" _metrics
          else
            git clone --depth 1 "$AUTH" _metrics
            (
              cd _metrics
              git checkout --orphan ci-shadow-metrics
              git rm -rf . >/dev/null 2>&1 || true
              printf '# CI shadow test-selection metrics (OMN-14342)\n\nAppend-only NDJSON log. One ModelShadowRecord per dev-PR CI run.\nSchema: scripts/ci/test_selection_shadow_models.py on the product branch.\n' > README.md
            )
          fi

          METRICS_DIR="$PWD/_metrics"
          cd _metrics
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"

          # Append the records and commit them. Idempotent: the append dedups by
          # repo+head_sha+pr_number, so running it again on a freshly synced tree
          # adds only what the remote does not already hold. Called as a plain
          # command, never inside `if`, so `set -e` still stops on a real error.
          COMMITTED=no
          commit_records() {
            python3 "$APPEND_SCRIPT" \
              --records-dir "$RECORDS_DIR" \
              --ndjson "$METRICS_DIR/${NDJSON_PATH}"
            git add "${NDJSON_PATH}" README.md
            if git diff --cached --quiet; then
              COMMITTED=no
              return 0
            fi
            git commit -m "chore(OMN-14342): harvest shadow test-selection record(s)" \
              --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
              --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            COMMITTED=yes
          }

          commit_records
          if [ "$COMMITTED" = no ]; then
            echo "No new records to commit."
            exit 0
          fi

          # OMN-19998: the push is the one step that talks to GitHub's ref store,
          # and it can be rejected on GitHub's side ("remote: fatal error in
          # commit_refs", "[remote rejected] ... (failure)") with nothing wrong in
          # the repository. This job is workflow_run-triggered, so its check lands
          # on the default branch tip and one such rejection read as a red dev.
          # Re-sync to the remote branch and push again, a bounded number of times;
          # every attempt rejected still fails the job.
          max_attempts=4
          delay="${HARVEST_PUSH_RETRY_DELAY:-15}"
          attempt=1
          while true; do
            if git push "$AUTH" ci-shadow-metrics; then
              exit 0
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::push to ci-shadow-metrics rejected on all ${max_attempts} attempts"
              exit 1
            fi
            echo "push to ci-shadow-metrics rejected (attempt ${attempt}/${max_attempts}); re-syncing and retrying"
            sleep "$((delay * attempt))"
            attempt=$((attempt + 1))
            if git ls-remote --exit-code --heads "$AUTH" ci-shadow-metrics >/dev/null 2>&1; then
              git fetch "$AUTH" ci-shadow-metrics
              git reset --hard FETCH_HEAD
              commit_records
              if [ "$COMMITTED" = no ]; then
                echo "Remote already holds these records."
                exit 0
              fi
            fi
          done
