name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.20.0). Leave empty when using sync_main_to_tag.'
        required: false
        default: ''
      # OMN-16289: sync-only recovery input. The main fast-forward is the LAST
      # step of the `release` job, sequenced behind `Publish to PyPI` and
      # `Create GitHub Release`, so neither a `--failed` re-run nor a plain
      # `-f tag=` dispatch can reach it without re-executing the publish,
      # re-cutting the GitHub Release and re-firing the dependency cascade.
      # When the sync is the ONLY thing that failed -- runs 34030901325
      # (v0.47.4) and 34052816626 (v0.47.5): publish SUCCESS, GitHub Release
      # SUCCESS, `Mint onexbot-occ-writer app token` FAILURE with HTTP 422
      # because the App installation lacked `workflows: write` -- this input
      # runs the mint + fast-forward and nothing else.
      sync_main_to_tag:
        description: 'Sync-only: fast-forward main to this EXISTING release tag. No build, no publish, no GitHub Release, no cascade.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # OMN-16289: a sync-only dispatch (`-f sync_main_to_tag=vX.Y.Z`) must not
    # re-publish an already-published version, re-cut its GitHub Release or
    # re-fire the dependency cascade. This job IS the release; skip it whole
    # and let `sync-main` below perform the pointer move on its own.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_main_to_tag == '' }}
    # OMN-15603: this job used to run on the trusted self-hosted `omnibase-ci`
    # runner. Measured egress from that runner to upload.pypi.org is
    # 30-39 KiB/s, and upload.pypi.org enforces a hard ~240s server-side
    # request deadline. The 6.4 MiB wheel clears it (170-216s); the 9.2 MiB
    # sdist deterministically does not (241.4s -> HTTP 500 after the full body
    # transferred, identical to the tenth of a second on two attempts of run
    # 30674223657), which stranded omnibase-core 0.46.8 wheel-only. The job
    # publishes to a public index and reads no LAN service, so nothing here
    # needs the self-hosted runner; it moves to a GitHub-hosted runner whose
    # egress clears the deadline (AC2).
    runs-on: ubuntu-latest
    # OMN-16286: job-level override (job-level permissions REPLACE, not add
    # to, the workflow-level block above) so this job can additionally read
    # the release commit's merged PR + body via `gh` to resolve real cascade
    # evidence below.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.tag.outputs.tag }}
      ticket: ${{ steps.release_evidence.outputs.ticket }}
      evidence_source: ${{ steps.release_evidence.outputs.evidence_source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # OMN-16289: `tag` is no longer a REQUIRED dispatch input -- a sync-only
      # dispatch supplies `sync_main_to_tag` instead and skips this job whole.
      # A dispatch that supplies NEITHER would otherwise fall back to
      # `github.ref` and die several steps later on a confusing
      # "tag v does not match pyproject.toml version" message. Fail here, in
      # the language of the mistake that was actually made.
      - name: Require a release tag on workflow_dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::workflow_dispatch needs one of: tag=<tag> to run a release, or sync_main_to_tag=<tag> to fast-forward main only"
            exit 1
          fi
          echo "Release dispatch for tag ${RELEASE_TAG}"

      - name: Assert clean working tree
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Validate tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG_VERSION=$(python3 -c "
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          v = d.get('project', {}).get('version')
          if not v:
              raise SystemExit('ERROR: missing [project].version in pyproject.toml')
          print(v)
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: tag v${TAG} does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        run: uv build

      - name: Verify dist artifacts exist
        run: |
          ls -la dist/
          ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1 || {
            echo "ERROR: expected wheel + sdist in dist/"
            exit 1
          }

      # OMN-15603 (AC4): checksums and the release tag are derived BEFORE the
      # publish attempt. They are pure local computations that used to sit
      # behind the single non-idempotent publish step, so a publish failure
      # silently skipped them along with the GitHub Release and the cascade.
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Set release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A newline in the dispatch input would forge extra GITHUB_OUTPUT
            # entries, so constrain it to the tag charset before writing it.
            case "$RELEASE_TAG" in
              ''|*[!A-Za-z0-9.+_-]*)
                echo "::error::release tag contains unsupported characters"
                exit 1
                ;;
            esac
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      # OMN-16286: the Dependency Cascade job below opens a bump PR in every
      # downstream repo. Those PRs previously carried no ticket and no
      # Evidence-Source, so Receipt-Gate / occ-preflight hard-failed on every
      # single one (no cascade PR could land anywhere without manual
      # intervention). Rather than fabricate new evidence or add a bot
      # exemption (both explicitly rejected -- OMN-16286), re-thread the SAME
      # real Evidence-Ticket/Evidence-Source pair that already closed the
      # release's own merged PR: that evidence is what actually proved this
      # released code, and the cascade PRs are honestly downstream of it. Fail
      # loud rather than open unlandable cascade PRs again when the tagged
      # commit has no resolvable merged PR or evidence pair.
      - name: Resolve release ticket + evidence (OMN-16286)
        id: release_evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"

          # OMN-16286 (CodeRabbit finding): /commits/{sha}/pulls returns EVERY
          # PR associated with this commit, not just the merged one -- GitHub
          # includes open PRs too when the commit isn't yet on the default
          # branch, and the endpoint documents no ordering guarantee. Selecting
          # a bare .[0] risked propagating evidence from an open, unreviewed PR
          # instead of the merged release PR that actually proved this code.
          # Filter to state=="closed" && mergedAt != null explicitly and fail
          # loud if none qualifies.
          pr_number="$(gh api "repos/${{ github.repository }}/commits/${head_sha}/pulls" \
            --jq '[.[] | select(.state == "closed" and .merged_at != null)][0].number // empty' 2>/dev/null || true)"
          if [ -z "$pr_number" ]; then
            echo "::error::OMN-16286: could not resolve a MERGED PR for release commit ${head_sha}. The dependency cascade requires a real Evidence-Ticket/Evidence-Source pair sourced from the release's own merged PR; a tag with no associated merged PR (only open/unmerged ones, or none at all) cannot cascade honestly."
            exit 1
          fi

          pr_state="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json state --jq '.state' 2>/dev/null || true)"
          if [ "$pr_state" != "MERGED" ]; then
            echo "::error::OMN-16286: PR #${pr_number} (commit ${head_sha}) resolved to state='${pr_state:-<unknown>}', not MERGED. Refusing to propagate evidence from a non-merged PR."
            exit 1
          fi

          pr_body="$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || true)"

          ticket="$(printf '%s' "$pr_body" | grep -oiE '^Evidence-Ticket:[[:space:]]*OMN-[0-9]+' | head -1 | grep -oiE 'OMN-[0-9]+' | tr '[:lower:]' '[:upper:]' || true)"
          evidence_source="$(printf '%s' "$pr_body" | grep -iE '^Evidence-Source:[[:space:]]+\S' | head -1 | sed -E 's/^Evidence-Source:[[:space:]]*//; s/[[:space:]]+$//' || true)"

          if [ -z "$ticket" ] || [ -z "$evidence_source" ]; then
            echo "::error::OMN-16286: release PR #${pr_number} (commit ${head_sha}) is missing a resolvable Evidence-Ticket/Evidence-Source pair (ticket='${ticket:-<none>}', evidence_source='${evidence_source:-<none>}'). Fix the release PR's evidence trailer, or release from a properly evidenced commit, before the dependency cascade can open honest downstream PRs."
            exit 1
          fi

          echo "ticket=${ticket}" >> "$GITHUB_OUTPUT"
          echo "evidence_source=${evidence_source}" >> "$GITHUB_OUTPUT"
          echo "::notice::OMN-16286: resolved cascade evidence from PR #${pr_number} -- ticket=${ticket} evidence_source=${evidence_source}"

      # OMN-15603 (AC4): preserve the built artifacts BEFORE publishing. Run
      # 30674223657 ended with total_count=0 artifacts, so the only way to
      # recover the stranded sdist was to rebuild it from the tag.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      # OMN-15603 (AC1 + AC3): resumable, retried publish.
      #
      # --check-url makes the upload idempotent: uv queries the PyPI simple
      # index and skips every file already present, so a retry re-transfers
      # only what is still missing. The URL must be the simple index ROOT --
      # uv appends the package name itself. Verified empirically against uv
      # 0.12.1 (the version astral-sh/setup-uv@v7 resolves) with the published
      # 0.46.8 wheel: `--check-url https://pypi.org/simple/` prints
      # "File omnibase_core-0.46.8-py3-none-any.whl already exists, skipping",
      # while the package-scoped `https://pypi.org/simple/omnibase-core/`
      # re-uploads exactly as if no --check-url had been passed at all.
      #
      # The retry loop absorbs the 5xx that upload.pypi.org returns on a
      # request that overruns its server-side deadline. Retries are cheap
      # because --check-url skips whatever already landed.
      #
      # AC3 says "retry on 5xx", so the loop READS the failure instead of
      # retrying every non-zero exit. A 4xx (bad token, malformed metadata,
      # rejected filename) is deterministic: retrying it burns the full
      # 15s + 45s backoff and then reports a permanent fault in the language
      # of a transient one. Only an upstream 5xx or a transport-level fault
      # -- the classes that a second attempt can actually clear -- is retried.
      - name: Publish to PyPI
        run: |
          set -uo pipefail
          attempt=1
          max_attempts=3
          backoff=15
          publish_log="$(mktemp)"

          # upload.pypi.org returns 500 when a request overruns its ~240s
          # server-side deadline; 502/503/504 are the other transient upstream
          # classes. The transport patterns cover a connection dropped before
          # any HTTP status was seen, which is the same "try again" class.
          # `\b` is not portable across GNU and BSD grep, and this shell is
          # executed verbatim by the tests on both -- so the patterns stay in
          # plain POSIX ERE.
          is_retryable() {
            grep -Eqi \
              -e 'status code 5[0-9][0-9]' \
              -e '(internal server error|bad gateway|service unavailable|gateway time-?out)' \
              -e '(error sending request|connection (reset|closed|refused)|operation timed out|timed out|broken pipe)' \
              "$1"
          }

          while true; do
            if uv publish \
              --check-url https://pypi.org/simple/ \
              --token "$UV_PUBLISH_TOKEN" \
              dist/*.whl dist/*.tar.gz 2>&1 | tee "$publish_log"
            then
              exit 0
            fi
            if ! is_retryable "$publish_log"; then
              echo "ERROR: uv publish failed with a non-retryable error (no 5xx or transport fault in the output); not retrying" >&2
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "ERROR: uv publish failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "uv publish attempt ${attempt}/${max_attempts} failed with a retryable 5xx/transport fault; retrying in ${backoff}s" >&2
            sleep "$backoff"
            attempt=$((attempt + 1))
            backoff=$((backoff * 3))
          done
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}

      # OMN-16343: main protection restricts pushes to a specific push
      # identity; the workflow GITHUB_TOKEN cannot be authorized in that
      # allowlist (proven live: GH006 on the plain-GITHUB_TOKEN push,
      # 2026-08-21). Mint a short-lived installation token for the
      # org-owned app onexbot-occ-writer and push with that identity
      # instead. App credentials come from org secrets ONEXBOT_OCC_APP_ID
      # / ONEXBOT_OCC_PRIVATE_KEY.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # OMN-16289: a `permission-*` input REPLACES the installation's full
          # permission set with exactly what is listed. OMN-17272 added
          # `permission-workflows: write` alone, which silently dropped
          # `contents: write` -- so the minted token could not push ANY ref and
          # the fast-forward died on `GH013 ... Cannot update this protected
          # ref` (run 34065670492, v0.47.5). omnimarket, whose sync has worked
          # throughout, mints with `permission-contents: write`. Both scopes are
          # required: contents to move the ref at all, workflows because a
          # release tag can legitimately contain changes under
          # .github/workflows/ (run 33525584540, OMN-17272).
          permission-contents: write
          permission-workflows: write

      # OMN-16289: main = the last release. Once a release publishes
      # successfully, fast-forward main to the released tag's commit SHA.
      # This is a non-force push of an already-proven dev SHA (release
      # tags are cut from dev; dev CI + this job already validated it).
      # Promotion PRs to main are retired -- main protection now empties
      # required_status_checks on main and restricts pushes to the
      # onexbot-occ-writer app identity (OMN-16343), so the push
      # authenticates with the app token minted above rather than the
      # workflow GITHUB_TOKEN.
      - name: Sync main to release tag
        if: ${{ !contains(steps.tag.outputs.tag, 'rc') }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          # OMN-16289: main = the last release. This step moves the pointer.
          #
          # It used to push the tag SHA to refs/heads/main over git, with
          # the App token embedded in the remote URL, after unsetting
          # `http.<origin>.extraheader` so the persisted workflow GITHUB_TOKEN
          # header could not override it (the OMN-17272 fix).
          #
          # That unset is now a NO-OP. actions/checkout v7 no longer persists
          # the token in `--local` config -- it writes the header into a
          # separate file and includes it through `includeIf.gitdir`:
          #   git config --file .../git-credentials-<uuid>.config \
          #     http.https://github.com/.extraheader "AUTHORIZATION: basic ***"
          #   git config --local includeIf.gitdir:<workdir>/.git.path <file>
          # so `--unset-all` against --local removes nothing, the included
          # header still overrides the URL credentials, and the push
          # authenticates as github-actions[bot]. The OMN-16289 main ruleset's
          # only bypass actor is the onexbot-occ-writer App, so it declines
          # exactly that: GH013 "Cannot update this protected ref" (core run
          # 34065670492, 2026-09-06 -- mint SUCCESS, push FAILURE).
          #
          # Update the ref through the REST API with the App token instead.
          # No git credential layer is involved, so nothing can override the
          # push identity. This is the shape omnimarket already syncs main
          # with, live-proven against its ACTIVE ruleset (run 34050376661,
          # 2026-09-06, main = v0.4.18). `"force": false` makes GitHub itself
          # enforce the fast-forward, server-side, on top of this workflow's
          # own ancestry guard.
          case "$TAG_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::resolved release SHA is not a full commit SHA"
              exit 1
              ;;
          esac
          printf '{"sha":"%s","force":false}' "$TAG_SHA" > update-main-ref.json
          http_code="$(curl -sS -o update-main-ref.out -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            --data @update-main-ref.json)"
          cat update-main-ref.out
          echo
          case "$http_code" in
            2*) ;;
            *)
              echo "::error::refs/heads/main update refused with HTTP ${http_code}"
              exit 1
              ;;
          esac
          echo "main fast-forwarded to $TAG_SHA ($TAG)"

  # ---------------------------------------------------------------------------
  # OMN-16289: sync-only main fast-forward, dispatchable for an EXISTING tag
  # ---------------------------------------------------------------------------
  # The `release` job's own main sync is the last step of a long, partly
  # non-idempotent job. When only that step fails, the pointer move has no
  # recovery path that does not also re-run the publish. This job is that path:
  # it builds nothing, publishes nothing, and touches no downstream repo.
  #
  # The step NAMES here are deliberately identical to the release job's
  # ("Mint onexbot-occ-writer app token", "Sync main to release tag") -- the
  # release-on-merge work (OMN-18010) reuses this dispatch path, and stable
  # step names are what its evidence is read from.
  #
  # Two guards, both fail-closed:
  #   * ancestor-valid: the tag must exist and be an ancestor of origin/dev.
  #     A tag cut from anywhere else is not a release this policy may point
  #     main at.
  #   * fast-forward only: current main must be an ancestor of the tag SHA, so
  #     main can never be moved backwards or sideways. main already AT the tag
  #     is a no-op, not a failure.
  #
  # The validation script is free of inline `${{ }}` (values arrive through
  # `env:`) so tests can execute the committed shell verbatim instead of
  # pattern-matching it.
  sync-main:
    name: Sync main to release tag (sync-only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_main_to_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate sync tag
        id: sync_tag
        env:
          SYNC_TAG: ${{ inputs.sync_main_to_tag }}
        run: |
          set -euo pipefail
          TAG="$SYNC_TAG"

          # A newline in the dispatch input would forge extra GITHUB_OUTPUT
          # entries, so constrain it to the tag charset before it is written.
          case "$TAG" in
            ''|*[!A-Za-z0-9.+_-]*)
              echo "::error::sync_main_to_tag contains unsupported characters"
              exit 1
              ;;
          esac

          # Only a real release tag. This is the same shape the push trigger
          # accepts, so nothing reachable here is outside the release policy.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::sync_main_to_tag '$TAG' is not a vX.Y.Z release tag"
              exit 1
              ;;
          esac
          case "$TAG" in
            *rc*)
              echo "::error::refusing to point main at the prerelease tag '$TAG'"
              exit 1
              ;;
          esac

          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::tag '$TAG' does not exist in this repository"
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"

          # Explicit refspecs: never rely on git opportunistically updating
          # the remote-tracking refs for a named-branch fetch.
          git fetch --no-tags --quiet origin \
            "+refs/heads/dev:refs/remotes/origin/dev" \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/dev; then
            echo "::error::tag '$TAG' ($TAG_SHA) is not an ancestor of origin/dev -- it is not a release cut from dev, refusing to point main at it"
            exit 1
          fi

          MAIN_SHA="$(git rev-parse origin/main)"
          echo "main=$MAIN_SHA  tag=$TAG_SHA ($TAG)"
          if [ "$MAIN_SHA" = "$TAG_SHA" ]; then
            echo "::notice::main is already at $TAG_SHA ($TAG) -- nothing to do"
            echo "noop=true" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$MAIN_SHA" "$TAG_SHA"; then
            echo "::error::main ($MAIN_SHA) is not an ancestor of $TAG ($TAG_SHA) -- refusing to move main backwards or sideways"
            exit 1
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Mint onexbot-occ-writer app token
        id: app-token
        if: steps.sync_tag.outputs.noop == 'false'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Both scopes are required, and a `permission-*` input REPLACES the
          # installation's full set: contents to move refs/heads/main at all,
          # workflows because a release tag can legitimately contain changes
          # under .github/workflows/ (OMN-16289 run 34065670492, OMN-17272).
          permission-contents: write
          permission-workflows: write

      - name: Sync main to release tag
        if: steps.sync_tag.outputs.noop == 'false'
        env:
          RELEASE_TAG: ${{ steps.sync_tag.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          echo "Resolved tag $TAG -> commit $TAG_SHA"
          # OMN-16289: main = the last release. This step moves the pointer.
          #
          # It used to push the tag SHA to refs/heads/main over git, with
          # the App token embedded in the remote URL, after unsetting
          # `http.<origin>.extraheader` so the persisted workflow GITHUB_TOKEN
          # header could not override it (the OMN-17272 fix).
          #
          # That unset is now a NO-OP. actions/checkout v7 no longer persists
          # the token in `--local` config -- it writes the header into a
          # separate file and includes it through `includeIf.gitdir`:
          #   git config --file .../git-credentials-<uuid>.config \
          #     http.https://github.com/.extraheader "AUTHORIZATION: basic ***"
          #   git config --local includeIf.gitdir:<workdir>/.git.path <file>
          # so `--unset-all` against --local removes nothing, the included
          # header still overrides the URL credentials, and the push
          # authenticates as github-actions[bot]. The OMN-16289 main ruleset's
          # only bypass actor is the onexbot-occ-writer App, so it declines
          # exactly that: GH013 "Cannot update this protected ref" (core run
          # 34065670492, 2026-09-06 -- mint SUCCESS, push FAILURE).
          #
          # Update the ref through the REST API with the App token instead.
          # No git credential layer is involved, so nothing can override the
          # push identity. This is the shape omnimarket already syncs main
          # with, live-proven against its ACTIVE ruleset (run 34050376661,
          # 2026-09-06, main = v0.4.18). `"force": false` makes GitHub itself
          # enforce the fast-forward, server-side, on top of this workflow's
          # own ancestry guard.
          case "$TAG_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::resolved release SHA is not a full commit SHA"
              exit 1
              ;;
          esac
          printf '{"sha":"%s","force":false}' "$TAG_SHA" > update-main-ref.json
          http_code="$(curl -sS -o update-main-ref.out -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
            --data @update-main-ref.json)"
          cat update-main-ref.out
          echo
          case "$http_code" in
            2*) ;;
            *)
              echo "::error::refs/heads/main update refused with HTTP ${http_code}"
              exit 1
              ;;
          esac
          echo "main fast-forwarded to $TAG_SHA ($TAG)"


  # ---------------------------------------------------------------------------
  # Post-release: open dependency bump PRs in downstream repos (OMN-5109)
  # ---------------------------------------------------------------------------
  # When omnibase_core is released, downstream repos (omnibase_infra,
  # omniintelligence, omnimemory, omniclaude) need their lockfiles updated.
  dependency-cascade:
    name: Dependency Cascade
    needs: release
    # OMN-16289: `needs.release.result == 'success'` is explicit rather than
    # implied, so a sync-only dispatch (which skips `release`) can never open
    # downstream bump PRs off an empty version string.
    if: ${{ needs.release.result == 'success' && !contains(needs.release.outputs.version, 'rc') }}
    uses: ./.github/workflows/dependency-cascade.yml
    with:
      package: omnibase_core
      version: ${{ needs.release.outputs.version }}
      ticket: ${{ needs.release.outputs.ticket }}
      evidence_source: ${{ needs.release.outputs.evidence_source }}
    secrets:
      # OMN-16373: CROSS_REPO_PAT retired — pass the onexbot-occ-writer App
      # credentials through so dependency-cascade.yml can mint its own
      # per-repo installation token.
      onexbot-occ-app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
      onexbot-occ-private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}

  # ---------------------------------------------------------------------------
  # OMN-15603 (AC4): a failed release used to be silent about its own wreckage
  # -- the downstream steps just showed "skipped" and nothing said which
  # artifacts had already landed on the public index. This names the partial
  # state and the canonical recovery command.
  #
  # It is a JOB rather than a step inside `release` because AC4 names the
  # Dependency Cascade among the things that must "either run, or the run fails
  # loudly naming which artifacts landed" -- and a step inside `release` cannot
  # observe a cascade failure. With `release` green and a cascade matrix job
  # red, the run went red and nothing emitted the artifact census. As a job
  # with `needs: [release, dependency-cascade]` it covers every way this
  # workflow ends badly, with ONE copy of the shell rather than two.
  #
  # The tag and the upstream job results arrive through `env:` rather than
  # inline `${{ }}` so the committed shell is executable verbatim -- that is
  # what lets test_release_workflow_shape.py RUN this block under `bash -e`
  # instead of pattern-matching the string and shipping a shell bug green.
  # ---------------------------------------------------------------------------
  report-partial-state:
    name: Report partial release state
    runs-on: ubuntu-latest
    needs: [release, dependency-cascade]
    # `skipped` is deliberately NOT a trigger. dependency-cascade is skipped by
    # design on an rc tag, so a `!= 'success'` condition would fire this report
    # on a perfectly good rc release.
    if: ${{ always() && (needs.release.result == 'failure' || needs.release.result == 'cancelled' || needs['dependency-cascade'].result == 'failure' || needs['dependency-cascade'].result == 'cancelled') }}
    steps:
      # Best-effort: when `release` died before `Upload dist artifacts` there is
      # nothing to download and the report must still emit, so a missing
      # artifact must not fail this job. The shell below handles an empty
      # dist/ (see test_partial_release_state_survives_an_unresolved_tag_...).
      - name: Download preserved dist artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist/

      - name: Report partial release state
        env:
          RELEASE_TAG: ${{ needs.release.outputs.version }}
          RELEASE_RESULT: ${{ needs.release.result }}
          CASCADE_RESULT: ${{ needs['dependency-cascade'].result }}
        run: |
          set -uo pipefail
          RELEASE_TAG="${RELEASE_TAG:-}"
          RELEASE_RESULT="${RELEASE_RESULT:-unknown}"
          CASCADE_RESULT="${CASCADE_RESULT:-unknown}"
          echo "::error::RELEASE INCOMPLETE for ${RELEASE_TAG:-<tag unresolved>} -- release job: ${RELEASE_RESULT}, dependency cascade: ${CASCADE_RESULT}."
          if [ "$RELEASE_RESULT" != "success" ]; then
            echo "::error::GitHub Release and Dependency Cascade did NOT run."
          fi
          if [ "$CASCADE_RESULT" = "failure" ] || [ "$CASCADE_RESULT" = "cancelled" ]; then
            echo "::error::Dependency Cascade did NOT complete (${CASCADE_RESULT}) -- downstream lockfile bump PRs were NOT opened."
          fi
          # An unreachable index means the landed/missing question is UNKNOWN.
          # Reporting "MISSING" there would be a false claim about a public
          # index, which is the opposite of what this step exists to do.
          if index=$(curl -sSL --max-time 60 https://pypi.org/simple/omnibase-core/); then
            index_read=1
          else
            index_read=0
            index=""
            echo "::error::Could not read the PyPI simple index -- landed/missing state is UNKNOWN."
          fi
          for path in dist/*.whl dist/*.tar.gz; do
            [ -e "$path" ] || continue
            name=$(basename "$path")
            if [ "$index_read" -eq 0 ]; then
              echo "::error::UNKNOWN on PyPI: ${name}"
            elif printf '%s' "$index" | grep -qF -- "$name"; then
              echo "::error::LANDED on PyPI: ${name}"
            else
              echo "::error::MISSING from PyPI: ${name}"
            fi
          done
          if [ -n "$RELEASE_TAG" ] && ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1; then
            echo "::error::Built artifacts preserved as workflow artifact 'dist-${RELEASE_TAG}'."
            echo "::error::Recover with: gh workflow run release.yml --repo OmniNode-ai/omnibase_core --ref dev -f tag=${RELEASE_TAG}"
          else
            echo "::error::No dist artifact can be claimed for an unresolved release tag."
            echo "::error::Recover by determining the intended tag, then run: gh workflow run release.yml --repo OmniNode-ai/omnibase_core --ref dev -f tag=<tag>"
          fi
