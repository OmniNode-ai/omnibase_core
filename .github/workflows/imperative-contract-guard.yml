#
# Reusable imperative contract guard for OmniNode repositories (OMN-20918).
#
# The guard runs HandlerImperativeContractGuard from this repository's own checkout
# against the CALLER's tree and the CALLER's own allowlist, and refuses an allowlist that
# gains a path against the merge base (a shrink-only ratchet), so no repository can widen
# another repository's list.
#
# Usage in a caller repo:
#
#   jobs:
#     imperative-contract-guard:
#       name: Imperative Contract Guard
#       uses: OmniNode-ai/omnibase_core/.github/workflows/imperative-contract-guard.yml@<full sha>
#       with:
#         allowlist-path: imperative-contract-allowlist.yaml   # relative to the caller's root
#
# The validator version is the caller's pin: omnibase-core-ref defaults to
# job.workflow_sha, the sha of this file as the caller pinned it.

name: Imperative Contract Guard

on:
  workflow_call:
    inputs:
      allowlist-path:
        description: >-
          The caller's own allowlist, relative to the caller's repository root.
        required: true
        type: string
      ratchet-base-ref:
        description: >-
          Ref the allowlist may only shrink against (merge base). Empty means the
          pull request base sha, or the merge-group base sha; a push event has none and
          the ratchet is skipped.
        required: false
        type: string
        default: ""
      scan-freestanding:
        description: Also audit freestanding src/ modules outside node handlers.
        required: false
        type: boolean
        default: true
      python-version:
        description: Python version for the validator runtime.
        required: false
        type: string
        default: "3.12"
      uv-version:
        description: uv version for the validator runtime.
        required: false
        type: string
        default: "0.8.3"
      target-ref:
        description: Caller repository ref to check out.
        required: false
        type: string
        default: ""
      omnibase-core-ref:
        description: >-
          omnibase_core ref containing the validator. Empty means the sha this
          workflow file was called at.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  imperative-contract-guard:
    name: Imperative Contract Guard
    runs-on: ${{ github.event.repository.private && ( (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]') || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]')) ) || 'ubuntu-latest' }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          ref: ${{ inputs['target-ref'] || github.ref }}
          fetch-depth: 0

      # OMN-23527: the validator ref is ALWAYS explicit. The spelling this step used
      # before, `github.job_workflow_sha`, is not a context that exists; it evaluated empty,
      # so actions/checkout made a REST "Determining the default branch" lookup on every run
      # (spending installation API quota, and fetching omnibase_core's dev tip instead of
      # the caller's pin). `job.workflow_sha` is the sha of THIS file as the caller pinned
      # it. An empty ref is refused here, before anything is fetched.
      - name: Resolve the omnibase_core validator pin
        id: pin
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          REF_OVERRIDE: ${{ inputs['omnibase-core-ref'] }}
        run: |
          set -euo pipefail
          resolved="${REF_OVERRIDE:-$WORKFLOW_SHA}"
          if [ -z "$resolved" ]; then
            echo "::error::imperative contract guard validator ref is empty; refusing the default-branch lookup. THE GATE DID NOT RUN."
            exit 1
          fi
          if [ -z "$REF_OVERRIDE" ]; then
            if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::imperative contract guard pin is not a lowercase 40-hex commit. THE GATE DID NOT RUN."
              exit 1
            fi
            if [ "$WORKFLOW_REPOSITORY" != "OmniNode-ai/omnibase_core" ]; then
              echo "::error::workflow repository is '$WORKFLOW_REPOSITORY', not OmniNode-ai/omnibase_core. THE GATE DID NOT RUN."
              exit 1
            fi
          fi
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"
          echo "imperative contract guard validator pin: $resolved"

      # OMN-23527: a rate-limit or 5xx answer is retried with backoff a bounded number of
      # times. A fetch that is still refused fails the job AND says so in the job summary:
      # the guard did not run, so the red is not a finding about the caller's code. This
      # step never exits 0 unless the validator was fetched, and a failure that is not a
      # rate limit or a 5xx fails at once without a retry.
      - name: Fetch the omnibase_core validator (retried on a rate limit or 5xx)
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_REF: ${{ steps.pin.outputs.ref }}
          VALIDATOR_REPOSITORY: OmniNode-ai/omnibase_core
          VALIDATOR_DEST: omnibase_core
          FETCH_ATTEMPTS: "5"
          FETCH_BACKOFF_SECONDS: "15"
        run: |
          set -uo pipefail
          rm -rf "$VALIDATOR_DEST"
          git init --quiet "$VALIDATOR_DEST"
          git -C "$VALIDATOR_DEST" remote add origin "${GITHUB_SERVER_URL}/${VALIDATOR_REPOSITORY}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          attempt=1
          while :; do
            log="$(mktemp)"
            if git -C "$VALIDATOR_DEST" -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --quiet --no-tags --depth 1 origin "$VALIDATOR_REF" >"$log" 2>&1; then
              git -C "$VALIDATOR_DEST" -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
              got="$(git -C "$VALIDATOR_DEST" rev-parse HEAD)"
              if [[ "$VALIDATOR_REF" =~ ^[0-9a-f]{40}$ ]] && [ "$got" != "$VALIDATOR_REF" ]; then
                echo "::error::validator checkout is at $got, expected $VALIDATOR_REF. THE GATE DID NOT RUN."
                exit 1
              fi
              echo "omnibase_core validator checked out at $got"
              exit 0
            fi
            cat "$log"
            if ! grep -qiE 'rate limit|returned error: (429|5[0-9][0-9])|HTTP/[0-9.]+ (429|5[0-9][0-9])|error: 5[0-9][0-9]' "$log"; then
              echo "::error::validator fetch failed and it is not a rate limit or server error (see the log above). THE GATE DID NOT RUN."
              exit 1
            fi
            if [ "$attempt" -ge "$FETCH_ATTEMPTS" ]; then
              break
            fi
            wait_seconds=$((FETCH_BACKOFF_SECONDS * 2 ** (attempt - 1)))
            echo "::warning::validator fetch attempt ${attempt}/${FETCH_ATTEMPTS} was refused (rate limit or server error); retrying in ${wait_seconds}s"
            sleep "$wait_seconds"
            attempt=$((attempt + 1))
          done
          {
            echo "### Imperative Contract Guard did not run: GitHub rate limit or server error"
            echo
            echo "The validator could not be fetched from ${VALIDATOR_REPOSITORY} after ${attempt} attempts."
            echo "The guard did not run. This red is NOT a finding about the code in this pull request; rerun the check once GitHub accepts requests again."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "::error::validator fetch was still refused by a GitHub rate limit or server error after ${attempt} attempts; the guard did not run (not a finding about the code)."
          exit 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs['python-version'] }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ inputs['uv-version'] }}

      - name: Run imperative contract guard
        working-directory: omnibase_core
        env:
          UV_HTTP_TIMEOUT: "600"
          UV_SYNC_ATTEMPTS: "3"
          UV_SYNC_RETRY_DELAY_SECONDS: "10"
          ALLOWLIST_PATH: ${{ inputs['allowlist-path'] }}
          RATCHET_BASE_REF: >-
            ${{ inputs['ratchet-base-ref']
            || github.event.pull_request.base.sha
            || github.event.merge_group.base_sha }}
          SCAN_FREESTANDING: ${{ inputs['scan-freestanding'] }}
        run: |
          git config --global http.version HTTP/1.1
          attempt=1
          until uv sync --locked --no-dev; do
            status=$?
            if [ "$attempt" -ge "$UV_SYNC_ATTEMPTS" ]; then
              echo "::error::uv sync failed after ${attempt} attempt(s)"
              exit "$status"
            fi

            sleep_seconds=$((UV_SYNC_RETRY_DELAY_SECONDS * attempt))
            echo "::warning::uv sync attempt ${attempt}/${UV_SYNC_ATTEMPTS} failed with exit ${status}; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

          args=(--repo-root "$GITHUB_WORKSPACE/target" --allowlist-path "$ALLOWLIST_PATH")
          if [ "$SCAN_FREESTANDING" = "true" ]; then
            args+=(--scan-freestanding)
          fi
          if [ -n "$RATCHET_BASE_REF" ]; then
            args+=(--ratchet-base-ref "$RATCHET_BASE_REF")
          else
            echo "::notice::no ratchet base ref (push event): allowlist ratchet skipped"
          fi
          uv run --no-sync check-imperative-contracts "${args[@]}"
