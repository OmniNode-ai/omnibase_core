#
# OMN-22894: secret scanning for omnibase_core, kept as a reusable so the job is hosted here and the
# caller in security-scan.yml stays a one-line reference (the CI inheritance ratchet refuses an inline
# repository-specific job). This repository is public, so the job runs on a hosted runner and never on
# an internal one. The scanner is the image digest the reference security-scan workflow of this
# organization carries (OMN-23008): the TruffleHog action is only a wrapper around a `docker run` of the
# :latest tag, so pinning the action pinned nothing that scans.

name: Secret Scanning (reusable)

on:
  workflow_call:

permissions:
  contents: read

env:
  # The TruffleHog scanner, by immutable digest: the one omnimarket's security-scan.yml carries
  # (resolved from ghcr.io/trufflesecurity/trufflehog:latest on 2026-11-07, when :latest and :3.99.8
  # both pointed at it). Bump it in a reviewed PR, together with the reference workflow's.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # The steps run the image by digest (env.TRUFFLEHOG_IMAGE) with the arguments the
      # trufflesecurity/trufflehog action builds, so the scope, flags and pass/fail behaviour match the
      # reference workflow's.
      # --exclude-detectors=lob (OMN-16045): Lob detector regex (v3.95.9+) mass-verifies test_-prefixed pytest identifiers as live keys; zero Lob usage in this repo. Dropping it is its own reviewed change, not part of a digest bump.
      - name: TruffleHog Secret Scanning (push diff)
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
        run: |
          # The action's explicit base/head path: resolve both, refuse an empty range.
          git status >/dev/null
          base_commit=$(git rev-parse "$BASE" 2>/dev/null) || true
          head_commit=$(git rev-parse "$HEAD" 2>/dev/null) || true
          if [ "$base_commit" == "$head_commit" ]; then
            echo "::error::BASE and HEAD commits are the same. TruffleHog won't scan anything."
            exit 1
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      - name: TruffleHog Secret Scanning (full scan)
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The action's event path: a pull request scans base..head, a schedule
          # or manual run scans the whole history.
          git status >/dev/null
          BASE=""
          HEAD=""
          if [ "$EVENT_NAME" == "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          fi
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --since-commit "$BASE" \
            --branch "$HEAD" \
            --fail \
            --no-update \
            --github-actions \
            --only-verified --exclude-detectors=lob

      # OMN-22894: the planted control. Reads the whole history for the control token declared in
      # .github/trufflehog-control.yml; an added token turns this step red.
      - name: TruffleHog planted control
        run: |
          docker run --rm -v .:/tmp -w /tmp "$TRUFFLEHOG_IMAGE" \
            git file:///tmp/ \
            --config=.github/trufflehog-control.yml \
            --include-detectors=CustomRegex \
            --results=unverified \
            --no-verification \
            --fail \
            --no-update \
            --github-actions
