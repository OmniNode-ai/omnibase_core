#
# Reusable secret scan: TruffleHog, pinned by image digest, on a GitHub-hosted runner.
#
# Rebuild plan, step 0, safety source 1: a repository's source is a scanner that runs on its
# default branch every night, with a planted control that proves the scanner can still find a
# credential. Repositories of the same type run the same CI, hosted here (OMN-17427), so the
# scan lives in this file and each repository's secret-scan.yml calls it.
#
# Controls, run before every scan (a scan that cannot see a planted credential is a failure):
#   planted control  a credential assembled at run time from fragments (so no literal credential
#                    is ever in this file) must make the scanner exit 183;
#   clean control    a file with no credential must make it exit 0.
# The scan itself is verified-only and has no `|| true`: a verified secret fails the run.

name: Secret Scan (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TruffleHog 3.95.9, the index digest. Move it with a commit, never with a tag.
      TRUFFLEHOG_IMAGE: trufflesecurity/trufflehog@sha256:59b244249d1a1aef4baa24fe73d3c931616264482580d806d77f6c74d26b3e42
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scanner controls (planted credential found, clean file passes)
        run: |
          set -euo pipefail
          ctl="$(mktemp -d)"
          mkdir "$ctl/planted" "$ctl/clean"
          key="AKIA$(printf '%s' 'Z7Q3XK9M2PLW' '4VBN')"
          secret="$(printf '%s' 'r8T5kLq2Vx' '9Zp3NmYc6H' 'dJw4UbGfE1' 'sAoI7tR0Xy')"
          printf 'aws_access_key_id = %s\naws_secret_access_key = %s\n' "$key" "$secret" > "$ctl/planted/creds.txt"
          printf 'name = example\nvalue = 42\n' > "$ctl/clean/notes.txt"
          rc=0
          docker run --rm -v "$ctl/planted:/ctl:ro" "$TRUFFLEHOG_IMAGE" filesystem /ctl --no-verification --results=unverified --fail --no-update || rc=$?
          if [ "$rc" -ne 183 ]; then
            echo "PLANTED CONTROL FAILED: the scanner exited $rc on a planted credential, expected 183"
            exit 1
          fi
          rc=0
          docker run --rm -v "$ctl/clean:/ctl:ro" "$TRUFFLEHOG_IMAGE" filesystem /ctl --no-verification --results=unverified --fail --no-update || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "CLEAN CONTROL FAILED: the scanner exited $rc on a file with no credential, expected 0"
            exit 1
          fi
          echo "scanner controls passed: planted credential found (183), clean file passed (0)"

      - name: Scan the repository (verified secrets only)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=()
          case "$EVENT_NAME" in
            push)
              if [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                range=(--since-commit "$PUSH_BEFORE" --branch "$PUSH_AFTER")
              fi
              ;;
          esac
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$TRUFFLEHOG_IMAGE" git file:///repo "${range[@]}" \
            --only-verified --exclude-detectors=lob --fail --no-update
