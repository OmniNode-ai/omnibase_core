#
# CodeQL security and quality analysis for omnibase_core.
# Calls the reusable workflow in onex_change_control.
# OMN-5421

name: Security Scan

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev]
  # OMN-20375: dev is queue-controlled. `CodeQL` (code scanning) and
  # `CodeQL / CodeQL Analysis (python)` are required contexts, and code scanning
  # can only report them on a queue commit when this workflow analyses it.
  merge_group:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  codeql:
    name: CodeQL
    uses: OmniNode-ai/onex_change_control/.github/workflows/codeql-reusable.yml@6ee1ebdb88514c91ab9017db41a575fc9e5dc674  # OCC sha already pinned at ci.yml (OMN-14887); OMN-20001
    with:
      language: python
      query_suite: security-and-quality
    permissions:
      actions: read
      contents: read
      security-events: write
