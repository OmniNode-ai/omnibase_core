#
# CodeQL security and quality analysis for omnibase_core.
# Calls the reusable workflow in onex_change_control.
# OMN-5421

name: Security Scan

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev]
  # OMN-20375: dev is queue-controlled. `CodeQL` (code scanning) and
  # `CodeQL / CodeQL Analysis (python)` are required contexts, and code scanning
  # can only report them on a queue commit when this workflow analyses it.
  merge_group:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  occ-preflight:
    uses: ./.github/workflows/occ-preflight.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  codeql:
    # OMN-15120/OMN-14864 (fan-out finding from the required-checks.yaml
    # manifest, pre-flagged there as "vector-5 (ungated needs cascade),
    # pending triage in OMN-14864"): `needs: occ-preflight` without an
    # `if: always()` override means this caller job is implicitly skipped
    # whenever occ-preflight fails (the ordinary state of a fresh PR before
    # its OCC companion is minted) — identical vector-3 shape to the
    # "gate / CodeRabbit Thread Check" fix in this same PR, just triggered
    # via needs-cascade instead of an explicit `if:`. CodeQL analysis doesn't
    # depend on any occ-preflight output, so there is no correctness reason
    # to couple its execution to that outcome. Matches the established
    # convention every other required `needs: occ-preflight` caller in this
    # repo already follows (deploy-gate.yml, pr-title-check.yml,
    # required-check-skip-guard-caller.yml, call-receipt-gate.yml).
    needs: occ-preflight
    if: always()
    name: CodeQL
    uses: OmniNode-ai/onex_change_control/.github/workflows/codeql-reusable.yml@91f5b69104366c2d86e4bb21de67c3c497702111  # OCC sha already pinned at ci.yml (OMN-14887); OMN-20001
    with:
      language: python
      query_suite: security-and-quality
    permissions:
      actions: read
      contents: read
      security-events: write
