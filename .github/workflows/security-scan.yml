#
# CodeQL security and quality analysis for omnibase_core.
# Calls the in-repo reusable workflow, codeql-reusable.yml.
# OMN-5421
# OMN-20074: the reusable now lives in this repository; the inputs and the caller job name are
# unchanged, so the required context "CodeQL / CodeQL Analysis (python)" does not move.

name: Security Scan

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev]
  # OMN-20375: dev is queue-controlled. `CodeQL` (code scanning) and
  # `CodeQL / CodeQL Analysis (python)` are required contexts, and code scanning
  # can only report them on a queue commit when this workflow analyses it.
  merge_group:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql-reusable.yml
    with:
      language: python
      query_suite: security-and-quality
    permissions:
      actions: read
      contents: read
      security-events: write
