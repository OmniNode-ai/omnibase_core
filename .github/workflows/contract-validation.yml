# Contract Validation Gate
#
# Validates ONEX ticket contracts for PRs in omnibase_core using the
# reusable composite action from onex_change_control.
#
# Required status check: "contract-validation"
# Must pass (or skip) before merging to main.
#
# The validation is intentionally lenient on missing contracts:
# - If branch name has no OMN-XXXX ticket ID → skipped
# - If contracts/<ticket_id>.yaml does not exist → skipped
# - If contract file exists but fails schema validation → fails
#
# This prevents blocking PRs that legitimately have no contract
# (e.g., dependency bumps, docs-only changes) while enforcing schema
# correctness when a contract is present.

name: Contract Validation

on:
  pull_request:
    branches: [main, develop, dev]
  merge_group:
    branches: [main, develop, dev]
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Branch name to validate contracts for (defaults to current branch)"
        required: false
        default: ""

# Allow concurrent runs on different PRs; cancel stale runs on the same ref
concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  occ-preflight:
    # Poller, not a re-emitter (OMN-15112 collapse-to-one-producer): this job
    # does NOT call the reusable occ-preflight.yml workflow. It polls the ONE
    # canonical "occ-preflight / eligibility" check-run -- produced solely by
    # call-occ-preflight.yml, the repo's single unconditional-on-every-PR
    # caller -- via the Checks API, and blocks/fails this workflow's downstream
    # job accordingly. Copied from the pattern omnimarket and omniclaude already
    # run safely to avoid re-emitting the shared context name from every
    # workflow file that needs to gate on it (GH Actions `needs:` cannot cross
    # workflow files, so each file still needs its own gate -- but the gate
    # does not have to be its own duplicate emission of the reusable workflow).
    name: OCC Preflight Dependency
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for required OCC preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "OCC preflight dependency is enforced by the pull_request gate; continuing for ${GITHUB_EVENT_NAME}."
            exit 0
          fi

          # OMN-15112: desynchronize same-PR pollers across workflow files (GH
          # Actions `needs:` can't cross workflow-file boundaries) so they
          # don't all hit the Checks API in the same instant every 10s and
          # exhaust the shared per-repo GitHub App installation rate-limit
          # bucket (same rationale as omnimarket's OMN-14343).
          sleep "$(( RANDOM % 15 ))"

          backoff=5
          elapsed=0
          deadline=720

          while [ "$elapsed" -lt "$deadline" ]; do
            # GH Actions runs `run:` steps under `bash -e {0}` by default --
            # that -e is already active before this script's own
            # `set -uo pipefail` runs, and `set -uo pipefail` does NOT clear
            # an inherited -e. A bare `response="$(gh api ...)"; status=$?`
            # would therefore abort the whole step on ANY gh api failure
            # before status is ever checked, silently defeating the retry
            # logic below. Using the command substitution as the condition of
            # this `if` is the errexit-safe form -- bash does not trigger -e
            # for a command that is part of an if/while/until condition,
            # regardless of ambient -e state.
            response=""
            status=0
            if response="$(
              gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=latest&check_name=occ-preflight%20%2F%20eligibility&per_page=1" \
                --jq 'first(.check_runs[] | .conclusion) // ""' \
                2>&1
            )"; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -ne 0 ]; then
              if echo "$response" | grep -qi "rate limit"; then
                echo "::warning::gh api rate-limited waiting for occ-preflight; backing off ${backoff}s."
                sleep "$backoff"
                elapsed=$((elapsed + backoff))
                backoff=$(( backoff * 2 < 60 ? backoff * 2 : 60 ))
                continue
              fi
              echo "::error::gh api call failed (non-rate-limit): ${response}"
              exit 1
            fi
            backoff=5

            conclusion="$response"

            case "$conclusion" in
              success)
                echo "OCC preflight passed for ${HEAD_SHA}."
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::OCC preflight concluded ${conclusion}; refusing to start this workflow."
                exit 1
                ;;
              "")
                echo "Waiting for occ-preflight / eligibility to post for ${HEAD_SHA}..."
                ;;
              *)
                echo "OCC preflight is ${conclusion}; waiting."
                ;;
            esac

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "::error::Timed out waiting for occ-preflight / eligibility on ${HEAD_SHA}."
          exit 1

  contract-validation:
    needs: occ-preflight
    if: always()
    name: contract-validation
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to self-hosted omnibase-ci; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      # OMN-15112 vector-5 fix: `needs: occ-preflight` alone lets GitHub's
      # implicit `success()`-over-needs skip this job when occ-preflight
      # fails/cancels, and a skipped job satisfies branch protection as
      # passing. `if: always()` above stops the skip; this step is the other
      # required half — it explicitly fails the job when occ-preflight did
      # not succeed, so the job's own conclusion is FAILURE, never a
      # decorative pass.
      - name: Fail when OCC preflight fails
        if: needs.occ-preflight.result != 'success'
        run: |
          echo "::error::occ-preflight result was ${{ needs.occ-preflight.result }}; refusing to run contract-validation."
          exit 1

      - name: Auth preflight — confirm onex_change_control action is accessible
        id: auth-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking visibility of OmniNode-ai/onex_change_control..."
          if gh api repos/OmniNode-ai/onex_change_control --silent; then
            echo "::notice::onex_change_control repo is accessible."
          else
            echo "::error::Cannot reach OmniNode-ai/onex_change_control. Composite action will not resolve."
            exit 1
          fi

      - name: Resolve branch name
        id: resolve-branch
        env:
          WORKFLOW_INPUT_BRANCH: ${{ inputs.branch-name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # merge_group events run on gh-readonly-queue/... branches with no PR head ref.
          # Contract validation is not meaningful in this context — skip immediately.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "resolved_branch=" >> "$GITHUB_OUTPUT"
            echo "skip_validation=true" >> "$GITHUB_OUTPUT"
            echo "::notice::merge_group event — contract validation skipped (validated on PR branch instead)."
            exit 0
          fi

          echo "skip_validation=false" >> "$GITHUB_OUTPUT"

          # Prefer workflow_dispatch input, then PR head ref, then ref name
          if [[ -n "$WORKFLOW_INPUT_BRANCH" ]]; then
            BRANCH="$WORKFLOW_INPUT_BRANCH"
          elif [[ -n "$GITHUB_HEAD_REF" ]]; then
            BRANCH="$GITHUB_HEAD_REF"
          else
            BRANCH="$GITHUB_REF_NAME"
          fi
          echo "resolved_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved branch name: $BRANCH"

      - name: Run contract validation
        id: validate-contract
        if: steps.resolve-branch.outputs.skip_validation != 'true'
        uses: OmniNode-ai/onex_change_control/.github/actions/validate-contract@main
        with:
          branch-name: ${{ steps.resolve-branch.outputs.resolved_branch }}
          contracts-path: contracts

      - name: Report validation result
        if: always()
        env:
          TICKET_ID: ${{ steps.validate-contract.outputs.ticket-id }}
          VALIDATION_STATUS: ${{ steps.validate-contract.outputs.validation-status }}
          SKIP_VALIDATION: ${{ steps.resolve-branch.outputs.skip_validation }}
        run: |
          if [[ "$SKIP_VALIDATION" == "true" ]]; then
            echo "::notice::Contract validation SKIPPED — merge_group event."
            exit 0
          fi
          case "$VALIDATION_STATUS" in
            passed)
              echo "::notice::Contract validation PASSED for ticket $TICKET_ID"
              ;;
            skipped)
              if [[ -z "$TICKET_ID" ]]; then
                echo "::notice::Contract validation SKIPPED — no OMN-XXXX ticket ID found in branch name."
              else
                echo "::notice::Contract validation SKIPPED — no contract file found for $TICKET_ID in contracts/."
              fi
              ;;
            failed)
              echo "::error::Contract validation FAILED for ticket $TICKET_ID. See validate-contract step for details."
              exit 1
              ;;
            *)
              echo "::warning::Unexpected validation status: '$VALIDATION_STATUS'. Treating as skipped."
              ;;
          esac
