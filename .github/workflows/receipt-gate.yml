# SPDX-License-Identifier: MIT
#
# Receipt-Gate — reusable workflow enforcing "Enforcement by Receipt" (OMN-10419).
#
# Every PR must cite a Linear ticket whose contracts/<OMN-N>.yaml sits in the
# caller's own repository at the PR head; the pinned verifier
# (omnimarket node_dod_verify) runs every dod_evidence check at the head and a
# must-fail control at the merge base. The `dod-verify` job carries the verdict.
#
# OMN-20074: caller evidence is the only mode. The change-control evidence
# mode (a checkout of the retired change-control repository at a stamped SHA),
# its bounded wait on the change-control eligibility context and the comparison
# against that context are removed. `verify` stays as a success no-op so a caller whose
# branch protection still names `<job> / verify` keeps a concluded context.
#
# Inputs:
#   evidence-source: caller is the only accepted value, and the default. Any
#                   other value fails dod-verify; callers still pass it
#                   explicitly.
#   verifier-version: pinned omnimarket PyPI release (default: 0.4.305; must be
#                   numeric MAJOR.MINOR.PATCH and at or above the install
#                   step's VERIFIER_FLOOR, OMN-20032).
#   compare-with-occ: must be "false" (the default). Kept so existing callers
#                   that pass it stay valid; "true" fails dod-verify.
#   shadow:         "true" while a repository counts this gate's verdict
#                   without enforcing it (OMN-20073); "false" otherwise
#                   (default: "false"). With "true", dod-verify records its
#                   verdict (the first refused step) as one `Shadow verdict:`
#                   job-summary line and one notice annotation, then passes.
#
# Secrets:
#   (none — contracts are in the caller's repository)

name: receipt-gate

on:
  workflow_call:
    inputs:
      evidence-source:
        description: "Evidence source: caller (contracts at the caller's PR head) is the only mode."
        type: string
        required: false
        default: caller
      verifier-version:
        description: Pinned omnimarket PyPI release for caller evidence verification.
        type: string
        required: false
        default: "0.4.305"
      compare-with-occ:
        description: "Retired comparison switch kept for existing callers: must be false."
        type: string
        required: false
        default: "false"
      shadow:
        description: "Record the caller-evidence verdict without enforcing it (S5): true or false."
        type: string
        required: false
        default: "false"

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    # OMN-20074: caller evidence is the only mode, so this job reports a
    # success no-op; dod-verify carries the verdict. Same runner routing
    # expression as dod-verify (OMN-18205): a genuine fork pull request
    # resolves to OMNI_PUBLIC_PR_RUNS_ON_JSON, everything else to the trusted
    # fleet.
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]'))
      }}
    timeout-minutes: 5
    steps:
      - name: Caller evidence runs in dod-verify
        run: echo "::notice::caller evidence is verified by the dod-verify job (OMN-20074)"

  dod-verify:
    name: dod-verify
    # Same runner routing expression as verify (OMN-18205).
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name != github.repository)
        && fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
        || fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]'))
      }}
    timeout-minutes: 40
    env:
      ACTIONS_CACHE_URL: ""
      ACTIONS_RUNTIME_URL: ""
    permissions:
      contents: read
      pull-requests: read
    # OMN-20543: a bound test that needs a database gets one, at the head and
    # in the must-fail control alike. Without it a real-Postgres test could not
    # be bound as hosted evidence, its author scoped it local_done_gate, the
    # hosted verifier reported it SKIPPED at both trees, and the control refused
    # it as a control that could not run (omnimarket#3369, run 37211811803).
    # The service, the PG16 server tools and the INTEGRATION_POSTGRES_* env are
    # the ones the caller's own test job uses (omnimarket ci.yml, OMN-14167 and
    # OMN-18693), so a test runs here the way it runs in the pull request's CI.
    # The password is a throwaway for a container that lives as long as the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: omnibase_infra
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # OMN-20073: the caller-evidence path honours the dependency-bot
      # exemption (OMN-13762). An automated release or dependency bump cannot
      # bind evidence of its own, so without this the dod-verify context goes
      # red on every bot bump and every later bump is blocked. Nothing in the
      # PR body is read, and a behaviour-changing PR is never exempt. A skipped
      # step concludes success, so the context passes WITHOUT a skip token.
      # OMN-13762: Dependency-bot PRs (Dependabot, Renovate) are authored by bots
      # that structurally cannot cite a Linear ticket or carry a contract — the
      # receipt gate's premise (a human-authored, ticket-backed
      # change) does not apply to an automated dependency bump. Detect a trusted
      # dependency-bot author up front from GitHub-verified PR metadata (never
      # from caller-supplied body text, so a human PR cannot spoof it) and skip
      # the receipt-evidence steps below. The job still concludes `success` (its
      # remaining steps are skipped, not failed), so the required
      # `verify / verify` status check passes WITHOUT a skip token. The allowlist
      # mirrors validator_receipt_gate.DEPENDENCY_BOT_AUTHORS (the first `case`
      # arm, exempt unconditionally). The second arm is OCC_WRITER_BOT_AUTHORS,
      # the writer app: never exempt here; it sets writer_app and the
      # writer_pin_only step below derives its verdict from the head's own
      # diff (OMN-17427, OMN-20074).
      - name: Detect dependency-bot author (receipt-gate exemption)
        continue-on-error: ${{ inputs.shadow == 'true' }}
        id: bot_exempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          # Resolve the PR number for both pull_request and merge_group events.
          if [ -n "${PR_NUMBER:-}" ]; then
            resolved_pr_num="$PR_NUMBER"
          elif [ -n "${MERGE_GROUP_HEAD_REF:-}" ]; then
            resolved_pr_num="$(printf '%s' "$MERGE_GROUP_HEAD_REF" | sed -E 's@^.*/pr-([0-9]+)-.*$@\1@')"
            [ "$resolved_pr_num" = "$MERGE_GROUP_HEAD_REF" ] && resolved_pr_num=""
          else
            resolved_pr_num=""
          fi

          # GitHub-verified author identity. Prefer the API login; fall back to
          # the event-payload login when the API is unavailable. Author identity
          # is read from trusted GitHub metadata, never from PR body text.
          author_login=""
          if [ -n "$resolved_pr_num" ]; then
            author_login="$(gh pr view "$resolved_pr_num" --repo "$GH_REPO" --json author --jq '.author.login' 2>/dev/null || true)"
          fi
          if [ -z "$author_login" ]; then
            author_login="${PR_EVENT_AUTHOR:-}"
          fi

          # Trusted dependency-bot allowlist. Matches both the gh CLI login form
          # ("app/dependabot") and the raw API/event login form
          # ("dependabot[bot]"). Keep in sync with
          # validator_receipt_gate.DEPENDENCY_BOT_AUTHORS.
          exempt="false"
          writer_app="false"
          case "$author_login" in
            "dependabot[bot]"|"app/dependabot"|"dependabot"|"renovate[bot]"|"app/renovate"|"renovate")
              exempt="true"
              ;;
            "onexbot-occ-writer[bot]"|"app/onexbot-occ-writer"|"onexbot-occ-writer")
              # OMN-20074: the head-SHA-bound producer outcome this arm used to
              # probe came from the retired change-control autobind; the
              # writer_pin_only step derives the verdict from the head's diff.
              writer_app="true"
              ;;
          esac

          if [ "$exempt" = "true" ]; then
            echo "::notice::Receipt-gate exemption (OMN-13762): PR authored by trusted dependency bot '${author_login}'. Dependency-bump PRs carry no Linear ticket or OCC receipt; the evidence gate is not applicable. Receipt-evidence steps are skipped; the job still reports success."
          fi
          echo "exempt=${exempt}" >> "$GITHUB_OUTPUT"
          echo "writer_app=${writer_app}" >> "$GITHUB_OUTPUT"

      - name: Refuse anything but a same-repository pull request
        id: same_repo
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          COMPARE_WITH_OCC: ${{ inputs.compare-with-occ }}
          EVIDENCE_SOURCE: ${{ inputs.evidence-source }}
        run: |
          set -euo pipefail
          # OMN-20074: caller evidence is the only mode.
          if [ "$EVIDENCE_SOURCE" != caller ]; then
            echo "::error::evidence-source must be caller; the change-control evidence mode is removed (OMN-20074)"
            exit 1
          fi
          if [ "$COMPARE_WITH_OCC" != false ]; then
            echo "::error::compare-with-occ must be false; the comparison is removed (OMN-20074)"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target) ;;
            *)
              echo "::error::caller evidence requires a pull_request or pull_request_target event"
              exit 1
              ;;
          esac
          if [ "$HEAD_REPOSITORY" != "$CALLER_REPOSITORY" ]; then
            echo "::error::caller evidence requires a same-repository pull request; fork heads are refused"
            exit 1
          fi

      - name: Resolve the cited tickets
        id: tickets
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dod"
          printf '%s\n' "$PR_TITLE" | grep -oE 'OMN-[0-9]+' | sort -u > "$RUNNER_TEMP/dod/tickets.txt" || true
          if [ ! -s "$RUNNER_TEMP/dod/tickets.txt" ]; then
            echo "::error::pull request title must cite at least one OMN-[0-9]+ ticket"
            exit 1
          fi
          while IFS= read -r ticket; do
            if [[ ! "$ticket" =~ ^OMN-[0-9]+$ ]]; then
              echo "::error::invalid cited ticket id"
              exit 1
            fi
          done < "$RUNNER_TEMP/dod/tickets.txt"

      - name: Check out the pull request head
        id: head_checkout
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .dod-verify/head_home/${{ github.event.repository.name }}

      - name: Set up Python 3.13
        id: setup_python
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        id: install_uv
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure'
        uses: astral-sh/setup-uv@v7

      # OMN-20032: refuse a verifier older than the floor before installing it.
      # VERIFIER_FLOOR is the one place the floor lives: 0.4.303 is the first
      # omnimarket release carrying omnimarket#3511, which makes node_dod_verify
      # refuse a contract that leaves an acceptance criterion unbound. A later
      # release that tightens verification raises this one value.
      - name: Install the pinned verifier
        id: verifier
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure'
        env:
          VERIFIER_VERSION: ${{ inputs.verifier-version }}
          VERIFIER_FLOOR: "0.4.303"
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::verifier-version must match numeric MAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS=. read -r v_major v_minor v_patch <<< "$VERIFIER_VERSION"
          IFS=. read -r f_major f_minor f_patch <<< "$VERIFIER_FLOOR"
          if (( 10#$v_major < 10#$f_major || (10#$v_major == 10#$f_major && (10#$v_minor < 10#$f_minor || (10#$v_minor == 10#$f_minor && 10#$v_patch < 10#$f_patch))) )); then
            echo "::error::verifier-version $VERIFIER_VERSION is below the floor $VERIFIER_FLOOR; releases before it admit a contract that leaves an acceptance criterion unbound. Re-pin the caller's verifier-version to $VERIFIER_FLOOR or newer."
            exit 1
          fi
          uv venv --clear --python 3.13 "$GITHUB_WORKSPACE/.dod-verify/venv"
          uv pip install --python "$GITHUB_WORKSPACE/.dod-verify/venv/bin/python" --no-config "omnimarket==${VERIFIER_VERSION}"
          DOD_VERIFY_PY="$GITHUB_WORKSPACE/.dod-verify/venv/bin/python"
          echo "DOD_VERIFY_PY=$DOD_VERIFY_PY" >> "$GITHUB_ENV"
          "$DOD_VERIFY_PY" -c "import omnimarket.nodes.node_dod_verify"

      # OMN-17427, OMN-20074: derive the writer app's verdict from the exact
      # head's git diff against its merge base, using the pinned verifier.
      # Admit dependency-pin-only first, then a workflow-only diff that moves
      # only the omnibase_core checkout pin (the OMN-9050 downstream bump the
      # occ-autobind producer used to classify), then release cuts with root
      # changelog additions, one new heading matching project.version, and
      # optional pins. A diff of .claude-plugin manifests alone goes to the
      # plugin version classifier (the OMN-20710 post-merge plugin version
      # bump, OMN-20074). Every failure is not-exempt; PR title/body never
      # supply this verdict.
      # OMN-20068: before the release cut, admit a pin swap across the
      # declared pin files (.github/sibling-pins.yaml,
      # .github/omnimarket-contract-pin.yaml), dependency manifests (judged by
      # classify_dependency_pin_only) and workflow ref:/uses: shas, where every
      # changed line replaces one pin value with another and nothing else
      # moves: no added, removed or reworded line, no new or deleted file.
      # Operator ruling 2026-10-12T22:05:22Z: a pin bump rides on its own CI.
      - name: Derive the OCC writer app's dependency-pin-only or release-cut verdict at the head (OMN-17427, OMN-20074)
        id: writer_pin_only
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.bot_exempt.outputs.writer_app == 'true'
        env:
          REPO_SHORT: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          exempt=false
          reason="could not derive the dependency-pin-only or release-cut verdict"
          derive_pin_only() {
            head_tree="$GITHUB_WORKSPACE/.dod-verify/head_home/$REPO_SHORT"
            reason="merge base is unresolvable"
            MB="$(git -C "$head_tree" merge-base "$BASE_SHA" "$HEAD_SHA")" || return 1
            [ -n "$MB" ] || return 1
            reason="could not prepare classifier input files"
            mkdir -p "$RUNNER_TEMP/dod" || return 1
            probe_dir="$(mktemp -d "$RUNNER_TEMP/dod/writer-pin-only.XXXXXX")" || return 1
            reason="could not read the head's changed paths"
            git -C "$head_tree" diff --name-only --no-renames -z "$MB" "$HEAD_SHA" > "$probe_dir/paths" || return 1
            manifest_count=0
            manifest=""
            changelog_changed=false
            workflow_only=true
            plugin_only=true
            pin_swap_paths=true
            while IFS= read -r -d '' path; do
              if [ "$path" = CHANGELOG.md ]; then
                changelog_changed=true
              fi
              case "$path" in
                .github/workflows/*.yml | .github/workflows/*.yaml) ;;
                *) workflow_only=false ;;
              esac
              case "$path" in
                .github/workflows/*.yml | .github/workflows/*.yaml | .github/sibling-pins.yaml | .github/omnimarket-contract-pin.yaml) ;;
                *)
                  case "${path##*/}" in
                    pyproject.toml | uv.lock) ;;
                    *) pin_swap_paths=false ;;
                  esac
                  ;;
              esac
              case "$path" in
                .claude-plugin/plugin.json | .claude-plugin/marketplace.json | */.claude-plugin/plugin.json | */.claude-plugin/marketplace.json) ;;
                *) plugin_only=false ;;
              esac
              if [ "${path##*/}" = pyproject.toml ]; then
                manifest_count=$((manifest_count + 1))
                manifest="$path"
              fi
            done < "$probe_dir/paths" || return 1
            if [ "$manifest_count" -gt 1 ]; then
              reason="more than one dependency manifest changed"
              return 1
            fi
            if [ "$manifest_count" -eq 1 ]; then
              for side in head base; do
                sha="$HEAD_SHA"
                if [ "$side" = base ]; then
                  sha="$MB"
                fi
                reason="could not read the $side dependency manifest"
                git -C "$head_tree" ls-tree -z "$sha" -- "$manifest" > "$probe_dir/tree-$side" || return 1
                # An absent side stays absent on disk and is passed as None.
                if [ -s "$probe_dir/tree-$side" ]; then
                  git -C "$head_tree" show "$sha:$manifest" > "$probe_dir/pyproject-$side" || return 1
                fi
              done
            fi
            # Workflow-only, plugin-manifest-only and allowed pin-swap diffs
            # hand every file's head and base blob to their classifier, in
            # the order of the paths file.
            mkdir -p "$probe_dir/blobs" || return 1
            if [ "$workflow_only" = true ] || [ "$plugin_only" = true ] || [ "$pin_swap_paths" = true ]; then
              index=0
              while IFS= read -r -d '' path; do
                for side in head base; do
                  sha="$HEAD_SHA"
                  if [ "$side" = base ]; then
                    sha="$MB"
                  fi
                  reason="could not read the $side changed-file blob"
                  git -C "$head_tree" ls-tree -z "$sha" -- "$path" > "$probe_dir/blobs/tree-$index-$side" || return 1
                  # An absent side stays absent on disk and is passed as None.
                  if [ -s "$probe_dir/blobs/tree-$index-$side" ]; then
                    git -C "$head_tree" show "$sha:$path" > "$probe_dir/blobs/$index.$side" || return 1
                  fi
                done
                index=$((index + 1))
              done < "$probe_dir/paths" || return 1
            fi
            if [ "$changelog_changed" = true ]; then
              for blob in changelog-head changelog-base release-project-head; do
                sha="$HEAD_SHA"
                path=CHANGELOG.md
                if [ "$blob" = changelog-base ]; then
                  sha="$MB"
                elif [ "$blob" = release-project-head ]; then
                  path=pyproject.toml
                fi
                reason="could not read the $blob blob"
                git -C "$head_tree" ls-tree -z "$sha" -- "$path" > "$probe_dir/tree-$blob" || return 1
                # An absent blob stays absent on disk and becomes None.
                if [ -s "$probe_dir/tree-$blob" ]; then
                  git -C "$head_tree" show "$sha:$path" > "$probe_dir/$blob" || return 1
                fi
              done
            fi
            reason="the pinned verifier Python is missing"
            [ -n "${DOD_VERIFY_PY:-}" ] && [ -x "$DOD_VERIFY_PY" ] || return 1
            reason="the pinned classifier failed"
            (cd "$RUNNER_TEMP" && "$DOD_VERIFY_PY" -I - "$probe_dir/paths" "$probe_dir/pyproject-head" "$probe_dir/pyproject-base" "$probe_dir/changelog-head" "$probe_dir/changelog-base" "$probe_dir/release-project-head" "$probe_dir/blobs" <<'PY'
          import difflib
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          from omnimarket.occ_content_probe import (
              classify_dependency_pin_only,
              is_release_artifact_only_diff,
          )

          def read_optional(path):
              return path.read_text(encoding="utf-8") if path.exists() else None

          def classify_release_cut(paths, pyproject_head, pyproject_base,
                                   changelog_head_file, changelog_base_file, project_file):
              if paths.count("CHANGELOG.md") != 1:
                  return False, "release cut requires root CHANGELOG.md"
              if not is_release_artifact_only_diff(paths):
                  return False, "release cut is not a release-artifact-only diff"
              if any(path not in {"CHANGELOG.md", "pyproject.toml", "uv.lock"} for path in paths):
                  return False, "release cut contains a path outside the root release allowlist"
              manifests = [path for path in paths if path in {"pyproject.toml", "uv.lock"}]
              if manifests:
                  pin_only, reason = classify_dependency_pin_only(
                      manifests, pyproject_head=pyproject_head, pyproject_base=pyproject_base,
                  )
                  if not pin_only:
                      return False, f"release cut manifests are not dependency-pin-only: {reason}"
              changelog_head = read_optional(changelog_head_file)
              if changelog_head is None:
                  return False, "release cut CHANGELOG.md is unreadable at the head"
              base = (read_optional(changelog_base_file) or "").splitlines(keepends=True)
              head = changelog_head.splitlines(keepends=True)
              inserted = []
              for tag, _, _, head_start, head_end in difflib.SequenceMatcher(
                  None, base, head, autojunk=False,
              ).get_opcodes():
                  if tag not in {"equal", "insert"}:
                      return False, "release cut rewrites or deletes an existing changelog line"
                  if tag == "insert":
                      inserted.extend(head[head_start:head_end])
              headings = [line.rstrip("\r\n") for line in inserted if line.startswith("## ")]
              if len(headings) != 1:
                  return False, "release cut requires exactly one inserted ## heading"
              heading = re.fullmatch(r"## v(\d+\.\d+\.\d+) \((\d{4}-\d{2}-\d{2})\)", headings[0])
              if heading is None:
                  return False, "release cut heading must match ## v<version> (<date>)"
              first = next((line.rstrip("\r\n") for line in inserted if line.strip()), None)
              if first != headings[0]:
                  return False, "release cut heading is not the first non-blank inserted line"
              project = read_optional(project_file)
              if project is None:
                  return False, "release cut root pyproject.toml is unreadable at the head"
              try:
                  version = tomllib.loads(project).get("project", {}).get("version")
              except (tomllib.TOMLDecodeError, AttributeError):
                  return False, "release cut root pyproject.toml does not parse at the head"
              if version != heading.group(1):
                  return False, "release cut heading version does not match head project.version"
              if any(line.startswith(f"## v{version} ") for line in base):
                  return False, "release cut version already has a heading at the merge base"
              return True, f"release cut adds changelog version {version} with optional dependency pins"

          def read_blobs(paths, blobs_dir):
              # Contents come from git objects, never the working tree.
              return {
                  path: (read_optional(blobs_dir / f"{index}.head"),
                         read_optional(blobs_dir / f"{index}.base"))
                  for index, path in enumerate(paths)
              }

          def classify_workflow_pin(paths, blobs_dir):
              # Imported here so a verifier without it fails closed only on
              # the workflow path.
              from omnimarket.occ_content_probe import classify_workflow_core_pin_only

              return classify_workflow_core_pin_only(paths, contents=read_blobs(paths, blobs_dir))

          def is_plugin_manifest(path):
              parts = path.split("/")
              return parts[-1] in ("plugin.json", "marketplace.json") and parts[-2:-1] == [".claude-plugin"]

          def classify_plugin_version(paths, blobs_dir):
              # Imported here so a verifier without it fails closed only on
              # the plugin manifest path (OMN-20074).
              from omnimarket.occ_content_probe import classify_plugin_manifest_version_only

              return classify_plugin_manifest_version_only(paths, contents=read_blobs(paths, blobs_dir))

          def classify_pin_swap_only(paths, pyproject_head, pyproject_base, blobs_dir):
              if not paths:
                  return False, "pin swap requires changed paths"
              pin_files = {".github/sibling-pins.yaml", ".github/omnimarket-contract-pin.yaml"}
              manifests = []
              pin_paths = []
              for index, path in enumerate(paths):
                  workflow = path.startswith(".github/workflows/") and path.endswith((".yml", ".yaml"))
                  if workflow or path in pin_files:
                      pin_paths.append((index, path, workflow))
                  elif Path(path).name in {"pyproject.toml", "uv.lock"}:
                      manifests.append(path)
                  else:
                      return False, f"path is not allowed for a pin swap: {path}"
              manifest_reason = None
              if manifests:
                  pin_only, manifest_reason = classify_dependency_pin_only(
                      manifests, pyproject_head=pyproject_head, pyproject_base=pyproject_base,
                  )
                  if not pin_only:
                      return False, f"pin swap manifests are not dependency-pin-only: {manifest_reason}"
              if not pin_paths:
                  return False, "pin swap requires a workflow or declared pin file"
              workflow_patterns = [
                  re.compile(r"^(?P<lead>[ ]*(?:-[ ]+)?ref:[ ]+)(?P<value>[0-9a-f]{40})(?P<tail>(?:[ ]+#.*)?)$"),
                  re.compile(r"^(?P<lead>[ ]*(?:-[ ]+)?uses:[ ]+[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@)(?P<value>[0-9a-f]{40})(?P<tail>(?:[ ]+#.*)?)$"),
              ]
              pin_pattern = re.compile(r"^(?P<lead>[ ]*(?:-[ ]+)?[A-Za-z0-9_.-]+:[ ]+)(?P<value>[0-9a-f]{40}|v?\d+(?:\.\d+)+)(?P<tail>(?:[ ]+#.*)?)$")
              swapped = 0
              for index, path, workflow in pin_paths:
                  head_file, base_file = blobs_dir / f"{index}.head", blobs_dir / f"{index}.base"
                  if not head_file.exists() or not base_file.exists():
                      return False, f"pin swap file is added or deleted: {path}"
                  # Preserve line endings: read_text would normalize CRLF.
                  head = head_file.read_bytes().decode("utf-8").splitlines(keepends=True)
                  base = base_file.read_bytes().decode("utf-8").splitlines(keepends=True)
                  file_swapped = 0
                  patterns = workflow_patterns if workflow else [pin_pattern]
                  for tag, base_start, base_end, head_start, head_end in difflib.SequenceMatcher(
                      None, base, head, autojunk=False,
                  ).get_opcodes():
                      if tag == "equal":
                          continue
                      if tag != "replace" or base_end - base_start != head_end - head_start:
                          return False, f"{path} adds or removes a line"
                      for offset, (base_line, head_line) in enumerate(zip(
                          base[base_start:base_end], head[head_start:head_end],
                      )):
                          base_body, head_body = base_line.rstrip("\r\n"), head_line.rstrip("\r\n")
                          valid = False
                          if base_line[len(base_body):] == head_line[len(head_body):]:
                              for pattern in patterns:
                                  old, new = pattern.fullmatch(base_body), pattern.fullmatch(head_body)
                                  if old is None or new is None:
                                      continue
                                  old_sha = re.fullmatch(r"[0-9a-f]{40}", old["value"]) is not None
                                  new_sha = re.fullmatch(r"[0-9a-f]{40}", new["value"]) is not None
                                  valid = (old["lead"] == new["lead"] and old["tail"] == new["tail"]
                                           and old["value"] != new["value"] and old_sha == new_sha)
                                  if valid:
                                      break
                          if not valid:
                              return False, f"{path} line {head_start + offset + 1} is not solely a pin value swap"
                          file_swapped += 1
                  if not file_swapped:
                      return False, f"{path} has no swapped pin line"
                  swapped += file_swapped
              reason = f"pin swap only: {swapped} pin value(s) in {len(pin_paths)} file(s)"
              if manifests:
                  reason += f"; manifests: {manifest_reason}"
              return True, reason

          def classify():
              (paths_file, head_file, base_file, changelog_head, changelog_base,
               project_file, blobs_dir) = map(Path, sys.argv[1:])
              raw_paths = paths_file.read_bytes()
              paths = [path.decode("utf-8") for path in raw_paths.split(b"\0") if path]
              pyproject_head, pyproject_base = read_optional(head_file), read_optional(base_file)
              pin_only, pin_reason = classify_dependency_pin_only(
                  paths, pyproject_head=pyproject_head, pyproject_base=pyproject_base,
              )
              if pin_only:
                  return {"exempt": True, "kind": "dependency_pin_only", "reason": pin_reason,
                          "classifier": "classify_dependency_pin_only"}
              if paths and all(
                  path.startswith(".github/workflows/") and path.endswith((".yml", ".yaml"))
                  for path in paths
              ):
                  workflow_pin, workflow_reason = classify_workflow_pin(paths, blobs_dir)
                  if workflow_pin:
                      return {"exempt": True, "kind": "dependency_pin_only", "reason": workflow_reason,
                              "classifier": "classify_workflow_core_pin_only"}
                  pin_reason = f"{pin_reason}; workflow checkout pin: {workflow_reason}"
              if paths and all(is_plugin_manifest(path) for path in paths):
                  plugin_bump, plugin_reason = classify_plugin_version(paths, blobs_dir)
                  if plugin_bump:
                      return {"exempt": True, "kind": "plugin_version_bump", "reason": plugin_reason,
                              "classifier": "classify_plugin_manifest_version_only"}
                  pin_reason = f"{pin_reason}; plugin manifest version: {plugin_reason}"
              pin_swap, reason = classify_pin_swap_only(paths, pyproject_head, pyproject_base, blobs_dir)
              if pin_swap:
                  return {"exempt": True, "kind": "pin_swap_only", "reason": reason,
                          "classifier": "classify_pin_swap_only"}
              pin_reason = f"{pin_reason}; pin swap: {reason}"
              release_cut, reason = classify_release_cut(
                  paths, pyproject_head, pyproject_base, changelog_head, changelog_base, project_file,
              )
              return {"exempt": release_cut, "kind": "release_cut" if release_cut else "none",
                      "reason": reason if release_cut else f"{reason}; dependency-pin-only: {pin_reason}"}

          try:
              verdict = classify()
          except Exception as exc:
              verdict = {"exempt": False, "kind": "none", "reason": f"the pinned classifier failed: {exc}"}
          print(json.dumps(verdict))
          PY
            ) > "$probe_dir/verdict.json" || return 1
            reason="the pinned classifier output is not one valid JSON verdict"
            jq -s -e 'length == 1 and (.[0] | type == "object" and (.exempt | type == "boolean") and (.kind == "dependency_pin_only" or .kind == "plugin_version_bump" or .kind == "pin_swap_only" or .kind == "release_cut" or .kind == "none") and (.exempt == (.kind != "none")) and (.reason | type == "string"))' "$probe_dir/verdict.json" > /dev/null 2>&1 || return 1
            reason="$(jq -r '.reason' "$probe_dir/verdict.json")" || return 1
            kind="$(jq -r '.kind' "$probe_dir/verdict.json")" || return 1
            classifier="$(jq -r '.classifier // "classify_dependency_pin_only"' "$probe_dir/verdict.json")" || return 1
            derived_exempt="$(jq -r '.exempt' "$probe_dir/verdict.json")" || return 1
            [ "$derived_exempt" = true ] || return 1
          }
          # Every operation in the function is guarded: a failed computation
          # leaves the single output false and lets the existing gate continue.
          if derive_pin_only; then
            exempt=true
            if [ "$kind" = dependency_pin_only ]; then
              echo "::notice::OCC writer app authored a dependency-pin-only change at ${HEAD_SHA} (derived in this job from the head's diff against merge base ${MB} by the pinned verifier's ${classifier}: ${reason}; OMN-17427). The OCC autobind outcome this exemption used to read is no longer produced for caller-evidence repositories; the evidence gate is not applicable."
            elif [ "$kind" = plugin_version_bump ]; then
              echo "::notice::OCC writer app authored a plugin version bump at ${HEAD_SHA} (derived in this job from the head's diff against merge base ${MB} by the pinned verifier's ${classifier}: ${reason}; OMN-20074); the evidence gate is not applicable."
            elif [ "$kind" = pin_swap_only ]; then
              echo "::notice::OCC writer app authored a pin-swap-only change at ${HEAD_SHA} (derived in this job from the head's diff against merge base ${MB} by ${classifier}: ${reason}; OMN-20068). Every changed line replaces one pin value with another; the pull request rides on its own CI and the evidence gate is not applicable."
            else
              echo "::notice::OCC writer app authored a release cut at ${HEAD_SHA} (derived in this job from the head's diff against merge base ${MB}: ${reason}; OMN-20074); the evidence gate is not applicable."
            fi
          else
            echo "::notice::OCC writer app is not exempt: ${reason} (OMN-17427); the evidence gate continues."
          fi
          echo "exempt=${exempt}" >> "$GITHUB_OUTPUT"
          exit 0

      # OMN-20543: a test that starts its own native cluster (initdb into a
      # temporary directory) needs the PG16 server tools on PATH. Fail here,
      # before any verdict, when they are missing: a database test that cannot
      # start its database is a control that did not run, never a pass.
      # OMN-20413: the self-hosted omnibase-ci image ships no PG16 and grants
      # the runner no sudo apt-get, so on it this step refused every same-repo
      # pull request whatever it changed (omninode_infra#1896, #1897, #1898).
      # Without root, apt downloads postgresql-16 and the dependencies the image
      # lacks into a runner-owned state directory under RUNNER_TEMP, and
      # dpkg-deb extracts them there; no package script runs and nothing outside
      # RUNNER_TEMP is written. The step still refuses by name when neither
      # path yields a working PG16 initdb.
      - name: Provide the PostgreSQL 16 server tools
        id: pg_tools
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        run: |
          set -euo pipefail
          pg16_bin=/usr/lib/postgresql/16/bin
          if [ ! -x "${pg16_bin}/initdb" ]; then
            if sudo -n true 2>/dev/null && sudo -n apt-get update && sudo -n apt-get install --yes postgresql-16; then
              echo "Installed PostgreSQL 16 server tools with sudo apt-get"
            else
              pg_root="${RUNNER_TEMP}/pg16"
              apt_dir="${RUNNER_TEMP}/pg16-apt"
              rm -rf "${pg_root}" "${apt_dir}"
              mkdir -p "${pg_root}" "${apt_dir}/lists/partial" "${apt_dir}/archives/partial" "${apt_dir}/preferences.d"
              codename="$(. /etc/os-release && echo "${VERSION_CODENAME}")"
              if ! {
                curl -fsSL --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "${apt_dir}/pgdg.asc" &&
                { cat /etc/apt/sources.list &&
                  echo "deb [signed-by=${apt_dir}/pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main"
                } > "${apt_dir}/sources.list" &&
                apt_opts=(
                  -o Debug::NoLocking=1
                  -o Dir::State::Lists="${apt_dir}/lists"
                  -o Dir::Cache="${apt_dir}"
                  -o Dir::Cache::archives="${apt_dir}/archives"
                  -o Dir::Etc::sourcelist="${apt_dir}/sources.list"
                  -o Dir::Etc::sourceparts=-
                  -o Dir::Etc::preferencesparts="${apt_dir}/preferences.d"
                  -o APT::Install-Recommends=false
                  -o Acquire::Retries=3
                ) &&
                apt-get "${apt_opts[@]}" update &&
                apt-get "${apt_opts[@]}" install --download-only --yes postgresql-16 &&
                find "${apt_dir}/archives" -maxdepth 1 -name '*.deb' -print0 | xargs -0 -r -I{} dpkg-deb -x {} "${pg_root}"
              }; then
                echo "::error::the PostgreSQL 16 server tools are absent from this runner and cannot be installed (no sudo apt-get, and the rootless PGDG download into RUNNER_TEMP failed)"
                exit 1
              fi
              pg16_bin="${pg_root}/usr/lib/postgresql/16/bin"
              pg16_lib="${pg_root}/usr/lib/$(uname -m)-linux-gnu"
              export LD_LIBRARY_PATH="${pg16_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
              echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
              echo "Extracted PostgreSQL 16 server tools into ${pg_root} without root"
            fi
          fi
          for tool in initdb pg_ctl psql; do
            test -x "${pg16_bin}/${tool}"
          done
          "${pg16_bin}/initdb" --version | grep -Eq 'PostgreSQL\) 16\.'
          echo "${pg16_bin}" >> "$GITHUB_PATH"

      # OMN-20543: export the connection env the integration fixtures read, so
      # the head step and the must-fail control step see the same database. The
      # host is resolved the way the caller's test job resolves it, so this
      # holds on GitHub-hosted and self-hosted runners alike.
      - name: Export the Postgres service to the bound tests
        id: pg_env
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          import socket

          port = int(os.environ["POSTGRES_PORT"])

          def can_connect(candidate: str) -> bool:
              try:
                  with socket.create_connection((candidate, port), timeout=1.0):
                      return True
              except OSError:
                  return False

          if can_connect("127.0.0.1"):
              print("127.0.0.1")
              raise SystemExit(0)

          try:
              with open("/proc/net/route", encoding="utf-8") as routes:
                  route_lines = routes.readlines()[1:]
          except OSError:
              route_lines = []
          for line in route_lines:
              fields = line.split()
              if len(fields) >= 3 and fields[1] == "00000000":
                  gateway_hex = fields[2]
                  gateway = ".".join(
                      str(int(gateway_hex[i : i + 2], 16)) for i in (6, 4, 2, 0)
                  )
                  if can_connect(gateway):
                      print(gateway)
                      raise SystemExit(0)

          raise SystemExit(
              f"could not reach the Postgres service on localhost or the default gateway, port {port}"
          )
          PY
          )"
          {
            echo "INTEGRATION_POSTGRES_HOST=${host}"
            echo "INTEGRATION_POSTGRES_PORT=${POSTGRES_PORT}"
            echo "INTEGRATION_POSTGRES_USER=postgres"
            echo "INTEGRATION_POSTGRES_PASSWORD=test_password"
            echo "INTEGRATION_POSTGRES_DB=omnibase_infra"
            echo "POSTGRES_PASSWORD=test_password"
          } >> "$GITHUB_ENV"
          echo "Postgres service for the bound tests: host=${host} port=${POSTGRES_PORT}"

      # OMN-21013: resolve declared sibling revisions once, before either verdict.
      # Missing or conflicting pins leave the sibling absent; node_dod_verify
      # owns the refusal. Credentials exist only in each git process's env
      # (the equivalent of persist-credentials: false), using the default token.
      - name: Provision the contracts' declared sibling checkouts
        id: sibling_checkouts
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        env:
          REPO_SHORT: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$DOD_VERIFY_PY" - <<'PY'
          import base64
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          import yaml

          home = Path(os.environ["GITHUB_WORKSPACE"]) / ".dod-verify/head_home"
          caller = home / os.environ["REPO_SHORT"]
          dod = Path(os.environ["RUNNER_TEMP"]) / "dod"
          # A reused runner must not supply a stale sibling from an earlier job.
          for previous in home.iterdir():
              if previous != caller:
                  if previous.is_symlink() or previous.is_file():
                      previous.unlink()
                  else:
                      shutil.rmtree(previous)
          manifest = dod / "siblings.tsv"
          manifest.write_text("")
          siblings = set()
          for ticket in (dod / "tickets.txt").read_text().splitlines():
              contract_path = caller / "contracts" / f"{ticket}.yaml"
              if not contract_path.is_file():
                  continue
              try:
                  contract = yaml.safe_load(contract_path.read_text()) or {}
              except (OSError, yaml.YAMLError):
                  # Contract validation belongs to the verifier below.
                  continue
              if not isinstance(contract, dict):
                  continue
              for item in contract.get("dod_evidence", []):
                  if not isinstance(item, dict):
                      continue
                  for check in item.get("checks", []):
                      if not isinstance(check, dict):
                          continue
                      cwd = check.get("cwd", "")
                      if not isinstance(cwd, str):
                          continue
                      match = re.fullmatch(r"\$\{OMNI_HOME\}/([A-Za-z0-9][A-Za-z0-9_.-]*)(?:/.*)?", cwd)
                      if match and ".." not in match[1] and match[1] != caller.name:
                          siblings.add(match[1])

          if not siblings:
              sys.exit(0)
          # Read data from the PR head; never execute a caller-owned action.
          # Unreadable pin metadata cannot authorize a fallback revision.
          try:
              project = caller / "pyproject.toml"
              sources = tomllib.loads(project.read_text()).get("tool", {}).get("uv", {}).get("sources", {}) if project.is_file() else {}
              if not isinstance(sources, dict):
                  raise ValueError("uv sources must be a table")
              documents = []
              for folder in (caller / ".github/workflows", caller / ".github/actions"):
                  for path in sorted(folder.rglob("*")):
                      if path.suffix in (".yml", ".yaml") and path.is_file():
                          documents.append(yaml.safe_load(path.read_text()))
          except (OSError, ValueError, yaml.YAMLError):
              print("::notice::sibling pin metadata unreadable; checkouts left absent")
              sys.exit(0)

          def mappings(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from mappings(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from mappings(child)

          git_env = {key: value for key, value in os.environ.items() if key not in (
              "GIT_DIR", "GIT_WORK_TREE", "GIT_INDEX_FILE", "GIT_COMMON_DIR",
          )}
          git_env["GIT_TERMINAL_PROMPT"] = "0"
          token = os.environ.get("GH_TOKEN", "")
          if token:
              auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              git_env.update(GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
                             GIT_CONFIG_VALUE_0=f"AUTHORIZATION: basic {auth}")

          def git(*args):
              return subprocess.run(["git", *args], env=git_env, check=True,
                                    capture_output=True, text=True, timeout=45).stdout.strip()

          for sibling in sorted(siblings):
              target = home / sibling
              repository = f"OmniNode-ai/{sibling}"
              url = f"https://github.com/{repository}.git"
              uv_pins, action_pins, checkout_refs = set(), set(), set()
              for source in sources.values():
                  for entry in (source if isinstance(source, list) else [source]):
                      if isinstance(entry, dict) and str(entry.get("git", "")).removesuffix(".git").rstrip("/") == url.removesuffix(".git"):
                          pin = entry.get("rev") or entry.get("tag")
                          if pin:
                              uv_pins.add(pin)
              for document in documents:
                  for entry in mappings(document):
                      uses = entry.get("uses", "")
                      if isinstance(uses, str) and uses.startswith(repository + "/.github/actions/") and "@" in uses:
                          action_pins.add(uses.rsplit("@", 1)[1])
                      if isinstance(uses, str) and uses.startswith("actions/checkout@"):
                          options = entry.get("with", {})
                          if options.get("repository") == repository and options.get("ref"):
                              checkout_refs.add(str(options["ref"]))
              pins = next((pins for pins in (uv_pins, action_pins, checkout_refs) if pins), set())
              if len(pins) > 1:
                  print(f"::notice::{sibling}: conflicting revision pins; checkout left absent")
                  continue
              ref = next(iter(pins), "HEAD")
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_./-]*", ref) or ".." in ref:
                  print(f"::notice::{sibling}: unresolved revision; checkout left absent")
                  continue
              try:
                  if re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                      sha = ref.lower()
                  else:
                      patterns = ["HEAD"] if ref == "HEAD" else [ref, f"refs/heads/{ref}", f"refs/tags/{ref}", f"refs/tags/{ref}^{{}}"]
                      rows = [line.split() for line in git("ls-remote", url, *patterns).splitlines()]
                      peeled = {row[0] for row in rows if len(row) == 2 and row[1].endswith("^{}")}
                      resolved = peeled or {row[0] for row in rows if len(row) == 2}
                      if len(resolved) != 1:
                          raise ValueError("revision did not resolve uniquely")
                      sha = resolved.pop()
                  if not re.fullmatch(r"[0-9a-f]{40}", sha):
                      raise ValueError("revision is not a commit SHA")
                  target.mkdir()
                  git("init", str(target))
                  git("-C", str(target), "remote", "add", "origin", url)
                  git("-C", str(target), "fetch", "--depth=1", "--no-tags", "origin", sha)
                  git("-C", str(target), "checkout", "--detach", "FETCH_HEAD")
                  with manifest.open("a") as stream:
                      stream.write(f"{sibling}\t{sha}\n")
                  print(f"Sibling checkout: {sibling}@{sha}")
              except (subprocess.SubprocessError, OSError, ValueError) as error:
                  shutil.rmtree(target, ignore_errors=True)
                  print(f"::notice::{sibling}: checkout unavailable ({type(error).__name__}); left absent")
          PY

      - name: Verify the contract at the PR head
        id: head_verify
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        env:
          REPO_SHORT: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          # CI checks the exact subject commit, detached from a moving upstream.
          DOD_VERIFY_ALLOW_STALE_PRODUCT_CLONE: "1"
        run: |
          set -euo pipefail
          export OMNI_HOME="$GITHUB_WORKSPACE/.dod-verify/head_home"
          head_tree="$OMNI_HOME/$REPO_SHORT"
          cd "$head_tree"
          while IFS= read -r ticket; do
            contract="$head_tree/contracts/$ticket.yaml"
            if [ ! -f "$contract" ]; then
              echo "::error::pull request cites $ticket but carries no contracts/$ticket.yaml"
              echo "::notice::Include contracts/$ticket.yaml at this PR head; a later companion merge cannot supply evidence for this head."
              exit 1
            fi
            result="$RUNNER_TEMP/dod/head-$ticket.json"
            rc=0
            "$DOD_VERIFY_PY" -m omnimarket.nodes.node_dod_verify \
              --ticket-id "$ticket" --contract-path "$contract" --execution-audience hosted \
              --output-path "$RUNNER_TEMP/dod/head-$ticket.receipt.json" > "$result" || rc=$?
            # --output-path adds this non-JSON line after the pretty JSON document.
            sed -i '/^Receipt written to: /d' "$result"
            if [ "$rc" -ne 0 ]; then
              diagnostic="$(jq -s -er 'if length == 1 and (.[0] | type == "object") then .[0] | "status=\(.status) error_message=\(.error_message // "")" else error("invalid verdict") end' "$result" 2>/dev/null || printf '%s' 'stdout is not JSON; status and error_message unavailable')"
              echo "::error::$ticket head verification failed (exit $rc): $diagnostic"
              exit 1
            fi
            if ! jq -s -e 'length == 1 and (.[0] | type == "object" and .status == "verified")' "$result" > /dev/null; then
              echo "::error::$ticket head verification did not return one verified JSON verdict"
              exit 1
            fi
            echo "$ticket head: verified"
          done < "$RUNNER_TEMP/dod/tickets.txt"

      - name: Prepare the merge base with the pull request's test side laid over it
        id: merge_base
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        env:
          REPO_SHORT: ${{ github.event.repository.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head_tree="$GITHUB_WORKSPACE/.dod-verify/head_home/$REPO_SHORT"
          base_tree="$GITHUB_WORKSPACE/.dod-verify/base_home/$REPO_SHORT"
          if ! git -C "$head_tree" cat-file -e "$BASE_SHA^{commit}"; then
            git -C "$head_tree" fetch --no-tags origin "$BASE_SHA"
          fi
          MB=$(git -C "$head_tree" merge-base "$BASE_SHA" "$HEAD_SHA")
          printf '%s\n' "$MB" > "$RUNNER_TEMP/dod/merge-base.txt"
          # A self-hosted workspace outlives the job: clear a previous run's base trees.
          rm -rf "$GITHUB_WORKSPACE/.dod-verify/base_home" "$GITHUB_WORKSPACE/.dod-verify/fix_reverted_home"
          git -C "$head_tree" worktree prune
          TEST_SIDE='^tests?/|/tests?/|(^|/)conftest\.py$|(^|/)test_[^/]*\.py$|_test\.py$'
          # prepare_control HOME LABEL [FIX]: check the merge base out at HOME/$REPO_SHORT,
          # revert FIX's product (non-test, non-contract) changes there when one is named, and lay
          # over it every test-side path and cited contract this pull request changed.
          prepare_control() {
            local control_home="$1" label="$2" fix="${3:-}"
            local control_tree="$control_home/$REPO_SHORT" overlay_paths
            overlay_paths="$(mktemp "$RUNNER_TEMP/dod/overlay-paths.XXXXXX")"
            mkdir -p "$control_home"
            git -C "$head_tree" worktree add --detach "$control_tree" "$MB"
            # OMN-21013: reuse the early resolved SHA, including unpinned siblings,
            # for every merge-base and reverted-fix registry. Never re-resolve here.
            if [ -f "$RUNNER_TEMP/dod/siblings.tsv" ]; then
              while IFS=$'\t' read -r sibling sibling_sha; do
                git -C "$GITHUB_WORKSPACE/.dod-verify/head_home/$sibling" worktree prune
                if ! git -C "$GITHUB_WORKSPACE/.dod-verify/head_home/$sibling" worktree add --detach "$control_home/$sibling" "$sibling_sha"; then
                  echo "::notice::$sibling: control checkout unavailable; left absent"
                  rm -rf "$control_home/$sibling"
                fi
              done < "$RUNNER_TEMP/dod/siblings.tsv"
            fi
            local path test_side cited_contract ticket
            if [ -n "$fix" ]; then
              local -a product=()
              while IFS= read -r -d '' path; do
                if [[ "$path" == *..* || "$path" == /* ]]; then
                  echo "::error::unsafe revert path refused"
                  exit 1
                fi
                # A contract is evidence, not product: the fix's own contract
                # change is never reverted, and a later amendment on the base
                # would make it fail to revert (OMN-17427).
                if [[ ! "$path" =~ $TEST_SIDE|^contracts/OMN-[0-9]+\.yaml$ ]]; then
                  product+=("$path")
                fi
              done < <(git -C "$head_tree" diff --name-only --no-renames -z "$fix^1" "$fix")
              if [ "${#product[@]}" -eq 0 ]; then
                echo "::error::merged fix $fix changes no product path, so reverting it cannot make a bound test fail"
                exit 1
              fi
              if ! git -C "$head_tree" diff --binary --no-renames "$fix^1" "$fix" -- "${product[@]}" | git -C "$control_tree" apply -R; then
                echo "::error::the product changes of merged fix $fix do not revert cleanly at the merge base, so the control cannot run"
                exit 1
              fi
              for path in "${product[@]}"; do
                printf 'Reverted from %s: %s\n' "$fix" "$path"
              done
            fi
            git -C "$head_tree" diff --name-only --diff-filter=ACMR -z "$MB" "$HEAD_SHA" > "$overlay_paths"
            local test_paths=0
            while IFS= read -r -d '' path; do
              if [[ "$path" == *..* || "$path" == /* ]]; then
                echo "::error::unsafe overlay path refused"
                exit 1
              fi
              test_side=false
              if [[ "$path" =~ $TEST_SIDE ]]; then
                test_side=true
              fi
              cited_contract=false
              while IFS= read -r ticket; do
                if [ "$path" = "contracts/$ticket.yaml" ]; then
                  cited_contract=true
                fi
              done < "$RUNNER_TEMP/dod/tickets.txt"
              if [ "$test_side" = true ] || [ "$cited_contract" = true ]; then
                git -C "$control_tree" checkout "$HEAD_SHA" -- "$path"
                printf 'Overlaid: %s\n' "$path"
                if [ "$test_side" = true ]; then
                  test_paths=$((test_paths + 1))
                fi
              fi
            done < "$overlay_paths"
            # With a named fix, the reverted product change is what must make the bound tests fail.
            if [ -z "$fix" ] && [ "$test_paths" -eq 0 ]; then
              echo "::error::no test-side change: the bound tests cannot be shown to fail at $label"
              echo "::notice::For an already-merged fix, add a commit trailer 'Binds-Merged-Fix: OMN-<n> <full 40-character sha>' naming the merged product fix for each cited ticket. Its subject must cite the ticket and its product changes must revert cleanly at the merge base; the bound tests must fail with that fix reverted."
              exit 1
            fi
          }
          # OMN-17427: a binding for a fix that already merged names that fix in a
          # trailer on its own commits, "Binds-Merged-Fix: OMN-<n> <full sha>". Its
          # tests pass at the merge base by construction, so its control runs at the
          # merge base with that fix's product changes reverted: the head run and the
          # control run then differ by the fix alone. What makes the commit the fix is
          # read from git: it exists, is merged at the merge base, has one parent, and
          # its subject cites the ticket. The trailer only picks which merged commit;
          # the pull request body is never read.
          fixes="$RUNNER_TEMP/dod/merged-fixes.txt"
          git -C "$head_tree" log --format='%(trailers:key=Binds-Merged-Fix,valueonly)' "$MB..$HEAD_SHA" | sed '/^[[:space:]]*$/d' | sort -u > "$fixes"
          while IFS= read -r value; do
            if [[ ! "$value" =~ ^OMN-[0-9]+\ [0-9a-f]{40}$ ]]; then
              echo "::error::Binds-Merged-Fix must read 'OMN-<n> <full 40-character sha>'; refused: $value"
              exit 1
            fi
          done < "$fixes"
          merge_base_needed=false
          while IFS= read -r ticket; do
            named="$(awk -v t="$ticket" '$1 == t {print $2}' "$fixes")"
            if [ -z "$named" ]; then
              printf '%s\n' "$GITHUB_WORKSPACE/.dod-verify/base_home" > "$RUNNER_TEMP/dod/control-home-$ticket.txt"
              printf '%s\n' "the merge base" > "$RUNNER_TEMP/dod/control-label-$ticket.txt"
              merge_base_needed=true
              continue
            fi
            if [ "$(printf '%s\n' "$named" | wc -l)" -ne 1 ]; then
              echo "::error::$ticket: Binds-Merged-Fix names more than one merged fix; name exactly one"
              exit 1
            fi
            fix="$named"
            if ! git -C "$head_tree" cat-file -e "$fix^{commit}" 2>/dev/null; then
              echo "::error::$ticket: merged fix $fix is not a commit in this repository"
              exit 1
            fi
            if ! git -C "$head_tree" merge-base --is-ancestor "$fix" "$MB"; then
              echo "::error::$ticket: $fix is not merged at the merge base $MB; an unmerged fix proves red at the merge base"
              exit 1
            fi
            if [ "$(git -C "$head_tree" rev-list --parents -n 1 "$fix" | wc -w)" -ne 2 ]; then
              echo "::error::$ticket: merged fix $fix does not have exactly one parent"
              exit 1
            fi
            subject="$(git -C "$head_tree" log -1 --format=%s "$fix")"
            if ! grep -qwF -- "$ticket" <<< "$subject"; then
              echo "::error::$ticket: the subject of merged fix $fix does not cite $ticket"
              exit 1
            fi
            # A pull request that changes product code proves red at its own merge base.
            while IFS= read -r -d '' path; do
              if [[ ! "$path" =~ $TEST_SIDE|^contracts/OMN-[0-9]+\.yaml$ ]]; then
                echo "::error::$ticket names merged fix $fix, but this pull request changes $path, which is neither test-side nor a contract; a product change proves red at the merge base"
                exit 1
              fi
            done < <(git -C "$head_tree" diff --name-only --no-renames -z "$MB" "$HEAD_SHA")
            label="the merge base with merged fix $fix reverted"
            echo "$ticket: control at $label"
            prepare_control "$GITHUB_WORKSPACE/.dod-verify/fix_reverted_home/$ticket" "$label" "$fix"
            printf '%s\n' "$GITHUB_WORKSPACE/.dod-verify/fix_reverted_home/$ticket" > "$RUNNER_TEMP/dod/control-home-$ticket.txt"
            printf '%s\n' "$label" > "$RUNNER_TEMP/dod/control-label-$ticket.txt"
          done < "$RUNNER_TEMP/dod/tickets.txt"
          if [ "$merge_base_needed" = true ]; then
            prepare_control "$GITHUB_WORKSPACE/.dod-verify/base_home" "the merge base"
          fi

      # OMN-20070: unchanged carried evidence is exempt; each PR must bind its own evidence.
      - name: Must-fail control at the merge base
        id: base_control
        continue-on-error: ${{ inputs.shadow == 'true' }}
        if: steps.bot_exempt.outputs.exempt != 'true' && steps.same_repo.outcome != 'failure' && steps.tickets.outcome != 'failure' && steps.writer_pin_only.outputs.exempt != 'true'
        env:
          REPO_SHORT: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          # CI checks the exact subject commit, detached from a moving upstream.
          DOD_VERIFY_ALLOW_STALE_PRODUCT_CLONE: "1"
        run: |
          set -euo pipefail
          MB="$(cat "$RUNNER_TEMP/dod/merge-base.txt")"
          head_tree="$GITHUB_WORKSPACE/.dod-verify/head_home/$REPO_SHORT"
          # OMN-20070: coverage-only evidence has no earlier product behaviour
          # to control (GC.9 IMPOSSIBLE / TEST_ONLY_DIFF). Derive this from the
          # complete diff, including deletions and both sides of renames. Only
          # test-side paths and the cited contracts qualify; config, workflows,
          # uncited contracts and all other paths still require a failing control.
          TEST_SIDE='^tests?/|/tests?/|(^|/)conftest\.py$|(^|/)test_[^/]*\.py$|_test\.py$'
          diff_paths="$RUNNER_TEMP/dod/control-diff-paths.txt"
          git -C "$head_tree" diff --name-only --no-renames -z "$MB" "$HEAD_SHA" > "$diff_paths"
          test_only=true
          has_tests=false
          while IFS= read -r -d '' path; do
            if [[ "$path" =~ $TEST_SIDE ]]; then
              has_tests=true
              continue
            fi
            cited_contract=false
            while IFS= read -r ticket; do
              if [ "$path" = "contracts/$ticket.yaml" ]; then
                cited_contract=true
              fi
            done < "$RUNNER_TEMP/dod/tickets.txt"
            if [ "$cited_contract" = false ]; then
              test_only=false
            fi
          done < "$diff_paths"
          if [ "$has_tests" = false ]; then
            test_only=false
          fi
          failed=0
          while IFS= read -r ticket; do
            # The merge base, or the merge base with a named merged fix reverted (OMN-17427).
            control_home="$(cat "$RUNNER_TEMP/dod/control-home-$ticket.txt")"
            export OMNI_HOME="$control_home"
            base_tree="$OMNI_HOME/$REPO_SHORT"
            cd "$base_tree"
            where="$(cat "$RUNNER_TEMP/dod/control-label-$ticket.txt")"
            result="$RUNNER_TEMP/dod/base-$ticket.json"
            control="$RUNNER_TEMP/dod/base-$ticket.control.txt"
            printf '%s\n' 'refused' > "$control"
            mb_contract="$RUNNER_TEMP/dod/base-$ticket.mb-contract.yaml"
            carried="$RUNNER_TEMP/dod/base-$ticket.carried.json"
            git -C "$base_tree" show "$MB:contracts/$ticket.yaml" > "$mb_contract" 2>/dev/null || : > "$mb_contract"
            if ! "$DOD_VERIFY_PY" - "$GITHUB_WORKSPACE/.dod-verify/head_home/$REPO_SHORT/contracts/$ticket.yaml" "$mb_contract" > "$carried" <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          def evidence(path):
              contract = yaml.safe_load(Path(path).read_text())
              items = contract.get("dod_evidence") if isinstance(contract, dict) else None
              return items if isinstance(items, list) else []

          head_items = evidence(sys.argv[1])
          base_items = {
              item["id"]: item for item in evidence(sys.argv[2])
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          }
          head_ids = [
              item["id"] for item in head_items
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          ]
          # An id the head repeats is never carried: a second item cannot hide behind an inherited id.
          carried = {
              item["id"] for item in head_items
              if isinstance(item, dict) and isinstance(item.get("id"), str)
              and head_ids.count(item["id"]) == 1
              and item == base_items.get(item["id"])
          }
          print(json.dumps(sorted(carried)))
          PY
            then
              echo "::error::$ticket: cannot compare the contract with the merge base's; carried evidence unavailable"
              failed=1
              continue
            fi
            "$DOD_VERIFY_PY" -m omnimarket.nodes.node_dod_verify \
              --ticket-id "$ticket" --contract-path "$base_tree/contracts/$ticket.yaml" --execution-audience hosted \
              --output-path "$RUNNER_TEMP/dod/base-$ticket.receipt.json" > "$result" || true
            sed -i '/^Receipt written to: /d' "$result"
            if ! jq -s -e 'length == 1 and (.[0] | type == "object" and (.checks | type == "array"))' "$result" > /dev/null 2>&1; then
              echo "::error::$ticket: control stdout is not parseable as one JSON verdict with checks; evidence ids unavailable"
              failed=1
              continue
            fi
            bound="$RUNNER_TEMP/dod/base-$ticket.bound.json"
            if ! jq '[.checks[] | select((.binds_ac | length) > 0)]' "$result" > "$bound"; then
              echo "::error::$ticket: cannot read bound checks; evidence ids unavailable"
              failed=1
              continue
            fi
            if [ "$(jq 'length' "$bound")" -eq 0 ]; then
              echo "::error::$ticket: zero bound checks (evidence ids: none); nothing is bound, so nothing can fail"
              failed=1
              continue
            fi
            carried_ids="$(jq -r 'join(", ")' "$carried")"
            if [ -n "$carried_ids" ]; then
              echo "$ticket: carried unchanged from the merge base's contract, not re-controlled [$carried_ids]"
            fi
            remaining="$RUNNER_TEMP/dod/base-$ticket.remaining.json"
            jq --slurpfile carried "$carried" '[.[] | select(.evidence_id as $id | $carried[0] | index($id) | not)]' "$bound" > "$remaining"
            if [ "$(jq 'length' "$remaining")" -eq 0 ]; then
              echo "::error::$ticket [$carried_ids]: every bound check is carried unchanged from the merge base's contract; this pull request binds no evidence of its own"
              failed=1
              continue
            fi
            bound="$remaining"
            verified_ids="$(jq -r '[.[] | select(.status == "verified") | (.evidence_id | if . == null or . == "" then "<missing evidence_id>" else tostring end)] | join(", ")' "$bound")"
            other_ids="$(jq -r '[.[] | select(.status != "failed" and .status != "verified") | (.evidence_id | if . == null or . == "" then "<missing evidence_id>" else tostring end)] | join(", ")' "$bound")"
            # A named merged fix supplies earlier behaviour even on a test-only
            # binding PR. Its reverted control must still fail. A coverage-only
            # exception also cannot supply a missing or non-green head verdict.
            if [ "$test_only" = true ] && [ "$where" = "the merge base" ] && [ -z "$other_ids" ]; then
              head_result="$RUNNER_TEMP/dod/head-$ticket.json"
              if ! jq -s -e --slurpfile bound "$bound" '
                length == 1 and (.[0] as $head |
                  $head.status == "verified" and ($head.checks | type == "array")
                  and all($bound[0][]; .evidence_id as $id |
                    ($id | type == "string" and length > 0) and
                    any($head.checks[]; .evidence_id == $id and
                      (.binds_ac | length) > 0 and .status == "verified")))
              ' "$head_result" > /dev/null 2>&1; then
                echo "::error::$ticket: TEST_ONLY_DIFF requires verified head evidence for every own bound check"
                failed=1
                continue
              fi
              printf '%s\n' 'passed: IMPOSSIBLE TEST_ONLY_DIFF (test_only_diff); coverage-only evidence, no earlier product behaviour to control' > "$control"
              echo "$ticket base control: IMPOSSIBLE TEST_ONLY_DIFF (test_only_diff); coverage-only evidence, no earlier product behaviour to control"
              continue
            fi
            if [ -n "$verified_ids" ]; then
              echo "::error::$ticket [$verified_ids]: bound test also passes at $where: the control did not fail (always-pass)"
              failed=1
            fi
            if [ -n "$other_ids" ]; then
              echo "::error::$ticket [$other_ids]: the control could not run, a control that did not run is not a pass"
              failed=1
              # OMN-20543: name the commonest cause. This hosted job never runs a
              # local_done_gate item, at the head or here, so such an item cannot
              # be controlled. A database is provided to every bound test, so a
              # test that needs one is bound with the default scope instead.
              scoped_ids="$(jq -r '[.[] | select(.status != "failed" and .status != "verified") | select((.message // "") | startswith("NOT_EVALUATED [local_done_gate]")) | (.evidence_id | if . == null or . == "" then "<missing evidence_id>" else tostring end)] | join(", ")' "$bound")"
              if [ -n "$scoped_ids" ]; then
                echo "::error::$ticket [$scoped_ids]: scoped local_done_gate, which this hosted check runs neither at the head nor at $where; this job gives every bound test a Postgres (INTEGRATION_POSTGRES_*, PG16 initdb on PATH), so bind a database test with the default execution_scope"
              fi
            fi
            if [ -n "$verified_ids" ] || [ -n "$other_ids" ]; then
              continue
            fi
            ids="$(jq -r '[.[].evidence_id // "<missing evidence_id>"] | join(", ")' "$bound")"
            printf '%s\n' 'passed: every bound check failed' > "$control"
            echo "$ticket base control: passed; every bound check failed [$ids]"
          done < "$RUNNER_TEMP/dod/tickets.txt"
          exit "$failed"

      # OMN-20073: in shadow mode every refusing step above has
      # continue-on-error, so this job concludes success whatever the verdict
      # and the verdict is recorded here as data: one `Shadow verdict:` summary
      # line and one notice annotation (readable through the check-run's
      # annotations API without opening the log). new_path is verified,
      # refused (refused_step names the first step that failed, in run order)
      # or exempt (a dependency bot).
      - name: Summarise
        if: always()
        env:
          VERIFIER_VERSION: ${{ inputs.verifier-version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHADOW: ${{ inputs.shadow }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          # Best-effort summary, including when an earlier step failed.
          {
            printf 'Verifier version: %s\n\nHead SHA: %s\n\n' "$VERIFIER_VERSION" "$HEAD_SHA"
            printf 'Merge base SHA: %s\n\n' "$(cat "$RUNNER_TEMP/dod/merge-base.txt" 2>/dev/null || printf '%s' 'unavailable')"
            if [ -f "$RUNNER_TEMP/dod/tickets.txt" ]; then
              while IFS= read -r ticket; do
                verdict="$(jq -r '"status=\(.status), acceptance_basis=\(.acceptance_basis)"' "$RUNNER_TEMP/dod/head-$ticket.json" 2>/dev/null || printf '%s' 'unavailable')"
                control="$(cat "$RUNNER_TEMP/dod/base-$ticket.control.txt" 2>/dev/null || printf '%s' 'not run')"
                where="$(cat "$RUNNER_TEMP/dod/control-label-$ticket.txt" 2>/dev/null || printf '%s' 'unavailable')"
                printf '%s: head %s; base control %s at %s\n\n' "$ticket" "$verdict" "$control" "$where"
              done < "$RUNNER_TEMP/dod/tickets.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$SHADOW" = "true" ]; then
            {
              new_path=verified
              refused_step=none
              for step_id in bot_exempt same_repo tickets head_checkout setup_python install_uv verifier writer_pin_only pg_tools pg_env sibling_checkouts head_verify merge_base base_control; do
                if [ "$(jq -r --arg id "$step_id" '.[$id].outcome // empty' <<< "$STEPS_JSON")" = failure ]; then
                  new_path=refused
                  refused_step="$step_id"
                  break
                fi
              done
              if [ "$(jq -r '.bot_exempt.outputs.exempt // empty' <<< "$STEPS_JSON")" = true ]; then
                new_path=exempt
              fi
              if [ "$(jq -r '.writer_pin_only.outputs.exempt // empty' <<< "$STEPS_JSON")" = true ]; then
                new_path=exempt
              fi
              verdict_line="Shadow verdict: head=$HEAD_SHA new_path=$new_path refused_step=$refused_step"
              printf '%s\n\n' "$verdict_line" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=repo-evidence shadow verdict::$verdict_line"
            } || true
          elif [ "$(jq -r '.writer_pin_only.outputs.exempt // empty' <<< "$STEPS_JSON")" = true ]; then
            printf '%s\n' 'Writer-app dependency-pin-only exemption: derived at the head (OMN-17427)' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
