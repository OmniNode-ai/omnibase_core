#
# OMN-9050: automate omnibase_core SHA pin bumps across all downstream repos.
#
# Trigger: push to main OR manual workflow_dispatch (for the 2026-04-17 bootstrap
# sweep and any future on-demand replays).
#
# For each repo declared in docs/downstream-repos.yaml with pin_sites:
#   1. Checkout the downstream repo with a minted onexbot-occ-writer App
#      token (OMN-16373; CROSS_REPO_PAT retired).
#   2. Run scripts/pin_bump.py to rewrite every pin_site to the new SHA.
#   3. Commit + push a bot/bump-omnibase-core-pin-<shortsha> branch.
#   4. Open a PR titled "chore(ci): bump omnibase_core pin to <shortsha> [bot]".
#   5. Enable auto-merge SQUASH via GraphQL so the PR merges on green CI.
#      Arming is skipped where the repo disallows auto-merge (OMN-20361); the
#      PR URL and a hand-landing line go to the step summary and the leg stays
#      green. Any other arming failure still fails the leg.
#
# Failures on a single downstream repo must NOT cascade — each matrix leg is
# `continue-on-error: true` so a bad pin surface on one repo doesn't block the
# rest (`fail-fast: false` already keeps siblings running independently of
# this). OMN-19848: that must not mean the failure is invisible. The `summary`
# job queries this run's own jobs via the Actions API and fails the run when
# any "Bump: <repo>" leg did not succeed, naming it in the run summary and as
# an `::error::` annotation — no leg is declared optional today.

name: Publish downstream pin bumps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_sha:
        description: "Override SHA (defaults to github.sha). Must be 40-char hex."
        required: false

permissions:
  contents: read

concurrency:
  group: publish-downstream-pin-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enumerate-repos:
    name: Enumerate downstream repos
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    outputs:
      repos: ${{ steps.emit.outputs.repos }}
      new_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve new SHA
        id: sha
        run: |
          if [ -n "${{ inputs.override_sha }}" ]; then
            echo "sha=${{ inputs.override_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install parser deps
        run: pip install pyyaml

      - name: Emit matrix from manifest
        id: emit
        shell: python
        run: |
          import json, os, yaml
          with open("docs/downstream-repos.yaml") as f:
              mf = yaml.safe_load(f)
          repos = [r["name"] for r in mf["repos"] if r.get("pin_sites")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("repos=" + json.dumps(repos) + "\n")

  bump:
    name: "Bump: ${{ matrix.repo }}"
    needs: enumerate-repos
    if: needs.enumerate-repos.outputs.repos != '[]'
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.enumerate-repos.outputs.repos) }}
    env:
      NEW_SHA: ${{ needs.enumerate-repos.outputs.new_sha }}
      REPO: ${{ matrix.repo }}
    steps:
      - name: Checkout omnibase_core (manifest + script)
        uses: actions/checkout@v7
        with:
          path: omnibase_core

      # OMN-16373: CROSS_REPO_PAT retirement — mint a short-lived
      # onexbot-occ-writer App installation token, reused for the checkout,
      # push, and PR-open steps below.
      - name: Mint onexbot-occ-writer app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_OCC_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_OCC_PRIVATE_KEY }}
          owner: OmniNode-ai
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
          # OMN-19848: every declared pin_site lives under .github/workflows/.
          # GitHub refuses an App-authored push touching a workflow file unless
          # the token also carries `workflows: write` — without this every leg
          # failed identically at "Commit + push branch" with "refusing to allow
          # a GitHub App to create or update workflow ... without `workflows`
          # permission", before any PR was ever opened.
          permission-workflows: write

      - name: Checkout downstream (${{ matrix.repo }})
        uses: actions/checkout@v7
        with:
          repository: OmniNode-ai/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: downstream
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install script deps
        run: pip install pyyaml pydantic

      - name: Rewrite pins
        id: rewrite
        working-directory: downstream
        run: |
          python ../omnibase_core/scripts/pin_bump.py \
            --manifest ../omnibase_core/docs/downstream-repos.yaml \
            --repo "$REPO" \
            --repo-root . \
            --new-sha "$NEW_SHA"

      - name: Detect changes
        id: diff
        working-directory: downstream
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push branch
        if: steps.diff.outputs.changed == 'true'
        working-directory: downstream
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHORT="${NEW_SHA:0:12}"
          BRANCH="bot/bump-omnibase-core-pin-${SHORT}"
          # OMN-18273: commit as the App this job already mints a token for. The
          # previous identity resolved to no GitHub account, so the commit rendered
          # unlinked and named neither a bot nor a run. The numeric prefix on the
          # address is what links it to the App account.
          git config user.name "onexbot-occ-writer[bot]"
          git config user.email "307849072+onexbot-occ-writer[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(ci): bump omnibase_core pin to ${SHORT} [bot] [OMN-9050]" \
            --trailer "Onex-Workflow: ${GITHUB_WORKFLOW}" \
            --trailer "Onex-Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push -u origin "$BRANCH" --force-with-lease

      - name: Open PR + enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        working-directory: downstream
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SHORT="${NEW_SHA:0:12}"
          BRANCH="bot/bump-omnibase-core-pin-${SHORT}"
          # OMN-19848: the ticket token belongs in the TITLE, not only the commit
          # message. The downstream OCC autobind and Receipt Gate read the PR
          # title, and a title without it left every bot PR with no companion.
          TITLE="chore(ci): bump omnibase_core pin to ${SHORT} [bot] [OMN-9050]"
          # OMN-19848: open against the downstream repo's own default branch. A
          # hardcoded main opened every dev-default repo's PR against the
          # release-synced branch (OMN-16289), where main-target-guard rejects it
          # and the PR carries the whole dev-ahead-of-main history.
          BASE=$(gh api "repos/OmniNode-ai/${REPO}" --jq '.default_branch')
          if [[ -z "$BASE" || "$BASE" == "null" ]]; then
            echo "::error::could not resolve the default branch of OmniNode-ai/${REPO}"
            exit 1
          fi
          BODY=$(cat <<EOF
          Automated pin bump emitted by \`omnibase_core/publish-downstream-pin-bump.yml\`.

          - New SHA: \`${NEW_SHA}\`
          - Source: https://github.com/OmniNode-ai/omnibase_core/commit/${NEW_SHA}
          - Tracking: OMN-9050

          Will auto-merge on green CI. If CI regresses, DO NOT manually bump the pin to
          paper over the failure — diagnose the handshake break instead.
          EOF
          )
          # Check for existing open PR from this branch first — gh pr create
          # errors if one exists (no --upsert flag). When rerun from push, the
          # existing PR already has our commits; just update the PR body and
          # continue to the auto-merge step.
          PR_URL=$(gh pr list --repo "OmniNode-ai/${REPO}" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --repo "OmniNode-ai/${REPO}" \
              --head "$BRANCH" \
              --base "$BASE" \
              --title "$TITLE" \
              --body "$BODY")
            echo "Created: $PR_URL"
          else
            echo "Existing PR found: $PR_URL — updating body"
            PR_NUMBER=$(echo "$PR_URL" | sed -E 's#.*/pull/([0-9]+).*#\1#')
            gh pr edit "$PR_NUMBER" --repo "OmniNode-ai/${REPO}" --base "$BASE" --title "$TITLE" --body "$BODY" || true
          fi

          PR_NUMBER=$(echo "$PR_URL" | sed -E 's#.*/pull/([0-9]+).*#\1#')

          # OMN-20361: a repo with allow_auto_merge=false refuses the arm call
          # ("Auto merge is not allowed for this repository"), which turned the
          # leg red after the PR already existed. Skip arming there and leave
          # the PR for the landing controller. Only an explicit false skips up
          # front: an App-token read of the setting can return null (OMN-19852),
          # so null/empty still attempts the arm call and treats that exact
          # refusal as the same skip. Any other failure still fails the leg.
          skip_arming() {
            echo "::notice::auto-merge is not allowed on OmniNode-ai/${REPO}; PR ${PR_URL} left unarmed for the landing controller"
            {
              echo "### ${REPO}: auto-merge not allowed, PR left unarmed"
              echo "- PR: ${PR_URL}"
              echo "- Land by hand: \`gh pr merge ${PR_NUMBER} --repo OmniNode-ai/${REPO} --squash\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          ALLOW=$(gh api "repos/OmniNode-ai/${REPO}" --jq '.allow_auto_merge')
          if [[ "$ALLOW" == "false" ]]; then
            skip_arming
            exit 0
          fi

          PR_ID=$(gh api "repos/OmniNode-ai/${REPO}/pulls/${PR_NUMBER}" --jq '.node_id')
          if ! ARM_OUT=$(gh api graphql -f query='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}' -f id="$PR_ID" 2>&1); then
            if [[ "$ARM_OUT" == *"Auto merge is not allowed for this repository"* ]]; then
              skip_arming
              exit 0
            fi
            echo "$ARM_OUT"
            exit 1
          fi
          echo "$ARM_OUT"

      - name: Report no-op
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes for ${REPO} — pins already at ${NEW_SHA}."

  summary:
    name: Publish summary
    needs: [enumerate-repos, bump]
    if: always()
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || '["self-hosted","omnibase-ci"]')
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    permissions:
      actions: read
    steps:
      - name: Echo outcome
        run: |
          echo "Pin bump run for SHA ${{ needs.enumerate-repos.outputs.new_sha }}"
          echo "Repos attempted: ${{ needs.enumerate-repos.outputs.repos }}"

      # OMN-19848: each matrix leg is job-level continue-on-error, so a real
      # leg failure never turned this workflow's own conclusion red — the run
      # read "success" while every leg failed (docs/tracking/ROLLING_WORK_LEDGER.md
      # FRICTION row, lane omninode-infra-core-bump-83, 2026-09-27T03:30:12Z).
      # No leg is declared optional today, so any "Bump: <repo>" job that did
      # not succeed fails this job — and with it the workflow's conclusion.
      - name: Fail red on any real leg failure (no silent gates)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Bump: ")) | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion)"')
          if [ -n "$FAILED" ]; then
            {
              echo "## Downstream pin-bump leg failures"
              echo "$FAILED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILED" | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "One or more downstream bump legs did not succeed. See the errors above."
            exit 1
          fi
          echo "All downstream bump legs succeeded (or had no changes)." | tee -a "$GITHUB_STEP_SUMMARY"
