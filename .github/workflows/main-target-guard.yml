#
# OMN-12243: Block PRs targeting main.
# OMN-12477: Removed the hotfix/* bypass.
# OMN-20074: Removed the promotion-receipt exception. main is release-synced:
# release.yml ("Sync main to release tag") fast-forwards it to the published
# tag and opens no pull request against it, so the change-control receipt the
# exception read admitted nothing the release path uses. Every PR onto main is
# refused. Pinned by tests/ci/test_main_target_guard_prepush_omn20780.py.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

# OMN-19639: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  main-target-guard:
    name: main-target-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "::error::PR from '${HEAD_REF}' targets main, which is release-synced and never a pull-request target."
          echo "::error::The release workflow moves main by fast-forwarding it to the published tag; it opens no PR against main."
          echo "::error::Retarget this PR to dev."
          exit 1
