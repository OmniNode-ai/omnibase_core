name: Handshake Policy Gate
# Checks that every active OmniNode repo has the architecture-handshake
# CI workflow installed and passing on its default branch.
# Runs weekly and on manual dispatch here. The merge-queue run (OMN-13875) is
# a job of ci.yml, `handshake-policy-gate`, which calls this workflow on
# `merge_group` (OMN-20074), so the required "CI Summary" poller fails on it.
# The steps live only in this file. The per-repository required-context flip
# is a separate, staged decision.
#
# The check itself is omnimarket's node_handshake_policy_gate_effect (OMN-20671):
# it reads each repository's default branch and latest completed handshake run,
# asks node_handshake_policy_gate_compute what every read means and prints the
# report. This workflow only mints the token and calls the node at a pinned
# omnimarket revision; bump the revision to take a node change.
#
# Deliberately NOT triggered on `pull_request`: this job needs
# the onexbot App signing secrets, and this repo's OMNI_RUNNER_SELECTOR_V1
# convention (see ci.yml) routes every `pull_request`-triggered job to the
# public ubuntu-latest runner regardless of fork status, withholding trusted
# secrets by design. Adding `pull_request` here would make this job
# permanently red on every PR (confirmed live on PR #1381 — "ERROR: GitHub
# CLI is not authenticated"), which is a worse, always-failing-but-ignorable
# gate than the original silent one. `merge_group` is a distinct
# `github.event_name` (not `pull_request`), so it correctly routes to the
# trusted self-hosted runner where the token is available.

on:
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.3"

jobs:
  policy-gate:
    name: Check handshake compliance across repos
    # OMNI_RUNNER_SELECTOR_V1 - trusted events default to ubuntu-latest; pull_request defaults to ubuntu-latest
    runs-on: >-
      ${{
        github.event_name != 'pull_request'
        && fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON || (github.event.repository.private && '["self-hosted","omnibase-ci"]' || '["ubuntu-latest"]'))
        || fromJSON(vars.OMNI_PUBLIC_PR_RUNS_ON_JSON || '["ubuntu-latest"]')
      }}
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Mint onexbot app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ONEXBOT_APP_ID }}
          private-key: ${{ secrets.ONEXBOT_APP_PRIVATE_KEY }}
          owner: OmniNode-ai
          # Keep this scope aligned with architecture-handshakes/repos.conf.
          # The App installation needs Actions: read on all eight repos.
          repositories: |
            omnibase_core
            omnibase_infra
            omnibase_spi
            omniclaude
            omnidash
            omniintelligence
            omnimemory
            omninode_infra

      - name: Fetch the policy gate node (omnimarket)
        uses: actions/checkout@v7.0.1
        with:
          repository: OmniNode-ai/omnimarket
          ref: d99970696f78c6342b0f5cddb3aed72493e2aaed # pinned omnimarket rev (OMN-20671)
          path: .policy-gate-node-src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run policy gate check
        env:
          # The App token can read workflow runs across the scoped private repos.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            strict=""
          else
            strict="--strict"
          fi
          uv run --frozen --no-dev --project .policy-gate-node-src \
            python -m omnimarket.nodes.node_handshake_policy_gate_effect \
            --repos-conf architecture-handshakes/repos.conf ${strict}
