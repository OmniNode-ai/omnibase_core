#
# Caller workflow that invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core's .github/workflows/receipt-gate.yml) enforces
# "Enforcement by Receipt" (OMN-TBD): every PR must cite a Linear ticket whose
# dod_evidence items all have PASS ModelDodReceipt artifacts at the canonical
# path on onex_change_control. Missing or failing receipts block merge.
#
# Required-status-check name (for branch-protection): `receipt-gate / verify`.
# Branch-protection update happens after this workflow runs cleanly on a few
# PRs — see follow-up ticket OMN-TBD for the protection flip.
#
# Eats its own dogfood: this PR itself is gated by the same receipt-gate once
# the reusable workflow is present on main (PR #834).

name: Receipt Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  occ-preflight:
    uses: ./.github/workflows/occ-preflight.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      contracts-dir: contracts
      receipts-dir: drift/dod_receipts

  # OMN-15057: `needs: occ-preflight` with no `if:` override is vector-5 — an
  # occ-preflight FAILURE would SKIP this job (GitHub's implicit job-level
  # `if:` is `success()` over `needs:`), and a skipped required job satisfies
  # branch protection. `if: always()` makes `verify` run unconditionally.
  # This is safe without any compensating control: receipt-gate.yml's own
  # `verify` job independently re-resolves Evidence-Source and validates the
  # same dod_evidence PASS receipts occ-preflight checks (OMN-10419), so an
  # eligibility failure that would have failed occ-preflight also fails this
  # job's own logic directly — the needs-coupling was redundant, matching the
  # OMN-15057/omnimarket#1890 precedent.
  verify:
    needs: occ-preflight
    if: always()
    uses: ./.github/workflows/receipt-gate.yml
    with:
      branch-policy-mode: ${{ (github.event.pull_request.base.ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main') && 'main-release' || 'legacy' }}
