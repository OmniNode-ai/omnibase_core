      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestLocalModelIntegration::test_local_llm_client_protocol_compliant
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestLocalModelIntegration::test_local_model_health_check
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestLocalModelIntegration::test_local_model_responds
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestProviderClientCreation::test_local_client_from_config
