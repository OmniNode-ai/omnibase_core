---
# OMN-18790 — per-suite skip-count baseline for omnibase_core (epic OMN-18775).
#
# Ported from omnibase_infra's OMN-18776 landing (squash 77ea8d01). The gate
# that reads this file is scripts/ci/skip_count_ratchet.py, a hand-vendored
# copy of that repo's script; there is no automated vendoring path in this
# estate, so the SYNC header on that file is the convention.
#
# Each entry records what a suite is ALLOWED to leave unexecuted, and how that
# number was measured. An entry with no provenance is refused by the gate: a
# baseline with no recorded measurement is a claim, not a measurement.
#
# Lowering a number here is the ONLY way to lower the bar. There is no flag and
# no environment variable on scripts/ci/skip_count_ratchet.py that does it, and
# tests/ci/test_skip_count_ratchet_omn18790.py reads the parser's own option
# strings to keep it that way.
#
# mode: count    — the collected set is identical every run; compare the number.
# mode: nodeids  — an impacted-test selector varies the collected set, so compare
#                  identities instead. A selector only ever narrows, so a narrowed
#                  run's skip set is a subset of a full-width baseline.
#
# Honest limit: this counts skips, it does not judge them. A structurally sound
# skip and one caused by an env var CI never sets look identical here. What the
# ratchet removes is the SILENT GROWTH of the set, not the set.
version: 1
suites:
  omnibase_core/tests-integration:
    repo: omnibase_core
    job: Integration Tests (Split n/4)
    mode: count
    max_skips: 17
    baseline_collected: 608
    provenance:
      measured_at: '2026-09-18'
      measured_by: OMN-18790
      measurement_command: gh run download 35351419513 --repo OmniNode-ai/omnibase_core --pattern 'junit-int-*'
        --dir <dir> && uv run python scripts/ci/skip_count_ratchet.py --print-observed --suite omnibase_core/tests-integration
        --junit <dir>/*/junit-int-*.xml
      source_runs:
        - '35351419513'
      corroborating_runs:
        - '35339212128'
        - '35331654634'
        - '35346004317'
        - '35336363535'
      notes: 'The frozen-17 surface epic OMN-18775 named. Measured on five consecutive runs (three push-to-dev:
        35351419513, 35339212128, 35331654634; two pull_request: 35346004317, 35336363535). All five observed
        17 unique skipped ids out of 608 collected, and the id SETS were byte-identical: 0 ids outside
        this baseline and 0 ids missing from it, on every one. Mode is count because this job is NOT behind
        the impacted-test selector — its command is a fixed `pytest tests/integration/ --splits 4 --group
        N`, so the collected set does not vary and a count comparison cannot false-fail on narrowing.
        node_ids are recorded anyway so a breach names the offending test rather than only a number. What
        the 17 are: 11 support-assistant handler cases that need a local LLM endpoint CI does not provide,
        and 6 agent-YAML cases that need an omniclaude sibling checkout CI does not have. This entry does
        not judge either group; it refuses their silent growth. Positive control for the five zeros above,
        run end-to-end over 35351419513''s own JUnit bytes with one synthetic skipped id injected into
        split 1: the gate reports 18 against a baseline of 17, names the injected id, and exits 1.'
    node_ids:
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestErrorRecovery::test_timeout_raises_model_onex_error
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestHandlerWithLocalModel::test_handler_processes_billing_request
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestHandlerWithLocalModel::test_handler_processes_technical_request
      - integration.examples.demo.handlers.support_assistant.test_handler_integration.TestHandlerWithLocalModel::test_response_has_meaningful_content
