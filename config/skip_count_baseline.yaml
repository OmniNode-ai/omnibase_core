      measured_by: OMN-18790
      measurement_command: gh run download 35351419513 --repo OmniNode-ai/omnibase_core --pattern 'test-results-*'
        --dir <dir> && uv run python scripts/ci/skip_count_ratchet.py --print-observed --suite omnibase_core/test-parallel
        --junit <dir>/*/junit-*.xml
      source_runs:
        - '35351419513'
      corroborating_runs:
        - '35339212128'
        - '35331654634'
        - '35346004317'
        - '35336363535'
      notes: 'Measured on the same five runs as the integration entry. All five observed 60 unique skipped
        ids and the id SETS were byte-identical: 0 ids outside this baseline and 0 missing, on every one.
        Positive control for those zeros, at two levels: set arithmetic over the real id sets of 35339212128
        and 35336363535 reports 1 id outside the baseline once a synthetic id is injected; and end-to-end
        over 35351419513''s own 40 JUnit reports with one synthetic skipped id injected into split 1,
        the gate reports 61 against a baseline of 60, names the injected id, and exits 1. Mode is nodeids
        DESPITE the stable count, because this job sits behind scripts/ci/detect_test_paths.py and the
        repo variable ENABLE_SMART_TESTS is live — run 35346004317 recorded is_full_suite: false in its
        test-selection artifact. All five measured runs happened to collect ~45480 of ~45480 (the selector
        is directory-grain and selected tests/unit/ and tests/ci/ wholesale), so their agreement is evidence
        that the SET is frozen, not evidence that the selector never narrows. Under count mode a genuinely
        narrow diff would be green but would print a RATCHET CANDIDATE advising a lower number, and acting
        on that advice would red every subsequent full-width run. nodeids is correct under both shapes.
        baseline_collected is 45480, the value three of the five runs collected; the other two collected
        45481. Either value is green on all five — the field only decides whether a run reads as full-width
        or narrowed — and 45480 is the one under which all five read `at baseline` rather than one of
        them reading `narrowed selection` over a one-test difference.'
