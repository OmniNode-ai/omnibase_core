      corroborating_runs:
        - '35443411014'
      notes: 'Re-measured because the 2026-09-18 (OMN-18790) baseline recorded node_ids WITHOUT a leading
        "tests." package segment (e.g. unit.enums.test_compat_enum_parity_omn12189), while every run on
        2026-09-19 -- both this branch (OMN-16851, jonah/omn-16849-c17-parameter-retirement, runs 35442641430,
        35443411014, 35445052084, all three) and an UNRELATED open PR (#1710, lakshman/omn-18033-propagate-additional-deps,
        same-day failure, zero files in common with this change) -- observed the identical 60 ids WITH
        the "tests." prefix (e.g. tests.unit.enums.test_compat_enum_parity_omn12189). The #1710 cross-check
        is the positive control: two unrelated branches on the same day producing the same "new" prefix
        proves a classname-emission change upstream of this baseline, not drift caused by either PR''s
        content. dev itself was already red on this exact gate at 6ce05387 (this branch''s own merge-base,
        two separate CI runs, both failure) before either PR existed. This entry updates the recorded
        format to match current reality; it does not relax the check -- the skip COUNT is unchanged at
        60, and the SET of underlying skip causes (OMN-1126 circular-import module skip, sibling-clone-dependent
        cases, etc.) is unchanged, confirmed by diffing the old and new node_ids with the "tests." prefix
        stripped: the sets are identical. baseline_collected moved 45480 -> 45557 because this measurement
        run''s dev merge-base is one commit later (OMN-18807, +77 collected from its own new test file)
        than the 2026-09-18 measurement''s base.'
