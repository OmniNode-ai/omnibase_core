    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_commit_hygiene.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-configuration
    description: Every parameters key of every rule row of both contracts changes the verdict it controls,
      and a rule row missing a key or carrying an uncompilable pattern fails to load.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_hook_writes.py tests/unit/validation/test_validator_commit_hygiene.py
          -q -o addopts='' -k "parameter or compile or disabling"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-bindings
    description: A container spy records the report writer resolved by the runtime; a second injected
      writer gives the committed golden report with no code change; the checkers run with open and Path
      reads patched to raise.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_handler_validator_run.py -q -o addopts=''
          -k "container or injected"
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_hook_writes.py tests/unit/validation/test_validator_commit_hygiene.py
          -q -o addopts='' -k "checker_is_pure"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-deploy-checkout-runtime
    description: Exercise the generic validator runtime at the checkout on a hosted runner. The container
      resolution, injected writer, canonical report and CLI refusal cases need no container daemon or
      private runtime.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_handler_validator_run.py -q --no-cov
          -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-deploy-published-runtime
    description: Read the published generic validator runtime at the checkout commit. Refuse a missing
      source or a runtime without container resolution of the report writer. The public source probe runs
      on hosted runners without a private runtime or container daemon.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC5]
    checks:
      - check_type: command
        check_value: |
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 60 "https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/$(git rev-parse HEAD)/src/omnibase_core/nodes/node_validation_report_write_effect/runtime_validator_run.py" |
            grep -F "writer = container.get_service(NodeValidationReportWriteEffect)" > /dev/null'
        cwd: ${OMNI_HOME}/omnibase_core
