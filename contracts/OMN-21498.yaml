---
schema_version: "1.0.0"
ticket_id: OMN-21498
title: "T2.6: check-only pre-commit hooks in omnibase_core"
summary: Items of plan task T2.6 (validators-to-core and hardcoded-rules migration plan), omnibase_core
  slice. The pre-commit hooks that rewrote files check and refuse instead, and one core rule refuses a
  hook whose entry writes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21498-t26-check-only-hooks
    statement: T2.6 - no pre-commit hook of omnibase_core rewrites a file. Formatting, lint, end-of-file,
      tmp/ and the AI co-author trailer are checks that refuse, and one core rule refuses a new hook whose
      entry writes.
    acceptance:
      - id: AC1
        statement: 'AC1: No hook of omnibase_core rewrites a file or a commit message: each Appendix 1
          REWRITES FILES row of this repository is a check that refuses -- falsifier: pytest cases over
          the converted hook config and a git grep of the config for hooks whose entry writes'
      - id: AC2
        statement: 'AC2: A canary commit with an unformatted file and an AI co-author trailer is refused
          and the working tree is byte-identical after the hook run -- falsifier: pytest case that hashes
          the tree before and after the hook run, plus pre-commit run --files on the canary commit'
evidence_requirements:
  - kind: "tests"
    description: "The hook-writes, commit-hygiene and runtime tests and the canary pass at the head and
      fail at the merge base"
    command: "uv run pytest tests/unit/validation/test_validator_hook_writes.py tests/unit/validation/test_validator_commit_hygiene.py
      tests/unit/validation/test_handler_validator_run.py tests/ci/test_check_only_hooks_omn21498.py -q
      -o addopts=''"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21498-ac1-hook-writes-rule
