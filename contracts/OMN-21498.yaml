---
schema_version: "1.0.0"
ticket_id: OMN-21498
title: "T2.6: check-only pre-commit hooks in omnibase_core"
summary: Items of plan task T2.6 (validators-to-core and hardcoded-rules migration plan), omnibase_core
  slice. The pre-commit hooks that rewrote files check and refuse instead, and one core rule refuses a
  hook whose entry writes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21498-t26-check-only-hooks
    statement: T2.6 - no pre-commit hook of omnibase_core rewrites a file. Formatting, lint, end-of-file,
      tmp/ and the AI co-author trailer are checks that refuse, and one core rule refuses a new hook whose
      entry writes.
    acceptance:
      - id: AC1
        statement: 'AC1: No hook of omnibase_core rewrites a file or a commit message: each Appendix 1
          REWRITES FILES row of this repository is a check that refuses -- falsifier: pytest cases over
          the converted hook config and a git grep of the config for hooks whose entry writes'
      - id: AC2
        statement: 'AC2: A canary commit with an unformatted file and an AI co-author trailer is refused
          and the working tree is byte-identical after the hook run -- falsifier: pytest case that hashes
          the tree before and after the hook run, plus pre-commit run --files on the canary commit'
evidence_requirements:
  - kind: "tests"
    description: "The canary tests, the hook-writes handler tests and the CLI tests pass at the head and
      fail at the merge base"
    command: "uv run pytest tests/ci/test_check_only_hooks_omn21498.py tests/unit/handlers/test_handler_hook_writes.py
      tests/unit/handlers/test_handler_hook_writes_cli.py -q -o addopts=''"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21498-t26-ac1-canary
    description: Each rewriting hook is lifted out of the config and run through pre-commit on its canary;
      every one refuses, the tree digest is unchanged, and the clean control passes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_check_only_hooks_omn21498.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn21498-t26-ac2-hook-writes-rule
    description: The handler fails each writing entry shape and known rewriting id, passes the check-only
      forms and a temporary-directory writer, and the CLI refuses a missing overlay and zero hooks.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_hook_writes.py tests/unit/handlers/test_handler_hook_writes_cli.py
          -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn21498-t26-ac3-repo-has-no-writer
    description: The rule run over this repository's own hook files exits 0 and reports the hooks it read.
    source: manual
    checks:
      - check_type: command
        check_value: uv run python -m omnibase_core.handlers.handler_hook_writes_cli --root .
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
