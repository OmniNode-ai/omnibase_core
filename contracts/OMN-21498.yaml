      the check-only forms, and this repository's own hook files hold no writer.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_hook_writes.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_contract_omn21498_criteria.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run python -m omnibase_core.validation.validator_hook_writes .pre-commit-config.yaml
          .pre-commit-hooks.yaml
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: |
          bash -c '! grep -qE "^[[:space:]]+- id: AC[345]$" contracts/OMN-21498.yaml'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-ac2-canary
    description: Each converted hook runs through pre-commit on its canary; every one refuses, the whole
      canary (unformatted file, file without a final newline, staged tmp/ file, trailer) is refused, the
      tree digest is unchanged, and the clean control passes.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_check_only_hooks_omn21498.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21498-ac3-commit-hygiene
    description: The four commit_hygiene rules each yield exactly one issue on their planted fixture and
