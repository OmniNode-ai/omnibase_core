---
schema_version: "1.0.0"
ticket_id: OMN-21478
title: FSM executor evaluates every operator the condition model accepts
summary: The FSM executor evaluates greater_than, less_than, greater_than_or_equal, less_than_or_equal,
  min_length, max_length, exists and not_exists, so a guard written with one of them holds when its condition
  is true.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21478-fsm-operators
    statement: Every operator in ModelFSMTransitionCondition.VALID_OPERATORS has an evaluator in the FSM
      executor.
    acceptance:
      - id: AC1
        statement: 'AC1: Each of the eight operators evaluates true and false on a pair of contexts, or
          is refused when the contract is loaded -- falsifier: one pytest case per operator, parametrized
          from `VALID_OPERATORS` so a new operator without an evaluator fails'
      - id: AC2
        statement: 'AC2: The contracts that use these operators today still evaluate as their authors
          intended -- falsifier: the existing runtime contract tests pass, and a new case drives `node_graph_reducer`''s
          `registry_loaded` guard with a non-empty registry'
      - id: AC3
        statement: 'AC3: Configuration: a core library carries no deployment value; the operator set and
          the expression grammar are the model''s own constants -- falsifier: the one test per operator
          reads the operator list from `ModelFSMTransitionCondition.VALID_OPERATORS`, so adding an operator
          without an evaluator fails'
      - id: AC4
        statement: 'AC4: Bindings: a core library has no binding; the executor evaluates a context --
          falsifier: the same context gives the same transition in a direct call and through a reducer
          run by the local in-process entry of the parity harness (T-B2)'
  - id: req-omn21478-pin-currency
    statement: Sibling dev pins stay within the contract's staleness bounds, and dev merges update opted-in
      downstream dependency pins.
    acceptance:
      - id: AC5
        statement: A sibling dev pin beyond either the merge or timestamp bound is refused; missing tag
          inventories fail closed. The CLI enforces staleness by default and supports offline pre-commit
          checks with --no-staleness.
      - id: AC6
        statement: The dependency pin handler rewrites only the declared omnibase-core source tag for
          opted-in consumers. The publish workflow selects dependency mode for dev pushes, refreshes the
          lockfile, and exposes repo and mode to each matrix leg.
      - id: AC7
        statement: 'AC7: No consumer is opted in to the dependency pin bump, because a core-only bump
          cannot resolve in a consumer that also pins omnibase_infra by a dev merge tag -- omnibase_infra
          pins omnibase-core in its own [tool.uv.sources] and uv honours a git dependency''s sources,
          so a head whose core tag differs from the one its pinned omnibase_infra commit names carries
          two conflicting omnibase-core URLs and omnimarket''s Sibling Release Compatibility Gate (OMN-20381)
          refuses it -- falsifier: tests/unit/handlers/test_handler_dependency_pin_bump.py::test_real_manifest_dependency_opt_ins
          fails at the merge base, whose docs/downstream-repos.yaml opts omnimarket in'
evidence_requirements:
  - kind: tests
    description: One parametrized case per operator, the node_graph_reducer registry_loaded guard, and
      direct-call versus reducer parity.
    command: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py -q --no-cov
  - kind: ci
    description: Hosted-runner check that runs the same test file against the checkout; no live service
      is required.
    command: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21478-ac1-operators
    description: Each operator of VALID_OPERATORS holds on one context and fails on another.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py
          -q --no-cov -k "operator"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-ac2-runtime-contract
    description: The node_graph_reducer registry_loaded guard holds for a non-empty registry and fails
      for an empty one; the runtime contract tests pass.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py
          tests/unit/contracts/test_runtime_contracts.py -q --no-cov -k "registry_loaded or node_graph"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-ac3-operator-set
    description: The case table must equal ModelFSMTransitionCondition.VALID_OPERATORS, and the parser's
      set must equal it.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py
          -q --no-cov -k "cover_exactly or same_operators"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-ac4-reducer-parity
    description: A reducer run in process through the FSM mixin gives the direct call's transition for
      every operator.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py
          -q --no-cov -k "reducer_run"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-deploy-checkout-test
    description: Hosted-runner run of the test file at the checkout; needs no container daemon or private
      runtime.
    source: manual
    binds_ac: [AC1, AC2, AC3, AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/utils/test_fsm_executor_condition_operators.py
          -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-pin-currency-staleness
    description: A pinned sibling dev tag that trails the newest dev tag by more than the contract bound
      is refused, and a missing tag inventory fails closed.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref/test_first_party_ref_parameters.py
          tests/unit/validation/first_party_ref/test_runtime_first_party_ref.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-pin-currency-dependency-bump
    description: The dependency pin bump handler rewrites the omnibase-core tag for opted-in consumers
      and the publish workflow matrix exposes repo and mode to every leg.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dependency_pin_bump.py tests/unit/scripts/test_publish_downstream_pin_bump_workflow.py
          tests/ci/test_sibling_reads_pinned_omn20001.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-pin-currency-deploy-source
    description: Read the published handler sources at the checkout commit through the GitHub contents
      API. Fail if either staleness bound or the dependency tag rewrite is absent. This hosted-runner
      probe needs no container daemon or private runtime.
    source: manual
    binds_ac: [AC5, AC6]
    checks:
      - check_type: command
        check_value: |
          gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/validation/checker_first_party_ref.py?ref=$(git rev-parse HEAD)" --jq .content |
            base64 -d | grep -F 'merges > policy.max_trailing_merges' > /dev/null &&
          gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/validation/checker_first_party_ref.py?ref=$(git rev-parse HEAD)" --jq .content |
            base64 -d | grep -F '> timedelta(hours=policy.max_trailing_hours)' > /dev/null &&
          gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/nodes/node_dependency_pin_bump_effect/handler_dependency_pin_bump.py?ref=$(git rev-parse HEAD)" --jq .content |
            base64 -d | grep -F 'source["tag"] = dependency_tag' > /dev/null
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21478-ac7-no-dependency-opt-in
    description: The manifest opts no consumer in to the dependency pin bump, so dependency mode enumerates
      an empty matrix and no core-only bump PR is opened. Asserted by the manifest test and by parsing
      the manifest read at the head commit through the GitHub contents API, never a mutable working copy.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_dependency_pin_bump.py -q
          --no-cov -k "real_manifest_dependency_opt_ins"
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: |
          gh api "repos/OmniNode-ai/omnibase_core/contents/docs/downstream-repos.yaml?ref=$(git rev-parse HEAD)" --jq .content |
            base64 -d |
            python3 -c 'import sys,yaml; m=yaml.safe_load(sys.stdin); d=[r["name"] for r in m["repos"] if r.get("dependency_pin") is not None]; sys.exit(0 if d==[] else 1)'
        cwd: ${OMNI_HOME}/omnibase_core
