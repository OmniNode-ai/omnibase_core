---
schema_version: "1.0.0"
ticket_id: OMN-14355
title: The release workflow publishes a tag whose release PR body carries an Evidence-Ticket and no Evidence-Source
summary: The Resolve release ticket + evidence step in release.yml requires only the Evidence-Ticket of
  the release's merged PR. An absent Evidence-Source is passed on empty, a present one still flows to
  the dependency cascade, and the cascade's evidence_source input is optional and validated only when
  non-empty. v0.47.43 was tagged and then refused by this step before the build, so it never reached PyPI
  (release run 38485202286).
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn14355
    statement: A release tag whose merged release PR names an Evidence-Ticket reaches the publish step
      without an Evidence-Source line.
    acceptance:
      - id: AC1
        statement: 'AC1: the resolve step, run under bash against a release PR body with an Evidence-Ticket
          and no Evidence-Source, exits 0 with ticket=OMN-18595 and an empty evidence_source. -- falsifier:
          uv run pytest tests/unit/validation/test_release_workflow_shape.py -n 0 --no-cov -q -k test_release_evidence_resolves_with_a_ticket_and_no_evidence_source'
      - id: AC2
        statement: 'AC2: a present Evidence-Source still flows through, and a missing Evidence-Ticket
          still fails the step. -- falsifier: uv run pytest tests/unit/validation/test_release_workflow_shape.py
          -n 0 --no-cov -q -k "test_release_evidence_still_threads_an_evidence_source_when_present or
          test_release_evidence_still_requires_a_ticket"'
      - id: AC3
        statement: 'AC3: the dependency cascade accepts an empty evidence_source on both triggers. --
          falsifier: uv run pytest tests/scripts/test_dependency_cascade_matrix.py -n 0 --no-cov -q -k
          test_workflow_call_requires_ticket_and_evidence_source_is_optional'
evidence_requirements:
  - kind: tests
    description: The resolve step releases a ticket-only release PR body.
    command: uv run pytest tests/unit/validation/test_release_workflow_shape.py -n 0 --no-cov -q -k test_release_evidence_resolves_with_a_ticket_and_no_evidence_source
  - kind: tests
    description: The resolve step keeps the ticket requirement and the present-source path.
    command: uv run pytest tests/unit/validation/test_release_workflow_shape.py -n 0 --no-cov -q -k "test_release_evidence_still_threads_an_evidence_source_when_present
      or test_release_evidence_still_requires_a_ticket"
  - kind: tests
    description: The cascade workflow takes an empty evidence_source.
    command: uv run pytest tests/scripts/test_dependency_cascade_matrix.py -n 0 --no-cov -q -k test_workflow_call_requires_ticket_and_evidence_source_is_optional
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-14355-ac1
    description: The resolve step releases a ticket-only release PR body.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_release_workflow_shape.py -n 0 --no-cov
          -q -k test_release_evidence_resolves_with_a_ticket_and_no_evidence_source
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn-14355-ac2
    description: The resolve step keeps the ticket requirement and the present-source path.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_release_workflow_shape.py -n 0 --no-cov
          -q -k "test_release_evidence_still_threads_an_evidence_source_when_present or test_release_evidence_still_requires_a_ticket"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn-14355-ac3
    description: The cascade workflow takes an empty evidence_source.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_dependency_cascade_matrix.py -n 0 --no-cov -q -k
          test_workflow_call_requires_ticket_and_evidence_source_is_optional
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
