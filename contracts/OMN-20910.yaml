schema_version: "1.0.0"
ticket_id: OMN-20910
title: Review-voter models are declared in a contract overlay, not repo variables or workflow files
summary: The hardcoded-model-config policy classes the contract overlay tree (config/onex/overlays/ at
  the repository root) as OVERLAY, the sanctioned home of model ids, endpoints and lab facts, so a review-voter
  endpoint declared in its overlay is not a finding. The class refuses retired values only; the same lines
  in any shipped file stay refused, and a look-alike tree deeper down is source.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20910-overlay-path-class
    statement: The contract overlay tree is not source to the hardcoded-model-config guard; every other
      class keeps its families.
    acceptance:
      - id: AC1
        statement: "AC1: a path under config/onex/overlays/ classes OVERLAY, which refuses family R only,
          and a look-alike path elsewhere classes SOURCE -- falsifier: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_config.py
          -q -k 'classify_path or every_scanned_class' in omnibase_core"
      - id: AC2
        statement: "AC2: an endpoint on the lab subnet and a model id pass in an overlay and are E, E-LAN
          and M findings in a shipped source file, both in the pure scan and in the ratchet runner; a
          retired value in an overlay is still an R finding -- falsifier: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_config.py
          -q -k overlay in omnibase_core"
evidence_requirements:
  - kind: tests
    description: Corpus, policy-shape, overlay-class and ratchet tests of the guard.
    command: uv run pytest tests/unit/validation/hardcoded_model_config -q
emergency_bypass:
