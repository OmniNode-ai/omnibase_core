---
schema_version: "1.0.0"
ticket_id: OMN-20962
title: omnibase_core's boundary-validation job calls omnibase_core's validate-boundaries action, not onex_change_control's
summary: The boundary-validation job in ci.yml (check-run context "Cross-repo boundary validation") changes
  only its uses line, from the onex_change_control validate-boundaries action to omnibase_core's copy
  at merge de3398d1fcf7a6f48451f680b74b1a6c6c383b8a. Job id, job name, context and the inputs (checks
  boundary-parity, warn-only false) are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20962
    statement: omnibase_core's ci.yml must call omnibase_core's validate-boundaries action at de3398d1fcf7a6f48451f680b74b1a6c6c383b8a
      and no workflow may call the onex_change_control copy, with the job, its name and its required context
      unchanged.
    acceptance:
      - id: AC1
        statement: "AC1: omnibase_core .github/workflows/ci.yml job boundary-validation has uses OmniNode-ai/omnibase_core/.github/actions/validate-boundaries@de3398d1fcf7a6f48451f680b74b1a6c6c383b8a
          and no workflow references the onex_change_control validate-boundaries action, with its inputs
          and the context name unchanged. -- falsifier: uv run pytest tests/ci/test_validate_boundaries_caller_omn20962.py
          -q -p no:randomly"
      - id: AC2
        statement: "AC2: omnibase_core's boundary-parity and migration-conflicts handlers exit 0 on a
          clean fixture and nonzero on an injected undeclared topic or conflicting migration. -- falsifier:
          cd omnibase_core && uv run pytest tests/unit/handlers/test_handler_boundary_parity.py tests/unit/handlers/test_handler_migration_conflicts.py
          -q -p no:randomly"
evidence_requirements:
  - kind: tests
    description: "omnibase_core ci.yml calls omnibase_core's action at the merge sha, with a positive
      control that the retired reference is detected."
    command: "uv run pytest tests/ci/test_validate_boundaries_caller_omn20962.py -q -p no:randomly"
  - kind: tests
    description: "The core handlers the action runs pass a clean fixture and fail a drifted one, and the
      action the job now calls is the one that runs them."
    command: "cd omnibase_core && uv run pytest tests/unit/handlers/test_handler_boundary_parity.py tests/unit/handlers/test_handler_migration_conflicts.py
      tests/ci/test_validate_boundaries_caller_omn20962.py::test_the_called_action_runs_core_handlers_that_fail_a_drifted_fixture
      -q -p no:randomly"
emergency_bypass:
