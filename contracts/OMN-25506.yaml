ticket_id: OMN-25506
title: "Shared red dependency-pins / Dependency Pins (omnibase_infra): the expired hook-rev exemption
  is extended one week at its source"
summary: "dependency_pin_policy.yaml holds one dated exemption, the omnibase_infra check-public-runner-placement
  hook pin 1c9566e2c249, which expired after 2026-11-16 and turned dependency-pins red on omnibase_infra
  pull requests. Under RULING 2026-11-18T01:29:21Z (extend the exemption for one week) the entry's last
  day moves to 2026-11-24, the latest day whose end is no later than the operator's expiry 2026-11-25T01:29Z.
  The entry keeps RULING 2026-11-09T01:57:48Z as its origin and the ticket OMN-22867. No second entry,
  no baseline, no new field, no change to hook_rev_max_releases_behind."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn25506-extend-exemption
    statement: "The one hook-rev exemption admits its revision through 2026-11-24 and refuses it from
      2026-11-25."
    acceptance:
      - id: AC1
        statement: "AC1: the shared cause is named from the failure text read on three omnibase_infra
          pull requests (jobs 134268823747, 134345268620, 134226570726) and recorded in the ledger STATUS
          rows of lanes cause4-2049 and pins-0015 -- falsifier: the ledger holds no STATUS row naming
          the cause with job ids and quotes for three PRs"
      - id: AC2
        statement: "AC2: one pull request on the omnibase_core default branch extends the exemption at
          its source with a test that fails on the unfixed policy and passes on the fix -- falsifier:
          `uv run pytest tests/unit/validation/dependency_pins/test_hook_rev_exemption.py -q` passes at
          the unfixed base commit"
      - id: AC3
        statement: "AC3: the change widens or bypasses no check, so the diff removes no assertion and
          adds no skip, xfail, loosened threshold or changed required-check list -- falsifier: `git diff
          origin/dev HEAD -- tests/ .github/` shows a removed assert, a new skip or xfail marker or a
          changed required-check list"
      - id: AC4
        statement: "AC4: the PR body carries a Lab line and the lane TERMINAL names the head -- falsifier:
          the PR body carries no line starting `Lab:`"
