    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/models/dashboard -k view_kind -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
