---
schema_version: "1.0.0"
ticket_id: OMN-17870
title: Werror teardown no longer leaks an unclosed event loop and AF_UNIX sockets
summary: Under PYTHONWARNINGS=error the teardown of the service-resolution regression failed with two
  unclosed AF_UNIX socket warnings and one unclosed event loop warning. The owner is pytest-asyncio below
  1.4, which creates an implicit event loop while installing its temporary loop policy and never closes
  it. The fix raises the pytest-asyncio constraint to >=1.4,<2 (locked at 1.4.0) and adds a behavioral
  Werror regression that runs a fresh pytest process. No warning filter is added.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17870-werror-teardown
    statement: An async test followed by a sync asyncio.run test tears down with no unraisable warnings
      under PYTHONWARNINGS=error, and the project pins the pytest-asyncio release that closes the loop.
    acceptance:
      - id: AC1
        statement: "AC1: a fresh pytest process under PYTHONWARNINGS=error that runs an async test, then
          a sync asyncio.run test, each followed by gc.collect(), exits 0 with no unclosed socket or event
          loop warning -- falsifier: the same test fails on pytest-asyncio 1.3.0"
      - id: AC2
        statement: "AC2: the testing and full extras and the dev group constrain pytest-asyncio to >=1.4,<2
          and uv.lock resolves it to 1.4.0 or later -- falsifier: any of the three constraints or the
          lock still allows 1.3.x"
      - id: AC3
        statement: "AC3: no warning filter, Werror setting or conftest hook is loosened to pass -- falsifier:
          the diff adds an ignore for ResourceWarning or PytestUnraisableExceptionWarning"
evidence_requirements:
  - kind: tests
    description: Run the Werror event loop teardown regression.
    command: uv run pytest tests/unit/models/container/test_werror_event_loop_teardown.py -q --no-cov
  - kind: ci
    description: Hosted-runner deploy check. The regression runs its own fresh pytest process and needs
      no lab service.
    command: uv run pytest tests/unit/models/container/test_werror_event_loop_teardown.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn17870-ac1-werror-regression
    description: The fresh-process Werror regression passes with pytest-asyncio 1.4.0 locked.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/container/test_werror_event_loop_teardown.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1]
  - id: dod-omn17870-ac2-constraint-and-lock
    description: Every pytest-asyncio constraint in pyproject.toml reads >=1.4,<2 and the lock holds 1.4.0.
    source: manual
    checks:
      - check_type: command
        check_value: test "$(grep -c 'pytest-asyncio>=1.4,<2' pyproject.toml)" = 3 && grep -A1 'name =
          "pytest-asyncio"' uv.lock | grep -q 'version = "1.4'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC2]
  - id: dod-omn17870-ac3-no-suppression
    description: The diff adds no ignore of ResourceWarning or PytestUnraisableExceptionWarning to the
      pytest configuration.
    source: manual
    checks:
      - check_type: command
        check_value: "! grep -n 'ignore.*ResourceWarning\\|ignore.*PytestUnraisableExceptionWarning' pyproject.toml
          tests/pytest.ini"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC3]
  - id: dod-omn17870-deploy-hosted-readback
    description: Hosted deploy probe. The regression starts a fresh pytest process under Werror, the way
      the failing run was observed, and asserts a clean exit.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/models/container/test_werror_event_loop_teardown.py -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
