---
schema_version: 1.0.0
ticket_id: OMN-23527
title: Merge checks that fetch their checker report GitHub rate limits as such and retry
summary: The imperative contract guard reusable workflow named a validator ref that evaluated empty, so
  every run made a default-branch lookup with the installation token and a GitHub rate limit left the
  required check red with the guard never run. The workflow now resolves an explicit 40-hex pin from the
  job workflow sha (refusing an empty ref), fetches the validator in a step that retries a rate limit
  or 5xx with backoff, names a still-refused fetch in the job summary, and fails a real violation exactly
  as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23527-rate-limit
    statement: A GitHub rate limit or server error on the checker's input fetch is retried and named,
      never read as a finding about the code, and never makes the check pass.
    acceptance:
      - id: AC1
        statement: 'AC1: the imperative contract guard workflow fetches its validator at an explicit ref
          resolved from job.workflow_sha, refuses an empty or non-40-hex ref, and no longer uses the empty
          github.job_workflow_sha spelling -- falsifier: uv run pytest tests/ci/test_imperative_contract_guard_fetch_retry_omn23527.py
          -q fails on the workflow as origin/dev holds it'
      - id: AC2
        statement: 'AC2: a faked rate-limit or 503 answer is retried the declared number of times with
          backoff and then fails the job with a job-summary line saying the guard did not run, a non-rate-limit
          failure fails at once without a retry, and a faked guard violation still fails the guard step
          -- falsifier: the same file at the merge base fails 14 of its 18 tests'
evidence_requirements:
  - kind: tests
    description: The focused workflow tests, each driving the step's own script with a faked rate-limit
      answer, a faked server error, a non-rate-limit failure and a faked real violation, with the pre-image
      failing control.
    command: uv run pytest tests/ci/test_imperative_contract_guard_fetch_retry_omn23527.py tests/ci/test_imperative_contract_guard_workflow_omn20918.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23527-tests
    description: The focused tests pass on the branch and fail on the workflow as origin/dev holds it.
    source: manual
    binds_ac:
      - AC1
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_imperative_contract_guard_fetch_retry_omn23527.py tests/ci/test_imperative_contract_guard_workflow_omn20918.py
          -q
  - id: dod-omn23527-integration-proof
    description: Run the focused tests on a lab host at the pushed head. Hosted CI cannot reach the lab,
      so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_core
          --sha "$(git rev-parse HEAD)" --lane dod-integration-proof-23527 --kind test -- env PYTHONDONTWRITEBYTECODE=1
          uv run --frozen pytest tests/ci/test_imperative_contract_guard_fetch_retry_omn23527.py tests/ci/test_imperative_contract_guard_workflow_omn20918.py
          -q --no-cov
