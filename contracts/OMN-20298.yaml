---
schema_version: "1.0.0"
ticket_id: OMN-20298
title: The canonical handler-shape ratchet gains a flip path for a node with no legacy handler
summary: A baselined node that never had a handler flips canonical with an adequacy receipt that records
  legacy_handler none (adequacy_receipt.no_legacy.v1). The gate re-derives from git that no handler existed
  at the receipt's base_ref and at the live merge base, byte-compares the recorded node file listing with
  git ls-tree at base_ref, re-hashes the new handler module and executes the new handler's own contract
  tests green on HEAD. A node that had a handler cannot take the path; its byte-identical or replay proof
  is unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20298-no-legacy
    statement: A node with no legacy handler can flip canonical on re-derived evidence, and a node that
      had a handler still needs the equivalence-replay or hand-flip proof.
    acceptance:
      - id: AC1
        statement: 'AC1: a no-legacy-handler flip with a valid receipt passes the ratchet. -- falsifier:
          uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k test_no_legacy_flip_with_valid_receipt_passes'
      - id: AC2
        statement: 'AC2: the same flip without the receipt fails and the failure names the no-legacy receipt
          shape. -- falsifier: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q
          -n 0 -k test_no_legacy_flip_without_receipt_fails'
      - id: AC3
        statement: 'AC3: a node that had a handler at the merge base cannot use the no-legacy path, and
          an older handler-less commit cannot be cited past a live handler. -- falsifier: uv run pytest
          tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k "test_node_that_had_a_handler_cannot_use_no_legacy_path
          or test_old_handlerless_commit_cannot_be_cited_past_a_live_handler"'
      - id: AC4
        statement: 'AC4: the existing ratchet and flip-bundle tests pass. -- falsifier: uv run pytest
          tests/unit/validation/test_checker_handler_shape.py tests/unit/scripts/ci/test_verify_flip_bundle.py
          -q -n 0'
evidence_requirements:
  - kind: tests
    description: A no-legacy flip with a valid receipt is a proven flip.
    command: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k test_no_legacy_flip_with_valid_receipt_passes
  - kind: tests
    description: The same flip without a receipt is an unproven flip.
    command: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k test_no_legacy_flip_without_receipt_fails
  - kind: tests
    description: A node that had a handler is refused the no-legacy path.
    command: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k "test_node_that_had_a_handler_cannot_use_no_legacy_path
      or test_old_handlerless_commit_cannot_be_cited_past_a_live_handler"
  - kind: tests
    description: The existing ratchet and flip-bundle tests pass.
    command: uv run pytest tests/unit/validation/test_checker_handler_shape.py tests/unit/scripts/ci/test_verify_flip_bundle.py
      -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-20298-ac1
    description: A no-legacy flip with a valid receipt is a proven flip.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k test_no_legacy_flip_with_valid_receipt_passes
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
