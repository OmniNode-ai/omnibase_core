  - id: dod-omn-20298-ac2
    description: The same flip without a receipt is an unproven flip.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k test_no_legacy_flip_without_receipt_fails
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn-20298-ac3
    description: A node that had a handler is refused the no-legacy path.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_flip_no_legacy.py -q -n 0 -k "test_node_that_had_a_handler_cannot_use_no_legacy_path
          or test_old_handlerless_commit_cannot_be_cited_past_a_live_handler"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
