  - id: dod-omn-20298-ac4
    description: The existing ratchet and flip-bundle tests pass.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_shape.py tests/unit/scripts/ci/test_verify_flip_bundle.py
          -q -n 0
        cwd: ${OMNI_HOME}/omnibase_core
