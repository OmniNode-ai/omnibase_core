---
schema_version: "1.0.0"
ticket_id: OMN-20074
title: In caller evidence mode the shared receipt gate's verify job reports a success no-op, never skipped
summary: With evidence-source caller, shadow or not, verify has no job-level condition and runs as a reported
  success no-op. The bot_exempt step writes exempt=true and emits one notice with the reason before reading
  the pull request; every later step is gated on the exemption. Shadow governs only dod-verify. With compare-with-occ
  true, a missing PR-head contract names its home in another repository for the OCC difference without
  changing the head step's refusal.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20074
    statement: The shared receipt gate's verify job must report a success no-op, since caller evidence
      is the only mode, rather than a skipped check-run.
    acceptance:
      - id: AC1
        statement: 'AC1: verify has no job-level condition and runs exactly one step, which exits 0 and
          emits exactly one notice with the no-op reason without reading the pull request. -- falsifier:
          uv run pytest tests/ci/test_receipt_gate_caller_verify_noop_omn20074.py -q -k test_enforcing_caller_mode_verify_runs_as_a_success_noop_with_one_line_reason'
  - id: req-omn20074-contract-home
    statement: When the PR head lacks its cited contract, the head step refuses with the original error,
      notice and exit 1 and probes no other repository; the comparison it once fed is removed.
    acceptance:
      - id: AC2
        statement: 'AC2: the missing-contract path prints the original error and notice, exits 1, calls
          no GitHub API and carries no contract-home or comparison environment. -- falsifier: uv run pytest
          tests/ci/test_receipt_gate_contract_home_omn20074.py -q -p no:randomly'
