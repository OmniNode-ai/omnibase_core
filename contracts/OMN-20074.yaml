requirements:
  - id: req-omn20074
    statement: The shared receipt gate's verify job must report a success no-op in caller evidence mode,
      including enforcing mode, rather than a skipped check-run.
    acceptance:
      - id: AC1
        statement: 'AC1: verify has no job-level condition, and in enforcing caller mode its bot_exempt
          step exits 0, writes only exempt=true and emits exactly one notice with the no-op reason before
