          clone failures remain degraded failures -- falsifier: uv run pytest tests/ci/test_validate_boundaries_peer_closure_omn20074.py
          -q --no-cov -p no:randomly'
  - id: req-omn20074-contract-id-uniqueness
    statement: The ticket contract must identify each requirement, acceptance criterion and evidence item
      uniquely, and every evidence binding must name a declared criterion.
    acceptance:
      - id: AC51
        statement: 'AC51: requirement, acceptance and evidence IDs are unique, and every binds_ac value
          names a declared criterion -- falsifier: uv run pytest tests/ci/test_ticket_contract_ids_unique_omn20074.py
          -q --no-cov -p no:randomly'
  - id: req-omn20074-s12-unused-validators
    statement: omnibase_core must not carry the change-control validators and CLIs no workflow calls;
      the Evidence-Commit binding validator and its CLI and the receipt-gate CLI go together, while the
      receipt-gate library and the OCC merge-eligibility validator stay because omnibase_infra, omnimarket
      and omniclaude import them.
    acceptance:
      - id: AC49
        statement: 'AC49: validator_evidence_commit_binding.py, its CLI and validator_receipt_gate_cli.py
          are absent from the tree, the canonical-file-shape baseline, the ruff per-file ignores and the
          ai-slop scope fixture, while validator_receipt_gate.py and validator_occ_merge_eligibility.py
          are present -- falsifier: uv run pytest tests/ci/test_occ_unused_validators_deleted_omn20074.py
          -q -p no:randomly fails at the merge base'
  - id: req-omn20074-boundary-clone-check-pin-pair
    statement: The workflow shape check must audit the boundary action revision together with its exact
      repository list, retaining every required peer for each reviewed revision.
    acceptance:
      - id: AC55
        statement: 'AC55: the workflow shape check accepts the reviewed #1942 action with eight repositories
          and the reviewed #1972 action with seven repositories; missing peers, mismatched lists, unknown
          actions and duplicate peers fail -- falsifier: uv run pytest tests/unit/validation/test_ci_workflow_shape.py
          -q --no-cov -o addopts= -p no:randomly -k boundary_repo_contract'
  - id: req-omn20074-core-residual-callers
    statement: omnibase_core's boundary-validation job must not clone onex_change_control, and the main
      target guard must not admit a pull request on a change-control promotion receipt; main is moved
      only by the release workflow's fast-forward.
    acceptance:
      - id: AC52
        statement: 'AC52: the boundary-validation job pins validate-boundaries at the omnibase_core#1972
          merge and its repos input names no onex_change_control repository -- falsifier: uv run pytest
          tests/ci/test_validate_boundaries_caller_omn20962.py -q --no-cov -p no:randomly fails at the
          merge base'
      - id: AC53
        statement: 'AC53: main-target-guard refuses every pull request onto main, a dev or promotion/*
          head carrying a promotion-receipt line included, and reads no change-control receipt, while
          a pull request onto dev is admitted -- falsifier: uv run pytest tests/ci/test_main_target_guard_prepush_omn20780.py
          -q --no-cov -p no:randomly fails at the merge base'
      - id: AC54
        statement: 'AC54: the doc-content scan exempts OMN ticket references under contracts/ only, so
          a ticket reference under an onex_change_control/ path is flagged and the local-environment rules
          still apply under contracts/ -- falsifier: uv run pytest tests/unit/validation/doc_content_scan/test_handler_doc_content_scan_compute.py
          -q --no-cov -p no:randomly fails at the merge base'
  - id: req-omn20074-receipt-gate-private-fork
    statement: The receipt gate never places a private caller's run on a GitHub-hosted label, fork pull
      requests included, and a public caller keeps ubuntu-latest (operator rule 2026-10-19, the OMN-21216
      shape).
    acceptance:
      - id: AC56
        statement: 'AC56: verify and dod-verify carry no OMNI_PUBLIC_PR_RUNS_ON_JSON arm and resolve a
          private caller to fromJSON(vars.OMNI_TRUSTED_CI_RUNS_ON_JSON) with no literal default and a
          public caller to ubuntu-latest -- falsifier: uv run pytest tests/ci/test_receipt_gate_untrusted_test_omn18205.py
          tests/ci/test_receipt_gate_caller_evidence_omn20070.py -q --no-cov -p no:randomly fails at the
          merge base'
  - id: req-omn20074-main-push-summary-reds
    statement: A release push to main must not turn the landing branch red through CI Summary or Publish
      summary when every gating job and every downstream bump leg succeeded; an unread run index or a
      leg conclusion the jobs API has not yet filled holds the verdict pending instead of failing it.
    acceptance:
      - id: AC57
        statement: 'AC57: the CI Summary layer-5 sweep holds a non-success row whose Actions run id is
          absent from the actions/runs index provisional (PENDING), while an App row or an unparseable
          URL still fails and a pull_request-event row still fails -- falsifier: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py
          -q --no-cov -p no:randomly -k "unread or unusable_or_missing_index or unresolved_events" fails
          at the merge base'
      - id: AC58
        statement: 'AC58: Publish summary re-reads the run''s jobs while a Bump leg is not completed or
          has a null conclusion, bounded by SETTLE_ATTEMPTS, then fails on any leg that did not succeed
          or skip -- falsifier: uv run pytest tests/unit/scripts/test_publish_downstream_pin_bump_workflow.py
          -q --no-cov -p no:randomly -k settles_leg_conclusions fails at the merge base'
  - id: req-omn20074-runs-on-one-line
    statement: Every runs-on under .github/workflows and .github/actions is written on one line, so the
      omninode_infra private-repo-runner-placement gate pinned at 9d4b381d can parse receipt-gate.yml,
      with every runs-on value unchanged.
    acceptance:
      - id: AC59
        statement: 'AC59: the workflow and action scan rejects folded or missing inline runs-on values,
          finds at least two one-line private/public receipt-gate runner expressions, and detects a folded
          negative control -- falsifier: uv run pytest tests/ci/test_workflow_runs_on_single_line_omn20074.py
          -q --no-cov -p no:randomly fails at the merge base'
