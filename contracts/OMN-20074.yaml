---
schema_version: "1.0.0"
ticket_id: OMN-20074
title: In caller evidence mode the shared receipt gate's verify job reports a success no-op, never skipped
summary: With evidence-source caller, shadow or not, verify has no job-level condition and runs as a reported
  success no-op. The bot_exempt step writes exempt=true and emits one notice with the reason before reading
  the pull request; every later step is gated on the exemption. Shadow governs only dod-verify. With compare-with-occ
  true, a missing PR-head contract names its home in another repository for the OCC difference without
  changing the head step's refusal.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20074
    statement: The shared receipt gate's verify job must report a success no-op in caller evidence mode,
      including enforcing mode, rather than a skipped check-run.
    acceptance:
      - id: AC1
        statement: 'AC1: verify has no job-level condition, and in enforcing caller mode its bot_exempt
          step exits 0, writes only exempt=true and emits exactly one notice with the no-op reason before
          reading the pull request. -- falsifier: uv run pytest tests/ci/test_receipt_gate_caller_verify_noop_omn20074.py
          -q -k test_enforcing_caller_mode_verify_runs_as_a_success_noop_with_one_line_reason'
  - id: req-omn20074-contract-home
    statement: When compare-with-occ is true and the PR head lacks its cited contract, probe other product
      repositories before onex_change_control and write the first home for contract_in_another_repo classification,
      preserving the original error, notice and exit 1.
    acceptance:
      - id: AC2
        statement: 'AC2: the missing-contract path writes the first available home, prioritizes product
          repositories over OCC, skips the caller, writes nothing when absent, and never probes with compare-with-occ
          false; occ-difference still reads the same dod directory. -- falsifier: uv run pytest tests/ci/test_receipt_gate_contract_home_omn20074.py
          -q -p no:randomly'
  - id: req-omn20074-caller-repin
    statement: The Repo Evidence Gate caller must pin the contract-home reusable and its matching verifier
      release while keeping the S5 shadow comparison enabled.
    acceptance:
      - id: AC3
        statement: 'AC3: the Repo Evidence Gate caller pins receipt-gate.yml at omnibase_core#1914''s
          squash commit, which carries #1912''s contract-home reusable, and verifier-version at or above
          omnimarket v0.4.305, keeping compare-with-occ "true". -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py
          -q'
  - id: req-omn20074-writer-release-cut
    statement: The dod-verify writer_pin_only step must derive the OCC writer-app release-cut exemption
      from the head's git diff against its merge base and fail closed for every other release shape.
    acceptance:
      - id: AC4
        statement: 'AC4: for an OCC writer-app pull request, the dod-verify writer_pin_only step derives
          exempt=true for a release cut (root CHANGELOG.md additions only whose single new "## v<version>
          (<date>)" heading equals the head project.version, optionally with pin-only pyproject.toml/uv.lock)
          and exempt=false for any other path, a rewritten or deleted changelog line, a heading/version
          mismatch or an already-released version. -- falsifier: uv run pytest tests/ci/test_receipt_gate_writer_release_cut_omn20074.py
          -q'
  - id: req-omn20074-writer-workflow-pin
    statement: The dod-verify writer_pin_only step must derive the OCC writer-app exemption for a workflow-only
      diff that moves only the omnibase_core checkout pin, using the pinned verifier's classify_workflow_core_pin_only
      over head and base git blobs, and fail closed for every other workflow diff.
    acceptance:
      - id: AC5
        statement: 'AC5: for an OCC writer-app pull request whose whole diff is workflow files moving
          only the omnibase_core checkout pin, the dod-verify writer_pin_only step derives exempt=true
          from git objects through classify_workflow_core_pin_only, and derives exempt=false for a diff
          with any non-workflow path, a workflow change outside the pin, an added or deleted workflow,
          or a verifier without the classifier. -- falsifier: uv run pytest tests/ci/test_receipt_gate_writer_workflow_pin_omn20074.py
          -q -p no:randomly'
  - id: req-omn20074-writer-plugin-version
    statement: The dod-verify writer_pin_only step must derive the OCC writer-app exemption for a diff
      of .claude-plugin manifests alone through the pinned verifier's classify_plugin_manifest_version_only
      over head and base git blobs, and fail closed for every other plugin manifest diff.
    acceptance:
      - id: AC6
        statement: 'AC6: for an OCC writer-app pull request whose whole diff is .claude-plugin plugin.json
          and marketplace.json files, the dod-verify writer_pin_only step derives exempt=true from git
          objects through classify_plugin_manifest_version_only, and derives exempt=false for an edit
          outside the version keys, an added or deleted manifest, a mixed diff that never reaches the
          classifier, and a verifier without the classifier -- falsifier: uv run pytest tests/ci/test_receipt_gate_writer_plugin_version_omn20074.py
          -q fails at the merge base'
  - id: req-omn20074-topic-hook-handler
    statement: The no-hardcoded-topics decisions of the pinned onex_change_control hook must be reproduced
      by an omnibase_core handler, so the hook leaves the onex_change_control repository without a change
      in what any fleet file is flagged for.
    acceptance:
      - id: AC7
        statement: 'AC7: HandlerNoHardcodedTopics reproduces the check-hardcoded-topics decisions of onex_change_control
          rev 8d7e85bc00e7 on verbatim fleet files, flagging a quoted onex.evt. or onex.cmd. literal and
          skipping comment lines, docstring lines, block comments, test files, wire_schemas contracts
          and the twelve approved basenames, with the hook''s output lines byte for byte -- falsifier:
          uv run pytest tests/unit/handlers/test_handler_no_hardcoded_topics.py -q -p no:randomly fails
          at the merge base'
  - id: req-omn20074-topic-hook-export
    statement: omnibase_core must export the handler as pre-commit hook id no-hardcoded-topics and run
      it locally in place of the onex_change_control block, keeping the exclude unchanged.
    acceptance:
      - id: AC8
        statement: 'AC8: .pre-commit-hooks.yaml exports id no-hardcoded-topics running the handler module
          with types python, yaml, ts and javascript, and .pre-commit-config.yaml runs it as one local
          hook carrying the 13-path exclude unchanged with no onex_change_control hook of that id -- falsifier:
          uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py -q -p no:randomly fails at the
          merge base'
  - id: req-omn20074-s6-folds
    statement: Verification gates whose only enforcing context was an embedded occ-preflight must run
      in ci.yml, where the required CI Summary poller fails on them, with no new required context, annotation,
      allowlist or baseline entry.
    acceptance:
      - id: AC9
        statement: 'AC9: cr-thread-gate-caller.yml is deleted and ci.yml carries an unconditional, needs-free
          `gate` caller of cr-thread-gate.yml whose composed context "gate / CodeRabbit Thread Check"
          is unchanged and whose required-checks row names ci.yml. -- falsifier: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py
          -q -p no:randomly -k cr_thread_gate'
      - id: AC10
        statement: 'AC10: handshake-policy-gate.yml no longer triggers on merge_group and keeps its schedule,
          dispatch and workflow_call triggers with no embedded preflight, and ci.yml carries a handshake-policy-gate
          caller that runs on merge_group only with the original permissions and inherited secrets. --
          falsifier: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k handshake_policy_gate'
      - id: AC11
        statement: 'AC11: propagate-config.yml no longer carries dry-run-ci-check, and ci.yml carries
          an unconditional propagate-dry-run job with the original steps and token scope whose in-run
          path detection matches exactly the five propagate-config.yml path-filter entries on pull_request
          and push, runs on workflow_dispatch, skips merge_group and schedule, and fails open when no
          diff can be computed. -- falsifier: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q
          -p no:randomly -k "dry_run or detection"'
      - id: AC12
        statement: 'AC12: CI Summary registers the gate caller and the dry-run in both its completeness
          anchor and its strict set, does not anchor or allowlist the merge_group-only caller, and fails
          when any of the three folded jobs fails, is skipped (anchored two) or is absent (anchored two).
          -- falsifier: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k "anchored
          or folded_gate or baseline_run or soft_allowlist or jobs_api"'
  - id: req-omn20074-binds-ac-occ-parity
    statement: ModelTicketContract must refuse the two dod_evidence shapes that onex_change_control validate-yaml
      refuses and core admitted, with OCC's semantics, so a product repo can validate its contracts without
      OCC.
    acceptance:
      - id: AC13
        statement: 'AC13: ModelTicketContract refuses a dod_evidence item that declares binds_ac with
          an entry that is not a bare criterion label (for example "AC1 -- the gate is wired"), naming
          the item id and the DOD_EVIDENCE_BINDS_AC_LABEL rule, and still admits AC1, ac-1, DoD2 and the
          other label forms -- falsifier: uv run pytest tests/unit/models/ticket/test_model_ticket_contract_binds_ac_rules.py
          -q -k TestBindsAcLabelRule fails at the merge base'
      - id: AC14
        statement: 'AC14: ModelTicketContract refuses a dod_evidence item that declares binds_ac with
          a check type outside OCC''s eight (command_exit_0, rendered_output, runtime_sha_match, disposition),
          naming the item id and the DOD_EVIDENCE_BINDS_AC_CHECK_TYPE rule, and still admits command_exit_0
          on an item without binds_ac -- falsifier: uv run pytest tests/unit/models/ticket/test_model_ticket_contract_binds_ac_rules.py
          -q -k TestBindsAcCheckTypeRule fails at the merge base'
  - id: req-omn20074-cosmetic-hook-handler
    statement: The cosmetic-lint decisions of the pinned onex_change_control hook must be reproduced by
      an omnibase_core handler over the spec carried byte for byte, so the hook leaves the onex_change_control
      repository without a change in what any fleet repository is reported for.
    acceptance:
      - id: AC15
        statement: 'AC15: HandlerCosmeticLint reproduces the `cosmetic-lint check` output lines and exit
          status of onex_change_control rev 8d7e85bc00e7 for each of its five check classes (spdx, pyproject,
          precommit, readme, github) on trees built from verbatim omnibase_spi files and from constructed
          files, with a pass case, a fail case and an all-classes positive control, and the packaged spec
          has the sha256 of the pinned spec.yaml -- falsifier: uv run pytest tests/unit/handlers/test_handler_cosmetic_lint.py
          -q -p no:randomly fails at the merge base'
  - id: req-omn20074-cosmetic-hook-export
    statement: omnibase_core must export the handler as pre-commit hook id cosmetic-lint with the keys
      of the onex_change_control export, so a consumer changes only repo and rev.
    acceptance:
      - id: AC16
        statement: 'AC16: .pre-commit-hooks.yaml exports id cosmetic-lint running the handler module with
          types file, pass_filenames false, always_run true and stage pre-commit, and no hook of that
          id sits in this repository''s onex_change_control block -- falsifier: uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py
          -q -p no:randomly -k cosmetic fails at the merge base'
  - id: req-omn20074-codeql-reusable-home
    statement: omnibase_core must own the CodeQL reusable workflow so fleet security-scan callers can
      repoint to it and keep the required context CodeQL / CodeQL Analysis (python) without onex_change_control.
    acceptance:
      - id: AC17
        statement: 'AC17: .github/workflows/codeql-reusable.yml in omnibase_core is a workflow_call-only
          move of the previous reusable with the same language and query_suite inputs, the same analyze
          job name "CodeQL Analysis (${{ inputs.language }})" and the same permissions, so the caller
          context resolves to "CodeQL / CodeQL Analysis (python)", pins every action by full sha and references
          onex_change_control nowhere -- falsifier: uv run pytest tests/ci/test_codeql_reusable_omn20074.py
          -q fails at the merge base'
  - id: req-omn20074-arch-handler-compliance
    statement: The decisions of the onex_change_control arch_handler_contract_compliance validator must
      be reproduced by an omnibase_core handler that a consumer runs as a module with the same flags and
      exit codes, so a repository can enforce handler contract compliance without onex_change_control.
    acceptance:
      - id: AC18
        statement: 'AC18: HandlerArchHandlerContractCompliance reproduces the stdout and exit code of
          the onex_change_control validator (rev 9a8956cef4b3) on verbatim omniintelligence nodes and
          constructed nodes, with a pass and a fail for each of the hardcoded-topic, undeclared-transport,
          missing-handler-routing and logic-in-node rule classes, the missing-contract, no-nodes, EFFECT
          Kafka inference and unparseable-handler cases, the allowlist, --json and --generate-allowlist
          outputs, and a planted positive control the handler flags -- falsifier: uv run pytest tests/unit/handlers/test_handler_arch_handler_contract_compliance.py
          -q -p no:randomly -k "replays_occ_output or covers_pass_and_fail or positive_control_is_flagged"
          fails at the merge base'
      - id: AC19
        statement: 'AC19: python -m omnibase_core.handlers.handler_arch_handler_contract_compliance takes
          --repo-root and --allowlist-path as the consumer workflow passes them, exits 1 when a handler
          has a violation that is not allowlisted and 0 otherwise, and exits 2 without --repo-root; the
          handler is pure over explicit node sources and reads nothing from the filesystem -- falsifier:
          uv run pytest tests/unit/handlers/test_handler_arch_handler_contract_compliance.py -q -p no:randomly
          -k "invoked_as_module or missing_repo_root or reads_nothing or models" fails at the merge base'
  - id: req-omn20074-flag-hook-handler
    statement: The no-bare-feature-flags decisions of the pinned onex_change_control hook must be reproduced
      by an omnibase_core handler, so the hook leaves the onex_change_control repository without a change
      in what any fleet file is flagged for.
    acceptance:
      - id: AC20
        statement: 'AC20: HandlerNoBareFeatureFlags reproduces the check-bare-feature-flags decisions
          of onex_change_control rev 8d7e85bc00e7 on verbatim omnibase_infra and omniclaude files, flagging
          os.getenv, os.environ.get, os.environ[] and process.env reads of ENABLE_* and *_ENABLED names
          and skipping comment lines, reasoned ONEX_FLAG_EXEMPT lines, the four approved basenames, the
          four approved path segments and unreadable paths, with the hook''s output lines and exit code
          byte for byte and a positive control it must flag -- falsifier: uv run pytest tests/unit/handlers/test_handler_no_bare_feature_flags.py
          -q -p no:randomly fails at the merge base'
  - id: req-omn20074-flag-hook-export
    statement: omnibase_core must export the handler as pre-commit hook id no-bare-feature-flags, so a
      consumer changes only repo and rev.
    acceptance:
      - id: AC21
        statement: 'AC21: .pre-commit-hooks.yaml exports id no-bare-feature-flags running the handler
          module with types python, ts and javascript, the types the onex_change_control hook declared
          -- falsifier: uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py -q -p no:randomly
          -k bare_feature_flag fails at the merge base'
  - id: req-omn20074-s6-part1
    statement: For S6 part 1 of the OCC retirement, the skip-token caller must pin the omniclaude reusable
      that runs the scan with no nested change-control preflight, the required-checks manifest and the
      CI Summary audit must stop naming the nested preflight context, and CI Summary must expect repo-evidence
      / dod-verify on every pull_request run while the caller keeps comparing with OCC.
    acceptance:
      - id: AC22
        statement: 'AC22: call-reject-skip.yml pins reject-deploy-gate-skip.yml at omniclaude#2540''s
          squash commit, neither the required-checks manifest nor the CI Summary audit names call-reject-skip-token
          / occ-preflight / eligibility, repo-evidence / dod-verify is an L4 context for pull_request
          runs only whose absence holds and whose failure fails CI Summary, and compare-with-occ stays
          "true". -- falsifier: uv run pytest tests/ci/test_s6_part1_cutover_omn20074.py -q -p no:randomly'
evidence_requirements:
  - kind: tests
    description: The workflow test asserts that verify has no job-level condition and that enforcing caller
      mode is a success no-op with one notice line, without reading the pull request.
    command: uv run pytest tests/ci/test_receipt_gate_caller_verify_noop_omn20074.py -q -k test_enforcing_caller_mode_verify_runs_as_a_success_noop_with_one_line_reason
  - kind: tests
    description: Execute the head step with fake GitHub API responses to prove contract-home precedence,
      absent and disabled behavior, and the unchanged refusal.
    command: uv run pytest tests/ci/test_receipt_gate_contract_home_omn20074.py -q -p no:randomly
  - kind: tests
    description: 'The caller tests prove the immutable reusable pin at omnibase_core#1914''s squash commit
      (carrying #1912''s contract-home reusable and the writer release-cut exemption), the matching verifier
      release floor, and the enabled S5 shadow comparison.'
    command: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q
  - kind: tests
    description: Execute the writer-app verdict against git objects to prove release-cut shapes and fail-closed
      controls for paths, changelog edits, heading versions, and already-released versions.
    command: uv run pytest tests/ci/test_receipt_gate_writer_release_cut_omn20074.py -q
  - kind: tests
    description: Execute the writer-app verdict against git objects to prove the omnibase_core workflow
      checkout pin exemption and its fail-closed controls for mixed paths, edits outside the pin, added
      or deleted workflows, and an older verifier.
    command: uv run pytest tests/ci/test_receipt_gate_writer_workflow_pin_omn20074.py -q -p no:randomly
  - kind: tests
    description: Execute the writer-app verdict against git objects to prove the plugin manifest version
      exemption and its fail-closed controls for edits outside the version keys, added or deleted manifests,
      mixed paths, and an older verifier.
    command: uv run pytest tests/ci/test_receipt_gate_writer_plugin_version_omn20074.py -q
  - kind: tests
    description: Replay verbatim fleet files against the decisions of the pinned onex_change_control hook,
      with a positive control, every skip class and the byte-exact output lines.
    command: uv run pytest tests/unit/handlers/test_handler_no_hardcoded_topics.py -q -p no:randomly
  - kind: tests
    description: The exported and local hook declarations run the handler under the same hook id, with
      the exclude unchanged and no onex_change_control hook of that id.
    command: uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py -q -p no:randomly
  - kind: tests
    description: The fold tests prove the CodeRabbit thread gate caller moved into ci.yml with its composed
      context unchanged.
    command: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k cr_thread_gate
  - kind: tests
    description: The fold tests prove the handshake policy gate runs from ci.yml on merge_group and keeps
      its weekly and manual runs.
    command: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k handshake_policy_gate
  - kind: tests
    description: The fold tests prove the propagate dry-run keeps its steps and token scope and detects
      the original five paths in-run.
    command: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k "dry_run or detection"
  - kind: tests
    description: The fold tests prove CI Summary anchors the unconditional folds and fails when any folded
      job fails, with positive controls.
    command: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -p no:randomly -k "anchored or folded_gate
      or baseline_run or soft_allowlist or jobs_api"
  - kind: tests
    description: The ticket-contract tests prove the binds_ac label refusal and its admitted label forms.
    command: uv run pytest tests/unit/models/ticket/test_model_ticket_contract_binds_ac_rules.py -q -k
      TestBindsAcLabelRule
  - kind: tests
    description: The ticket-contract tests prove the binds_ac check-type refusal and that items without
      binds_ac are unaffected.
    command: uv run pytest tests/unit/models/ticket/test_model_ticket_contract_binds_ac_rules.py -q -k
      TestBindsAcCheckTypeRule
  - kind: tests
    description: Replay trees of verbatim omnibase_spi files and constructed files against the recorded
      output of the pinned onex_change_control cosmetic-lint, one pass, one fail and one positive control
      per check class, and the spec hash.
    command: uv run pytest tests/unit/handlers/test_handler_cosmetic_lint.py -q -p no:randomly
  - kind: tests
    description: The exported hook declaration runs the cosmetic handler under the same hook id with the
      keys of the onex_change_control export.
    command: uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py -q -p no:randomly -k cosmetic
  - kind: tests
    description: The workflow tests prove the CodeQL reusable's inputs, job name, permissions, composed
      context, sha-pinned actions and the absence of any onex_change_control reference.
    command: uv run pytest tests/ci/test_codeql_reusable_omn20074.py -q -p no:randomly
  - kind: tests
    description: Replay the stdout and exit code of the pinned onex_change_control validator on verbatim
      omniintelligence nodes and constructed nodes, with a pass and a fail per rule class and a planted
      positive control.
    command: uv run pytest tests/unit/handlers/test_handler_arch_handler_contract_compliance.py -q -p
      no:randomly -k "replays_occ_output or covers_pass_and_fail or positive_control_is_flagged"
  - kind: tests
    description: The handler runs as a module with the consumer's flags and exit codes and decides over
      explicit sources without reading the filesystem.
    command: uv run pytest tests/unit/handlers/test_handler_arch_handler_contract_compliance.py -q -p
      no:randomly -k "invoked_as_module or missing_repo_root or reads_nothing or models"
  - kind: tests
    description: Replay verbatim omnibase_infra and omniclaude files against the decisions of the pinned
      onex_change_control bare-feature-flag hook, with a positive control, every skip class and the byte-exact
      output and exit code.
    command: uv run pytest tests/unit/handlers/test_handler_no_bare_feature_flags.py -q -p no:randomly
  - kind: tests
    description: The exported hook declaration runs the handler under the same hook id with the types
      the onex_change_control hook declared.
    command: uv run pytest tests/ci/test_precommit_hooks_local_omn20068.py -q -p no:randomly -k bare_feature_flag
  - kind: tests
    description: The S6 part 1 tests prove the preflight-free skip-token pin, the removed nested preflight
      context, and CI Summary's pull_request-only expectation of repo-evidence / dod-verify.
    command: uv run pytest tests/ci/test_s6_part1_cutover_omn20074.py -q -p no:randomly
