---
schema_version: "1.0.0"
ticket_id: OMN-18595
title: Release 0.47.55 respects the repository documentation policy
summary: Retain the release notes in root README.md instead of the release-generated CHANGELOG.md that
  the README-only documentation policy refuses, and retain the 0.47.55 package identity in pyproject.toml
  and uv.lock.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-documentation
    statement: The release candidate complies with the tracked-documentation policy and retains a consistent
      package version.
    acceptance:
      - id: AC1
        statement: The canonical README-only documentation validator accepts the release tree; restoring
          the generated CHANGELOG.md makes the validator fail.
      - id: AC2
        statement: The project and editable omnibase-core lock entry declare one version, bumped past
          the released 0.47.55 whose notes root README retains.
  - id: req-omn18595-main-range-file-shape
    statement: The canonical-file-shape ratchet passes over the whole range a main fast-forward pushes,
      so a release cut leaves CI Summary green on the main push run.
    acceptance:
      - id: AC3
        statement: "AC3: the baselined validator file holds no more code lines than it did at the previous
          main head (731), with the TypeScript and shell location rules in a handler -- falsifier: the
          ratchet run with --base 342000ec57020e5258dde41d571420e7c09ed05b refuses with baselined-file-growth"
evidence_requirements:
  - kind: tests
    description: Release-cut identity tests, then the canonical documentation scan and package-identity
      probe on a hosted runner.
    command: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q
  - kind: ci
    description: Run the canonical documentation scan and package-identity probe on a hosted runner.
    command: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
      --root .
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18595-ac1-release-documentation
    description: Scan the indexed release tree using the same canonical adapter as kb-doc-gate.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
          --root .
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac2-release-identity
    description: Parse project and lock metadata and require the intended version in both.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k version
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text());
          lock = tomllib.loads(pathlib.Path("uv.lock").read_text()); assert tuple(map(int, project["project"]["version"].split(".")))
          > (0, 47, 55); assert "## v0.47.55 (2026-10-24)" in pathlib.Path("README.md").read_text(); packages
          = [p for p in lock["package"] if p["name"] == "omnibase-core"]; assert len(packages) == 1 and
          packages[0]["version"] == project["project"]["version"] and packages[0]["source"] == {"editable":
          "."}'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-deploy-hosted-readback
    description: Hosted deployment probe for this release-only change scans the actual indexed tree; restoring
      disallowed release documentation fails without any lab services or credentials.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
          --root .
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac1-release-0-47-52-notes
    description: The release tree passes the documentation policy and retains this release's notes in
      root README.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'from pathlib import Path; notes = Path("README.md").read_text();
          assert "## v0.47.52 (2026-10-22)" in notes; assert "### Included Since v0.47.51" in notes; assert
          "(#2076)" in notes and "(#2072)" in notes and "(#2071)" in notes and "(#2075)" in notes'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac1-release-0-47-53-notes
    description: The release tree passes the documentation policy and retains this release's notes in
      root README.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'from pathlib import Path; notes = Path("README.md").read_text();
          assert "## v0.47.53 (2026-10-22)" in notes; assert "### Included Since v0.47.52" in notes; assert
          "(#2081)" in notes'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac1-release-0-47-55-notes
    description: The release tree passes the documentation policy and retains this release's notes in
      root README.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'from pathlib import Path; notes = Path("README.md").read_text();
          assert "## v0.47.55 (2026-10-24)" in notes; assert "### Included Since v0.47.54" in notes; assert
          "(#2087)" in notes and "(#2088)" in notes'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac3-main-range-file-shape
    description: The ratchet accepts the range from the base head to this head, the moved location rules
      keep their behaviour, and the release tree retains the 0.47.58 notes (fails at the merge base).
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_typescript_and_shell_rules.py
          -q --no-cov -n 0
        cwd: ${OMNI_HOME}/omnibase_core
      # Keep the full validator suite, including both eight-second mutation controls,
      # in separate commands so each fits the verifier's per-command budget.
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_canonical_file_shape_rules.py
          -q --no-cov -n 0 -k 'not stalled_pipe_check_fails_on_the_pipe_above_64kib_mutant'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_canonical_file_shape_rules.py
          -q --no-cov -n 0 -k stalled_pipe_check_fails_on_the_pipe_above_64kib_mutant
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run python -m omnibase_core.nodes.node_canonical_file_shape_check_compute.runtime_canonical_file_shape_check
          --rules file-shape --base 342000ec57020e5258dde41d571420e7c09ed05b --head HEAD
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'from pathlib import Path; notes = Path("README.md").read_text();
          assert "## v0.47.58 (2026-10-29)" in notes'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-deploy-location-rules-handler
    description: Hosted content probe at the commit that moved the location rules; the handler module
      defines is_typescript_canonical_location and the validator imports it from that handler, without
      any lab services.
    source: manual
    binds_ac: [AC3]
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/handlers/handler_canonical_location_rules.py?ref=8116cd606883a869780fc20a7d033216f75c4e41'
          --jq .content | base64 -d | grep -c 'def is_typescript_canonical_location' | grep -qx '[1-9][0-9]*'
      - check_type: command
        check_value: >-
          gh api 'repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/validators/canonical_file_shape.py?ref=8116cd606883a869780fc20a7d033216f75c4e41'
          --jq .content | base64 -d | grep -c 'from omnibase_core.handlers.handler_canonical_location_rules
          import' | grep -qx '[1-9][0-9]*'
      # The same two properties read from the checked-out tree, so the item fails
      # wherever the location rules have not moved into the handler.
      - check_type: command
        check_value: grep -q 'def is_typescript_canonical_location' src/omnibase_core/handlers/handler_canonical_location_rules.py
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: grep -q 'from omnibase_core.handlers.handler_canonical_location_rules import' src/omnibase_core/validation/checker_canonical_file_shape.py
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac1-release-0-47-58-notes
    description: The release tree passes the documentation policy and retains this release's notes in
      root README.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'from pathlib import Path; notes = Path("README.md").read_text();
          assert not Path("CHANGELOG.md").exists(); assert "## v0.47.58 (2026-10-29)" in notes; assert
          "### Included Since v0.47.57" in notes; assert "(#2121)" in notes and "(#2103)" in notes'
        cwd: ${OMNI_HOME}/omnibase_core
