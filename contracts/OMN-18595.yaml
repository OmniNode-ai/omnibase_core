---
schema_version: "1.0.0"
ticket_id: OMN-18595
title: Release 0.47.55 respects the repository documentation policy
summary: Retain the release notes in root README.md instead of the release-generated CHANGELOG.md that
  the README-only documentation policy refuses, and retain the 0.47.55 package identity in pyproject.toml
  and uv.lock.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-documentation
    statement: The release candidate complies with the tracked-documentation policy and retains a consistent
      package version.
    acceptance:
      - id: AC1
        statement: The canonical README-only documentation validator accepts the release tree; restoring
          the generated CHANGELOG.md makes the validator fail.
      - id: AC2
        statement: The project and editable omnibase-core lock entry declare no version (the version is
          dynamic and comes from git at build time, OMN-23837), and a package built from the git history
          reads the release segment 0.47.74 over the v0.47.73 tag and exactly 0.47.74 once v0.47.74 tags
          the commit; root README retains that release's notes.
  - id: req-omn18595-main-range-file-shape
    statement: The canonical-file-shape ratchet passes over the whole range a main fast-forward pushes,
      so a release cut leaves CI Summary green on the main push run.
    acceptance:
      - id: AC3
        statement: "AC3: the baselined validator file holds no more code lines than it did at the previous
          main head (731), with the TypeScript and shell location rules in a handler -- falsifier: the
          ratchet run with --base 342000ec57020e5258dde41d571420e7c09ed05b refuses with baselined-file-growth"
  - id: req-omn18595-release-train-decision-record
    statement: The scheduled release train in omnibase_infra keeps a durable per-run decision record,
      separates every way the lab-evidence premise can fail without cutting, and never substitutes the
      default workflow token for a failed App-token mint. This repository's release cut cites the ticket,
      so the contract carries every criterion the live ticket carries; each of the three below is settled
      in omnibase_infra, not by this release.
    acceptance:
      - id: AC4
        statement: "AC4: the decision is a durable artifact, one JSON document per run carrying every
          repo's verdict, its inputs and its reason, uploaded under always() -- falsifier: force the workflow
          to fail after the decision step and confirm the artifact still exists for that run; an artifact
          that appears only on success fails this criterion. Evidence (omnibase_infra dev 75969ce9): .github/workflows/release-train-nightly.yml
          lines 258-268 (the release-train-decision-<run_id> upload under if: always()), pinned by tests/scripts/test_release_train_nightly.py
          line 892"
      - id: AC5
        statement: "AC5: every way the lab-evidence premise can fail to be established is a distinct named
          outcome and none of them cuts -- falsifier: four simulated runs against one candidate sha (no
          receipt artifact, a receipt carrying FAIL, a receipt whose payload sha disagrees with its artifact
          name, an artifact query that errors) must give four different reasons and zero cuts; any pair
          that collapses to one reason, and any cut, fails. Evidence (omnibase_infra dev 75969ce9): scripts/ci/release_train.py
          lines 1440-1545 (_classify_lab_receipt_on_lane returns LAB_RECEIPT_ABSENT, LAB_RECEIPT_FAIL,
          LAB_RECEIPT_NAME_PAYLOAD_DISAGREE and LAB_RECEIPT_UNREADABLE, with PENDING and INDETERMINATE
          beside them), pinned by tests/scripts/test_release_train_nightly.py line 688"
      - id: AC6
        statement: "AC6: the train workflow pushes nothing with the default workflow token where an App
          identity is required and carries no expression substituting the default token when the App-token
          mint fails -- falsifier: grep the workflow for secrets.GITHUB_TOKEN or a '|| secrets.' fallback;
          a match fails, and a failed mint must fail the job. Evidence (omnibase_infra dev 75969ce9):
          .github/workflows/release-train-nightly.yml lines 47-52 (the stated rule), 137-149 (decide mints
          onexbot) and 290-299 (cut mints onexbot-occ-writer, narrowed to one repository), pinned by tests/scripts/test_release_train_nightly.py
          line 875"
evidence_requirements:
  - kind: tests
    description: Release-cut identity tests, then the canonical documentation scan and package-identity
      probe on a hosted runner.
    command: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q
  - kind: ci
    description: Run the canonical documentation scan and package-identity probe on a hosted runner.
    command: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
      --root .
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18595-ac1-release-documentation
    description: Scan the indexed release tree using the same canonical adapter as kb-doc-gate.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k changelog
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
          --root .
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac2-release-identity
    description: Parse project and lock metadata and require that neither holds a version, and build the
      package from a git history that tags v0.47.73 to read 0.47.74 (untagged) and exactly 0.47.74 (tagged).
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k version
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_release_cut_identity_omn18595.py -q -k derived_version
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run --locked python -c 'import pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text());
          lock = tomllib.loads(pathlib.Path("uv.lock").read_text()); assert "version" not in project["project"]
          and project["project"]["dynamic"] == ["version"]; assert "## v0.47.55 (2026-10-24)" in pathlib.Path("README.md").read_text();
          packages = [p for p in lock["package"] if p["name"] == "omnibase-core"]; assert len(packages)
          == 1 and "version" not in packages[0] and packages[0]["source"] == {"editable": "."}'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-deploy-hosted-readback
    description: Hosted deployment probe for this release-only change scans the actual indexed tree; restoring
      disallowed release documentation fails without any lab services or credentials.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run --locked python -m omnibase_core.nodes.node_git_file_listing_effect.runtime_readme_only_docs
          --root .
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn18595-ac4-decision-uploaded-under-always
    description: The train workflow uploads its per-run decision JSON under always(). The evidence is
      in omnibase_infra, a repository this release does not change, so only the local Done gate reads
      it.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/scripts/test_release_train_nightly.py -q -k uploads_its_decision_under_always
        cwd: ${OMNI_HOME}/omnibase_infra
  - id: dod-omn18595-ac5-lab-premise-outcomes-distinct
    description: Each way the lab-evidence premise can fail is its own named reason and none cuts. The
