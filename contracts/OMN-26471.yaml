    description: The ledger shape tests and the existing topology database tests.
    command: uv run --frozen pytest tests/unit/models/core/test_model_deployment_topology_database_ledger_shape.py
      tests/unit/models/core/test_model_deployment_topology_database.py -q -n 0 --reruns 0
