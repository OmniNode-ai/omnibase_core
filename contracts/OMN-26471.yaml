schema_version: 1.0.0
ticket_id: OMN-26471
title: 'OMN-26471: a deployment database declares its migration-ledger shape (core side of AC6)'
summary: ModelDeploymentTopologyDatabaseMigrationLedger required four distinct columns (stream, domain,
  version, checksum), so the cloud database ledger public.schema_migrations (version, checksum) could
  not be declared. The ledger now carries a typed shape, stream_domain_version_checksum (default, every
  existing entry unchanged) or version_checksum; a malformed shape is refused by name.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn26471-ledger-shape
    statement: A database declares its migration ledger as the four-column form or the version/checksum
      form, typed and validated.
    acceptance:
      - id: AC6
        statement: "AC6: the version_checksum ledger shape is accepted and malformed shapes are refused
          by name -- falsifier: the shape test file fails on the head or passes on the base"
evidence_requirements:
