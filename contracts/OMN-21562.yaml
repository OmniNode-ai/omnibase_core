---
schema_version: "1.0.0"
ticket_id: OMN-21562
title: A required validator that was skipped or not applicable aggregates to non-pass
summary: EnumValidationStatus gains MISSING and ADVISORY; ModelValidationReport takes the required validator
  ids from its caller (read from the validator requirements file) and aggregates a required SKIP or NOT_APPLICABLE
  to FAIL, and MISSING to FAIL, while a non-required SKIP aggregates as before.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21562
    statement: A required validator in SKIP or NOT_APPLICABLE must not aggregate to PASS.
    acceptance:
      - id: AC1
        statement: 'AC1: a report whose required validator is SKIP or NOT_APPLICABLE has overall_status
          not PASS, while a non-required SKIP still aggregates as today -- falsifier: uv run pytest tests/unit/models/validation
          -q -k required_skip'
      - id: AC2
        statement: 'AC2: MISSING and ADVISORY round-trip through ModelValidationReport JSON and are accepted
          by the existing consumers -- falsifier: the round-trip test and the existing suite passing'
      - id: AC3
        statement: 'AC3: which validators are required comes from the caller, read from the validator
          requirements file, not from a list in code -- falsifier: the default required_validators is
          empty and no validator name appears in the aggregation'
dod_evidence:
  - id: dod-omn-21562-ac1
    description: The required_skip tests pass, red before the change.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/validation -q -k required_skip
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn-21562-ac2
    description: The MISSING and ADVISORY JSON round-trip test and the enum member test pass; both exercise
      the new members, so they are red at the merge base.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/validation -q -k "required_skip_missing_and_advisory_json_round_trip
          or required_skip_enum_members"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn-21562-ac3
    description: The default required_validators is empty, so no list in code decides what is required.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/validation -q -k required_skip_default_has_no_required_validators
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
