---
schema_version: 1.0.0
ticket_id: OMN-21778
title: 'omnibase_core contracts_and_di literal_ip and literal_port burn-down, slice rf1500-c2'
summary: 'The hosts, bind address and default ports of the connection models, the service config defaults
  and the loopback checks are declared in a packaged YAML contract that the call sites read, so the 13
  literal_ip and 12 literal_port findings over omnibase_core src go to zero without a baseline entry or
  a suppression.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21778-network-defaults
    statement: Addresses and ports in omnibase_core's connection models and loopback checks come from
      a packaged contract that is read through one accessor, and the touched code holds none.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_ip and literal_port over the slice paths
          drops to zero and the repo total drops by the slice size, with no baseline entry or suppression
          added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over
          omnibase_core src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every address and port comes from the owning node contract or overlay and is
          injected, none hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over
          the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: The network-defaults contract tests pass.
    command: uv run pytest tests/unit/models/runtime/test_model_network_defaults.py -n 0 -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21778-ac1-checker-count
    description: Each of the ten slice modules draws no literal_ip or literal_port finding from the contracts_and_di
      checker. At the merge base the findings exist and the contract does not, so these cases fail.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/runtime/test_model_network_defaults.py -q -o addopts=''
          -k 'no_literal_ip_or_port_finding'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21778-ac2-injected
    description: The packaged contract loads and validates, an overlaid value reaches the connection factories,
      explicit ports win over the contract, and the default ports are unchanged.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/runtime/test_model_network_defaults.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21778-ac3-lab-proof
    description: The unit tests of the touched modules pass on the lab at the PR head.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/connections tests/unit/models/configuration tests/unit/models/runtime/test_model_network_defaults.py
          -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
