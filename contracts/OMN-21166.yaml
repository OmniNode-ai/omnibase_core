---
schema_version: "1.0.0"
ticket_id: OMN-21166
title: Receipt gate takes a per-check timeout
summary: A caller may set check-timeout-seconds; empty keeps the verifier's 30 s default; a whole number
  from 1 to 900 is written to GITHUB_ENV as DOD_VERIFY_CHECK_TIMEOUT_S so the head check and the merge-base
  control see the same value; anything else is refused before the verifier is installed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21166-check-timeout
    statement: The shared receipt gate must let a caller name each dod_verify check's time ceiling, keep
      the verifier's 30 s default when none is named, and refuse a malformed value before it runs.
    acceptance:
      - id: AC43
        statement: 'AC43: (approved plan amendment, 2026-10-22) omnibase_core''s receipt gate takes a
          check-timeout-seconds input: empty keeps the verifier''s 30 s per-check default, a whole number
          from 1 to 900 reaches both the head check and the merge-base control, and any other value is
          refused before the verifier is installed -- falsifier: uv run pytest tests/ci/test_receipt_gate_check_timeout_omn21166.py
          -q in omnibase_core fails at the merge base'
  - id: req-omn21166-declared-sibling-pin
    statement: The shared receipt gate must take a caller's declared sibling pin as data, hold every literal
      pin to it, fail closed on a bad pin, and the pin-bump bot must keep omnidash's declared pin with
      its handshake.
    acceptance:
      - id: AC209
        statement: 'AC209: (approved plan amendment part 31, 2026-10-27, Lakshman; Jonah chose option
          B on 2026-10-25) the receipt gate''s sibling resolver uses a caller''s declared pin in .github/sibling-pins.yaml
          as the sibling''s revision: every literal pin for that sibling must equal it or the checkout
          stays absent, expression refs are set aside only when a pin is declared, and a caller with no
          pin file is unchanged -- falsifier: the bound check dod-omn21166-ac209-declared-sibling-pin
          fails at the merge base'
      - id: AC210
        statement: 'AC210: (approved plan amendment part 31, 2026-10-27, Lakshman; Jonah chose option
          B on 2026-10-25) an unreadable or malformed .github/sibling-pins.yaml, or a declared pin that
          is not a 40-hex commit, leaves the sibling''s checkout absent and never falls back to another
          revision -- falsifier: the bound check dod-omn21166-ac210-bad-declared-pin fails at the merge
          base'
      - id: AC211
        statement: 'AC211: (approved plan amendment part 31, 2026-10-27, Lakshman; Jonah chose option
          B on 2026-10-25) the core pin-bump bot''s manifest lists omnidash''s .github/sibling-pins.yaml
          as a second pin site, so one bump moves it and check-handshake.yml to the same commit -- falsifier:
          the bound check dod-omn21166-ac211-bot-bumps-declared-pin fails at the merge base'
evidence_requirements:
  - kind: "tests"
    description: "The receipt-gate workflow tests pass at the head and the new file fails at the merge
      base"
    command: "uv run pytest tests/ci/test_receipt_gate_check_timeout_omn21166.py -q -p no:randomly"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21166-ac43-check-timeout
    description: The workflow tests declare the input, run the resolver step on empty, accepted and refused
      values, and find the value reaching both verifier steps through GITHUB_ENV.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_receipt_gate_check_timeout_omn21166.py -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC43
  - id: dod-omn21166-ac209-declared-sibling-pin
    description: 'Runs the gate''s real resolver over omnidash''s three workflows with a declared pin
      (resolves to it) and a disagreeing uv pin (absent); both fail at the merge base.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: 'uv run pytest tests/ci/test_receipt_gate_sibling_checkouts_omn21013.py -q -p no:randomly
          -k "declared_pin_resolves_omnidash_workflows or declared_pin_also_binds_uv_pins"'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC209
  - id: dod-omn21166-ac210-bad-declared-pin
    description: 'A malformed, branch-name, short or unmapped pin file withholds a sibling that its uv
      pin alone would resolve; every case fails at the merge base.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: 'uv run pytest tests/ci/test_receipt_gate_sibling_checkouts_omn21013.py -q -p no:randomly
          -k "malformed_declared_pin_withholds_an_otherwise_resolved_sibling"'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC210
  - id: dod-omn21166-ac211-bot-bumps-declared-pin
    description: 'The shipped manifest lists omnidash''s handshake and declared pin, and one bump moves
      both to one commit; both fail at the merge base.'
    source: manual
    checks:
      - check_type: test_passes
        check_value: 'uv run pytest tests/unit/scripts/test_pin_bump.py -q -p no:randomly -k "handshake_and_declared_pin"'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC211
