---
schema_version: "1.0.0"
ticket_id: OMN-19448
title: A delegation request refused before any dispatch has a terminal failure cause to land on
summary: omnibase_core adds EnumDelegationTerminalFailureCause.REFUSED_BEFORE_DISPATCH (wire value refused_before_dispatch),
  the member a request refused before any rung ran lands on. Until now a timeout above the task class
  ceiling or an absent credential left the cause null, the one row on the lab that failed "no failed row
  has a null cause". The omnimarket change that sets the cause is a separate pull request in that repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19448-core-refused-before-dispatch
    statement: The terminal carries, unchanged, the cause, outcome, verdict and trace that delegation_events
      copies, and its failure cause vocabulary has a member for a request refused before any dispatch.
    acceptance:
      - id: AC1
        statement: "AC1: the projection writes the terminal's cause, operational_outcome and content_verdict
          unchanged"
      - id: AC2
        statement: "AC2: the new columns arrive through a vendored migration and are written from the
          terminal"
      - id: AC3
        statement: "AC3: on the lab, no failed row written after the deploy has a null cause"
evidence_requirements:
  - kind: tests
    description: The terminal failure cause vocabulary tests, including the refused-before-dispatch member.
    command: uv run pytest tests/unit/enums/test_enum_delegation_terminal_failure_cause.py -q
dod_evidence:
  - id: dod-omn19448-core-refused-before-dispatch
    description: The vocabulary tests pass with the refused_before_dispatch member pinned.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/enums/test_enum_delegation_terminal_failure_cause.py -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn19448-core-terminal-carries-copied-values
    description: >-
      Core's part of AC1 and AC2: the terminal wire model the projection copies from keeps a quality_gate_refused
      cause, the quality_rejected outcome, the unusable verdict and the trace_id unchanged through a JSON
      round trip. The projection writers that copy them and the vendored migrations that add the columns
      are proven in the omnimarket and omnibase_infra contracts for this ticket.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/delegation/wire/test_omn19448_terminal_fields_for_projection.py
          -q -k 'survive_the_wire or trace_id'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
      - AC2
  - id: dod-omn19448-core-refused-before-dispatch-cause
    description: >-
      Core's part of AC3: a request refused before any dispatch has a typed cause to land on. The vocabulary
      pins refused_before_dispatch, and a terminal naming it keeps it through a JSON round trip, so such
      a row is not left with a NULL cause. The lab readback of AC3 is recorded in the omnimarket contract
      for this ticket.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/enums/test_enum_delegation_terminal_failure_cause.py tests/unit/models/delegation/wire/test_omn19448_terminal_fields_for_projection.py
          -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
