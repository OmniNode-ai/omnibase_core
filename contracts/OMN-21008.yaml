          -q -n 0 fails on any case run through the installed node.'
      - id: AC3
        statement: 'AC3: .github/required-checks.yaml names the `pr-title / check-title` row as a local
          producer for pr-title-check.yml job pr-title with no cross_repo_ref to onex_change_control --
          falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q -n 0 fails when
          parsing the merge-base manifest row.'
