---
schema_version: "1.0.0"
ticket_id: OMN-20413
title: The dod-verify job provisions the PG16 server tools on a runner without sudo apt-get
summary: The receipt-gate dod-verify step that provides the PostgreSQL 16 server tools refused every same-repo
  pull request routed to the self-hosted omnibase-ci image, which has no PG16 and no sudo apt-get. It
  now downloads postgresql-16 and its missing dependencies from PGDG into RUNNER_TEMP without root and
  extracts them there, and refuses by name only when neither path yields a PG16 initdb.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20413-rootless-pg16
    statement: dod-verify provides working PG16 server tools on a runner that grants no sudo apt-get.
    acceptance:
      - id: AC1
        statement: The Provide the PostgreSQL 16 server tools step keeps the sudo apt-get path, adds a
          rootless PGDG download and dpkg-deb extraction under RUNNER_TEMP, exports its library directory
          through GITHUB_ENV, and still refuses by name when both paths fail.
      - id: AC2
        statement: On an Ubuntu 24.04 runner whose archive is listed only in deb822 source parts, the
          rootless path copies the host's source parts into its private apt state instead of turning source
          parts off, so postgresql-16's Ubuntu dependencies (libjson-perl) resolve.
      - id: AC3
        statement: The repo-evidence caller pins a receipt-gate whose Binds-Merged-Fix control falls back
          to the merged fix's parent when the fix's product changes do not revert at the merge base, so
          a pull request bound to an older merged fix is no longer refused before its tests run.
evidence_requirements:
  - kind: tests
    description: Hosted CI test that pins the step's sudo path, rootless extraction path and named refusal.
    command: uv run --frozen pytest tests/ci/test_receipt_gate_caller_evidence_omn20070.py -q --no-cov
      -k "postgres_steps_are_gated_and_fail_closed"
  - kind: ci
    description: Deploy check scoped to hosted CI configuration; fails when the receipt-gate workflow
      loses the rootless PG16 path or the caller pins a receipt-gate older than the merged-fix parent
      fallback. No runtime service changes are included.
    command: uv run --frozen pytest tests/ci/test_receipt_gate_caller_evidence_omn20070.py tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py
      tests/ci/test_s6_caller_occ_disabled_omn20969.py -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20413-rootless-pg16
    description: The PG16 tools step test asserts the rootless RUNNER_TEMP extraction path beside the
      sudo path and the named refusal; it fails at the merge base, whose step has no rootless path.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_receipt_gate_caller_evidence_omn20070.py -q
          --no-cov -k "postgres_steps_are_gated_and_fail_closed"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn20413-noble-deb822-sources
    description: The rootless PG16 apt state keeps the host's deb822 source parts; the test fails at the
      merge base, whose step sets source parts to none and so cannot resolve libjson-perl on noble.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_receipt_gate_caller_evidence_omn20070.py -q
          --no-cov -k "deb822_sources"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn20413-caller-pins-fix-parent-fallback
    description: The caller test asserts the repo-evidence caller pins a dev-merge tag at or after the
      receipt-gate with the merged-fix parent fallback; it fails at the merge base, whose caller pins
      the 2026-10-18 tag that refuses a binding whose revert conflicts.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/ci/test_s6_caller_occ_disabled_omn20969.py -q --no-cov
          -k "merged_fix_parent_fallback or matches_the_merge_base"
        cwd: ${OMNI_HOME}/omnibase_core
