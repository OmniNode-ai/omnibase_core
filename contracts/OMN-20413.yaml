ticket_id: OMN-20413
title: The dod-verify job provisions the PG16 server tools on a runner without sudo apt-get
summary: The receipt-gate dod-verify step that provides the PostgreSQL 16 server tools refused every same-repo
  pull request routed to the self-hosted omnibase-ci image, which has no PG16 and no sudo apt-get. It
  now downloads postgresql-16 and its missing dependencies from PGDG into RUNNER_TEMP without root and
  extracts them there, and refuses by name only when neither path yields a PG16 initdb.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20413-rootless-pg16
    statement: dod-verify provides working PG16 server tools on a runner that grants no sudo apt-get.
    acceptance:
      - id: AC1
        statement: The Provide the PostgreSQL 16 server tools step keeps the sudo apt-get path, adds a
          rootless PGDG download and dpkg-deb extraction under RUNNER_TEMP, exports its library directory
          through GITHUB_ENV, and still refuses by name when both paths fail.
evidence_requirements:
  - kind: tests
    description: Hosted CI test that pins the step's sudo path, rootless extraction path and named refusal.
    command: uv run --frozen pytest tests/ci/test_receipt_gate_caller_evidence_omn20070.py -q --no-cov
      -k "postgres_steps_are_gated_and_fail_closed"
  - kind: ci
