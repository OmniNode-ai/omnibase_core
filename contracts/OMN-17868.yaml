      - id: AC1
        statement: 'AC1: the focused registry-status test passes with UserWarning promoted to an error
          -- falsifier: uv run pytest -W error::UserWarning tests/unit/models/container/test_model_registry_status.py
          -q'
      - id: AC2
        statement: 'AC2: the container model and service suites are warning-clean under the same filter
          -- falsifier: uv run pytest -W error::UserWarning tests/unit/models/container tests/unit/container
          -q'
