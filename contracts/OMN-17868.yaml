---
schema_version: "1.0.0"
ticket_id: OMN-17868
title: "The registry-status unit test keys its distributions with enum members, so serialization raises
  no Pydantic warning"
summary: The ModelServiceRegistryStatus unit test assigned raw string keys to the health_summary, lifecycle_distribution
  and scope_distribution fields, which are declared as dicts keyed by EnumHealthStatus, EnumServiceLifecycle
  and EnumInjectionScope. Pydantic accepts the assignment and model_dump then warns, which fails the test
  when warnings are errors. The test now uses the enum members, and the test class turns UserWarning into
  an error so the defect cannot return unseen. The model and production construction in container_service_registry
  are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17868-enum-keys
    statement: The registry-status unit test builds and mutates the enum-keyed distributions with enum
      members only, and passes with UserWarning promoted to an error.
