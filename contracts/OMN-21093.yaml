title: Claude Code binding install models move to core (the core half of the skill-mapping entry)
summary: >-
  Relocates the Claude Code binding install wire family from omnimarket to omnibase_core: ModelClientBinding
  with its ModelClientArgument and the EnumBindingKind, EnumClientMaxMode and EnumClientVerdictAction
  enums, plus ModelBindingInstallRequest and ModelBindingInstallResult, verbatim (same fields, types,
  constraints and defaults, OMN-18531 shapes). Shared wire models must sit below the node boundary: omnibase_infra's
  skill mapping names ModelBindingInstallResult, and a cross-repo reference into an omnimarket node package
  is a seam the node-boundary gate refuses (OMN-17427/OMN-20703, shrink-only baseline). omnimarket re-exports
  the classes from their former module paths in the follow-up PR against the core release that carries
  them; the omnibase_infra skill_mapping entry for claude_code_binding_install lands last, naming the
  core result model.
is_seam_ticket: true
