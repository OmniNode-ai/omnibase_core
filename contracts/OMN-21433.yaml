    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_baselined_finding_hooks.py -q -n 0 -k 'test_a_new_finding_fails_and_names_only_the_new_one
          or test_g_manifest_declares_both_hook_ids_with_a_self_contained_entry'"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn-21433-t21-core-2-backward-compat-baseline
    description: "T2.1-core-2: check-no-backward-compat accepts --baseline; a baselined finding passes
      and a new finding fails."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_baselined_finding_hooks.py -q -n 0 -k 'test_a_new_finding_fails_and_names_only_the_new_one
          or test_b_baselined_finding_passes'"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn-21433-t21-core-3-baseline-only-shrinks
    description: "T2.1-core-3: removing a baselined finding shrinks the baseline file on --write-baseline,
      and --write-baseline never adds an entry."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_baselined_finding_hooks.py -q -n 0 -k 'test_c_removed_finding
