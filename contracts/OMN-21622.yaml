    statement: >-
      A developer.principal row can declare that its principal is one of the deployment's own machines,
      without carrying a grant.
    acceptance:
      - id: AC1
        statement: >-
          AC1: a resolved, wired mechanism enforces RULING 2026-10-30T21:35:44Z lane=orchestrator-31d9,
