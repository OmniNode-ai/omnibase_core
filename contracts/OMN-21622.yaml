title: "Machine login profile: one declared grant set every machine principal receives at issuance, with
  a drift check"
summary: >-
  Core side: a developer.principal overlay row gains an optional role from the closed vocabulary EnumDeveloperPrincipalRole
  (developer, machine). It says whether the principal is a person's development machine or a machine the
  deployment runs itself, and is never a grant. The lab issuer's machine grant audit reads it to audit
  the deployment's own machines and only those.
