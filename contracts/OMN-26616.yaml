---
schema_version: "1.0.0"
ticket_id: "OMN-26616"
title: "onex doctor and onex health judge only what a customer needs and never show a raw error"
summary: "On a customer install onex doctor skips Docker, Linear and repository-sync checks; onex health
  reports an unset KAFKA_BOOTSTRAP_SERVERS as a skipped check with a plain sentence and a Fix line instead
  of a raw KeyError; success and skip messages do not name environment variables or internal details."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn26616-customer-doctor-health"
    statement: "onex doctor and onex health must judge only what a customer needs and never show a raw
      error."
    acceptance:
      - id: "AC1"
        statement: "AC1: on a customer install onex doctor runs no Docker, Linear or repository check;
          Falsifier: tests/unit/doctor/test_omn26616_ac1_customer_install.py::test_customer_install_skips_developer_only_checks"
      - id: "AC3"
        statement: "AC3: onex health with KAFKA_BOOTSTRAP_SERVERS unset prints no raw exception and names
          the fix; Falsifier: tests/unit/cli/test_omn26616_ac3_health_kafka_unset.py::test_health_unset_kafka_prints_plain_sentence_and_fix"
      - id: "AC4"
        statement: "AC4: on a working customer install both commands exit 0; Falsifier: tests/integration/test_omn26616_installed_package_e2e.py (the dod-omn26616-integration-proof
          item below runs it)."
evidence_requirements:
  - kind: "tests"
    description: "Unit tests for customer install doctor checks, health kafka unset handling, and customer
      wording."
    command: "uv run pytest tests/unit/doctor/test_omn26616_ac1_customer_install.py tests/unit/doctor/test_omn26616_ac1_real_checks.py tests/unit/cli/test_omn26616_ac3_health_no_raw_text.py tests/unit/cli/test_omn26616_ac3_health_kafka_unset.py
      tests/unit/doctor/test_omn26616_extra5_customer_wording.py -q -n 0 --no-cov -p no:cacheprovider"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn26616-ac1"
    description: "AC1: on a customer install onex doctor runs no Docker, Linear or repository check"
    source: "manual"
    binds_ac:
      - "AC1"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/doctor/test_omn26616_ac1_customer_install.py -q -n 0 --no-cov
          -p no:cacheprovider"
        cwd: "."
  - id: "dod-omn26616-ac3"
    description: "AC3: onex health with KAFKA_BOOTSTRAP_SERVERS unset prints no raw exception and names
      the fix"
    source: "manual"
    binds_ac:
      - "AC3"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/cli/test_omn26616_ac3_health_kafka_unset.py tests/unit/doctor/test_omn26616_extra5_customer_wording.py
          -q -n 0 --no-cov -p no:cacheprovider"
        cwd: "."
  - id: "dod-omn26616-integration-proof"
    description: "The headless run of the OMN-26616 doctor and health tests on a lab host at the pushed
      head; hosted CI cannot reach the lab runner so only the local Done gate runs it"
    source: "manual"
    execution_scope: "local_done_gate"
    binds_ac:
      - "AC4"
    checks:
      - check_type: "command"
        check_value: "env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnibase_core
          --sha \"$(git rev-parse HEAD)\" --lane dod-integration-proof-26616 --kind test -- env PYTHONDONTWRITEBYTECODE=1 OMN_26616_INSTALLED_E2E=1
          uv run --frozen pytest tests/unit/doctor/test_omn26616_ac1_customer_install.py tests/unit/doctor/test_omn26616_ac1_real_checks.py tests/unit/cli/test_omn26616_ac3_health_no_raw_text.py tests/unit/cli/test_omn26616_ac3_health_kafka_unset.py
          tests/unit/doctor/test_omn26616_extra5_customer_wording.py tests/integration/test_omn26616_installed_package_e2e.py -q -n 0 --reruns 0 --no-cov -p no:cacheprovider"
        cwd: "."
