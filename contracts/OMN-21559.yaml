---
schema_version: 1.0.0
ticket_id: OMN-21559
title: Build the plan_invariant checker
summary: Pure plan-invariant checker and generic file validator using the committed K12 predicate. All
  plan syntax and literal kinds are contract rule data. Hosted tests use a recording bus for the Redpanda
  overlay; the opt-in lab test exercises a live broker.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21559-plan-invariant-checker
    statement: Refuse tasks with no falsifiable criterion, tasks naming runtime literals, and invariants
      with no enforcing task.
    acceptance:
      - id: AC1
        statement: 'AC1: Planted plan refused naming each by rule_id, clean plan yields zero.'
      - id: AC2
        statement: 'AC2: Every rule severity: error, no warning-only mode, the CLI exits non-zero on the
          planted fixtures.'
      - id: AC3
        statement: 'AC3: Literal kinds and their patterns are rule data; an eighth kind needs no code
          change.'
      - id: AC4
        statement: 'AC4: Every pattern, name list, threshold and remediation text is a parameters entry;
          K10 rule_table_in_checker reports zero on the checker module (ValidatorCheckerRuleData); a table-driven
          test mutates every parameters key; an invalid contract fails to load.'
      - id: AC5
        statement: 'AC5: The checker is pure; the runtime resolves node_validation_report_write_effect
          and the bus from the container (get_service); K1 call_site_construction reports zero on the
          runtime module.'
      - id: AC6
        statement: 'AC6: No host, port, topic, model name, timeout or URL in the changed production source.'
      - id: AC7
        statement: 'AC7: In-memory and broker overlays on one commit give the same golden report and one
          ModelValidatorRunEvent each.'
evidence_requirements:
  - kind: tests
    description: Rule fixtures, all rule parameters, fail-closed contracts, purity, predicate reuse, container
      resolution and golden reports on both overlays.
    command: uv run pytest tests/unit/validation/test_checker_plan_invariant.py -q -o addopts=''
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
