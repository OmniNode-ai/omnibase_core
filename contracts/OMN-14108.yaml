    statement: omnibase_core carries the PR OCC stamp schema with the tests that came with it, and no
      test in omnibase_core imports omnibase_compat.
    acceptance:
      - id: AC1
        statement: "AC1: omnibase_core carries the PR OCC stamp schema (enum, models, parser and renderer)
          with its tests -- falsifier: `uv run pytest tests/unit/validation/test_pr_occ_metadata_stamp.py
          tests/unit/models/validation/test_model_pr_occ_metadata_stamp.py -q` passes"
evidence_requirements:
