---
schema_version: "1.0.0"
ticket_id: OMN-14108
title: "omnibase_compat is retired: its last used symbols move to omnibase_core or their one consumer,
  and no first-party repository depends on it"
summary: RULING 2026-10-22T21:43:04Z retires omnibase_compat. The PR OCC stamp schema (the evidence-source
  kind enum, four models, the parser and the renderer) is used by omnibase_infra, omnimarket and omniclaude,
  so it returns to omnibase_core, where it lived before OMN-14223. Symbols one repository uses move into
  that repository, and every omnibase-compat pin is removed.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - omnibase_core.enums.enum_pr_evidence_source_kind
  - omnibase_core.models.validation.model_pr_body_section
  - omnibase_core.models.validation.model_pr_evidence_source
  - omnibase_core.models.validation.model_pr_occ_metadata_stamp
  - omnibase_core.models.validation.model_pr_receipt_gate_skip_token
  - omnibase_core.contracts.pr_occ_metadata_stamp
requirements:
