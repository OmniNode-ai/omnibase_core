          -q'
      - id: AC2
        statement: 'AC2: contracts/OMN-20450.yaml and contracts/OMN-20499.yaml load through ModelTicketContract
          with matching ticket identities and populated check values. -- falsifier: uv run pytest tests/unit/models/ticket/test_moved_ticket_contracts_omn21293.py
          -q -k loads_through'
evidence_requirements:
