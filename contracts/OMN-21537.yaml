---
schema_version: "1.0.0"
ticket_id: OMN-21537
title: "T4.1b: hardcoded_model_config families O, G, F, P, S, H and B"
summary: The existing hardcoded_model_config gate gains families O (operational numbers), G (first-party
  repository URLs), F (filesystem locations), P (repository lists), S (ruling stamps), H (lab host lists)
  and B (budget constants). The families are a pure checker over the rule rows of hardcoded_model_literals.validation.yaml;
  the organisation comes from the sibling pins contract, the repository names from the repository layer
  contract and the host names from the private vocabulary. The tree passes with a first-install baseline
  that only shrinks to zero; the files the plan names are fixed, not baselined. The report-writer and
  bus resolution from the container is not in this change, because the import-linter contract forbids
  the validation package from importing nodes, so it belongs to a node home that OMN-21529 adds.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21537-families-o-g-f-p-s-h-b
    statement: The hardcoded_model_config gate refuses a hard-coded operational number, first-party URL,
      filesystem location, repository list, ruling stamp, host list and budget in code and workflows,
      with every vocabulary a parameters entry of a rule row and no suppression marker.
    acceptance:
      - id: AC1
        statement: "AC1: each family has a violation fixture refused with exactly one issue of its rule
          and a comment form that passes for O, G and F (the nine planted violations) -- falsifier: uv
          run pytest tests/unit/validation/hardcoded_model_config -q -k families_o_g_f_p_s_h_b"
      - id: AC2
        statement: "AC2: the current tree passes with a generated baseline, a new finding fails, the baseline
          only shrinks, no file the plan names is admitted, and the header names the zero date -- falsifier:
          uv run pytest tests/unit/validation -q -k baseline_only_shrinks"
      - id: AC3
        statement: "AC3: the G family reads github_org from the sibling pins contract and the policy names
          no organisation -- falsifier: uv run pytest tests/unit/validation/hardcoded_model_config -q
          -k 'g_family_reads_github_org or name_no_organisation'"
      - id: AC4
        statement: "AC4: every pattern, name list, threshold and remediation text is a parameters entry
          of the rule rows; a table-driven test mutates every key and an invalid contract fails to load,
          and K10 reports no rule table in the checker -- falsifier: uv run pytest tests/unit/validation/hardcoded_model_config
          -q -k 'every_parameters_key or invalid_contract or missing_parameters or k10'"
      - id: AC5
        statement: "AC5: the checker is pure: facts in, issues out, no file read; resolving the report
          writer and the bus from the container is not in this change (see the summary) -- falsifier:
          uv run pytest tests/unit/validation/hardcoded_model_config -q -k checker_is_pure"
      - id: AC6
        statement: "AC6: the changed production source holds no finding of the gate, with the rule data
          and the planted fixtures excluded by exclude_patterns -- falsifier: uv run pytest tests/unit/validation/hardcoded_model_config
          -q -k 'changed_production_source or exclude_patterns'"
      - id: AC7
        statement: "AC7: disabling a rule row fails that rule's fixture and no other -- falsifier: uv
          run pytest tests/unit/validation/hardcoded_model_config -q -k disabled_row (the T0.8 corpus
          assertions wait on OMN-21530)"
      - id: AC8
        statement: "AC8: the runtime runs on the in-memory default and with the CI bus overlay with no
          code change, once OMN-21529 lands the overlay pair -- falsifier: the validator entry runs on
          the default wiring in the test below; the broker overlay half waits on OMN-21529 and is not
          claimed here"
evidence_requirements:
  - kind: tests
    description: Fixtures, rule-row mutation, ratchet, runtime and validator entry tests.
    command: uv run pytest tests/unit/validation/hardcoded_model_config -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21537-ac1-planted-violations
    description: Each family's violation fixture yields exactly one issue of its rule, clean fixtures
      none, and the nine planted texts are refused (O, G, F also as comments).
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          -q -p no:randomly -k families_o_g_f_p_s_h_b
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn21537-ac2-baseline
    description: A new finding fails, a stale entry fails, growth against the base fails, no file the
      plan names is baselined, and the baseline header names the zero date.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals_ratchet.py
          -q -p no:randomly -k baseline_only_shrinks
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn21537-ac3-organisation
    description: A sibling pins contract naming another organisation changes the verdict, and no shipped
      file of the checker names the organisation.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          -q -p no:randomly -k "g_family_reads_github_org or name_no_organisation"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
  - id: dod-omn21537-ac4-configuration
    description: Every parameters key changes its fixture's verdict, an invalid contract fails to load,
      and K10 reports no rule table in the checker modules.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals_ratchet.py -q -p
          no:randomly -k "every_parameters_key or invalid_contract or missing_parameters or k10"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn21537-ac5-pure
    description: The checker reads no file (open and Path reads patched to raise); the writer and bus
      resolution from the container is not claimed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          -q -p no:randomly -k checker_is_pure
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn21537-ac6-no-literal
    description: The changed production source holds no finding of the gate and the rule data is excluded
      by exclude_patterns.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals_ratchet.py -q -p
          no:randomly -k "changed_production_source or exclude_patterns"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC6
  - id: dod-omn21537-ac7-disabled-row
    description: Disabling a rule row fails that rule's fixture and leaves the other rules' fixtures failing.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals.py
          -q -p no:randomly -k disabled_row
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC7
  - id: dod-omn21537-ac8-in-memory-default
    description: The validator entry runs on the default wiring with no overlay; the broker overlay half
      waits on OMN-21529 and is not claimed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/hardcoded_model_config/test_hardcoded_model_literals_ratchet.py
          -q -p no:randomly -k validator_entry_loads_its_contract
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC8
