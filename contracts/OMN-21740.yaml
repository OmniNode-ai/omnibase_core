---
schema_version: 1.0.0
ticket_id: OMN-21740
title: 'omnibase_core contracts_and_di literal_timeout burn-down, slice rf1300-c6: retry, breaker, throttling
  and connection-pool timings move into a packaged contract read through a typed model'
summary: 'The delays, backoffs and timeouts the retry, circuit-breaker, throttling and connection-pool
  presets held as literals are declared in models/configuration/resilience_defaults.yaml and read through
  ModelResilienceDefaults. The contracts_and_di checker reports no literal_timeout finding on the six
  touched modules; no baseline entry and no suppression is added.'
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21740-resilience-defaults
    statement: A timeout, delay or backoff that a resilience preset falls back to is declared in a packaged
      contract that a typed model reads, and the preset code holds no literal of it.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_timeout over the slice paths drops to
          zero and the repo total drops by the slice size, with no baseline entry or suppression added
          -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omnibase_core
          src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every moved timeout is taken through an injected parameter bound from the node
          contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest
          tests/unit -q over the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: The resilience defaults contract tests pass.
    command: uv run pytest tests/unit/models/configuration/test_model_resilience_defaults.py -n 0 -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21740-ac1-checker-counts
    description: The checker reports no literal_timeout finding on each of the six touched modules and
      still flags a planted literal. At the merge base the modules hold 32 such findings, so these cases
      fail.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/configuration/test_model_resilience_defaults.py -q
          -o addopts='' -k 'TestCheckerReportsNoTimeoutLiteral'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21740-ac2-contract-read
    description: Every moved value equals its entry in the packaged contract, an explicit argument still
