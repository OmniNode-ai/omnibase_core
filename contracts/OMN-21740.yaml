        check_value: uv run pytest tests/unit/models/configuration/test_model_resilience_defaults.py -q
          -o addopts='' -k 'TestResilienceDefaultsContract or TestPresetsReadTheContract'
        cwd: ${OMNI_HOME}/omnibase_core
