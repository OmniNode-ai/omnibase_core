---
schema_version: "1.0.0"
ticket_id: OMN-21373
title: "S-a: Agent Skills model, parser and renderer in omnibase_core"
summary: Slice S-a of the Agent Skills amendment. A typed model of the Agent Skills SKILL.md format (the
  six spec fields, the declared Claude Code extension keys, the body), a strict parser that loads frontmatter
  with strictyaml the way the reference validator does, a tolerant reader for today's files, and a deterministic
  renderer with two profiles (AGENT_SKILLS and CLAUDE_CODE). The release of the model (the slice's AC6)
  is cut separately through the release train.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21373-sa-agent-skills-model
    statement: Every SKILL.md parses into one typed model whose spec-only rendering passes the reference
      validator, with every divergence from it declared under its own rule name.
    acceptance:
      - id: AC1
        statement: "AC1: on every fixture, the model's reference verdict equals `skills-ref validate`
          for the AGENT_SKILLS profile (and for CLAUDE_CODE after removing declared extension keys) --
          falsifier: the agreement test lists any fixture whose verdicts differ."
      - id: AC2
        statement: "AC2: `parse(render(m)) == m` for every model the property test generates, and `render(parse(x))
          == x` for every canonical fixture -- falsifier: either assertion fails."
      - id: AC3
        statement: "AC3: the field limits are 64, 1024 and 500 and the six spec fields are the only top-level
          fields the AGENT_SKILLS profile renders -- falsifier: a 65-character name, a 1025-character
          description, a 501-character compatibility or a seventh top-level key in an AGENT_SKILLS render
          is accepted."
      - id: AC4
        statement: "AC4: the new core modules import only omnibase_core, the standard library, pydantic,
          PyYAML and strictyaml; strictyaml is a pinned runtime dependency with its uv.lock change --
          falsifier: uv.lock on the PR head has no strictyaml entry, or the boundary import check over
          the added files reports any other top-level package."
      - id: AC5
        statement: "AC5: the canonical file shape check passes on every new file -- falsifier: `python
          -m omnibase_core.validators.canonical_file_shape --base origin/dev --head HEAD` exits nonzero."
      - id: AC7
        statement: "AC7: read_skill_md reads every SKILL.md of the measured skill trees without error,
          and parse_skill_md refuses exactly the files counted as failing -- falsifier: the corpus test
          disagrees with either."
  - id: req-omn21373-sd1-skill-readers
    statement: The core skill readers read skill_kind and backing_node through read_skill_md, from top-level
      frontmatter or from metadata.
    acceptance:
      - id: AC10
        statement: "S-d1 AC1: each reads `skill_kind` and `backing_node` through `read_skill_md` from
          top level or from `metadata`, with tests for both placements and for a today's-format file with
          no `name` -- falsifier: a test with the key only under `metadata` fails, or the module still
          holds its own frontmatter regex (`git grep -n '_FRONTMATTER_RE' -- src/omnibase_core/validators/skill_dispatch_receipt_mode.py`
          prints a line)."
evidence_requirements:
  - kind: tests
    description: The agreement suite, the round-trip property test, the codec tests and the corpus test.
    command: uv run pytest tests/unit/models/skill tests/unit/handlers/test_handler_agent_skill_codec.py
      -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21373-sa-ac1
    description: The agreement test runs the pinned skills-ref validator over every rule fixture and compares
      its verdict, mapped to rule ids, with the model's reference verdict.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/skill/test_agent_skill_agreement.py -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn21373-sa-ac2
    description: The hypothesis round-trip property test and the canonical fixture byte comparison.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/skill/test_model_agent_skill.py tests/unit/models/skill/test_agent_skill_canonical_fixtures.py
          -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn21373-sa-ac3
    description: The field limit tests and the AGENT_SKILLS top-level key check on every rendered fixture.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/skill/test_model_agent_skill.py tests/unit/models/skill/test_agent_skill_agreement.py
          -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
  - id: dod-omn21373-sa-ac4
    description: The codec import test, and strictyaml pinned in pyproject.toml and locked in uv.lock.
    source: manual
    checks:
      - check_type: command
        check_value: grep -q '^name = "strictyaml"' uv.lock && grep -q '"strictyaml==1.7.3"' pyproject.toml
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn21373-sa-ac5
    description: The Agent Skills modules load from canonical source locations and declare at most one
      class per file with the appropriate Model or Enum prefix. The repository shape check also runs over
      the PR's files against dev. The module checks fail when the implementation is absent at the merge
      base, instead of treating an empty diff as evidence for this change.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/skill/test_agent_skill_file_shape.py -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run python -m omnibase_core.validators.canonical_file_shape --base origin/dev
          --head HEAD
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn21373-sa-ac7
    description: The corpus test over the measured skill trees, given as a JSON list of skill roots and
      their expected outcome in .onex_state/agent_skill_corpus.json; when that manifest is absent it runs
      over the committed fixture tree instead of skipping.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/skill/test_agent_skill_corpus.py -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC7
  - id: dod-omn21373-sa-deploy-readback-on-dev
    description: Deploy probe. omnibase_core is a library, so the live surface for this change is its
      dev branch. The probe reads the merged codec handler from dev and fails until parse_skill_md and
      render_skill_md are there. Run at the local done gate, after merge.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/handlers/handler_agent_skill_codec.py?ref=dev"
          --jq .content | base64 -d | grep -c -e 'def parse_skill_md' -e 'def render_skill_md'
  - id: dod-omn21373-sa-deploy-hosted-readback
    description: Hosted deploy probe for the library's codec handler. The codec tests parse, check and
      render SKILL.md files through the handler's public functions.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/handlers/test_handler_agent_skill_codec.py -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21373-sd1-ac10
    description: The two skill readers use the tolerant reader for top-level and metadata values, and
      the dispatch receipt-mode validator no longer holds its own frontmatter regex.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validators/test_skill_dispatch_receipt_mode.py tests/unit/validation/test_validator_skill_backing_node.py
          -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: test -z "$(git grep -n '_FRONTMATTER_RE' -- src/omnibase_core/validators/skill_dispatch_receipt_mode.py)"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC10
  - id: dod-omn21373-sd1-deploy-hosted-readback
    description: "Hosted deploy probe for the two skill readers: their tests read skill_kind and backing_node
      from top level and from metadata through read_skill_md."
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/validators/test_skill_dispatch_receipt_mode.py tests/unit/validation/test_validator_skill_backing_node.py
          -n 0 -q
        cwd: ${OMNI_HOME}/omnibase_core
