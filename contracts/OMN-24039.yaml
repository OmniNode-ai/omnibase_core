ticket_id: OMN-24039
title: The delegation call time limit for each kind of task is a setting in the overlays repository
summary: The inference intent that the delegation orchestrator sends to the inference effect gains one
  optional field, task_type, the delegation task class the call serves. The inference effect in omnimarket
  reads it to look up the call time ceiling of that class in the deployment overlay instead of a constant
  in its contract. The field is additive, defaults to None and stays off the wire when absent, so an older
  producer's intent still validates. The reader, the effect change and the overlay values are in omnimarket
  and the overlays repository under the same ticket.
