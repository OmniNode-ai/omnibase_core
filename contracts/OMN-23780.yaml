---
schema_version: 1.0.0
ticket_id: OMN-23780
title: "omnibase_core deletes the second ticket contract model and the validator, script and types only
  it used"
summary: "The second ticket contract model, its validator, result type, input type and script, and their
  tests, are deleted, and the inventory ratchet lists ModelTicketContract as the one ticket contract model."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn23780-one-ticket-contract-model
    statement: "ModelTicketContract is the only ticket contract model in core, and no file names a deleted
      module."
    acceptance:
      - id: AC1
        statement: "AC1: the inventory lists ModelTicketContract as the only ticket contract model, and
          a planted second one fails"
      - id: AC2
        statement: "AC2: no file in the repository names a deleted module"
      - id: AC3
        statement: "AC3: core CI is green after the deletion"
evidence_requirements:
  - kind: tests
    description: "The inventory ratchet passes at the checkout with the second model and its validator
      gone."
    command: "uv run pytest tests/unit/test_ticket_model_inventory.py -q --no-cov -o addopts='' -n 0"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23780-ac1-only-one-ticket-contract-model
    description: "the inventory lists ModelTicketContract as the only ticket contract model, and a planted
      second one fails"
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/test_ticket_model_inventory.py -q --no-cov -o addopts=''
          -n 0 -k only_one_ticket_contract_model"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn23780-ac2-no-deleted-module-named
    description: "no tracked file names a deleted module"
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: command
        check_value: "! git grep -n -E 'validate_ticke[t]_contract|ModelLinearTicke[t]Contract|validators.validatio[n]_result|typed_dict_ticke[t]_input|validate-pr-ticket[s]'"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn23780-ac3-inventory-and-standard-form-pass
    description: "the inventory ratchet and the standard-form tests pass at the checkout after the deletion"
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/test_ticket_model_inventory.py tests/unit/models/ticket/test_model_ticket_contract_standard_form.py
          -q --no-cov -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnibase_core
