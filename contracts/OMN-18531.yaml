---
schema_version: 1.0.0
ticket_id: OMN-18531
title: Context-source contract in omnibase_core (plan task TC.1, core half)
summary: omnibase_core half of plan task TC.1. Adds ModelContextSourceRequest, ModelContextSourceEntry,
  ModelContextSourceResult, ModelContextCallerScope, ModelContextAccess and ModelContextSourceSpan, the
  status, supersession, span-unit and error-code enums, and appends POLICY_SCOPE_RULE to EnumSelectionReason.
  The omnibase_spi ProtocolContextSource and its layering criterion land in a follow-up PR against the
  core release that carries these models.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18531-tc1-entry-validation
    statement: Context-source entries refuse a text that does not hash to its text_sha256 and a verbatim
      claim with no source_ref or span.
    acceptance:
      - id: AC1
        statement: 'AC1: the models are frozen with `extra="forbid"`, and an entry whose `text` does not
          hash to its `text_sha256` fails validation -- falsifier: a fixture entry with a mismatched hash
          that validates.'
      - id: AC2
        statement: 'AC2: an entry marked `verbatim_verified: true` without a `source_ref` or a `span`
          fails validation -- falsifier: such an entry validates.'
  - id: req-omn18531-tc1-selection-reason
    statement: POLICY_SCOPE_RULE is appended to EnumSelectionReason without moving an existing member.
    acceptance:
      - id: AC4
        statement: 'AC4: the existing `EnumSelectionReason` members keep their values and order -- falsifier:
          enum test.'
  - id: req-omn18531-tc1-access
    statement: A context-source request carries the tenant it is made for and cannot be built without
      it.
    acceptance:
      - id: AC5
        statement: 'AC5: `ModelContextSourceRequest` refuses construction without `access`, and an `access`
          without `tenant_id` -- falsifier: either validates.'
  - id: req-omn18531-tc1-result
    statement: A context-source result carries paging, counts and timings, and a failed response is a
      typed error, never an empty resolved.
    acceptance:
      - id: AC6
        statement: 'AC6: `ModelContextSourceResult` carries `has_more`, per-source entry counts and per-leg
          timings as typed fields, and a response that fails validation yields a typed error status, never
          an empty `resolved` -- falsifier: a result without those fields validates, or an invalid response
          becomes an empty result.'
evidence_requirements:
  - kind: tests
    description: Context-source contract model tests and the EnumSelectionReason test.
    command: uv run pytest tests/unit/models/context/test_model_context_source_contract.py tests/unit/enums/test_enum_selection_reason.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18531-tc1-ac1-frozen-and-hash
    description: The models are frozen with extra forbid; a mismatched text_sha256 fails validation.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/context/test_model_context_source_contract.py -q
          -k 'TestFrozenAndForbid or TestEntryHash'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn18531-tc1-ac2-verbatim-needs-source
    description: verbatim_verified without source_ref or span fails validation.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/context/test_model_context_source_contract.py -q
          -k 'TestVerbatimVerified'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn18531-tc1-ac4-selection-reason-order
    description: The six EnumSelectionReason members are in order, the original five unchanged.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/enums/test_enum_selection_reason.py -q
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn18531-tc1-ac5-access-required
    description: A request without access, and an access without a tenant_id, fail validation.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/context/test_model_context_source_contract.py -q
          -k 'TestAccessAndRequest'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn18531-tc1-ac6-result-typed-error
    description: The result carries has_more, entry_counts and leg_timings_ms; an invalid response becomes
      an UNAVAILABLE result with an error code, never an empty resolved.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/models/context/test_model_context_source_contract.py -q
          -k 'TestResult'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC6
  - id: dod-omn18531-tc1-deploy-readback-on-dev
    description: Deploy probe. omnibase_core is a library, so the live surface for this change is its
      dev branch. The probe reads the merged result model from dev and fails until the typed error path
      is there. Run at the local done gate, after merge.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/models/context/model_context_source_result.py?ref=dev"
          --jq .content | base64 -d | grep -c -e INVALID_RESPONSE -e from_raw_response
  - id: dod-omn18531-tc1-deploy-hosted-readback
    description: Hosted deploy probe. The result-model tests run the invalid-response path as production
      wires it (from_raw_response over a tampered entry) and assert an UNAVAILABLE result with INVALID_RESPONSE.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/models/context/test_model_context_source_contract.py -q
          -k 'invalid_response_yields_typed_error_not_empty_resolved or raw_valid_response_round_trips'
        cwd: ${OMNI_HOME}/omnibase_core
