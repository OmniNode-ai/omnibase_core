---
schema_version: "1.0.0"
ticket_id: OMN-18531
title: "TA.2 Session and tier factors in core: EnumContextFactor gains fifteen members"
summary: Plan task TA.2 of the Claude Code context and delegation adapter plan, number 1 in the compaction
  order. EnumContextFactor in omnibase_core gains the six session factors and the nine tier factors, appended
  in order after the existing five, so the context pack builder can carry operator rulings, open work
  and the other session state a compaction needs.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - omnibase_core.enums.enum_context_factor.EnumContextFactor
requirements:
  - id: req-omn18531-ta2-factors
    statement: EnumContextFactor carries the session and tier factors in plan order without disturbing
      the existing members or duplicating the meaning of one.
    acceptance:
      - id: AC1
        statement: "AC1: the six members of section 4, then the nine of section 4.1, exist, appended in
          that order after the existing five, with string values equal to their lower-case names -- falsifier:
          enum test, or an existing member's position changed."
      - id: AC2
        statement: "AC2: no member duplicates an existing one's meaning: patterns and exemplars use `ARCHITECTURE_PATTERNS`
          and `EXEMPLAR` -- falsifier: a new member named for patterns or exemplars."
      - id: AC3
        statement: "AC3: `node_context_roi_runner` tests in omnimarket pass unchanged against the new
          core -- falsifier: any change in its golden output."
evidence_requirements:
  - kind: tests
    description: Enum order, value and no-duplicate tests, and the pack schema member set.
    command: uv run pytest tests/unit/enums/test_enum_context_factor.py tests/models/pack/test_context_pack_schema.py
      -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18531-ta2-order
    description: The fifteen members exist after the existing five, in plan order, with lower-case name
      values.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/enums/test_enum_context_factor.py -q -n 0 --no-cov -k "members_in_order
          or value_is_lower_case_name or existing_members_keep"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1]
  - id: dod-omn18531-ta2-no-duplicates
    description: No added member is named for patterns or exemplars.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/enums/test_enum_context_factor.py -q -n 0 --no-cov -k no_member_duplicates
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC2]
  - id: dod-omn18531-ta2-roi-runner
    description: The omnimarket node_context_roi_runner tests pass against this core.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: cd ${OMNI_HOME}/omnimarket && OMNIMARKET_ALLOW_PYTHONPATH_OVERRIDE=1 PYTHONPATH=${OMNI_HOME}/omnibase_core/src
          .venv/bin/python -m pytest tests/nodes/node_context_roi_runner -q -n0 -p no:cacheprovider
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC3]
