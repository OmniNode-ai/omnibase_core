---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: Contract Compliance dep-scope keeps the dependency-bot exemption on dev push
summary: On a push event the Contract Compliance Check dep-scope step resolves the commit's merged pull
  request and applies the unchanged dependency-bot rules, so a merged workflow-only dependency-bot PR
  no longer fails the dev push run for a missing Evidence-Source line; with no merged PR the step stays
  fail-closed.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn17427-dep-scope-push
    statement: The dep-scope step must take the same dependency-bot exemption decision on a dev push as
      on the merged pull request's own run, and fail closed when no merged pull request is found.
    acceptance:
      - id: AC1
        statement: "AC1: on push the step classifies the commit's merged pull request with the dependency-bot
          rules (author, title, workflow-only files): a dependency-bot workflow-only PR is exempt, a product
          file, a human author, another title or an empty file list is not. -- falsifier: uv run pytest
          tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py -q -k test_push_classifies_the_merged_pr"
      - id: AC2
        statement: "AC2: on push with no merged pull request for the commit the step leaves exempt=false
          and fetches no file list. -- falsifier: uv run pytest tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py
          -q -k test_push_without_a_merged_pr_returns_without_fetching_files"
      - id: AC3
        statement: "AC3: on push the step selects the latest merged pull request for the commit, the same
          selection the evidence resolver makes. -- falsifier: uv run pytest tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py
          -q -k test_push_selects_the_latest_merged_pr_like_the_resolver"
  - id: req-omn17427-writer-pin-only-in-job
    statement: The caller-evidence job must derive the OCC writer app dependency-pin-only exemption with
      the pinned producer classifier at the exact head and fail closed on every error.
    acceptance:
      - id: AC4
        statement: "AC4: The caller-evidence job exempts an OCC writer app version bump using the pinned
          producer classifier over the exact head diff against the merge base. -- falsifier: uv run pytest
          tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
      - id: AC5
        statement: "AC5: Every broken or missing pinned verifier leaves the writer app not-exempt, emits
          exactly one false output and exits successfully so the existing evidence gate continues. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
      - id: AC6
        statement: "AC6: Only an unproven writer app reaches the in-job classifier after verifier installation,
          and its exemption gates every later evidence step in dod-verify alone. -- falsifier: uv run
          pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
evidence_requirements:
  - kind: tests
    description: "on push the step classifies the commit's merged pull request with the dependency-bot
      rules (author, title, workflow-only files): a dependency-bot workflow-only PR is exempt, a product
      file, a human author, another title or an empty file list is not."
    command: "uv run pytest tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py
      -q -k test_push_classifies_the_merged_pr"
  - kind: tests
    description: "on push with no merged pull request for the commit the step leaves exempt=false and
      fetches no file list."
    command: "uv run pytest tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py
      -q -k test_push_without_a_merged_pr_returns_without_fetching_files"
  - kind: tests
    description: "on push the step selects the latest merged pull request for the commit, the same selection
      the evidence resolver makes."
    command: "uv run pytest tests/unit/scripts/ci/test_contract_compliance_dep_scope_push_omn17427.py
      -q -k test_push_selects_the_latest_merged_pr_like_the_resolver"
  - kind: tests
    description: "The caller-evidence job exempts an OCC writer app version bump using the pinned producer
      classifier over the exact head diff against the merge base."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
  - kind: tests
    description: "Every broken or missing pinned verifier leaves the writer app not-exempt, emits exactly
      one false output and exits successfully so the existing evidence gate continues."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
  - kind: tests
    description: "Only an unproven writer app reaches the in-job classifier after verifier installation,
      and its exemption gates every later evidence step in dod-verify alone."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
