---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: Caller evidence derives the OCC writer app dependency-pin-only exemption in-job
summary: The caller-evidence job derives the OCC writer app dependency-pin-only exemption using the pinned
  producer classifier at the exact head and fails closed on every error. OMN-20074 retires the Contract
  Compliance dep-scope push requirement and AC1-AC3 with the OCC evidence job.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  # OMN-20074: req-omn17427-dep-scope-push and AC1-AC3 retired with contract-compliance.
  - id: req-omn17427-writer-pin-only-in-job
    statement: The caller-evidence job must derive the OCC writer app dependency-pin-only exemption with
      the pinned producer classifier at the exact head and fail closed on every error.
    acceptance:
      - id: AC4
        statement: "AC4: The caller-evidence job exempts an OCC writer app version bump using the pinned
          producer classifier over the exact head diff against the merge base. -- falsifier: uv run pytest
          tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
      - id: AC5
        statement: "AC5: Every broken or missing pinned verifier leaves the writer app not-exempt, emits
          exactly one false output and exits successfully so the existing evidence gate continues. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
      - id: AC6
        statement: "AC6: Only an unproven writer app reaches the in-job classifier after verifier installation,
          and its exemption gates every later evidence step in dod-verify alone. -- falsifier: uv run
          pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - id: req-omn17427-named-tests-on-the-wire
    statement: The delegation request wire carries the tests a code answer is graded on, with their sources,
      and the quality gate input carries the executed run, so the deployed lane can grade code.
    acceptance:
      - id: AC7
        statement: "AC7: A delegation request carries named tests with inline sources, a gate input carries
          the executed named-test run, unsafe or incomplete naming is refused, and a request naming none
          keeps its wire shape. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py
          -q"
  - id: req-omn17427-merged-fix-revert-skips-contracts
    statement: The merged-fix control reverts only the merged fix's product paths, never a contract file,
      so a fix whose contract the base later amended still yields a control.
    acceptance:
      - id: AC8
        statement: "AC8: A Binds-Merged-Fix control reverts the merged fix's product change and not its
          contracts/OMN-<n>.yaml, also when the base amended that contract after the fix, and a merged
          fix that changes only tests and a contract is still refused as changing no product path. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
          or only_test_and_contract\""
evidence_requirements:
  - kind: tests
    description: "The caller-evidence job exempts an OCC writer app version bump using the pinned producer
      classifier over the exact head diff against the merge base."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
  - kind: tests
    description: "Every broken or missing pinned verifier leaves the writer app not-exempt, emits exactly
      one false output and exits successfully so the existing evidence gate continues."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
  - kind: tests
    description: "Only an unproven writer app reaches the in-job classifier after verifier installation,
      and its exemption gates every later evidence step in dod-verify alone."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - kind: tests
    description: "The delegation request and quality gate input carry named tests and their executed run;
      unsafe naming is refused and an unnamed request keeps its wire shape."
    command: "uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py -q"
  - kind: tests
    description: "A Binds-Merged-Fix control reverts the merged fix's product change and not its contract,
      also when the base amended that contract, and a test-and-contract-only fix is refused."
    command: "uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
      or only_test_and_contract\""
