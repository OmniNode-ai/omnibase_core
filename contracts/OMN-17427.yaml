        check_value: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC6
  - id: dod-omn-17427-named-tests-on-the-wire
    description: "A delegation request carries named tests with inline sources, a gate input carries the
      executed named-test run, unsafe or incomplete naming is refused, and a request naming none keeps
      its wire shape."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py
          -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC7
  - id: dod-omn-17427-merged-fix-revert-skips-contracts
    description: "A Binds-Merged-Fix control reverts the merged fix's product change and not its contracts/OMN-<n>.yaml,
      also when the base amended that contract after the fix, and a merged fix that changes only tests
      and a contract is still refused as changing no product path."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
