          test_writer_pin_only_step_exempts_a_version_bump"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn-17427-writer-pin-only-fails-closed
    description: "Every broken or missing pinned verifier leaves the writer app not-exempt, emits exactly
      one false output and exits successfully so the existing evidence gate continues."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn-17427-writer-pin-only-gates-evidence
