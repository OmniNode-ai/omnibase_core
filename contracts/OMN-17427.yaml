---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: Caller evidence derives the OCC writer app dependency-pin-only exemption in-job
summary: The caller-evidence job derives the OCC writer app dependency-pin-only exemption using the pinned
  producer classifier at the exact head and fails closed on every error. OMN-20074 retires the Contract
  Compliance dep-scope push requirement and AC1-AC3 with the OCC evidence job.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  # OMN-20074: req-omn17427-dep-scope-push and AC1-AC3 retired with contract-compliance.
  - id: req-omn17427-writer-pin-only-in-job
    statement: The caller-evidence job must derive the OCC writer app dependency-pin-only exemption with
      the pinned producer classifier at the exact head and fail closed on every error.
    acceptance:
      - id: AC4
        statement: "AC4: The caller-evidence job exempts an OCC writer app version bump using the pinned
          producer classifier over the exact head diff against the merge base. -- falsifier: uv run pytest
          tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
      - id: AC5
        statement: "AC5: Every broken or missing pinned verifier leaves the writer app not-exempt, emits
          exactly one false output and exits successfully so the existing evidence gate continues. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
      - id: AC6
        statement: "AC6: Only an unproven writer app reaches the in-job classifier after verifier installation,
          and its exemption gates every later evidence step in dod-verify alone. -- falsifier: uv run
          pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - id: req-omn17427-named-tests-on-the-wire
    statement: The delegation request wire carries the tests a code answer is graded on, with their sources,
      and the quality gate input carries the executed run, so the deployed lane can grade code.
    acceptance:
      - id: AC7
        statement: "AC7: A delegation request carries named tests with inline sources, a gate input carries
          the executed named-test run, unsafe or incomplete naming is refused, and a request naming none
          keeps its wire shape. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py
          -q"
  - id: req-omn17427-merged-fix-revert-skips-contracts
    statement: The merged-fix control reverts only the merged fix's product paths, never a contract file,
      so a fix whose contract the base later amended still yields a control.
    acceptance:
      - id: AC8
        statement: "AC8: A Binds-Merged-Fix control reverts the merged fix's product change and not its
          contracts/OMN-<n>.yaml, also when the base amended that contract after the fix, and a merged
          fix that changes only tests and a contract is still refused as changing no product path. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
          or only_test_and_contract\""
  - id: req-omn17427-merged-fix-revert-skips-version-bookkeeping
    statement: The merged-fix control does not revert a path whose every changed line only sets a quoted
      version or digest value, so a fix whose release bump the base later moved still yields a control.
    acceptance:
      - id: AC33
        statement: "AC33: A Binds-Merged-Fix control reverts the merged fix's product change and not its
          version-only or digest-only lines, also when a later release moved them on the base; a fix whose
          pyproject.toml also changes a dependency still reverts that file as product, and a merged fix
          that changes only tests and version lines is refused as changing no product path. -- falsifier:
          uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"version_bookkeeping
          or dependency_change_is_reverted\""
  - id: req-omn17427-ci-inherits-from-core
    statement: A change to omnibase_core's workflows must not add a reusable workflow or action reference
      to an organization repository other than omnibase_core, so the CI hosted outside core only shrinks.
    acceptance:
      - id: AC9
        statement: "AC9: The ci-inheritance check fails a change that adds a reusable workflow or action
          reference to an organization repository other than the host, and passes a pin bump, a move between
          files, a removal or a reference to the host. -- falsifier: uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py
          tests/unit/handlers/test_handler_ci_inheritance_cli.py -q"
  - id: req-omn17427-validators-emit-run-and-fire-events
    statement: A validator that writes its canonical report through the report-write effect also emits
      a run event, and a fire event for each finding that fired, so the work ledger can show which checks
      ever catch anything.
    acceptance:
      - id: AC10
        statement: "AC10: A report yields one run event and one fire event per WARN, FAIL or ERROR finding
          and none for PASS, SKIP or NOT_APPLICABLE; an empty report still yields its run event; the report-write
          effect appends the events beside the report. -- falsifier: uv run pytest tests/unit/handlers/test_handler_validator_run_events.py
          tests/unit/nodes/node_validation_report_write_effect -q"
  - id: req-omn17427-yamlfmt-download-retry-window
    statement: The pinned yamlfmt download in the CI test splits must retry with a fixed delay and a bounded
      total budget long enough to outlast a minute-long upstream gateway failure.
    acceptance:
      - id: AC11
        statement: "AC11: The Install pinned yamlfmt step of the test-parallel job retries its download
          for at least sixty seconds in total under a retry budget of 120 to 300 seconds. -- falsifier:
          uv run pytest tests/ci/test_yamlfmt_download_retry_window_omn17427.py -q"
  - id: req-omn17427-same-ci-per-repository-type
    statement: A change to a repository's workflows must not add a job defined inline in that repository's
      own workflow unless the repository is omnibase_core and the workflow is reusable, so CI that differs
      between repositories of the same type only shrinks.
    acceptance:
      - id: AC12
        statement: "AC12: The repository-jobs check fails a change that adds an inline job to a non-reusable
          workflow of the host or to any workflow of another repository, and passes a job of a host reusable
          workflow, a job that calls a reusable workflow, a step change inside an existing job and a removal.
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_ci_repository_jobs.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
          -q"
  - id: req-omn17427-pr-title-check-core-reusable
    statement: The PR title check runs from one reusable workflow in omnibase_core that each repository
      of the same type calls with only its omnimarket version, under the unchanged required context.
    acceptance:
      - id: AC13
        statement: "AC13: pr-title-check.yml is a workflow_call workflow whose one job check-title runs
          the pinned title node, omnibase_core's pr-title-check-caller.yml job pr-title calls it with
          only omnimarket-version, the call composes pr-title / check-title and a merge_group call accepts
          without the node. -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py
          -q"
  - id: req-omn17427-receipt-gate-states-caller-mode
    statement: The receipt-gate reusable states in its own header that evidence-source caller is the only
      accepted mode, so omnibase_core carries no live use of the change-control repository.
    acceptance:
      - id: AC14
        statement: "AC14: receipt-gate.yml sets `evidence-source: caller` as its only accepted value in
          its own header, and the pattern that reads that line does not match the old wording. -- falsifier:
          uv run pytest tests/ci/test_receipt_gate_occ_mode_removed_omn20074.py -q -k test_receipt_gate_states_its_single_mode_as_evidence_source_caller"
  - id: req-omn17427-occ-contract-checks-in-core
    statement: omnibase_core must ship the check-value lint, the substance floor and the compliance-check
      primitives that omnimarket's parity tests import from onex_change_control, answering as the originals
      do.
    acceptance:
      - id: AC15
        statement: "AC15: The core ports of lint_contract_check_values, check_contract_substance_floor
          and the contract_compliance_check primitives return the onex_change_control originals' recorded
          verdicts on every case of the parity corpus. -- falsifier: uv run pytest tests/unit/handlers/test_occ_contract_checks_parity.py
          -q"
  - id: req-omn17427-hook-push-rehearsal
    statement: A pull request that changes a hook, hook script, preflight or push path rehearses the repository's
      pre-push set as a controller worker pushes, before a worker push is refused.
    acceptance:
      - id: AC16
        statement: "AC16: hook-push-rehearsal.yml pushes a sample commit through the installed pre-push
          hook to a local bare remote on a matching pull request only, and fails when the push is refused,
          runs past the timeout or a hook leaves a file in the work tree. -- falsifier: uv run pytest
          tests/unit/scripts/ci/test_hook_push_rehearsal_workflow_omn17427.py -q"
  - id: req-omn17427-mac-migration-ledger-schema-alias
    statement: The deployment-topology migration-ledger model imports without the pydantic field-shadow
      warning and without a process-global warning filter, while a contract key `schema` still validates
      and serializes by alias.
    acceptance:
      - id: AC17
        statement: "AC17: Importing the migration-ledger module in a fresh interpreter under -W error::UserWarning
          succeeds with empty stderr and without the module calling warnings.filterwarnings, and a payload
          keyed `schema` validates to schema_name and dumps back to `schema`. -- falsifier: uv run pytest
          tests/unit/models/core/test_model_deployment_topology_database.py -q -k migration_ledger"
  - id: req-omn17427-coderabbit-gate-removed
    statement: CodeRabbit is retired, so omnibase_core must carry no CodeRabbit review-thread gate, no
      required-check row for its context and no CI Summary anchor for it.
    acceptance:
      - id: AC18
        statement: "AC18: cr-thread-gate.yml and the ci.yml gate caller are absent, the required-checks
          manifest carries the context gate / CodeRabbit Thread Check only as a RETIRED row, and the CI
          Summary gate does not anchor it. -- falsifier: uv run pytest tests/ci/test_coderabbit_gate_removed_omn17427.py
          -q"
  - id: req-omn17427-brief-drafting-wire
    statement: The delegation wire request admits the brief_drafting task class, so a request for lane
      brief drafting is deliverable once the Market task-class contract declares it.
    acceptance:
      - id: AC19
        statement: "AC19: ModelDelegationRequest accepts task_type brief_drafting and its JSON schema
          enum is exactly the canonical sixteen classes. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_delegation_wire_models.py
          -q -k canonical"
  - id: req-omn17427-context-compaction-wire
    statement: The delegation wire request admits the context_compaction task class, so the model-written
      section of a compaction package is deliverable once the Market task-class contract declares it.
    acceptance:
      - id: AC38
        statement: "AC38: ModelDelegationRequest accepts task_type context_compaction and its JSON schema
          enum is exactly the canonical twenty-one classes. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_delegation_wire_models.py
          -q -k canonical"
  - id: req-omn17427-evidence-comment-wire
    statement: The delegation wire request admits the evidence_comment task class, so a request for a
      done-evidence comment draft is deliverable once the Market task-class contract declares it.
    acceptance:
      - id: AC32
        statement: "AC32: ModelDelegationRequest accepts task_type evidence_comment and its JSON schema
          enum is exactly the canonical twenty classes. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_delegation_wire_models.py
          -q -k canonical"
  - id: req-omn17427-no-legacy-landed-flip
    statement: The canonical handler-shape ratchet accepts a no-legacy flip that already landed on the
      live merge base, so a merged flip and the change that drops it from the baseline are not refused
      by the flip's own handler.
    acceptance:
      - id: AC20
        statement: "AC20: A no-legacy receipt whose flip landed with no handler before it passes after
          merge and drops from the baseline as a proven flip, while a handler on the base before the receipt
          landed, a node changed after it landed and a receipt that never landed are refused. -- falsifier:
          uv run pytest tests/unit/scripts/ci/test_canonical_handler_shape_no_legacy.py -q -k landed"
  - id: req-omn17427-ledger-row-required-cells
    statement: The typed work-ledger renderer writes the cells the ledger row grammar requires, so a rendered
      CLAIM carries worktree= and a rendered RULING carries question=.
    acceptance:
      - id: AC21
        statement: "AC21: A rendered CLAIM carries a worktree= cell (the claim's own worktree, else none),
          a rendered RULING carries a question= cell (its own question, else the question it answers),
          and a ruling naming neither is refused. -- falsifier: uv run pytest tests/unit/models/events/work/test_work_ledger_render.py
          -q -k \"golden_row_per_kind or worktree or question\""
  - id: req-omn17427-external-default-deny
    statement: CI Summary fails on any external check-run on the head that no other layer accounts for
      unless it carries a dated, ticketed, expiring exclusion, so an unregistered context cannot go red
      while the umbrella reads green.
    acceptance:
      - id: AC22
        statement: "AC22: CI Summary judges every pull-request-event check-run outside this run and the
          registered contexts and passes only success, holds a running row pending, exempts only a row
          whose run event is a known non-pull-request event, and refuses a malformed or spent exclusion
          registry. -- falsifier: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -k \"ExternalDefaultDenySweep
          or ExternalSweepExclusions or SweepIsWired\""
  - id: req-omn17427-remove-repository-prose
    statement: Repository prose lives in the public knowledge base; remove the unused contribution, conduct,
      security and fixture guides and retain a short root README signpost.
    acceptance:
      - id: AC23
        statement: "AC23: The four unused prose guides and two unused evidence logs are absent and README.md
          has three to five lines including the public knowledge_base link; machine-read handshakes, changelog,
          templates and fixtures remain available."
  - id: req-omn17427-sweep-excludes-propagate-placeholder
    statement: CI Summary's external sweep excludes the skipped placeholder row propagate-config.yml posts
      on a path-matched pull request, with a dated, ticketed, expiring exclusion.
    acceptance:
      - id: AC30
        statement: "AC30: A skipped Propagate placeholder row on a pull request leaves CI Summary green
          and is reported as an applied exclusion, while an unregistered failing row beside it still fails
          the gate. -- falsifier: uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -k ExternalSweepExclusions
          -o addopts=''"
  - id: req-omn17427-readme-only-docs
    statement: Every tracked documentation format outside root README.md is refused except explicit reasoned
      machine inputs, requirements txt is always refused, the root README remains tracked, and knowledge-base
      repositories are exempt.
    acceptance:
      - id: AC24
        statement: "AC24: The strict documentation node refuses md, mdx, rst, adoc and txt files including
          a renamed extension and nested README, refuses requirements txt despite an exception, validates
          reasoned machine-input policy from the index, preserves the root README, exempts knowledge-base
          repositories and emits run/fire events on pass, fail and error. -- falsifier: uv run pytest
          tests/unit/nodes/node_readme_only_docs_effect/test_readme_only_docs.py -q -o addopts=''"
      - id: AC25
        statement: "AC25: The exported hook and core's reusable workflow invoke the same documentation
          node on the entire tracked tree without an outcome filter; core preserves kb-doc-gate / kb-doc-gate,
          the reusable resolves its immutable validator revision and retains report/event artifacts even
          on failure. -- falsifier: uv run pytest tests/unit/nodes/node_readme_only_docs_effect/test_readme_only_docs.py
          -q -o addopts='' -k core_ci"
      - id: AC26
        statement: "AC26: The retained README has no broken local documentation links after the prose
          documents are removed. -- falsifier: uv run onex-validate-links --verbose"
  - id: req-omn17427-shared-token-quota
    statement: Same-repository reads use the run token and new shared-token uses require exact exceptions.
    acceptance:
      - id: AC27
        statement: "AC27: The enqueue shell reads repository metadata and PR state with the run token
          while retaining the existing identity for mutations and branch-protection reads. -- falsifier:
          uv run pytest tests/unit/validation/test_ci_shared_token_quota.py -q -k enqueue -o addopts=''"
      - id: AC28
        statement: "AC28: The shared-token policy node refuses unlisted, repeated, dynamic and stale-exception
          uses through its event-bus adapter. -- falsifier: uv run pytest tests/unit/validation/test_ci_shared_token_quota.py
          -q -o addopts=''"
      - id: AC29
        statement: "AC29: Required CI, the exported pre-commit hook and the reusable workflow invoke the
          same policy node without the shared token. -- falsifier: uv run pytest tests/unit/validation/test_ci_shared_token_quota.py
          -q -k surfaces -o addopts=''"
  - id: req-repo-evidence-caller-verifier-floor
    statement: The Repo Evidence Gate caller pins a verifier-version at or above the floor the evidence
      job needs, and a pre-commit hook refuses a lower pin.
    acceptance:
      - id: AC31
        statement: "AC31: The Repo Evidence Gate caller passes a verifier-version at or above 0.4.303;
          0.4.280 and 0.4.302 are refused and 0.4.303 and 0.4.305 are admitted; the call-repo-evidence-gate
          caller verifier floor pre-commit hook runs this check. -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_verifier_floor_omn17427.py
          -q -p no:randomly --no-cov fails when the caller's verifier-version is below 0.4.303"
  - id: req-omn16926-cascade-range-cap-fails-the-leg
    statement: A dependency cascade leg whose pyproject.toml constraint does not admit the released version
      fails, and a leg with no lockfile change is reported as skipped only when uv.lock locks exactly
      the released version.
    acceptance:
      - id: AC34
        statement: "AC34: The cascade movable guard receives the released version as --target-version.
          -- falsifier: uv run pytest tests/scripts/test_dependency_cascade_range_cap_omn16926.py -q -k
          movable_guard_receives_the_released_version_as_target"
      - id: AC35
        statement: "AC35: The exact-pin rewrite runs before the movable guard, which runs before the lockfile
          upgrade. -- falsifier: uv run pytest tests/scripts/test_dependency_cascade_range_cap_omn16926.py
          -q -k pin_rewrite_runs_before_the_movable_guard"
      - id: AC36
        statement: "AC36: After the lockfile upgrade, a step not gated on SKIP passes only when uv.lock
          locks the released version, and fails naming both versions when it locks another version or
          does not lock the package. -- falsifier: uv run pytest tests/scripts/test_dependency_cascade_range_cap_omn16926.py
          -q -k verify_step"
      - id: AC37
        statement: "AC37: The Skip summary states the locked released version instead of already uses
          the latest version. -- falsifier: uv run pytest tests/scripts/test_dependency_cascade_range_cap_omn16926.py
          -q -k skip_summary_states_the_locked_version_not_latest"
  - id: req-omn17427-demo-test-contract-endpoint
    statement: The support-assistant demo integration test takes its local endpoint and model only from
      the contract-aware configuration boundary, with no direct environment reads and no endpoint, host,
      port or model fallback.
    acceptance:
      - id: AC34
        statement: "AC34: Neither the demo integration test module nor a conftest beside it reads os.getenv
          or os.environ or names a default host. -- falsifier: uv run pytest tests/integration/examples/demo/handlers/support_assistant/test_handler_integration.py
          -q -k test_module_reads_no_environment_and_names_no_default_host"
      - id: AC35
        statement: "AC35: An unset endpoint yields no config and a skip reason naming LOCAL_LLM_ENDPOINT,
          a set endpoint is used verbatim with the contract's model name, and an endpoint without an http
          or https scheme, host or explicit port raises CONFIGURATION_ERROR. -- falsifier: uv run pytest
          tests/integration/examples/demo/handlers/support_assistant/test_handler_integration.py -q -k
          TestLocalEndpointConfiguration"
evidence_requirements:
  - kind: tests
    description: "The caller-evidence job exempts an OCC writer app version bump using the pinned producer
      classifier over the exact head diff against the merge base."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
  - kind: tests
    description: "Every broken or missing pinned verifier leaves the writer app not-exempt, emits exactly
      one false output and exits successfully so the existing evidence gate continues."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
  - kind: tests
    description: "Only an unproven writer app reaches the in-job classifier after verifier installation,
      and its exemption gates every later evidence step in dod-verify alone."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - kind: tests
