  - id: dod-omn-17427-deploy-hosted-ci-inheritance
    description: Hosted deploy probe for the library's CI-inheritance handler and CLI. Read both published
      source files at the immutable PR implementation commit and compare their bytes with the checked-out
      product, then exercise rejection of new references and acceptance of existing references. A missing
      published file, different implementation or incorrect handler behavior fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/a8b2509915d6fee19d3a5a26bcae016aaddfcf29/src/omnibase_core/handlers/handler_ci_inheritance.py
          | cmp - src/omnibase_core/handlers/handler_ci_inheritance.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/4ebe05bc64d25f5e6260d665a981a9a269e750fd/src/omnibase_core/handlers/handler_ci_inheritance_cli.py
          | cmp - src/omnibase_core/handlers/handler_ci_inheritance_cli.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
          -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
