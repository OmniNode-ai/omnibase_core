    command: "uv run pytest tests/scripts/test_dependency_cascade_range_cap_omn16926.py -q"
  - kind: tests
    description: The demo integration test's endpoint configuration tests run without a local LLM server.
    command: uv run pytest tests/integration/examples/demo/handlers/support_assistant/test_handler_integration.py
      -q -k TestLocalEndpointConfiguration
emergency_bypass:
  enabled: false
  justification: ''
