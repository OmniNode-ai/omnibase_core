  - id: dod-omn-17427-ci-inherits-from-core
    description: "The ci-inheritance check fails a change that adds a reusable workflow or action reference
      to an organization repository other than the host, and passes a pin bump, a move between files,
      a removal or a reference to the host."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
          -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC9
  - id: dod-omn-17427-deploy-hosted-ci-inheritance
    description: Hosted deploy probe for the library's CI-inheritance handler and CLI. Read both published
      source files at the immutable PR implementation commit and compare their bytes with the checked-out
      product, then exercise rejection of new references and acceptance of existing references. A missing
      published file, different implementation or incorrect handler behavior fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/a8b2509915d6fee19d3a5a26bcae016aaddfcf29/src/omnibase_core/handlers/handler_ci_inheritance.py
          | cmp - src/omnibase_core/handlers/handler_ci_inheritance.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/a8b2509915d6fee19d3a5a26bcae016aaddfcf29/src/omnibase_core/handlers/handler_ci_inheritance_cli.py
          | cmp - src/omnibase_core/handlers/handler_ci_inheritance_cli.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
          -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC9
  - id: dod-omn-17427-validator-run-and-fire-events
    description: Hosted deploy probe for the validator run and fire events. Read the handler and the report-write
      effect at the immutable PR implementation commit and compare their bytes with the checked-out product,
      then exercise one run event for a passing report and a fire event for a failing one. A missing published
      file, different implementation or incorrect handler behavior fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/24c78505307f676a61a29b47656c8b58289c5309/src/omnibase_core/handlers/handler_validator_run_events.py
          | cmp - src/omnibase_core/handlers/handler_validator_run_events.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/24c78505307f676a61a29b47656c8b58289c5309/src/omnibase_core/nodes/node_validation_report_write_effect/handler.py
          | cmp - src/omnibase_core/nodes/node_validation_report_write_effect/handler.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_validator_run_events.py tests/unit/nodes/node_validation_report_write_effect
          -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC10
  - id: dod-omn-17427-yamlfmt-download-retry-window
    description: The Install pinned yamlfmt step of the test-parallel job retries its download for at
      least sixty seconds in total under a retry budget of 120 to 300 seconds, read from the checked-out
      ci.yml.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_yamlfmt_download_retry_window_omn17427.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC11
