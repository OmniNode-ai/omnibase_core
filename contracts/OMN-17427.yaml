---
schema_version: "1.0.0"
ticket_id: OMN-17427
title: Caller evidence derives the OCC writer app dependency-pin-only exemption in-job
summary: The caller-evidence job derives the OCC writer app dependency-pin-only exemption using the pinned
  producer classifier at the exact head and fails closed on every error. OMN-20074 retires the Contract
  Compliance dep-scope push requirement and AC1-AC3 with the OCC evidence job.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  # OMN-20074: req-omn17427-dep-scope-push and AC1-AC3 retired with contract-compliance.
  - id: req-omn17427-writer-pin-only-in-job
    statement: The caller-evidence job must derive the OCC writer app dependency-pin-only exemption with
      the pinned producer classifier at the exact head and fail closed on every error.
    acceptance:
      - id: AC4
        statement: "AC4: The caller-evidence job exempts an OCC writer app version bump using the pinned
          producer classifier over the exact head diff against the merge base. -- falsifier: uv run pytest
          tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
      - id: AC5
        statement: "AC5: Every broken or missing pinned verifier leaves the writer app not-exempt, emits
          exactly one false output and exits successfully so the existing evidence gate continues. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k
          test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
      - id: AC6
        statement: "AC6: Only an unproven writer app reaches the in-job classifier after verifier installation,
          and its exemption gates every later evidence step in dod-verify alone. -- falsifier: uv run
          pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - id: req-omn17427-named-tests-on-the-wire
    statement: The delegation request wire carries the tests a code answer is graded on, with their sources,
      and the quality gate input carries the executed run, so the deployed lane can grade code.
    acceptance:
      - id: AC7
        statement: "AC7: A delegation request carries named tests with inline sources, a gate input carries
          the executed named-test run, unsafe or incomplete naming is refused, and a request naming none
          keeps its wire shape. -- falsifier: uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py
          -q"
  - id: req-omn17427-merged-fix-revert-skips-contracts
    statement: The merged-fix control reverts only the merged fix's product paths, never a contract file,
      so a fix whose contract the base later amended still yields a control.
    acceptance:
      - id: AC8
        statement: "AC8: A Binds-Merged-Fix control reverts the merged fix's product change and not its
          contracts/OMN-<n>.yaml, also when the base amended that contract after the fix, and a merged
          fix that changes only tests and a contract is still refused as changing no product path. --
          falsifier: uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
          or only_test_and_contract\""
  - id: req-omn17427-ci-inherits-from-core
    statement: A change to omnibase_core's workflows must not add a reusable workflow or action reference
      to an organization repository other than omnibase_core, so the CI hosted outside core only shrinks.
    acceptance:
      - id: AC9
        statement: "AC9: The ci-inheritance check fails a change that adds a reusable workflow or action
          reference to an organization repository other than the host, and passes a pin bump, a move between
          files, a removal or a reference to the host. -- falsifier: uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py
          tests/unit/handlers/test_handler_ci_inheritance_cli.py -q"
  - id: req-omn17427-validators-emit-run-and-fire-events
    statement: A validator that writes its canonical report through the report-write effect also emits
      a run event, and a fire event for each finding that fired, so the work ledger can show which checks
      ever catch anything.
    acceptance:
      - id: AC10
        statement: "AC10: A report yields one run event and one fire event per WARN, FAIL or ERROR finding
          and none for PASS, SKIP or NOT_APPLICABLE; an empty report still yields its run event; the report-write
          effect appends the events beside the report. -- falsifier: uv run pytest tests/unit/handlers/test_handler_validator_run_events.py
          tests/unit/nodes/node_validation_report_write_effect -q"
  - id: req-omn17427-yamlfmt-download-retry-window
    statement: The pinned yamlfmt download in the CI test splits must retry with a fixed delay and a bounded
      total budget long enough to outlast a minute-long upstream gateway failure.
    acceptance:
      - id: AC11
        statement: "AC11: The Install pinned yamlfmt step of the test-parallel job retries its download
          for at least sixty seconds in total under a retry budget of 120 to 300 seconds. -- falsifier:
          uv run pytest tests/ci/test_yamlfmt_download_retry_window_omn17427.py -q"
  - id: req-omn17427-same-ci-per-repository-type
    statement: A change to a repository's workflows must not add a job defined inline in that repository's
      own workflow unless the repository is omnibase_core and the workflow is reusable, so CI that differs
      between repositories of the same type only shrinks.
    acceptance:
      - id: AC12
        statement: "AC12: The repository-jobs check fails a change that adds an inline job to a non-reusable
          workflow of the host or to any workflow of another repository, and passes a job of a host reusable
          workflow, a job that calls a reusable workflow, a step change inside an existing job and a removal.
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_ci_repository_jobs.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
          -q"
  - id: req-omn17427-pr-title-check-core-reusable
    statement: The PR title check runs from one reusable workflow in omnibase_core that each repository
      of the same type calls with only its omnimarket version, under the unchanged required context.
    acceptance:
      - id: AC13
        statement: "AC13: pr-title-check.yml is a workflow_call workflow whose one job check-title runs
          the pinned title node, omnibase_core's pr-title-check-caller.yml job pr-title calls it with
          only omnimarket-version, the call composes pr-title / check-title and a merge_group call accepts
          without the node. -- falsifier: uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py
          -q"
  - id: req-omn17427-receipt-gate-states-caller-mode
    statement: The receipt-gate reusable states in its own header that evidence-source caller is the only
      accepted mode, so omnibase_core carries no live use of the change-control repository.
    acceptance:
      - id: AC14
        statement: "AC14: receipt-gate.yml sets `evidence-source: caller` as its only accepted value in
          its own header, and the pattern that reads that line does not match the old wording. -- falsifier:
          uv run pytest tests/ci/test_receipt_gate_occ_mode_removed_omn20074.py -q -k test_receipt_gate_states_its_single_mode_as_evidence_source_caller"
  - id: req-omn17427-occ-contract-checks-in-core
    statement: omnibase_core must ship the check-value lint, the substance floor and the compliance-check
      primitives that omnimarket's parity tests import from onex_change_control, answering as the originals
      do.
    acceptance:
      - id: AC15
        statement: "AC15: The core ports of lint_contract_check_values, check_contract_substance_floor
          and the contract_compliance_check primitives return the onex_change_control originals' recorded
          verdicts on every case of the parity corpus. -- falsifier: uv run pytest tests/unit/handlers/test_occ_contract_checks_parity.py
          -q"
  - id: req-omn17427-hook-push-rehearsal
    statement: A pull request that changes a hook, hook script, preflight or push path rehearses the repository's
      pre-push set as a controller worker pushes, before a worker push is refused.
    acceptance:
      - id: AC16
        statement: "AC16: hook-push-rehearsal.yml pushes a sample commit through the installed pre-push
          hook to a local bare remote on a matching pull request only, and fails when the push is refused,
          runs past the timeout or a hook leaves a file in the work tree. -- falsifier: uv run pytest
          tests/unit/scripts/ci/test_hook_push_rehearsal_workflow_omn17427.py -q"
evidence_requirements:
  - kind: tests
    description: "The caller-evidence job exempts an OCC writer app version bump using the pinned producer
      classifier over the exact head diff against the merge base."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_exempts_a_version_bump"
  - kind: tests
    description: "Every broken or missing pinned verifier leaves the writer app not-exempt, emits exactly
      one false output and exits successfully so the existing evidence gate continues."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_fails_closed_on_a_broken_verifier"
  - kind: tests
    description: "Only an unproven writer app reaches the in-job classifier after verifier installation,
      and its exemption gates every later evidence step in dod-verify alone."
    command: "uv run pytest tests/ci/test_receipt_gate_writer_pin_only_in_job_omn17427.py -q -k test_writer_pin_only_step_is_gated_and_gates_every_evidence_step"
  - kind: tests
    description: "The delegation request and quality gate input carry named tests and their executed run;
      unsafe naming is refused and an unnamed request keeps its wire shape."
    command: "uv run pytest tests/unit/models/delegation/wire/test_omn17427_named_tests_wire.py -q"
  - kind: tests
    description: "A Binds-Merged-Fix control reverts the merged fix's product change and not its contract,
      also when the base amended that contract, and a test-and-contract-only fix is refused."
    command: "uv run pytest tests/ci/test_receipt_gate_merged_fix_control_omn17427.py -q -k \"merged_fix_contract_is_not_reverted
      or only_test_and_contract\""
  - kind: tests
    description: "The ci-inheritance check fails an added non-host reference and passes a pin bump, a
      move, a removal or a host reference."
    command: "uv run pytest tests/unit/handlers/test_handler_ci_inheritance.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
      -q"
  - kind: tests
    description: "A report yields one run event and one fire event per finding that fired, none for PASS,
      SKIP or NOT_APPLICABLE, and the report-write effect appends the events beside the report."
    command: "uv run pytest tests/unit/handlers/test_handler_validator_run_events.py tests/unit/nodes/node_validation_report_write_effect
      -q"
  - kind: tests
    description: "The Install pinned yamlfmt step retries its download for at least sixty seconds under
      a bounded retry budget."
    command: "uv run pytest tests/ci/test_yamlfmt_download_retry_window_omn17427.py -q"
  - kind: tests
    description: "The repository-jobs check fails an added inline job outside a host reusable workflow
      and passes a host reusable job, a reusable call, a step change and a removal."
    command: "uv run pytest tests/unit/handlers/test_handler_ci_repository_jobs.py tests/unit/handlers/test_handler_ci_inheritance_cli.py
      -q"
  - kind: tests
    description: "The PR title check runs from the core reusable workflow that each caller calls with
      only its omnimarket version, under the unchanged required context."
    command: "uv run pytest tests/ci/test_pr_title_check_omnimarket_node.py -q"
  - kind: tests
    description: "receipt-gate.yml sets evidence-source caller as its only accepted value in its own header."
    command: "uv run pytest tests/ci/test_receipt_gate_occ_mode_removed_omn20074.py -q -k test_receipt_gate_states_its_single_mode_as_evidence_source_caller"
  - kind: tests
    description: "The hook push rehearsal pushes a sample commit through the pre-push set on a matching
      pull request only and fails a refused, timed-out or tree-dirtying push."
    command: "uv run pytest tests/unit/scripts/ci/test_hook_push_rehearsal_workflow_omn17427.py -q"
