---
schema_version: "1.0.0"
ticket_id: OMN-20295
title: Pin the direct-model-call baseline's ticket and expiry refusals with tests
summary: The direct-model-call gate (check-direct-model-call) already refuses a planted direct chat-completions
  call. This change adds the missing regression tests for the baseline's admission rules in omnibase_core,
  where the detector lives, so an entry with no removal ticket or past its expiry is refused and a regression
  in either rule fails the test run. The refusal of an entry that names a Done ticket is not delivered
  here; it needs a ticket-state read the gate does not have.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20295-direct-model-call-gate
    statement: A direct model-endpoint call outside the delegation nodes is refused by the pre-commit
      hook and the required CI job, and the interim baseline admits only entries that name a cutover ticket
      and an unexpired date.
    acceptance:
      - id: AC1
        statement: "AC1: the gate refuses a planted direct chat-completions call in each owning repository,
          through both the pre-commit hook and the required CI job -- falsifier: uv run pytest on the
          gate's planted-violation fixtures passes with the detector disabled"
      - id: AC2
        statement: "AC2: an interim entry with no ticket, a Done ticket or a past expiry is refused --
          falsifier: the gate's fixture with an expired lab_crush.py entry is admitted"
evidence_requirements:
  - kind: tests
    description: Run the direct-model-call check node's unit tests, which plant each refused sample and
      the expired and ticketless baseline entries.
    command: uv run pytest tests/unit/nodes/node_direct_model_call_check_compute/test_node_direct_model_call_check_compute.py
      -q --no-cov
  - kind: ci
    description: Hosted-runner deploy check for the CLI's baseline-file admission behavior. The CLI must
      accept a valid ticketed entry and refuse ticketless and expired entries in temporary repositories.
    command: uv run pytest tests/unit/nodes/node_direct_model_call_check_compute/test_node_direct_model_call_check_compute.py
      -q --no-cov -k "cli_baseline_file_with_a_ticket or cli_refuses_a_baseline_file_entry"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20295-ac1-planted
    description: Each planted audit sample is refused by the detector and by the CLI, and the clean sample
      is accepted.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_direct_model_call_check_compute/test_node_direct_model_call_check_compute.py
          -q --no-cov -k "audit_sample_is_refused or cli_refuses_planted_sample or clean_sample"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1]
  - id: dod-omn20295-ac2-expired
    description: A baseline entry past its expiry is refused and no longer covers its site, in the detector
      and through the CLI baseline file (the lab_crush.py shaped fixture). The Done-ticket half of AC2
      is not covered by this entry.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_direct_model_call_check_compute/test_node_direct_model_call_check_compute.py
          -q --no-cov -k "expired_baseline_entry or past_its_expiry"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC2]
  - id: dod-omn20295-ac2-no-ticket
    description: A baseline entry whose ticket is empty or not an OMN id is refused, in the entry model
      and through the CLI baseline file.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_direct_model_call_check_compute/test_node_direct_model_call_check_compute.py
          -q --no-cov -k "without_a_ticket or with_no_ticket"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC2]
