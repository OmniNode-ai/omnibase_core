    description: "A fixture public workflow's literal, label-list, group, matrix and vars-computed jobs
      each fail (rule self_hosted_in_public); the input model carries no baseline and refuses one; the
      CLI refuses the retired --baseline, --base-ref and --baseline-ratchet-base-ref flags."
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/validation/test_validator_public_runner_placement.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn-21280-ac2-baseline-absent
    description: "The placement baseline path is absent, no repository file carries its name, the check's
