dod_evidence:
  - id: dod-omn23012-dev-tool-bounds
    description: "Both tool requirements carry an upper bound at the next release, and uv.lock pins the
      versions behind it. Fails at the merge base, where ruff is declared <0.18.0 and pyright has no upper
