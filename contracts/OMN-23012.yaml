      resolves the version this tree is measured clean under.
    acceptance:
      - id: AC1
        statement: 'AC1: each tool requirement carries the narrow upper bound, so no lock refresh can
          upgrade it -- falsifier: uv run --frozen pytest tests/ci/test_dev_tool_bounds_omn23012.py -q
          fails on a tree whose ruff bound is <0.18.0'
      - id: AC2
        statement: 'AC2: uv.lock pins ruff 0.14.14 and pyright 1.1.408, so the Code Quality job installs
          the ruff this tree is formatted for -- falsifier: the same test module, which reads each locked
          version'
evidence_requirements:
