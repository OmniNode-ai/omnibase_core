---
schema_version: "1.0.0"
ticket_id: OMN-21786
title: "omnibase_core contracts_and_di handler_hand_construction burn-down, slice rf1505-c3: handlers
  are injected, not hand-built"
summary: Eight check runtimes under nodes/ built the effects and COMPUTE nodes they call by hand, 29 handler_hand_construction
  findings. Each runtime now binds those nodes in one container and resolves every node it calls from
  it. No baseline entry, suppression or rule change.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21786-handlers-injected
    statement: The eight runtimes resolve the nodes they call from a container; no call site builds one
      by hand.
    acceptance:
      - id: AC1
        statement: "AC1: the handler_hand_construction count over the eight runtime modules drops from
          29 to zero and the repo total drops by 29 with no baseline entry or suppression added -- falsifier:
          onex run of runtime_validator_run with the contracts_and_di reference over omnibase_core src
          before and after, counts compared per rule"
      - id: AC2
        statement: "AC2: every touched node is resolved from the container and no call site constructs
          it by hand in the touched code -- falsifier: uv run pytest tests/unit/nodes/test_check_runtimes_resolve_nodes_from_container_c3.py
          and the touched nodes' unit tests, plus the checker re-run on the slice paths"
      - id: AC3
        statement: "AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body"
evidence_requirements:
  - kind: tests
    description: The container-resolution tests and the touched nodes' unit tests pass.
    command: uv run pytest tests/unit/nodes/test_check_runtimes_resolve_nodes_from_container_c3.py -n
      0 -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21786-ac1-count-drop
    description: The eight runtime sources draw no handler_hand_construction finding from the contracts_and_di
      checker, and the rule still fires on a planted construction.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/test_check_runtimes_resolve_nodes_from_container_c3.py
          -q -o addopts='' -k 'no_hand_construction_finding or still_refused'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21786-ac2-resolved-from-container
    description: Each runtime's container hands out the nodes it registered, and the touched nodes' own
      tests pass.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/test_check_runtimes_resolve_nodes_from_container_c3.py
          -q -o addopts='' -k 'container_hands_out'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: boundary-import-ac1-di-check
    description: The target passes the DI gate and its former baseline entry is absent.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          uv run python -c "from pathlib import Path; p = 'src/omnibase_core/nodes/node_boundary_import_check_effect/handler.py';
          assert Path(p).is_file(); assert not any(line.split() and line.split()[0] == p for line in Path('.onex_ratchets/handler_di_baseline.txt').read_text().splitlines())"
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run pre-commit run handler-di-gate --files src/omnibase_core/nodes/node_boundary_import_check_effect/handler.py
          src/omnibase_core/nodes/node_boundary_import_check_compute/runtime_node_boundary_import_check.py
          .onex_ratchets/handler_di_baseline.txt
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          uv run python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run
          omnibase_core.validation.validator_contracts_and_di:ValidatorContractsAndDi src/omnibase_core/nodes/node_boundary_import_check_effect/handler.py
          src/omnibase_core/nodes/node_boundary_import_check_compute/runtime_node_boundary_import_check.py
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1]
  - id: boundary-import-ac2-constructor-di
    description: Missing collaborators refuse construction; supplied collaborators handle all reads and
      report writes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_boundary_import_check_compute/test_runtime.py -q --no-cov
          -n 0 -k 'effect_ or container_reads_contract_dependencies'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC2]
  - id: boundary-import-ac3-lab-regression
    description: >-
      Repeat the lab-tested integration cases at the PR head. The publishing lane records the lab observation
      and PR title in the PR handoff.
    source: manual
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_boundary_import_check_compute/test_runtime.py -q --no-cov
          -n 0
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC3]
  - id: boundary-import-deploy-checkout
    description: >-
      Exercise contract-driven bootstrap, unbound dependency refusal, source reads, historical baseline
      comparisons and artifact persistence on the hosted checkout. This library change requires no external
      service or host installation.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: >-
          uv run pytest tests/unit/nodes/node_boundary_import_check_compute/test_runtime.py -q --no-cov
          -n 0
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1, AC2, AC3]
