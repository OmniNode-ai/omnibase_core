---
schema_version: 1.0.0
ticket_id: OMN-20940
title: omnibase_core produces the required hygiene context public-repo-hygiene / deployment-config and
  runs the hook locally
summary: 'Operator RULING 2026-10-10T21:57:38Z, amended 2026-10-10T22:07:49Z (''This should be in ci.''):
  no deployment or lab configuration lives in a shipped repository, and the check that refuses it is a
  required CI context on every shipped repository. omniclaude (OMN-20923) ships the check as the job deployment-config
  of its reusable hygiene workflow and as the exported deployment-config pre-commit hook. This change
  makes omnibase_core produce that context on every pull request, including forks, with no secret, and
  run the same check at the same commit in pre-commit. The context is added to the repository''s required
  status checks by a separate branch-protection or ruleset write, read back per repository.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-deployment-config-required-context
    statement: omnibase_core produces public-repo-hygiene / deployment-config on a pull request and runs
      the deployment-config hook in pre-commit at the same omniclaude commit.
    acceptance:
      - id: AC1
        statement: 'AC1: the caller workflow .github/workflows/ci.yml pins the reusable public-repo-hygiene
          workflow to the omniclaude commit that carries the deployment-config job, so the required context
          public-repo-hygiene / deployment-config is produced on every pull request -- falsifier: uv run
          pytest tests/ci/test_deployment_config_context_omn20940.py -q (fails at the merge base, where
          the pin is older and the hook is absent)'
      - id: AC2
        statement: 'AC2: the pre-commit configuration runs the deployment-config hook at the same omniclaude
          commit as the caller workflow, so the local and CI verdicts cannot diverge -- falsifier: uv
          run pytest tests/ci/test_deployment_config_context_omn20940.py -q (fails at the merge base,
          where the pin is older and the hook is absent)'
evidence_requirements:
  - kind: tests
    description: The caller and the hook both carry the deployment-config wiring at the head.
    command: test "$(grep -c 'public-repo-hygiene-reusable.yml@0c9f9146d8dd0446fc5c10952aa57247b3a880ae'
      .github/workflows/ci.yml)" = 1
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
