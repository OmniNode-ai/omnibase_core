    description: .github/workflows/ci.yml calls the reusable hygiene workflow at the omniclaude commit
      that carries the deployment-config job.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_deployment_config_context_omn20940.py -q
    binds_ac:
