---
schema_version: "1.0.0"
ticket_id: OMN-21531
title: "handler_di checker: constructor, call-site, fallback, reflective, optional-port, contract-self-load,
  module-singleton, sibling-import and contract-value-literal rules, replacing handler_di_gate"
summary: Checker K1 (plan task T0.3) in the generic validator format -- a pure checker_handler_di.py,
  a ValidatorBase validator_handler_di.py and validation/contracts/handler_di.validation.yaml with ten
  rule rows. The hook id handler-di-gate stays and runs the validator through the shared validator runtime;
  validators/handler_di_gate.py is deleted with its constants moved into the contract, and the scope widens
  from handlers/handler_*.py and nodes/node.py to every .py under handlers/ and nodes/ plus *_cli.py.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn21531-handler-di
    statement: Handlers, nodes and command line modules acquire every dependency from the container; ten
      rules judge it from facts, with every pattern and remediation text in the rule rows.
    acceptance:
      - id: AC1
        statement: "AC1: each of the ten rules has a violation fixture that yields exactly one issue with
          that rule_id and a clean fixture that yields none -- falsifier: uv run pytest tests/unit/validation/test_checker_handler_di.py
          -q"
      - id: AC2
        statement: "AC2: the hook id stays handler-di-gate and validators/handler_di_gate.py is deleted
          with its constants moved into the contract -- falsifier: git ls-files src/omnibase_core/validators/handler_di_gate.py
          prints nothing and git grep -n handler-di-gate -- .pre-commit-hooks.yaml finds the id on the
          new runtime"
      - id: AC3
        statement: "AC3: the scope covers a handler with no node and a *_cli.py -- falsifier: the fixture
          HandlerX().handle( in handlers/handler_x_cli.py is reported"
      - id: AC4
        statement: "AC4: KC-config: every pattern, name list, threshold and remediation text is a parameters
          entry of the checker's .validation.yaml -- falsifier: K10 rule_table_in_checker reports zero
          on the checker module, and a table-driven test mutates every parameters key of every rule row
          and asserts the verdict change, and an invalid contract fails to load"
      - id: AC5
        statement: "AC5: KC-a: the checker is pure; the runtime resolves the report writer from the container
          -- falsifier: the container spy test, the facts-only test with open and Path reads patched to
          raise, and call_site_construction reporting zero on the runtime module"
      - id: AC6
        statement: "AC6: KC-b: the changed source holds no host, port, topic, model name, timeout or URL
          -- falsifier: the new checker and validator modules carry no literal of that kind; the rule
          data and the planted fixtures are excluded by exclude_patterns"
      - id: AC7
        statement: "AC7: KC-replay: disabling a rule's row fails that rule's fixture and no other -- falsifier:
          uv run pytest tests/unit/validation/test_checker_handler_di.py -q -k disabling"
      - id: AC8
        statement: "AC8: KC-c: the in-memory default run equals the committed golden report and puts one
          run event carrying the report's run id; the broker overlay half waits on the overlay-pair ticket
          (plan task T3.1) -- falsifier: uv run pytest tests/unit/validation/test_checker_handler_di.py
          -q -k 'in_memory or overlay'"
evidence_requirements:
  - kind: tests
    description: K1 handler_di fixtures, parameters, scope, hook entry, golden and baseline.
    command: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: dod-omn21531-ac1-fixtures
    description: Each of the ten rules has a planted violation yielding exactly one issue with its rule_id
      and a clean twin yielding none.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "violation_fixture
          or clean_fixture or every_rule_has or planted_violations"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn21531-ac2-hook
    description: The hook id handler-di-gate runs the validator through the shared runtime and the old
      gate module is absent.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "hook_id_runs_on_the_new_runtime"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn21531-ac3-scope
    description: A handler with no node and a *_cli.py are reported; a module outside handlers, nodes
      and *_cli.py is not.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "scope
          or in_scope or not_judged"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
  - id: dod-omn21531-ac4-configuration
    description: Each parameters key of each rule row changes the verdict on the fixture it controls,
      a missing parameter or an invalid expression fails the contract load, and K10 reports zero on the
      checker.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py tests/unit/validation/test_validator_checker_rule_data.py
          -n 0 -q -k "parameter or contract_load or remediation_text or hold_no_rule_table or no_rule_table"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn21531-ac5-di
    description: The checker reads no file while open and Path reads raise; the container spy records
      the report writer resolved with get_service; the runtime module builds no handler at a call site.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "pure or
          resolves_the_report_writer or construct_no_handler"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn21531-ac6-no-literal
    description: The new modules hold no rule table or literal; the planted fixtures and the rule data
      are outside the shipped scope by exclude_patterns.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "no_rule_table
          or repository_or_baseline or holds_exactly"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC6
  - id: dod-omn21531-ac7-replay
    description: Disabling a rule row clears exactly that rule's fixtures; the corpus half runs when the
      T0.8 corpus lands.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "disabling
          or corpus"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC7
  - id: dod-omn21531-ac8-golden
    description: The in-memory default run equals the committed golden report and writes one run event
      carrying its run id; the broker overlay half is pending the overlay-pair ticket (plan task T3.1).
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_checker_handler_di.py -n 0 -q -k "in_memory
          or overlay"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC8
  - id: dod-omn21531-deploy-checkout-validator
    description: Hosted-runner execution of the K1 validator at the checkout. The focused tests need no
      private runtime or container daemon.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_checker_handler_di.py -q --no-cov
          -o addopts='' && .venv/bin/onex --help
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC1, AC2, AC3, AC4, AC5, AC6, AC7, AC8]
