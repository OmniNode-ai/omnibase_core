    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run pytest tests/unit/validators/test_pydantic_extra_forbid.py -q -n 0 --no-cov
          --reruns 0 -k 'modified_model_preserves_git_path_identity and newline and normal'
        cwd: ${OMNI_HOME}/omnibase_core
