    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validators/test_pydantic_extra_forbid.py -q -n 0 --no-cov
          --reruns 0 -k modified_model_preserves_git_path_identity
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac: [AC7]
  - id: dod-omn17904-hosted-deploy-probe
    description: This library validator has no service rollout. The hosted probe exercises the gate entry
