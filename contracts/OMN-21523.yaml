    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_index_base_is_merge_base.py
          -n 0 -q
        cwd: .
    binds_ac:
      - AC1
  - id: dod-omn21523-ac2-growth
