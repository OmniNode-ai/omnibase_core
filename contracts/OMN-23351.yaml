    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_yamlfmt_install_cache_first_omn19998.py -q --no-cov
          -o addopts='' -n 0"
        cwd: ${OMNI_HOME}/omnibase_core
