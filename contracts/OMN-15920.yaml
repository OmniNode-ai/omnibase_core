title: 'OMN-15920: typed list of MCP tool entries with parser and schema (one-MCP-server plan, PR 1)'
summary: Core types for the one-MCP-server plan. A contract mcp block is a typed list of tool entries,
  one per operation, each with tool name, description, timeout, input and output models, a command route
  and completed and failed reply routes. A parser refuses the legacy single-tool block, a duplicate name,
  an exposed block with no entries and routes that are not distinct. The JSON schema is committed and
  checked against the model. This is pull request 1 of 8 and does not finish the ticket.
