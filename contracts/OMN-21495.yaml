---
schema_version: "1.0.0"
ticket_id: OMN-21495
title: T1.1 support - node-home admits declared validator nodes
summary: The node-home ratchet (OMN-20702) refused every new node directory in omnibase_core, so the validator
  and validator-support nodes that plan section D requires in core could not land. A new node directory
  is admitted when its contract.yaml lists a validator category under the declaration field; the field,
  the categories and the remediation text are rule data in node_home_rules.yaml. The baseline file is
  unchanged and no per-entry exemption exists.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21495-node-home-admission
    statement: A new node directory is admitted by the node-home ratchet only when its contract.yaml declares
      a validator or validator-support category from the rule data.
    acceptance:
      - id: AC1
        statement: 'AC1: A new node directory whose contract.yaml lists a validator category is admitted;
          an ordinary new node (effect, no declaration) is still refused -- falsifier: pytest cases over
          a declared validator node, a validator-support node, an undeclared effect node and a mixed tree'
      - id: AC2
        statement: 'AC2: Admission adds no baseline entry and leaves the baseline file unchanged; a baselined
          node that declares a category is not reported stale -- falsifier: pytest cases that compare
          the baseline file before and after the check'
      - id: AC3
        statement: 'AC3: Configuration: the declaration field, the admitted categories and the remediation
          text are rule data in node_home_rules.yaml, loaded as ModelNodeHomeRules; invalid rule data
          fails to load -- falsifier: a table-driven pytest case mutates every rule-data key and asserts
          the verdict change, and an invalid file raises'
      - id: AC4
        statement: 'AC4: Bindings: the handler stays a pure COMPUTE node; the runtime gathers the git
          index and contract blobs and loads the rule data -- falsifier: the handler tests run with facts
          only'
  - id: req-omn21495-pin-parity
    statement: The shared core hook repo is pinned at one rev per pre-commit config, checked by a validator
      in the generic format whose commit-time lookup is an effect node resolved from the container.
    acceptance:
      - id: AC5
        statement: 'AC5: The check refuses a hook of the shared core hook repo whose pinned rev is older
          than the newest rev that hook repo is pinned at in the same .pre-commit-config.yaml, and admits
          the converged config -- falsifier: pytest cases over a canary fixture and a converged fixture'
      - id: AC6
        statement: 'AC6: A config shaped like omniclaude-internal .pre-commit-config.yaml line 13 pinned
          at d7ed23f1 fails the check; at the current core pin it passes -- falsifier: the check run against
          both consumer-shaped fixtures'
      - id: AC7
        statement: 'AC7: Configuration: the git timeout, the cache directory default, the cache index
          names, the hook repositories and the remediation text are parameters of the validation contract;
          the rev-time lookup is an effect node and the runtime resolves it and the report writer from
          the container -- falsifier: a table-driven test mutates every parameter, an invalid contract
          fails to load, and a container spy records both resolutions'
  - id: req-omn21495-first-party-ref
    statement: Every first-party reference is a dev-merge tag with one home, checked by one blocking validator
      in the generic format that replaces the action-pin and internal-sibling-pin one-off handlers.
    acceptance:
      - id: AC8
        statement: 'AC8: A cross_repo_ref carrying a 40-hex sha, a git+https URL on a sha in a workflow,
          a pyproject uv git source on a sha and a pre-commit rev that is not a dev-merge tag each yield
          exactly one issue with the rule id first_party_not_dev_tag, cross_repo_ref_not_dev_tag or first_party_source_not_dev_tag
          -- falsifier: pytest over tests/fixtures/validation/first_party_ref violation_* and clean_*
          rows'
      - id: AC9
        statement: 'AC9: The same first-party tag in .pre-commit-config.yaml and in a workflow yields
          one first_party_ref_two_homes issue, and a brief that names a release version instead of a dev-merge
          tag yields one brief_names_release_version issue -- falsifier: pytest over the two-homes and
          brief fixtures'
      - id: AC10
        statement: 'AC10: The validator reports zero issues on this repository and the same run over the
          tree at the previous head reports its violations -- falsifier: test_repository_tracked_files_have_zero_issues
          and the positive-control run recorded in the PR'
      - id: AC11
        statement: 'AC11: Configuration: every pattern, tag format, forbidden ref, sibling list and remediation
          text is a parameter of the rule rows of first_party_ref.validation.yaml, an invalid contract
          fails to load, and the tag lookup is an effect node resolved with the report writer from the
          container -- falsifier: a table-driven test mutates every parameter key of every rule row, and
          the runtime test records both resolutions and equals the committed golden run event'
      - id: AC12
        statement: 'AC12: handler_action_pin*, handler_internal_sibling_pins*, their console scripts,
          models and tests are deleted and the hook ids check-action-pins and check-internal-sibling-pins
          run the validator -- falsifier: test_hook_ids_still_name_new_module and the deleted paths in
          the diff'
evidence_requirements:
  - kind: tests
    description: Node-home ratchet tests pass at the checkout; no live service is required.
    command: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute -n 0 -q --no-cov
  - kind: ci
    description: Hosted-runner run of the same test directory at the checkout.
    command: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute -n 0 -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21495-ac1-admission
    description: A declared validator node is admitted and an undeclared effect node is refused.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -q --no-cov -k "admits_declared or undeclared_effect or only_the_declaring or malformed_declaration"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac2-baseline
    description: Admission leaves the baseline file unchanged.
    source: manual
    binds_ac: [AC2]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -q --no-cov -k "baseline"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac3-rule-data
    description: Every rule-data key changes the verdict and invalid rule data fails to load.
    source: manual
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -q --no-cov -k "rule_data or remediation_text"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac4-bindings
    description: The whole node-home test directory passes with the handler called on facts only.
    source: manual
    binds_ac: [AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute -n 0 -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-deploy-checkout-test
    description: Hosted-runner run of the node-home tests at the checkout; needs no container daemon or
      private runtime.
    source: manual
    binds_ac: [AC1, AC2, AC3, AC4]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/nodes/node_node_home_check_compute -n 0 -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac5-canary-converged
    description: The canary config is refused and the converged config is admitted.
    source: manual
    binds_ac: [AC5]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_validator_precommit_pin_parity.py
          -n 0 -q --no-cov -k "older_than or clean or violation"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac6-consumer-fixtures
    description: The consumer-shaped config fails at the stale rev and passes at the current pin.
    source: manual
    binds_ac: [AC6]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_validator_precommit_pin_parity.py
          -n 0 -q --no-cov -k "consumer"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac7-parameters-di
    description: Every parameter changes a verdict, an invalid contract fails to load, and the runtime
      resolves its effects from the container.
    source: manual
    binds_ac: [AC7]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/test_validator_precommit_pin_parity.py
          tests/unit/nodes/node_precommit_rev_time_effect -n 0 -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac8-planted-violations
    description: Each planted violation yields exactly one issue with its rule id; each clean row yields
      none.
    source: manual
    binds_ac: [AC8]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref/test_checker_first_party_ref.py
          -n 0 -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac9-two-homes-brief
    description: The two-homes and release-version briefs are refused.
    source: manual
    binds_ac: [AC9]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref/test_checker_first_party_ref.py
          -n 0 -q --no-cov -k "homes or brief"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac10-zero-target
    description: The repository's tracked files report zero issues.
    source: manual
    binds_ac: [AC10]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref/test_runtime_first_party_ref.py
          -n 0 -q --no-cov -k "zero_issues"
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac11-parameters-di
    description: Every parameter changes a verdict, an invalid contract fails to load, and the runtime
      resolves its effects from the container and equals the golden run event.
    source: manual
    binds_ac: [AC11]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref -n 0 -q --no-cov
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-ac12-one-offs-deleted
    description: The hook ids name the validator module and the one-off handlers are gone.
    source: manual
    binds_ac: [AC12]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/validation/first_party_ref/test_runtime_first_party_ref.py
          -n 0 -q --no-cov -k "hook_ids"
        cwd: ${OMNI_HOME}/omnibase_core
