---
schema_version: "1.0.0"
ticket_id: "OMN-21495"
title: "T1.1 support: node-home admits declared validator nodes (OMN-21495)"
summary: >
  The node-home ratchet (OMN-20702) refused every new node directory in omnibase_core, so the validator
  and validator-support nodes that plan section D requires in core could not land. A new node directory
  is now admitted when its contract.yaml lists a validator category under the declaration field; the field,
  the categories and the remediation text are rule data in node_home_rules.yaml. The baseline file is
  unchanged and no per-entry exemption exists. This is the ratchet-definition fix, not a bypass.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
evidence_requirements:
  - kind: "tests"
    description: "Node-home ratchet tests pass: declared validator node admitted, undeclared effect node
      refused"
    command: "uv run pytest tests/unit/nodes/node_node_home_check_compute -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "AC1"
    description: "A new node directory whose contract.yaml declares a validator category is admitted;
      an ordinary new node (effect, no declaration) is still refused"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -k 'admits_declared or undeclared_effect or only_the_declaring'"
  - id: "AC2"
    description: "Every rule-data key changes the verdict and invalid rule data fails to load"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -k 'rule_data'"
  - id: "AC3"
    description: "Admission adds no baseline entry and leaves the baseline file unchanged"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -k 'baseline'"
  - id: "Configuration"
    description: "Declaration field, admitted categories and remediation text are rule data in node_home_rules.yaml,
      loaded as ModelNodeHomeRules"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_node_home_check_compute/test_node_home_check.py
          -n 0 -k 'rule_data'"
  - id: "Bindings"
    description: "The ratchet remains a pure COMPUTE handler; the runtime gathers the git index and contract
      blobs and loads the rule data"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run pytest tests/unit/nodes/node_node_home_check_compute -n 0"
  - id: "dod-deploy"
    description: "Deploy-gate evidence: a ratchet rule-data change only; no Docker image, daemon, broker
      topic, runtime process, docker exec, or service deploy is required before merge"
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "echo 'deploy-gate: OMN-21495 changes the node-home ratchet only; no Docker image,
          daemon, broker topic, runtime process, docker exec, or service deploy is required before merge'"
