---
schema_version: "1.0.0"
ticket_id: OMN-21495
title: Validators-to-core plan, task T0.2 -- pin parity for the shared core hook repo
summary: One core check refuses a hook of the shared core hook repo whose pinned rev is older than the
  newest rev that hook repo is pinned at anywhere in the same .pre-commit-config.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21495-t02-precommit-pin-parity
    statement: T0.2 -- a hook of the shared core hook repo never pins a rev older than the newest rev
      that hook repo is pinned at in the same repository's .pre-commit-config.yaml.
    acceptance:
      - id: AC1
        statement: 'T0.2 AC1: the check refuses a hook of the shared core hook repo whose pinned rev is
          older than the newest rev that hook repo is pinned at in the same .pre-commit-config.yaml, and
          admits the converged config -- falsifier: uv run pytest tests/unit/handlers/test_handler_precommit_pin_parity.py
          -q -o addopts='''' -k "older or order or newest or converged or fixture"'
      - id: AC2
        statement: 'T0.2 AC2: a config shaped like omniclaude-internal .pre-commit-config.yaml with line
          13 at d7ed23f1 fails the check at line 13, and the same config at the current omnibase_core
          pin passes -- falsifier: uv run pytest tests/unit/handlers/test_handler_precommit_pin_parity.py
          -q -o addopts='''' -k consumer_config'
      - id: AC3
        statement: 'T0.2 AC3: a canary commit that lowers one pin is refused by the CLI, which orders
          revs by git commit time from a history repository or the pre-commit cache -- falsifier: uv run
          pytest tests/unit/handlers/test_handler_precommit_pin_parity_cli.py -q -o addopts='''' and pre-commit
          run --files .pre-commit-config.yaml on the canary commit'
evidence_requirements:
  - kind: tests
    description: The pin-parity handler and CLI pass and fail each pin shape, including the canary fixture
      that lowers one pin.
    command: uv run pytest tests/unit/handlers/test_handler_precommit_pin_parity.py tests/unit/handlers/test_handler_precommit_pin_parity_cli.py
      -q -o addopts=''
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21495-t02-handler
    description: The handler fails a hook pinned older than the newest pin of the same hook repo and passes
      converged pins.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC1, AC2]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_precommit_pin_parity.py -q -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-t02-cli-canary
    description: The CLI refuses the canary that lowers one pin, resolves commit times from git, and refuses
      a missing or unparsable config.
    source: manual
    execution_scope: hosted_and_local
    binds_ac: [AC3]
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_handler_precommit_pin_parity_cli.py -q -o
          addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-deploy-checkout-test
    description: Hosted-runner run of the pin-parity handler and CLI tests at the checkout; needs no container
      daemon or private runtime.
    source: manual
    binds_ac: [AC1, AC2, AC3]
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/unit/handlers/test_handler_precommit_pin_parity.py tests/unit/handlers/test_handler_precommit_pin_parity_cli.py
          -q --no-cov -o addopts=''
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn21495-deploy-source
    description: Read the published handler source at the checkout commit through the GitHub contents
      API. Fail if the older-than-newest refusal is absent. This hosted-runner probe needs no container
      daemon or private runtime.
    source: manual
    binds_ac: [AC1]
    checks:
      - check_type: command
        check_value: |
          gh api "repos/OmniNode-ai/omnibase_core/contents/src/omnibase_core/handlers/handler_precommit_pin_parity.py?ref=$(git rev-parse HEAD)" --jq .content |
            base64 -d | grep -F 'is older than newest rev' > /dev/null
        cwd: ${OMNI_HOME}/omnibase_core
