    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_receipt_gate_verifier_tag_omn21676.py -q -p no:randomly
          --no-cov -k "declared_input or version_is_ignored or empty_tag or not_a_dev_merge_tag"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
