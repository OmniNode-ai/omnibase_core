  - id: dod-omn-21676-ac2
    description: A tag after the floor is installed from its resolved commit and recorded.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_receipt_gate_verifier_tag_omn21676.py -q -p no:randomly
          --no-cov -k "after_the_floor or floor_commit_itself or annotated or summary_records"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn-21676-ac3
    description: A tag before the floor, off dev, moved or absent is refused with nothing installed.
