---
schema_version: "1.0.0"
ticket_id: OMN-19998
title: Cross-repository dependency-direction check every repository inherits from omnibase_core
summary: A repository may depend only on repositories at a strictly lower layer of the declared order
  (src/omnibase_core/contracts/repo_layers.yaml). The check reads Python imports, pyproject dependencies
  and uv sources, requirements files, Dockerfile installs and clones, workflow checkouts and pins, and
  scripts that install, clone or fetch, and refuses a dependency at the same or a higher layer that the
  repository's shrink-only baseline does not record.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-direction-across-repositories
    statement: The dependency-direction handler must fail a dependency on a repository at the same or
      a higher layer through every channel it reads, and pass a dependency on a lower layer.
    acceptance:
      - id: AC1
        statement: "AC1: An upward or same-layer reference through a Python import, pyproject, a requirements
          file, a Dockerfile, a workflow checkout or pin, or a script install or clone fails, and each
          negative control passes. -- falsifier: uv run pytest tests/unit/handlers/test_handler_dependency_direction.py
          -q"
      - id: AC2
        statement: "AC2: The CLI warns on a baselined violation, refuses a baseline entry the base ref
          does not have, refuses a missing base ref, and writes the report with its run and fire events.
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_dependency_direction_cli.py -q"
      - id: AC3
        statement: "AC3: The canonical-file-shape ratchet counts the baseline the check-dependency-direction
          hook declares with --baseline as a declared gate baseline, and still refuses an undeclared one.
          -- falsifier: uv run pytest tests/unit/validators/test_canonical_file_shape.py -q -k dependency_direction"
  - id: req-omn19998-version-drift-at-source
    statement: A floor raise on a sibling registry package must fail while a registry consumer that installs
      it is not ready, and pull request CI must run every job the merge queue runs.
    acceptance:
      - id: AC4
        statement: "AC4: A pull request raising a sibling registry floor fails, naming each consumer pull
          request needed, while a consumer's pin excludes the new floor, a consumer of the raising repository
          declares a lower floor, or a consumer is unreadable; it passes once every consumer is ready.
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_version_floor_consumers.py -q"
      - id: AC5
        statement: "AC5: In a workflow triggered on merge_group, a missing pull_request trigger, a pull_request
          path filter, a merge_group-only job if, or a job gated on an event-dependent needs output fails
          unless baselined, and a draft-only skip passes. -- falsifier: uv run pytest tests/unit/handlers/test_handler_merge_queue_parity.py
          -q"
      - id: AC6
        statement: "AC6: Both CLIs run over real git clones (consumers read at origin's default branch),
          the parity baseline only shrinks, and the canonical-file-shape ratchet counts the hook-declared
          baseline. -- falsifier: uv run pytest tests/unit/handlers/test_handler_version_drift_cli.py
          tests/unit/validators/test_canonical_file_shape.py -q -k 'version_drift or merge_queue_parity
          or floor_cli or parity_cli'"
  - id: req-omn19998-ci-summary-ghost-row
    statement: CI Summary must judge a job or check-run row that GitHub leaves at in_progress while its
      conclusion and completed_at are set as completed, under the unchanged verdict rules.
    acceptance:
      - id: AC7
        statement: "AC7: A ghost row with conclusion success and completed_at passes, one with conclusion
          failure fails, and a running row missing either field still holds PENDING. -- falsifier: uv
          run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -k Ghost"
  - id: req-omn19998-public-runner-placement
    statement: CI runners are for private repositories only; a public repository must not add a job that
      runs on a self-hosted runner.
    acceptance:
      - id: AC8
        statement: "AC8: A public repository's pull request that adds a job whose runs-on is a self-hosted
          label or can resolve to one fails, a baselined job that is new or newly self-hosted against
          the base fails, the shipped baseline may only shrink against the base, and a private repository
          passes. -- falsifier: uv run pytest tests/unit/handlers/test_handler_public_runner_placement.py
          tests/unit/validators/test_canonical_file_shape.py -q -k 'public_runner or runs_on or negative_control
          or cli_ or shipped_baseline or omnibase_core_passes'"
  - id: req-omn19998-dependency-direction-wired
    statement: The dependency-direction check must be run by a required CI job and a pre-commit hook through
      its handler module, the name a workflow and hook audit reads.
    acceptance:
      - id: AC9
        statement: "AC9: The lint-imports job step and the check-dependency-direction hook both run the
          handler module omnibase_core.handlers.handler_dependency_direction_cli, and a step that runs
          only the console script alias fails the check. -- falsifier: uv run pytest tests/ci/test_dependency_direction_wiring_omn19998.py
          -q"
evidence_requirements:
  - kind: tests
    description: "Every channel fails upward and same-layer references; negative controls pass."
    command: "uv run pytest tests/unit/handlers/test_handler_dependency_direction.py -q"
  - kind: tests
    description: "The CLI baseline, ratchet, base-ref and report-and-events behaviour."
    command: "uv run pytest tests/unit/handlers/test_handler_dependency_direction_cli.py -q"
  - kind: tests
    description: "The canonical-file-shape ratchet admits the declared gate baseline only."
    command: "uv run pytest tests/unit/validators/test_canonical_file_shape.py -q -k dependency_direction"
  - kind: tests
    description: "A floor raise ahead of a registry consumer fails and names the consumer."
    command: "uv run pytest tests/unit/handlers/test_handler_version_floor_consumers.py -q"
  - kind: tests
    description: "Merge-queue-only jobs fail unless baselined."
    command: "uv run pytest tests/unit/handlers/test_handler_merge_queue_parity.py -q"
  - kind: tests
    description: "Both CLIs over real git clones and the shrink-only parity baseline."
    command: "uv run pytest tests/unit/handlers/test_handler_version_drift_cli.py -q"
  - kind: tests
    description: "A public repository adding a self-hosted job fails; the baseline only shrinks."
    command: "uv run pytest tests/unit/handlers/test_handler_public_runner_placement.py -q"
  - kind: tests
    description: "The dependency-direction step and hook run the handler module."
    command: "uv run pytest tests/ci/test_dependency_direction_wiring_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn-19998-channels
    description: "An upward or same-layer reference through every channel fails, and each negative control
      passes."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_dependency_direction.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn-19998-cli-ratchet-events
    description: "The CLI warns on a baselined violation, refuses baseline growth and a missing base ref,
      and writes the report with its run and fire events."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_dependency_direction_cli.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn-19998-declared-gate-baseline
    description: "The canonical-file-shape ratchet admits the baseline the hook declares and refuses an
      undeclared one."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/validators/test_canonical_file_shape.py -q -k dependency_direction"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
  - id: dod-omn-19998-deploy-hosted-dependency-direction
    description: Hosted deploy probe for the dependency-direction handler. Read the handler and its rules
      at the immutable PR implementation commit and compare their bytes with the checked-out product,
      then run omnibase_core's own tree through the check against its baseline. A missing published file,
      a different implementation, or a new upward dependency fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/142f76653ca70600f1ba2ea7011a276cd7900105/src/omnibase_core/handlers/handler_dependency_direction.py
          | cmp - src/omnibase_core/handlers/handler_dependency_direction.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: >-
          bash -o pipefail -c 'curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/OmniNode-ai/omnibase_core/142f76653ca70600f1ba2ea7011a276cd7900105/src/omnibase_core/handlers/handler_dependency_direction_rules.py
          | cmp - src/omnibase_core/handlers/handler_dependency_direction_rules.py'
        cwd: ${OMNI_HOME}/omnibase_core
      - check_type: command
        check_value: uv run check-dependency-direction --repo omnibase_core
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn-19998-floor-ahead-of-consumers
    description: "A floor raise on a sibling registry package fails while a registry consumer is not ready,
      names the consumer, and passes once every consumer is ready."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_version_floor_consumers.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC4
  - id: dod-omn-19998-merge-queue-parity
    description: "A job the merge queue runs and pull request CI can skip fails unless baselined."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_merge_queue_parity.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn-19998-version-drift-cli
    description: "Both CLIs over real git clones; the parity baseline only shrinks."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_version_drift_cli.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC6
  - id: dod-omn-19998-deploy-hosted-merge-queue-parity
    description: Hosted deploy probe for the merge-queue parity check. Run omnibase_core's own workflows
      through check-merge-queue-parity against its shrink-only baseline. A new merge-queue-only job, or
      a missing console script, fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run check-merge-queue-parity
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC5
  - id: dod-omn-19998-ci-summary-ghost-row
    description: "CI Summary reads a ghost in_progress row carrying a conclusion and completed_at as completed;
      a row missing either field still holds PENDING."
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -k Ghost"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC7
  - id: dod-omn-19998-public-runner-placement
    description: "A public repository adding a self-hosted or computed runs-on job fails, a private one
      passes, and the shipped baseline only shrinks."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/unit/handlers/test_handler_public_runner_placement.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC8
  - id: dod-omn-19998-deploy-public-runner-placement
    description: Hosted deploy probe for the public runner placement check. Run omnibase_core's own workflows
      through check-public-runner-placement against the shipped shrink-only baseline. A new self-hosted
      job, or a missing console script, fails the probe.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run check-public-runner-placement --repo omnibase_core
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC8
  - id: dod-omn-19998-dep-direction-wiring
    description: "The lint-imports step and the pre-commit hook run the dependency-direction handler module,
      and a console-script-only step fails."
    source: manual
    checks:
      - check_type: test_passes
        check_value: "uv run pytest tests/ci/test_dependency_direction_wiring_omn19998.py -q"
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC9
