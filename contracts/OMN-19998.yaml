---
schema_version: "1.0.0"
ticket_id: OMN-19998
title: Cross-repository dependency-direction check every repository inherits from omnibase_core
summary: A repository may depend only on repositories at a strictly lower layer of the declared order
  (src/omnibase_core/contracts/repo_layers.yaml). The check reads Python imports, pyproject dependencies
  and uv sources, requirements files, Dockerfile installs and clones, workflow checkouts and pins, and
  scripts that install, clone or fetch, and refuses a dependency at the same or a higher layer that the
  repository's shrink-only baseline does not record.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn19998-direction-across-repositories
    statement: The dependency-direction handler must fail a dependency on a repository at the same or
      a higher layer through every channel it reads, and pass a dependency on a lower layer.
    acceptance:
      - id: AC1
        statement: "AC1: An upward or same-layer reference through a Python import, pyproject, a requirements
          file, a Dockerfile, a workflow checkout or pin, or a script install or clone fails, and each
          negative control passes. -- falsifier: uv run pytest tests/unit/handlers/test_handler_dependency_direction.py
          -q"
      - id: AC2
        statement: "AC2: The CLI warns on a baselined violation, refuses a baseline entry the base ref
          does not have, refuses a missing base ref, and writes the report with its run and fire events.
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_dependency_direction_cli.py -q"
      - id: AC3
        statement: "AC3: The canonical-file-shape ratchet counts the baseline the check-dependency-direction
          hook declares with --baseline as a declared gate baseline, and still refuses an undeclared one.
          -- falsifier: uv run pytest tests/unit/validators/test_canonical_file_shape.py -q -k dependency_direction"
  - id: req-omn19998-version-drift-at-source
    statement: A floor raise on a sibling registry package must fail while a registry consumer that installs
      it is not ready, and pull request CI must run every job the merge queue runs.
    acceptance:
      - id: AC4
        statement: "AC4: A pull request raising a sibling registry floor fails, naming each consumer pull
          request needed, while a consumer's pin excludes the new floor, a consumer of the raising repository
          declares a lower floor, or a consumer is unreadable; it passes once every consumer is ready.
          -- falsifier: uv run pytest tests/unit/validation/test_validator_version_floor_consumers.py
          -q"
      - id: AC5
        statement: "AC5: In a workflow triggered on merge_group, a missing pull_request trigger, a pull_request
          path filter, a merge_group-only job if, or a job gated on an event-dependent needs output fails
          unless baselined, and a draft-only skip passes. -- falsifier: uv run pytest tests/unit/handlers/test_handler_merge_queue_parity.py
          -q"
      - id: AC6
        statement: "AC6: Both CLIs run over real git clones (consumers read at origin's default branch),
          the parity baseline only shrinks, and the canonical-file-shape ratchet counts the hook-declared
          baseline. -- falsifier: uv run pytest tests/unit/handlers/test_handler_version_drift_cli.py
          tests/unit/validators/test_canonical_file_shape.py -q -k 'version_drift or merge_queue_parity
          or floor_cli or parity_cli'"
  - id: req-omn19998-ci-summary-ghost-row
    statement: CI Summary must judge a job or check-run row that GitHub leaves at in_progress while its
      conclusion and completed_at are set as completed, under the unchanged verdict rules.
    acceptance:
      - id: AC7
        statement: "AC7: A ghost row with conclusion success and completed_at passes, one with conclusion
          failure fails, and a running row missing either field still holds PENDING. -- falsifier: uv
          run pytest tests/unit/scripts/ci/test_ci_summary_gate.py -q -k Ghost"
  - id: req-omn19998-public-runner-placement
    statement: CI runners are for private repositories only; a public repository must not add a job that
      runs on a self-hosted runner.
    acceptance:
      - id: AC8
        statement: "AC8: A public repository's pull request that adds a job whose runs-on is a self-hosted
          label or can resolve to one fails, a baselined job that is new or newly self-hosted against
          the base fails, the shipped baseline may only shrink against the base, and a private repository
          passes. -- falsifier: uv run pytest tests/unit/validation/test_validator_public_runner_placement.py
          tests/unit/validators/test_canonical_file_shape.py -q -k 'public_runner or runs_on or negative_control
          or cli_ or shipped_baseline or omnibase_core_passes'"
  - id: req-omn19998-dependency-direction-wired
    statement: The dependency-direction check must be run by a required CI job and a pre-commit hook through
      its handler module, the name a workflow and hook audit reads.
    acceptance:
      - id: AC9
        statement: "AC9: The lint-imports job step and the check-dependency-direction hook both run the
          handler module omnibase_core.nodes.node_dependency_direction_check_effect.runtime_dependency_direction_check,
          and a step that runs only the console script alias fails the check. -- falsifier: uv run pytest
          tests/ci/test_dependency_direction_wiring_omn19998.py -q"
  - id: req-omn19998-core-hosted-fallbacks
    statement: omnibase_core is public, so no workflow falls back to the self-hosted omnibase-ci fleet
      for a public caller, and the jobs that read the route decision run on a GitHub-hosted runner.
    acceptance:
      - id: AC10
        statement: "AC10: No workflow's OMNI_TRUSTED_CI_RUNS_ON_JSON fallback names the self-hosted fleet
          except a reusable workflow's private-caller branch, lint and wheel-content-parity run on ubuntu-latest
          and are out of the shipped baseline, and the placement check is a lint-imports step under quality-gate
          and a pre-commit hook. -- falsifier: uv run pytest tests/unit/validation/test_validator_public_runner_placement.py
          -q"
  - id: req-omn19998-full-suite-once
    statement: The heavy test suites run once per change. A run whose tree already passed the full suite
      in a run of a head the event lands reuses that pass instead of rerunning both matrices.
    acceptance:
      - id: AC11
        statement: "AC11: full-suite-reuse reports reuse only for a marker of the exact tree uploaded
          by a run of the same workflow that tested the pushed commit, the queued pull request head or
          the same pull request head; schedule, workflow_dispatch and every lookup failure run the suites;
          Tests Gate admits the skip only with a named producing run; the marker is uploaded only after
          a full pass or a verified reuse. -- falsifier: uv run pytest tests/ci/test_full_suite_reuse_omn19998.py
          -q"
  - id: "req-omn19998-omnibase_core-dev-merge-tag"
    statement: "Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omnibase_core,
      a sibling another platform repository consumes, tags every push to dev with a lightweight dev-<UTC
      YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other
      ref, so a consumer can pin it through a uv git source."
    acceptance:
      - id: "AC12"
        statement: "AC12: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag
          step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight
          tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run
          or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value
          that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py
          -q -n 0 fails at the merge base, where the workflow does not exist"
  - id: "req-omn19998-propagate-config-no-pr-run"
    statement: "A pull request that touches a config-propagation path must not turn the required CI Summary
      red through the skipped placeholder row that propagate-config.yml posts on pull_request. The propagate
      job runs on release and dispatch only; the dry-run for pull requests lives in ci.yml."
    acceptance:
      - id: "AC13"
        statement: "AC13: .github/workflows/propagate-config.yml triggers only on release and workflow_dispatch,
          so a pull_request touching a propagation path posts no skipped Propagate row for CI Summary's
          external sweep to refuse, and ci.yml's propagate-dry-run still watches the same five paths --
          falsifier: uv run pytest tests/ci/test_ci_fold_gates_omn20074.py -q -n 0 -k 'no_pull_request_or_push_trigger'
          fails at the merge base, where the file still triggers on pull_request and push"
  - id: "req-omn19998-internal-sibling-pins"
    statement: "Operator RULINGs 2026-10-16T07:34:18Z and 2026-10-16T09:35:49Z: internal siblings are
      consumed from dev merge tags, not releases, as part of the process. A check every consumer inherits
      from omnibase_core refuses a release, bare-sha or branch pin of an internal sibling."
    acceptance:
      - id: "AC14"
        statement: "AC14: For every internal sibling in src/omnibase_core/contracts/internal_sibling_pins.yaml
          that a pyproject declares, the internal sibling pin check fails a missing [tool.uv.sources]
          entry, a rev or direct URL sha, a release tag, a branch, any other ref or non-git source, a
          git source of another repository and an exact == version, and passes a git source pinned to
          a dev-<UTC YYYYMMDDHHMMSS>-<sha12> tag; the reusable .github/workflows/internal-sibling-pins.yml
          and the check-internal-sibling-pins hook run the handler module -- falsifier: uv run pytest
          tests/unit/handlers/test_handler_internal_sibling_pins.py -q -n 0 fails at the merge base, where
          the handler does not exist"
      - id: "AC15"
        statement: "AC15: Release refs retain their classification, while invalid refs containing 10,000
          repeated digits, letters or dotted numeric components are rejected within five seconds per case
          -- falsifier: uv run pytest tests/unit/handlers/test_handler_internal_sibling_pins.py -q -o
          addopts= -k 'release_ref'"
  - id: "req-omn19998-canonical-file-shape-no-base"
    statement: "The nightly schedule run of the Canonical File Shape (OMN-20304) job has no base revision.
      Its tree check runs only the file-shape rule group, since node-home with no base reads every baseline
      entry and onex.nodes entry point as new; the next step runs node-home against HEAD."
    acceptance:
      - id: "AC16"
        statement: "AC16: The no-base branch of the Refuse new non-canonical files and new exceptions
          step runs runtime_canonical_file_shape_check --rules file-shape --head HEAD, and no step runs
          it with --head HEAD alone -- falsifier: uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_node_home_activation.py
          -q -n 0 -k no_base fails at the merge base, where the step runs --head HEAD with every rule
          group"
  - id: "req-omn19998-auto-merge-transient-retry"
    statement: "A check_suite run of Auto-Merge executes at dev's sha, so its failure reads as a red on
      dev. The Enable auto-merge step retries the arming sequence on GitHub's transient server-side errors
      alone, at most three attempts, and fails loudly on any other error or on the last attempt."
    acceptance:
      - id: "AC17"
        statement: "AC17: The live Enable auto-merge Bash, run against a stub gh, recovers after one or
          two transient 'Something went wrong while executing your query' answers to the squash arm, fails
          after three, and does not retry a permanent error -- falsifier: uv run pytest tests/unit/validation/test_auto_merge_workflow_shape.py
          -q -n 0 -o addopts= -k Transient fails at the merge base, where one transient answer fails the
          step"
evidence_requirements:
  - kind: tests
    description: "Every channel fails upward and same-layer references; negative controls pass."
    command: "uv run pytest tests/unit/handlers/test_handler_dependency_direction.py -q"
  - kind: tests
    description: "The CLI baseline, ratchet, base-ref and report-and-events behaviour."
    command: "uv run pytest tests/unit/handlers/test_handler_dependency_direction_cli.py -q"
  - kind: tests
    description: "The canonical-file-shape ratchet admits the declared gate baseline only."
    command: "uv run pytest tests/unit/nodes/node_canonical_file_shape_check_compute/test_canonical_file_shape_rules.py
      -q -k dependency_direction"
  - kind: tests
    description: "A floor raise ahead of a registry consumer fails and names the consumer."
    command: "uv run pytest tests/unit/validation/test_validator_version_floor_consumers.py -q"
  - kind: tests
    description: "Merge-queue-only jobs fail unless baselined."
    command: "uv run pytest tests/unit/handlers/test_handler_merge_queue_parity.py -q"
  - kind: tests
    description: "Both CLIs over real git clones and the shrink-only parity baseline."
    command: "uv run pytest tests/unit/handlers/test_handler_version_drift_cli.py -q"
  - kind: tests
    description: "A public repository adding a self-hosted job fails; the baseline only shrinks."
    command: "uv run pytest tests/unit/validation/test_validator_public_runner_placement.py -q"
  - kind: tests
    description: "The dependency-direction step and hook run the handler module."
    command: "uv run pytest tests/ci/test_dependency_direction_wiring_omn19998.py -q"
  - kind: tests
    description: "Public workflows fall back to hosted runners; the placement hook and job are wired."
    command: "uv run pytest tests/unit/validation/test_validator_public_runner_placement.py -q"
  - kind: tests
    description: "The full-suite reuse probe and marker refuse every unbound marker and run the suites
      on failure."
    command: "uv run pytest tests/ci/test_full_suite_reuse_omn19998.py -q"
  - kind: tests
    description: "A release, sha or branch pin of an internal sibling fails; a dev merge tag passes."
    command: "uv run pytest tests/unit/validation/first_party_ref/test_checker_first_party_ref.py tests/unit/validation/first_party_ref/test_runtime_first_party_ref.py
      -q"
