---
schema_version: 1.0.0
ticket_id: OMN-26699
title: 'OMN-26699: the lane work types: models and enums for events, state, actions, receipts, step replies,
  terminals and help requests'
summary: Frozen pydantic models and enums for the lane work orchestrator (plan sections 3.1, 3.3, 3.5,
  3.7), with extra forbidden, one event model checked by kind, plain action ids and terminals that owe
  their kind fields.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn26699-lane-work-types
    statement: The shared lane work types exist, are immutable, and refuse malformed events, terminals,
      receipts and action ids.
    acceptance:
      - id: AC1
        statement: "AC1: EnumLaneWorkEvent holds exactly the 28 kinds of plan section 3.3 plus status_requested
          -- falsifier: a test compares the enum values with a list literal of those 29 names"
      - id: AC2
        statement: "AC2: a handed_off terminal without proven_head, handoff_request_id or proof_receipt_id,
          and a blocked terminal without reason, are refused -- falsifier: uv run pytest -k terminal_kind_fields
          asserts ValidationError for each"
      - id: AC3
        statement: "AC3: action ids are plain -- falsifier: a test builds the longest workflow id the
          model allows and asserts its action ids match ^[a-z0-9-]{8,64}$"
      - id: AC4
        statement: "AC4: every model is frozen and forbids extra fields -- falsifier: a parametrised test
          sets an attribute and passes an unknown field on each model"
      - id: AC5
        statement: "AC5: no handler, I/O or topic name in these files -- falsifier: the grep over src/omnibase_core/models/lane_work
          prints nothing"
evidence_requirements:
  - kind: tests
    description: The lane work model tests.
    command: uv run --frozen pytest tests/unit/models/lane_work -q -n 0 --reruns 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
