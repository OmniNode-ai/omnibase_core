  - id: dod-omn25394-ac9-required-checks-at-head
    description: The required checks of the release pull request read success at the head the watcher
      holds, and that head is the head of the pull request's branch in the canonical clone. Read from
      the pull request watcher; hosted CI cannot read them for its own head. onex scm pr-checks exits
      0 whatever the checks read, so the check asserts the JSON it prints.
    source: manual
    binds_ac:
      - AC9
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |
          uv run --locked python -c '
          import json, os, subprocess, sys
          def scm(verb):
              run = subprocess.run(["onex", "scm", verb, "OmniNode-ai/omnibase_core#2330"], capture_output=True, text=True)
              if run.returncode != 0:
                  print(verb, "failed:", run.returncode, run.stderr.strip())
                  sys.exit(1)
              return json.loads(run.stdout)["result"]
          view, checks = scm("pr-view"), scm("pr-checks")
          clone = os.path.join(os.environ["OMNI_HOME"], "omnibase_core")
          local = subprocess.run(["git", "-C", clone, "rev-parse", "origin/" + view["head_ref"]], capture_output=True, text=True)
          print(view["state"], view["head_sha"], checks["head_sha"], local.stdout.strip(), checks["class"], checks["red"], checks["pending"], checks["read_at"])
          ok = local.returncode == 0 and local.stdout.strip() == view["head_sha"] == checks["head_sha"] and checks["class"] == "green" and not checks["red"] and not checks["pending"]
          sys.exit(0 if ok else 1)'
        cwd: ${OMNI_HOME}/omnibase_core
