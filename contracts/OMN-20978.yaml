---
schema_version: "1.0.0"
ticket_id: OMN-20978
title: "Several merged change-control companions for one PR resolve to the latest merged"
summary: scripts/ci/check_occ_companion_merged.py no longer refuses when two or more merged change-control
  companions name the same product PR; it resolves to the one merged latest, so occ-preflight / eligibility
  stops waiting 1500 s and failing on every repository that loads the script from this repository's dev.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn20978-latest-merged
    statement: A product PR named by several merged companions resolves to exactly one of them, deterministically,
      instead of refusing.
    acceptance:
      - id: AC1
        statement: 'AC1: a product PR named by two or more merged companions resolves to exactly one of
          them deterministically (proposal: the highest-numbered, whose merge commit carries the earlier
          evidence) instead of refusing -- falsifier: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py
          -k multiple_merged red on dev, green after'
  - id: req-omn20978-still-closed
    statement: A companion that names another PR or is not merged never resolves, and zero merged companions
      still waits.
    acceptance:
      - id: AC2
        statement: 'AC2: a merged companion that names a different PR, or an open one, still never resolves
          for this PR, and zero merged companions still waits -- falsifier: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py
          -k other_pr'
  - id: req-omn20978-gate-passes
    statement: The companion gate passes for a PR in the omniclaude#2661 shape, two merged companions
      naming one PR.
    acceptance:
      - id: AC3
        statement: 'AC3: occ-preflight / eligibility on omniclaude#2661 passes on a rerun once the fix
          is on omnibase_core dev -- falsifier: the occ-preflight / eligibility check-run conclusion on
          the omniclaude#2661 head after rerun'
evidence_requirements:
  - kind: tests
    description: Several merged companions resolve to the latest merged one, an unorderable set still
      fails closed, and the gate passes on the latest.
    command: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py -k multiple_merged
      -q -p no:randomly
  - kind: tests
    description: A companion naming another PR or an unmerged one never resolves, and zero merged companions
      still waits.
    command: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py -k other_pr -q -p
      no:randomly
  - kind: tests
    description: The receipt-gate side binding resolves the latest of two merged companions.
    command: uv run pytest tests/ci/test_companion_side_binding_omn18338.py -q -p no:randomly
  - kind: ci
    description: 'Post-merge: occ-preflight / eligibility on the omniclaude#2661 head passes on a rerun
      once this change is on omnibase_core dev.'
    command: onex scm pr-checks OmniNode-ai/omniclaude#2661
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn20978-ac1
    description: Two or more merged companions naming one PR resolve to the one merged latest, by merge
      time and not by number, across UTC offsets; an unorderable set still fails closed.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py -k multiple_merged
          -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
  - id: dod-omn20978-ac2
    description: A merged companion naming a different PR, or an unmerged one, never resolves for this
      PR, and zero merged companions still waits.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py -k other_pr
          -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC2
  - id: dod-omn20978-ac3
    description: The companion gate passes for a PR named by two merged companions (the omniclaude#2661
      shape, OCC#13596 and OCC#13675), and the receipt-gate side binding resolves the latest of the two.
      The live rerun on omniclaude#2661 is post-merge evidence and is listed under evidence_requirements.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/scripts/ci/test_check_occ_companion_merged.py tests/ci/test_companion_side_binding_omn18338.py
          -k "gate_passes_on_the_latest or latest_merged_companion or latest-of-two" -q -p no:randomly
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC3
