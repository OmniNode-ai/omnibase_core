    description: Deterministic unmerged-index tests construct real stage 1/2/3 entries under a scan root
      containing at least one ordinary staged file; validator returns 1 before scanning.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validators/test_pydantic_extra_forbid.py -q -n 0 --no-cov
          --reruns 0 -k 'test_staged_index_rejects_unmerged_before_reading_inputs'
        cwd: ${OMNI_HOME}/omnibase_core
    binds_ac:
      - AC1
