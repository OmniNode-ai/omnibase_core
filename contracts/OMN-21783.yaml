summary: 'The 14 URL literals omnibase_core code held in 11 modules are declared in models/configuration/network_defaults.yaml
  and read through ModelNetworkDefaults. The contracts_and_di checker reports no literal_url finding on
  the touched modules; no baseline entry and no suppression is added.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21783-url-defaults
    statement: A URL that omnibase_core code falls back to is declared in a packaged contract that a typed
      model reads, and the code holds no literal of it.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_url over the slice paths drops to zero
          and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier:
          onex run of runtime_validator_run with the contracts_and_di reference over omnibase_core src
          before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every URL comes from the owning node contract or overlay and is injected, none
          hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules
          plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: The URL defaults tests pass.
    command: uv run pytest tests/unit/models/configuration/test_model_network_defaults_urls.py -n 0 -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
