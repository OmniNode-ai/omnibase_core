---
schema_version: 1.0.0
ticket_id: OMN-21506
title: 'T-C4: the two contract hashes, populated and shared'
summary: ContractMergeEngine passed resolver_config_hash=None and effective_contract_hash=None into its
  events. omnibase_core now has compute_resolver_config_hash and compute_effective_contract_hash (canonical
  JSON, sha256), the engine calls them, carries them in its merge_started and merge_completed events and
  returns them with the merge result through ContractMergeEngine.resolve.
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - public_api
  - events
requirements:
  - id: req-omn21506
    statement: The merge engine populates resolver_config_hash and effective_contract_hash from one shared
      definition, in its events and in its merge result.
    acceptance:
      - id: AC1
        statement: 'AC1: Equivalent inputs give equal hashes. A changed resolver configuration changes
          only `resolver_config_hash`, and a changed effective contract changes `effective_contract_hash`
          -- falsifier: four pytest cases'
      - id: AC2
        statement: 'AC2: The engine''s started and completed events carry both hashes, and the merge result
          returns them -- falsifier: the pytest case with a recording emitter'
      - id: AC3
        statement: 'AC3: Configuration: a core library carries no deployment value -- falsifier: the test
          reads no overlay and no environment variable'
      - id: AC4
        statement: 'AC4: Bindings: none -- falsifier: the same inputs hash the same in a direct call and
          through the local in-process entry of the parity harness (T-B2)'
evidence_requirements:
  - kind: tests
    description: Hash equivalence, engine event and result carriage, no deployment value, and direct versus
      in-process parity.
    command: uv run pytest tests/unit/merge/test_contract_merge_hashes.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
