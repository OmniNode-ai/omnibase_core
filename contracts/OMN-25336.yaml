  - id: dod-omn25336-ac1-required-checks-at-head
    description: The required checks of the release pull request read from the pull request watcher at
      the head the watcher holds; hosted CI cannot read them for its own head. `onex scm pr-checks` exits
      0 whatever the checks read (measured on a red head, exit 0), so the check asserts the JSON it prints,
      never the exit status, and refuses a read that names no head.
    source: manual
    binds_ac: [AC1]
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |
          uv run --locked python -c '
          import json, subprocess, sys
          run = subprocess.run(["onex", "scm", "pr-checks", "OmniNode-ai/omnibase_core#2330"], capture_output=True, text=True)
          if run.returncode != 0:
              print("pr-checks failed:", run.returncode, run.stderr.strip())
              sys.exit(1)
          result = json.loads(run.stdout)["result"]
          print(result["head_sha"], result["class"], "red=", result["red"], "pending=", result["pending"], "read_at=", result["read_at"])
          ok = len(result["head_sha"]) == 40 and result["class"] == "green" and not result["red"] and not result["pending"]
          sys.exit(0 if ok else 1)'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn25336-ac10-registry-search
    description: No registry repository imports the three removed ticket names on its default branch.
      The search fetches each clone first, resolves the default branch from origin/HEAD, and fails on
      a git exit other than 0 (found) or 1 (no match) so a clone with no such ref is an error, never a
      clean read. It reads the registry clones, which hosted CI does not have.
    source: manual
    binds_ac: [AC10]
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |
          uv run --locked python -c '
          import os, subprocess, sys
          home = os.environ["OMNI_HOME"]
          names = "validate_ticket_contract|ModelLinearTicketContract|TypedDictTicketInput"
          def git(repo, *args):
              return subprocess.run(["git", "-C", repo, *args], capture_output=True, text=True)
          found, errors = [], []
          for name in sorted(os.listdir(home)):
              repo = os.path.join(home, name)
              if not os.path.exists(os.path.join(repo, ".git")):
                  continue
              fetched = git(repo, "fetch", "--quiet", "origin")
              if fetched.returncode != 0:
                  errors.append((name, "fetch", fetched.returncode, fetched.stderr.strip()))
                  continue
              base = git(repo, "symbolic-ref", "--short", "refs/remotes/origin/HEAD")
              if base.returncode != 0 or not base.stdout.strip():
                  errors.append((name, "origin/HEAD", base.returncode, base.stderr.strip()))
                  continue
              hit = git(repo, "grep", "-lE", names, base.stdout.strip(), "--", "*.py")
              if hit.returncode == 1:
                  continue
              if hit.returncode != 0:
                  errors.append((name, "grep", hit.returncode, hit.stderr.strip()))
                  continue
              found.append((name, hit.stdout.strip()))
          print("found:", found, "errors:", errors)
          sys.exit(1 if found or errors else 0)'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn25336-ac11-lab-comment
    description: The pull request watcher state reads the pull request head, and the head it reads is
      the head of the pull request's own branch in the canonical clone. The watcher state and every local
      reader hold no comment text (pr-view prints none, measured), so the content of the Lab comment cannot
      be asserted by a command; the comment itself carries the head it names.
    source: manual
    binds_ac: [AC11]
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: |
          uv run --locked python -c '
          import json, os, subprocess, sys
          view = subprocess.run(["onex", "scm", "pr-view", "OmniNode-ai/omnibase_core#2330"], capture_output=True, text=True)
          if view.returncode != 0:
              print("pr-view failed:", view.returncode, view.stderr.strip())
              sys.exit(1)
          result = json.loads(view.stdout)["result"]
          clone = os.path.join(os.environ["OMNI_HOME"], "omnibase_core")
          local = subprocess.run(["git", "-C", clone, "rev-parse", "origin/" + result["head_ref"]], capture_output=True, text=True)
          print(result["state"], result["head_sha"], local.stdout.strip(), local.stderr.strip())
          ok = local.returncode == 0 and local.stdout.strip() == result["head_sha"] and result["state"] == "OPEN"
          sys.exit(0 if ok else 1)'
        cwd: ${OMNI_HOME}/omnibase_core
  - id: dod-omn25336-deploy-hosted-readback
