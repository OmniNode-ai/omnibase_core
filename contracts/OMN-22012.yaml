---
schema_version: 1.0.0
ticket_id: OMN-22012
title: 'Core legacy validators: Slice A staged-file refusal'
summary: Slice A addresses AC2 and AC3 with staged-file refusal, enabled pyright rules and per-file shrink-only
  baselines. AC1 remains for later slices; the remaining Appendix 1 rows are named in context.remaining_appendix_1_rows.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-core-legacy-slice-a
    statement: Local validator findings cannot hide below a global allowance.
    acceptance:
      - id: AC2
        statement: 'AC2: the canary''s except_swallow, optional_union and type_error defects are refused
          locally in omnibase_core -- falsifier: pre-commit run --files on the three canary files exits
          non-zero with one finding each'
      - id: AC3
        statement: 'AC3: no ratchet takes --max-violations N and a staged file can fail one commit --
          falsifier: git grep -n -e ''--max-violations'' in .pre-commit-config.yaml returns nothing, and
          a canary commit adding one finding to a baselined file is refused'
evidence_requirements:
  - kind: tests
    description: The staged-file canaries and shrink-only baseline regressions pass.
    command: uv run pytest tests/unit/handlers/test_core_legacy_ratchets.py --no-cov -o addopts='' -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-ac1-deferred-inventory
    description: AC1 is pending beyond Slice A. This check records the named remaining Appendix 1 rows,
      and does not assert that their migration is complete.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: command
        check_value: uv run python -c "from pathlib import Path; import yaml; c=yaml.safe_load(Path('contracts/OMN-22012.yaml').read_text());
          assert c['context']['deferred_acceptance']==['AC1']; assert c['context']['remaining_appendix_1_rows']"
  - id: dod-ac2-canaries
    description: The three canaries refuse through pre-commit --files with one finding each; clean controls
      pass.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_core_legacy_ratchets.py --no-cov -o addopts=''
          -q -k precommit_files
  - id: dod-ac3-staged-ratchet
    description: The configuration has no numeric violation allowance, and the commit-hook invocation
      refuses one added finding in a staged baselined file.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: command
        check_value: '! git grep -n -e ''--max-violations'' -- .pre-commit-config.yaml'
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_core_legacy_ratchets.py --no-cov -o addopts=''
          -q -k 'commit_hook or new_duplicate or baseline_edits'
  - id: dod-deploy-validator-runtime
    description: Validator runtime integration check, runnable on the hosted runner after uv sync installs
      this revision. No new bus node or service deployment; two-profile testing is not applicable.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/handlers/test_core_legacy_ratchets.py --no-cov -o addopts=''
          -q -k 'precommit_files or commit_hook'
  - id: dod-cli-logging-lifetime
    description: Repeated validator CLI calls restore the caller's handlers and level, leave its handlers
      open, and keep report verdicts and events readable after a naming CLI invocation.
    source: manual
    execution_scope: hosted_and_local
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_runtime_cli_logging.py tests/unit/validation/test_checker_naming_convention.py::TestMainFunction::test_main_logs_success
          tests/unit/validation/test_runtime_duplicate_config_ids_emits_omn22003.py tests/unit/validation/test_runtime_no_hardcoded_topics_emits_omn22003.py
          --no-cov -o addopts='' -q
  - id: dod-slice-b-staged-path-policy
    description: Slice B moves the hooks no-env-file and no-planning-docs, a shell script and an inline
      bash command, onto ValidatorStagedPathPolicy with the rule table staged_path_policy.validation.yaml.
      Both hook ids are unchanged and both rows leave context.remaining_appendix_1_rows. Bound to AC3
      for its staged-file half only, where a staged .env or docs/plans/ file now fails the commit through the
      file pre-commit passes to the validator. AC1 stays deferred.
    source: manual
    execution_scope: hosted_and_local
    binds_ac:
      - AC3
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/validation/test_validator_staged_path_policy.py --no-cov
          -o addopts='' -q
