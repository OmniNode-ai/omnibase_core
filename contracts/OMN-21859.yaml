          uv run pytest tests/ci -q and grep -rn verifier-version tests/ returning no caller assertion'
  - id: req-omn21859-lab-proof
    statement: The omnimarket dev-merge tag named by the caller must install from its own uv.lock on a
      lab host, and the caller tests must run as a lab-run unit.
    acceptance:
      - id: AC3
        statement: 'AC3: lab proof: the real install of tag dev-20261101000200-949993edf3b7 on the lab
          (clone at the tag commit, uv sync --frozen --no-dev --no-editable from its uv.lock) exits 0,
          and the repo caller tests run as an /omni:lab-run unit exit 0 -- falsifier: the /omni:lab-run
          receipt for the caller test command and the tag install command, each exit code 0'
