      carries verifier-tag, pass the omnimarket dev-merge tag as verifier-tag and carry no verifier-version
      key.
    acceptance:
      - id: AC1
        statement: 'AC1: .github/workflows/call-repo-evidence-gate.yml in omnibase_core calls OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@dev-20261101005012-ac2f26e3e5bf
          with verifier-tag dev-20261101000200-949993edf3b7 and no verifier-version key -- falsifier:
          uv run pytest tests/ci -q -k repo_evidence_caller'
  - id: req-omn21859-tests-assert-the-new-shape
    statement: Every test that asserted verifier-version for the caller must assert the verifier-tag shape
      and the absence of verifier-version, and the tests/ci suite must pass.
    acceptance:
      - id: AC2
        statement: 'AC2: every test in omnibase_core that asserted verifier-version now asserts verifier-tag
