  passes verifier-version. The tests that asserted verifier-version for the caller assert the verifier-tag
  shape instead. Operator ruling 2026-10-31T21:49:54Z extending OMN-21676, the definition-of-done check
  installs its verifier from the omnimarket dev-merge tag, not from a released package version.
