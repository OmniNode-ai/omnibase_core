requirements:
  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: a harness-delegate event with a prompt longer than 4000 characters is emitted with the whole prompt, or with a blob reference plus prompt_chars and prompt_sha256 that resolves to the whole prompt -- falsifier: a red-first pytest in the harness emitter suite that emits a 12000-character prompt and asserts the event reproduces it byte for byte or by sha256
      - id: "AC2"
        statement: |-
          AC2: the omnimarket delegation projection persists the full prompt and response, or the blob reference with length and sha256, into delegation_events without dropping the new keys -- falsifier: a red-first pytest in node_projection_delegation that projects an event with a 12000-character prompt and reads the row back, asserting length and sha256 equal the input
      - id: "AC3"
        statement: |-
          AC3: secret redaction still runs before storage, so a prompt that contains a credential-shaped string is stored with that string redacted -- falsifier: a pytest that projects a prompt with a planted credential and asserts the stored text and blob contain no trace of it
      - id: "AC4"
        statement: |-
          AC4: a prompt longer than 4000 characters round-trips on the dev lane from emit to a delegation_events readback with matching length and sha256 -- falsifier: a dev-lane run id and a read-only SELECT of prompt length and sha256 for that correlation id compared with the sent prompt
evidence_requirements:
