  - id: "req-transcribed-acceptance-criteria"
    statement: |-
      The acceptance criteria this ticket's author declared, transcribed from the ticket body at autobind time by occ-autobind. The ticket body is the source and this block is the copy; each criterion's id is the label the sibling binds_ac entry claims.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: The node's sync operation fetches refs/heads and refs/pull/*/head into a bare mirror under ONEX_STATE_DIR and never writes a ref into a canonical clone -- falsifier: uv run pytest tests over the node against a scratch upstream asserts the canonical clone's for-each-ref output is unchanged after sync
      - id: "AC2"
        statement: |-
          AC2: head-sha, changed-files, diff, conflicts and on-base return the same answers git computes directly over the same refs, and on-base reports true for a PR whose change is already on the base branch -- falsifier: uv run pytest over the node with a scratch upstream holding a clean PR, a conflicting PR and a superseded PR
      - id: "AC3"
        statement: |-
          AC3: A query against a mirror whose watermark is older than its max age refreshes the one PR ref by git fetch first, and falls back to the GitHub API only when that fetch fails, naming the source in its output -- falsifier: uv run pytest over the node with an aged watermark and an unreachable remote asserts source values mirror-refreshed and gh-fallback
      - id: "AC4"
        statement: |-
          AC4: On this Mac and on one lab host, head-sha for five open PRs matches git ls-remote on refs/pull/N/head with no GitHub API call -- falsifier: the five calls run with gh absent from PATH and no token in the environment and still return source mirror, compared against git ls-remote output
