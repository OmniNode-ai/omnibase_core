# Replay cases for the arch-handler-contract-compliance validator.
# expected/<id>.stdout.txt and expected_exit are the output and exit code of
# onex_change_control validators/arch_handler_contract_compliance.py at
# 9a8956cef4b3910ba862a482910be92bb7b34d96, run as
# `python -m ... --repo-root . [--allowlist-path allowlist.yaml] [flags]` in a directory
# materialised from trees/<tree>/ (each file name loses its .txt suffix).
# trees/omniintelligence-subset holds verbatim files of seven omniintelligence nodes at
# 9e4e646cfa1d0f13cf5661e946d71d721458124d; allowlists/omniintelligence.yaml.txt is that
# repository's arch-handler-contract-compliance-allowlist.yaml at the same revision.
- id: pass-compliant
  trees: [pass-compliant]
  expected_exit: 0
- id: fail-hardcoded-topic
  trees: [fail-hardcoded-topic]
  expected_exit: 1
- id: fail-hardcoded-topic-debt-listed
  trees: [fail-hardcoded-topic]
  allowlist: fixturepkg-fail-topic
  expected_exit: 0
- id: fail-hardcoded-topic-debt-file-absent
  trees: [fail-hardcoded-topic]
