# Canary defect file (OMN-21433, T0.2): the first hook pins an older rev than the second.
---
repos:
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 1111111111111111111111111111111111111111
    hooks:
      - id: canonical-file-shape
  - repo: https://github.com/OmniNode-ai/omnibase_core
    rev: 2222222222222222222222222222222222222222
    hooks:
      - id: check-direct-model-call
        args: [--repo, example]
