      - 'src/omniclaude/hooks/lib/onex_state.py:70: bare feature flag env var "KAFKA_ENABLED" -- declare
        in contract.yaml feature_flags: block and resolve via flag system'
      - ''
      - '4 violation(s). Declare flags in contract.yaml feature_flags: block and resolve via the flag
        system.'
