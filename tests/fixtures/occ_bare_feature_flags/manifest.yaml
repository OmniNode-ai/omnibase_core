# Cases replayed against the decisions of onex_change_control rev 8d7e85bc00e7
# check-bare-feature-flags. Every expected_rc and expected_stdout is the output of that pinned script,
# run on the materialised files (as_path relative to the working directory, as pre-commit passes
# them), never of the code under test. `base` names a verbatim fleet file (source_rev below) and
# `append` the lines added after it; a file without `base` is only its appended lines. The only
# real flag read in either repository is the exempted line of the protocol_domain_plugin base: both
# repositories pass the hook, so the lines that must be flagged are appended to real files.
# Lines copied from the fleet: process.env.OMNIWEB_DB_URL (omnibase_infra
# tests/unit/scripts/fixtures/fake-source/db.ts line 1).
bases:
  infra-model-lane-projection-readback-py.txt:
    repo: omnibase_infra
    source_rev: 77e3d5a849f7a37dbd3b0463fe1bb9d5022d083d
    source_path: src/omnibase_infra/nodes/node_chain_canary_effect/model_lane_projection_readback.py
  omniclaude-onex-state-py.txt:
    repo: omniclaude
    source_rev: b06de5dec077049f79ab7e89c8caf84a1ee85d2c
    source_path: src/omniclaude/hooks/lib/onex_state.py
  infra-protocol-domain-plugin-py.txt:
    repo: omnibase_infra
    source_rev: 77e3d5a849f7a37dbd3b0463fe1bb9d5022d083d
    source_path: src/omnibase_infra/runtime/protocol_domain_plugin.py
