    class: pass
    files:
      - as_path: src/omniclaude/hooks/lib/onex_state.py
        base: omniclaude-onex-state-py.txt
        append:
          - url = os.getenv("DATABASE_URL")
          - modes = os.environ.get("ENABLED_MODES")
          - off = os.getenv("DISABLED")
          - bare = os.getenv("ENABLE")
          - lower = os.getenv("enable_foo")
          - unquoted = os.getenv(ENABLE_FOO)
    args:
      - src/omniclaude/hooks/lib/onex_state.py
    expected_rc: 0
    expected_stdout_lines: []
  - id: pass-ts-process-env
