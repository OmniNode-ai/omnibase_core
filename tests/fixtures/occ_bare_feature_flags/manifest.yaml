    expected_rc: 0
    expected_stdout_lines: []
  - id: positive-control-py
    class: positive-control
    files:
      - as_path: src/omniclaude/hooks/lib/onex_state.py
        base: omniclaude-onex-state-py.txt
        append:
          - flag_a = os.getenv("ENABLE_REAL_TIME_EVENTS")
          - flag_b = os.environ.get("ENABLE_PATTERN_ENFORCEMENT")
          - flag_c = os.environ["ENABLE_FOO"]
          - flag_d = os.getenv("KAFKA_ENABLED")
    args:
      - src/omniclaude/hooks/lib/onex_state.py
    expected_rc: 1
    expected_stdout_lines:
      - 'src/omniclaude/hooks/lib/onex_state.py:67: bare feature flag env var "ENABLE_REAL_TIME_EVENTS"
        -- declare in contract.yaml feature_flags: block and resolve via flag system'
      - 'src/omniclaude/hooks/lib/onex_state.py:68: bare feature flag env var "ENABLE_PATTERN_ENFORCEMENT"
        -- declare in contract.yaml feature_flags: block and resolve via flag system'
      - 'src/omniclaude/hooks/lib/onex_state.py:69: bare feature flag env var "ENABLE_FOO" -- declare
