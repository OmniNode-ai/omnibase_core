---
schema_version: 1.0.0
ticket_id: OMN-22958
title: "Piece 11's reading: a lab pass receipt exists per runtime-affecting sha and a fresh exact-sha
  functional probe of the running runtime reads each 24 hours"
summary: A pure compute node reads the runtime-affecting merges, the lab pass receipts and the functional
  probes at a read time, and reads WORKING, NOT WORKING or UNKNOWN. It carries its own golden and error
  chain tests, each with named mutations that turn it red.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22958-dev-deploy-reading
    statement: Piece 11 reads NOT WORKING when a runtime-affecting merge past its deadline has no PASS
      receipt for its exact sha on the required lane inside the deadline, or when the newest probe is
      missing, stale, failing or saw another sha.
    acceptance:
      - id: AC1
        statement: 'AC1: the reading is NOT WORKING when no PASS receipt exists within an hour of a runtime-affecting
          merge or the 24-hour probe is missing or failing -- falsifier: uv run pytest src/omnimarket/nodes/node_dev_deploy_reading_compute
          -q -k receipt_and_probe'
      - id: AC2
        statement: 'AC2: generated golden and error chain tests exist and a named mutation turns each
          red -- falsifier: uv run pytest src/omnimarket/nodes/node_dev_deploy_reading_compute -q -k chain'
evidence_requirements:
  - kind: tests
    description: The receipt and probe rule tests and the golden and error chain tests with their named
      mutations
    command: uv run --frozen pytest tests/nodes/node_dev_deploy_reading_compute -q --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22958-receipt-and-probe
    description: A merge past its hour with no PASS receipt, a late receipt, a FAIL receipt, another lane's
      receipt, a missing, stale, failing or other-sha probe each read NOT WORKING; a merge inside its
      hour is pending and a good request reads WORKING.
    source: manual
    binds_ac:
      - AC1
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_dev_deploy_reading_compute -q --no-cov -k
          receipt_and_probe
        cwd: .
  - id: dod-omn22958-chains
    description: The golden chain and the error chain each hold their named mutations; every named mutation
      raises AssertionError in the chain it names.
    source: manual
    binds_ac:
      - AC2
    checks:
      - check_type: test_passes
        check_value: uv run --frozen pytest tests/nodes/node_dev_deploy_reading_compute -q --no-cov -k
          chain
        cwd: .
  - id: dod-omn22958-integration-proof
    description: Run this pull request's own tests on a lab host at the pushed head. Hosted CI cannot
      reach the lab, so only the local Done gate runs this unbound check.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: env PYTHONDONTWRITEBYTECODE=1 onex lab-work run --repo OmniNode-ai/omnimarket --sha
          "$(git rev-parse HEAD)" --lane dod-integration-proof-22958 --kind test -- env PYTHONDONTWRITEBYTECODE=1
          uv run --frozen pytest tests/nodes/node_dev_deploy_reading_compute -q --no-cov
        cwd: .
