---
# The shape of an existing node contract (node_pipeline_fill in omnimarket): its metadata mapping already holds a
# depends_on key listing node names as plain strings. That key means something else, so the check must not read
# it as a declaration; the declaration key is declared_dependencies.
name: node_orchestrator_with_its_own_depends_on
node_type: orchestrator
metadata:
  depends_on:
    - node_first_step
    - node_second_step
