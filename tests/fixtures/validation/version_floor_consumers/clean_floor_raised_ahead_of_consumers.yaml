---
layer_map:
  github_org: OmniNode-ai
  repos:
    - repo: omnibase_core
      layer: 0
      distributions: [omnibase-core]
    - repo: omnibase_infra
      layer: 1
      distributions: [omnibase-infra]
    - repo: omnimarket
      layer: 2
      distributions: [omnimarket]
repo: omnimarket
base_pyproject: |
  [project]
  dependencies = ["omnibase-core>=0.47.39"]
head_pyproject: |
  [project]
  dependencies = ["omnibase-core>=0.47.44"]
consumers:
  - repo: omnibase_infra
    ref: origin/dev
    pyproject: |
      [project]
      dependencies = ["omnibase-core==0.47.44"]
