---
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: gate
        name: gate
        entry: uv run python -m checker
        language: system
        stages: [pre-push]
      - id: opt-in
        name: opt-in
        entry: uv run python -m checker
        language: system
        stages: [manual]
