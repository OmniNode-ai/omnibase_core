---
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: gate
        name: gate
        entry: |
          bash -c '
          if [ -n "$SKIP_PATTERN" ]; then
            exit 0
          fi
          ./gate.sh
          '
        language: system
