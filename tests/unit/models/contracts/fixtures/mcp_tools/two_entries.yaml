---
name: mcp_ledger_probe_effect
contract_version: {major: 1, minor: 0, patch: 0}
description: OMN-15920 two-operation MCP fixture
node_type: EFFECT_GENERIC
input_model: omnibase_core.models.ModelInput
output_model: omnibase_core.models.ModelOutput
mcp:
  expose: true
  tools:
    - tool_name: probe_note_send
      description: Send a note to a probe mailbox.
      timeout_seconds: 30
      input_model: probe_pkg.models.ModelProbeNoteSendInput
      output_model: probe_pkg.models.ModelProbeNoteSendOutput
      command_topic: onex.cmd.probe-pkg.probe-note-send.v1
