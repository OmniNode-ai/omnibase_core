      failed_topic: onex.evt.probe-pkg.probe-note-send-failed.v1
    - tool_name: probe_note_read
      description: Read notes from a probe mailbox.
      timeout_seconds: 15
      input_model: probe_pkg.models.ModelProbeNoteReadInput
      output_model: probe_pkg.models.ModelProbeNoteReadOutput
      command_topic: onex.cmd.probe-pkg.probe-note-read.v1
      completed_topic: onex.evt.probe-pkg.probe-note-read-completed.v1
      failed_topic: onex.evt.probe-pkg.probe-note-read-failed.v1
