#
# RULING 2026-10-16T07:07:09Z: "Ci runners should be for private repos only."
# For each public repository, the workflow jobs whose `runs-on` was or could
# resolve to a self-hosted label when check-public-runner-placement was
# introduced, read from the parsed `runs-on` of each repository's origin/dev:
#   omnibase_core 83cc0e9a05, omnibase_infra 65258a5ec3,
#   omniclaude 0fe8af4737, omnimarket 749f480bb0
# (122, 216, 103 and 37 jobs; 13 pin a literal self-hosted label, the rest
# compute `runs-on` from a variable or an event expression).
#
# Shrink-only: removing a job is allowed, adding one is not. CI refuses an
# entry the base branch's copy of this file does not have, and a public
# repository cannot edit this file, because it reads it from the pinned
# omnibase_core checkout. A baselined job that is new, or newly self-hosted,
# against the base still fails (rule re_added).
