# Typed routes of public-repository jobs off the lab runners (OMN-19998).
#
# RULING 2026-11-05T09:10:44Z: it must be impossible for the lab to run public
# repositories on GitHub Actions runners. check-public-lab-selection refuses a
# public workflow that selects a lab label or a lab variable unless one route here
# says what replaces that job. A route is outstanding work, not an excuse.
#
# Read from the pinned omnibase_core, so a public repository cannot edit it. Shrink
# only: rule route_added refuses an entry the base revision does not have, and rule
# route_stale warns when a route's job has moved so that the entry is removed.
#
# Counted against the public clones' default branches on 2026-11-05.
routes:
  - repository: omnibase_infra
    workflow: .github/workflows/application-acl-postgres16-proof.yml
    job: rebuilt-postgres16-proof
    kind: moves_to_hosted
    destination: ubuntu-latest
    plan_step: R5
    reason: Proof runs Docker only; its cloud runner group no longer takes public repositories.
  - repository: omnibase_infra
    workflow: .github/workflows/arm64-verify-runner-proof.yml
    job: legs
    kind: retires_with_runners
    destination: runner fleet
    plan_step: R6
    reason: Tests the runner fleet itself; it has nothing to convert and leaves with the fleet.
