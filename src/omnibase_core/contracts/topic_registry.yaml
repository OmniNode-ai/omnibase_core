---
# topic_registry.yaml — canonical ONEX event-bus topic registry.
#
# This file is the authoritative record of every ONEX topic that has been
# formally registered with:
#   - a durability tier (durable | transient | ephemeral)
#   - a schema_ref pointing at the canonical Pydantic model
#   - the owning service/system
#
# Resolution contract:
#   Topic names here must match the corresponding TopicBase enum value in
#   omnibase_core.topics (topics.py). The enum value is the wire name.
#
# Durability tiers:
#   durable   — broker retains data; consumers can replay (e.g. Kafka with
#               retention > 0).  Use for audit, projection, governance.
#   transient — broker drops data on consumer disconnect; no replay guarantee.
#   ephemeral — in-memory only; never routed through a durable broker.
#
# Adding a new topic:
#   1. Add a TopicBase entry in topics.py with the # onex-topic-sot marker.
#   2. Add an entry below in alphabetical order by topic name.
#   3. Set schema_ref to the fully-qualified Pydantic class name.
#   4. Run the topic drift check: python -m omnibase_core.validation.validator_hardcoded_topics
#   5. Cite this file in the PR body.

schema_version:
  major: 1
  minor: 0
  patch: 0

topics:
  # ---------------------------------------------------------------------------
  # Platform — runtime health
  # ---------------------------------------------------------------------------
  - topic: onex.evt.platform.log-entry.v1  # onex-topic-sot
    introduced_in: OMN-13703
    owner: omnibase_core
    durability_tier: durable
    schema_ref: omnibase_core.models.logging.model_structured_log_entry.ModelStructuredLogEntry
    description: >
      Structured log entry emitted by any ONEX handler or node onto the event bus.  Consumed by node_log_projection
      (omnimarket) to build queryable log state and by omnidash for live log streaming.
    tags:
      - platform
      - logging
      - projection

  - topic: onex.evt.platform.runtime-manifest-published.v1  # onex-topic-sot
    introduced_in: OMN-11194
    owner: omnibase_core
    durability_tier: durable
    schema_ref: ~
    description: >
      Emitted when the runtime node manifest is published or refreshed.
    tags:
      - platform
      - runtime

  - topic: onex.evt.platform.projection-degraded.v1  # onex-topic-sot
    introduced_in: OMN-11194
    owner: omnibase_core
    durability_tier: transient
    schema_ref: ~
    description: >
      Emitted when a projection enters a degraded state (lag, errors, staleness).
    tags:
      - platform
      - projection
      - health

  - topic: onex.evt.platform.projection-recovered.v1  # onex-topic-sot
    introduced_in: OMN-11194
    owner: omnibase_core
    durability_tier: transient
    schema_ref: ~
    description: >
      Emitted when a degraded projection recovers to healthy state.
    tags:
      - platform
      - projection
      - health

  # ---------------------------------------------------------------------------
  # Delegation — terminal events (OMN-15622, plan Task 1.2)
  #
  # Scope note: this is the BACKFILL disposition for the delegation terminal
  # family ONLY. OMN-15622's parent criterion — an explicit, machine-readable
  # relationship between the whole TopicBase enum and this registry, checked in
  # both directions — is NOT answered by these five rows and stays open on the
  # parent ticket.
  #
  # The v2 family is three topics because it is three wire classes. Both failure
  # classes on a single delegation-failed.v2 topic is a non-injective
  # class -> topic map and is refused by assert_published_events_injective
  # (runtime_fanout_resolver.py).
  # ---------------------------------------------------------------------------
  - topic: onex.evt.omnibase-infra.delegation-completed.v1  # onex-topic-sot
    introduced_in: OMN-12663
    owner: omnibase_infra
    durability_tier: durable
    schema_ref: omnibase_core.models.delegation.wire.model_delegation_completed.ModelDelegationCompleted
    description: >
      v1 terminal event emitted by node_delegation_orchestrator when a delegation run completes successfully. 
      Superseded for new producers by onex.evt.omnibase-infra.delegation-completed.v2; retained because
      live v1 producers and projections still read it.
    tags:
      - delegation
      - terminal
      - v1

  - topic: onex.evt.omnibase-infra.delegation-failed.v1  # onex-topic-sot
    introduced_in: OMN-12663
    owner: omnibase_infra
    durability_tier: durable
    schema_ref: omnibase_core.models.delegation.wire.model_delegation_failed.ModelDelegationFailed
    description: >
      v1 terminal event emitted by node_delegation_orchestrator when a delegation run fails at any stage. 
      One class carried both routed and unrouted failures; v2 splits them into two typed classes on two
      topics.
    tags:
      - delegation
      - terminal
      - v1

  - topic: onex.evt.omnibase-infra.delegation-completed.v2  # onex-topic-sot
    introduced_in: OMN-15622
    owner: omnibase_infra
    durability_tier: durable
    schema_ref: omnibase_core.models.delegation.wire.model_delegation_terminal_v2.ModelDelegationTerminalCompletedV2
    description: >
      v2 terminal event for a ROUTED delegation that completed and passed the quality bar.  Carries backend_ref,
      pricing_manifest_version and the typed quality-bar evaluation pair; quality_passed is narrowed to
      true on this class.
    tags:
      - delegation
      - terminal
      - v2

  - topic: onex.evt.omnibase-infra.delegation-failed-routed.v2  # onex-topic-sot
    introduced_in: OMN-15622
    owner: omnibase_infra
    durability_tier: durable
    schema_ref: omnibase_core.models.delegation.wire.model_delegation_terminal_v2.ModelDelegationTerminalFailedRoutedV2
    description: >
      v2 terminal event for a delegation that reached a backend and then failed. Carries terminal_failure_reason
      and exactly one arm of the closed routed-failure cause union.
    tags:
      - delegation
      - terminal
      - v2

  - topic: onex.evt.omnibase-infra.delegation-failed-unrouted.v2  # onex-topic-sot
    introduced_in: OMN-15622
    owner: omnibase_infra
    durability_tier: durable
    schema_ref: omnibase_core.models.delegation.wire.model_delegation_terminal_v2.ModelDelegationTerminalFailedUnroutedV2
    description: >
      v2 terminal event for a delegation that never reached a backend.  Carries unrouted_reason and no
      routed-only or quality field.
    tags:
      - delegation
      - terminal
      - v2
