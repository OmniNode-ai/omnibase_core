---
#
# Policy for check-hardcoded-model-config-compute (OMN-19252). Task A1 of
# knowledge-base-internal beta/plans/2026-09-23-remove-hardcoded-model-config.md,
# as amended by that plan's "Review decisions (2026-09-23)".
#
# This file IS the allowlist. There is no inline suppression marker: an exception
# is a change to this file, which every repository running the hook sees.
# path_classes are ordered and the first match wins; the last class is SOURCE.
#
# OMN-21147 (operator ruling 2026-10-15): a model id belongs in a contract
# overlay, never in a repository. No class tolerates one: the VENDOR_DEFAULT
# class of named files is gone, and tests, examples and launch files refuse
# model ids (M), private and lab-subnet hosts (E-LAN) and lab deployment facts
# (D) like source does. A test declares its own fixture ids. HISTORICAL records
# and this guard's own corpus scan nothing; DOC is prose and OVERLAY is the
# contract overlay tree itself, and both refuse retired values only.
# Pre-existing findings sit in each repository's shrink-only baseline.

schema_version: 1

path_classes:
  - name: HISTORICAL
    globs:
      - "evidence/**"
      - "drift/**"
      - "contracts/OMN-*.yaml"
      - "**/receipts/**"
      - "benchmarks/**/results/**"
      - "**/*.captured"
      # The work ledger is append-only state history: it is never rewritten, so
      # a retired value a past row quotes stays (OMN-21147, operator ruling
      # 2026-10-15).
      - "**/ROLLING_WORK_LEDGER.md"
      - "**/ROLLING_WORK_LEDGER_*.md"
    families: []

  - name: GUARD
    globs:
      - "src/omnibase_core/validation/hardcoded_model_config/**"
      - "tests/unit/validation/hardcoded_model_config/**"
      # The baseline holds paths and hashes only; a path naming a model family
      # must not make the baseline a finding of itself.
      - "config/hardcoded_model_config_baseline.yaml"
      # The private denylist is the list of retired values this guard refuses, so
      # it names them by construction.
      - "vocabularies/hardcoded_model_config_lab_denylist.yaml"
      # The contracts_and_di checker's planted model-name violation (OMN-21623): the
      # fixture exists to prove that checker refuses a model id, so it holds one.
      - "tests/fixtures/validation/contracts_and_di/violation_literal_model_name.py.txt"
    families: []

  # The contract overlay tree is the sanctioned home of deployment facts: model
  # ids, endpoints, lab hosts and ports (OMN-20910; operator rulings
  # 2026-09-26, 2026-09-30 and 2026-10-10, and OMN-21147's "it lives in a
  # contract overlay"). It is not source, so it refuses retired values only.
  # Only the tree at the repository root: a look-alike deeper down is source.
  - name: OVERLAY
    globs:
      - "config/onex/overlays/**"
    families: [R]

  - name: EXAMPLE
    globs:
      - "**/*.example.yaml"
      - "**/*.example.json"
      - "**/.env.example"
      - "**/examples/config-overlays/**"
    families: [M, E-LAN, D, R]

  # A file that starts a model server takes the model it serves from an
  # overlay, like any other configuration (OMN-21147). It may name an endpoint.
  - name: LAUNCH
    globs:
      - "deploy/systemd/*.service"
      - "k8s/**"
    families: [M, E-LAN, D, R]

  - name: DOC
    globs:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
    families: [R]

  - name: TEST
    globs:
      - "tests/**"
      - "**/tests/**"
      - "**/node_tests/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"
      - "**/fixtures/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.stories.tsx"
    families: [M, E-LAN, D, R]

  - name: SOURCE
    globs:
      - "**"
    families: [M, E, E-LAN, D, R, L, T, N, O, G, F, P, S, H, B]

# Family M: the plan's P1 model-family regex, applied case-insensitively.
model_id_pattern: >-
  qwen[0-9]|qwen-|qwen2|qwen3|deepseek-(v|r|coder|chat)|glm-[0-9]|gpt-4|gpt-5|gpt-3\.5|o[134]-mini|claude-(opus|sonnet|haiku|3|4|5)|gemini-[0-9]|llama-?[0-9]|llama3|mistral-|nemotron|phi-[0-9]|codestral|devstral|text-embedding-|nomic-embed|bge-|gte-qwen|kimi-k|minimax-m

# Family E: a URL literal whose path ends in one of these, or a URL-valued
# literal assigned to one of these keys, or a URL default of an environment read.
endpoint_path_suffixes:
  - "/v1/chat/completions"
  - "/v1/completions"
  - "/v1/embeddings"
  - "/v1/models"
endpoint_keys:
  - endpoint_url
  - base_url
  - default_url
  - api_base

# Family E-LAN: an RFC 1918 address in a literal, inside a URL or bare, is
# detected in code; this pattern adds any literal on our own lab subnet, with or
# without a scheme or a port.
lab_subnet_pattern: '(?<![\d.])192\.168\.86\.\d{1,3}(?![\d])'

# Family R: exact retired lab strings (plan section 2.2). Matched in comments
# too, and never admitted to a baseline. A bare ":8099" or ":8101" is NOT listed:
# those are live projection-runner health ports (plan premise P4). The dead
# endpoints of a particular deployment are not listed here: the loader adds them
# from the operator's private vocabulary
# (vocabularies/hardcoded_model_config_lab_denylist.yaml under the workspace
# config root) when it is present, and runs these shape rules without it.
# Family D: lab deployment facts, a lab host name or a lab port. The public
# policy spells none: the loader reads them from the operator's private
# vocabulary (lab_host_names, lab_ports in the denylist file named above). A run
# without that vocabulary does not judge D baseline entries.
lab_host_names: []
lab_ports: []

retired_values:
  - "local-ds-v4-flash"
  - "deepseek-v4-flash"
  - "deepseek-v4-pro"
  - "Qwen3.8-27B-8bit"
  - "ds4-flash"
  - "qwen38-serve"
  - "BIFROST_LOCAL_DS_V4_FLASH"

# Families O, G, F, P, S, H and B (OMN-21537, K6) apply to SOURCE only. Their
# vocabularies are the rule rows of validation/contracts/hardcoded_model_literals.validation.yaml
# (patterns, name lists, thresholds, remediation) and three facts the runtime reads: the
# first-party organisation and the registry repository names, both from
# contracts/repo_layers.yaml, and, for H, lab_host_names above.
# This policy names no organisation.

# Family T (OMN-21463, K6): a model tier alias is a model choice. It is refused as
# the value of one of tier_keys, inside a Literal[...] and inside a tuple, list or
# set. The aliases are the Claude rungs of the engine ladder and the host-engine
# ids that name them; the operator's private vocabulary may add more.
tier_aliases:
  - sonnet
  - opus
  - haiku
  - claude_sonnet
  - claude_opus
  - claude_haiku

tier_keys:
  - ceiling
  - floor
  - model
  - engine
  - ladder
  - order
  - tier
  - default_tier
  - rung

# Family N (OMN-21463, K6): an engine name of the engine ladder (the rungs and
# host engines of node_remote_lane_compute's engine_ladder that are not tier
# aliases), as a whole string value, an enum member, a Literal[...] member or an
# alias-dict key. A tier alias used as an alias-dict key is family N too. The
# ladder is contract data; this list is the detector's vocabulary of it.
engine_names:
  - code-edit
  - glm
  - codex
  - antigravity
  - local-agent

# Files that implement the audited findings of plan D.3 for families O and G
# (omnibase_core#2105: URL and timeout in handlers, URL, retries and sleeps in the
# workflow; OMN-21537). They are fixed, so no baseline may name them: a baseline
# entry for one is an unreadable baseline, and a new finding in one fails.
unbaselinable_files:
  - .github/workflows/internal-sibling-pins.yml
  - .github/workflows/publish-downstream-pin-bump.yml
  - src/omnibase_core/nodes/node_dependency_pin_bump_effect/handler_dependency_pin_bump.py

# Text forms (OMN-21537): which files are read as Python syntax, which comment style a
# suffix has, and which files the gate scans at all. Data of the scanner, not code.
python_suffixes: [.py, .pyi]
slash_comment_suffixes: [.ts, .tsx, .js, .jsx, .mjs, .cjs]
no_comment_suffixes: [.json]
scanned_names: [Dockerfile, Containerfile]
scanned_suffixes:
  - .py
  - .pyi
  - .yaml
  - .yml
  - .json
  - .toml
  - .sh
  - .bash
  - .cfg
  - .ini
  - .conf
  - .service
  - .env
  - .tsv
  - .txt
  - .ts
  - .tsx
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .md
  - .mdx
  - .rst

# The comment header of a written baseline file.
baseline_header: |-
  # Baseline for check-hardcoded-model-config-compute (OMN-19252).
  # Plan: knowledge-base-internal beta/plans/2026-09-23-remove-hardcoded-model-config.md
  # (task A1 and the per-repository ratchet of tasks A3.x).
  #
  # RULE: entries only leave. A finding not listed here fails. An entry that no
  # longer matches its file fails until it is removed. CI refuses a pull request
  # whose copy of this file carries an entry its base branch did not. Retired lab
  # values (family R) are never admitted. Entries are keyed by line content
  # (sha1 of the stripped line), not by line number.
  #
  # Burn-down (OMN-21537): the entries of families O, G, F, P, S, H and B are the
  # measured findings of this install. Target zero: 2026-11-12. Burn-down ticket:
  # to be minted at 00:00Z on the next intake window; this line names it by id then.
  # No file the plan names as an audited finding (policy.yaml unbaselinable_files) is
  # admitted.
  #
  # Regenerate only to SHRINK it:
  #   python -m omnibase_core.validation.hardcoded_model_config.runtime_hardcoded_model_config \
  #     --all --baseline <this file> --write-baseline
