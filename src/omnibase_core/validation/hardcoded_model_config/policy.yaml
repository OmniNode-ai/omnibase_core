---
#
# Policy for check-hardcoded-model-config-compute (OMN-19252). Task A1 of
# knowledge-base-internal beta/plans/2026-09-23-remove-hardcoded-model-config.md,
# as amended by that plan's "Review decisions (2026-09-23)".
#
# This file IS the allowlist. There is no inline suppression marker: an exception
# is a change to this file, which every repository running the hook sees.
# path_classes are ordered and the first match wins; the last class is SOURCE.
#
# OMN-21147 (operator ruling 2026-10-15): a model id belongs in a contract
# overlay, never in a repository. No file is named into a class that tolerates
# one: the VENDOR_DEFAULT class is gone, and examples and launch files refuse
# model ids (M), private and lab-subnet hosts (E-LAN) and lab deployment facts
# (D) like source does. HISTORICAL records and this guard's own corpus scan
# nothing; DOC refuses retired values only.
# TEST does not yet refuse model ids: today's test findings would grow the
# shrink-only baseline, which the canonical-file-shape ratchet refuses, so that
# step waits on a follow-up of OMN-21147.

schema_version: 1

path_classes:
  - name: HISTORICAL
    globs:
      - "evidence/**"
      - "drift/**"
      - "contracts/OMN-*.yaml"
      - "**/receipts/**"
      - "benchmarks/**/results/**"
      - "**/*.captured"
    families: []

  - name: GUARD
    globs:
      - "src/omnibase_core/validation/hardcoded_model_config/**"
      - "tests/unit/validation/hardcoded_model_config/**"
      # The baseline holds paths and hashes only; a path naming a model family
      # must not make the baseline a finding of itself.
      - "config/hardcoded_model_config_baseline.yaml"
    families: []

  - name: EXAMPLE
    globs:
      - "**/*.example.yaml"
      - "**/*.example.json"
      - "**/.env.example"
      - "**/examples/config-overlays/**"
    families: [M, E-LAN, D, R]

  # A file that starts a model server takes the model it serves from an
  # overlay, like any other configuration (OMN-21147). It may name an endpoint.
  - name: LAUNCH
    globs:
      - "deploy/systemd/*.service"
      - "k8s/**"
    families: [M, E-LAN, D, R]

  - name: DOC
    globs:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
      - "docs/**"
      - "app/(marketing)/**"
    families: [R]

  - name: TEST
    globs:
      - "tests/**"
      - "**/tests/**"
      - "**/node_tests/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"
      - "**/fixtures/**"
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.spec.ts"
      - "**/*.stories.tsx"
    families: [E-LAN, D, R]

  - name: SOURCE
    globs:
      - "**"
    families: [M, E, E-LAN, D, R, L]

# Family M: the plan's P1 model-family regex, applied case-insensitively.
model_id_pattern: >-
  qwen[0-9]|qwen-|qwen2|qwen3|deepseek-(v|r|coder|chat)|glm-[0-9]|gpt-4|gpt-5|gpt-3\.5|o[134]-mini|claude-(opus|sonnet|haiku|3|4|5)|gemini-[0-9]|llama-?[0-9]|llama3|mistral-|nemotron|phi-[0-9]|codestral|devstral|text-embedding-|nomic-embed|bge-|gte-qwen|kimi-k|minimax-m

# Family E: a URL literal whose path ends in one of these, or a URL-valued
# literal assigned to one of these keys, or a URL default of an environment read.
endpoint_path_suffixes:
  - "/v1/chat/completions"
  - "/v1/completions"
  - "/v1/embeddings"
  - "/v1/models"
endpoint_keys:
  - endpoint_url
  - base_url
  - default_url
  - api_base

# Family E-LAN: an RFC 1918 host inside a URL is detected in code; this pattern
# adds any literal on our own lab subnet, with or without a scheme or a port.
lab_subnet_pattern: '(?<![\d.])192\.168\.86\.\d{1,3}(?![\d])'

# Family R: exact retired lab strings (plan section 2.2). Matched in comments
# too, and never admitted to a baseline. A bare ":8099" or ":8101" is NOT listed:
# those are live projection-runner health ports (plan premise P4). The dead
# endpoints of a particular deployment are not listed here: the loader adds them
# from the operator's private vocabulary
# (vocabularies/hardcoded_model_config_lab_denylist.yaml under the workspace
# config root) when it is present, and runs these shape rules without it.
# Family D: lab deployment facts, a lab host name or a lab port. The public
# policy spells none: the loader reads them from the operator's private
# vocabulary (lab_host_names, lab_ports in the denylist file named above). A run
# without that vocabulary does not judge D baseline entries.
lab_host_names: []
lab_ports: []

retired_values:
  - "local-ds-v4-flash"
  - "deepseek-v4-flash"
  - "deepseek-v4-pro"
  - "Qwen3.8-27B-8bit"
  - "ds4-flash"
  - "qwen38-serve"
  - "BIFROST_LOCAL_DS_V4_FLASH"
