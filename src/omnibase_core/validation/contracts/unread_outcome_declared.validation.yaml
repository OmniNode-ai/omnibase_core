---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: unread_outcome_declared
  validator_name: Unread Outcome Declared Validator
  validator_description: Refuses a contract whose io_operations declare an external read without a top-level
    unread_outcome mapping naming what a failed or absent read yields and the test that holds the handler
    to that declaration. The read types, the key names, the test separator, the annotation marker and
    the remediation text are the rule rows of this file (OMN-24538).
  target_patterns:
    - '**/contract.yaml'
  exclude_patterns:
    - '**/tests/**'
    - '**/test/**'
    - '**/fixtures/**'
    - '**/__pycache__/**'
    - '**/.git/**'
    - '**/.venv/**'
    - '**/venv/**'
  rules:
    - rule_id: unread_outcome_declared
      description: >-
        A contract that declares an external read and does not declare what an unread input yields hides
        a fail-open, because the unread input silently becomes a value the caller never chose.
      severity: error
      enabled: true
      parameters:
        external_read_types:
          - filesystem_read
          - database_read
          - network_read
          - http_read
          - subprocess
          - kafka_consume
          - api_call
        io_operations: io_operations
        operation_type: operation_type
        unread_outcome: unread_outcome
        returns: returns
        test: test
        test_separator: '::'
        comment_prefix: '# '
        annotation_marker: 'failopen-ok'
        reason: this contract declares an external read and must declare what an unread input yields
        remediation: >-
          Add a top-level unread_outcome mapping whose returns names what a failed or absent read yields
          (a typed refusal or UNKNOWN) and whose test names "<repo-relative test file>::<test function>",
          or annotate the io_operations line with the failopen-ok comment and a reason.
    - rule_id: baseline_ratchet
      description: The findings that sat in the tree before this refusal are burn-down entries and the
        only ones admitted; the baseline holds exactly those, per file, and only shrinks. An entry follows
        its code when git records a move and is dropped when its file is gone.
      severity: error
      enabled: true
      parameters:
        baseline_path: '.onex_ratchets/unread_outcome_declared_baseline.yaml'
        base_ref: 'HEAD'
        move_similarity_percent: 10
        missing_message: >-
          {path} is baselined at {count} but the file does not exist: delete the entry; the baseline follows
          moved code and drops removed files.
        grew_message: >-
          {path} holds {count} findings, baselined at {baselined}: a baselined file never grows; fix the
          new finding instead of raising the entry.
        stale_message: >-
          {path} holds {count} findings, baselined at {baselined}: lower the entry to {count} (delete
          it at zero) in the same change; the baseline only shrinks.
        growth_message: "{path} is baselined at {count} and the base revision has {baselined}: the baseline
          only shrinks; fix the findings instead of adding or raising an entry."
  suppression_comments: []
  fail_on_error: true
  fail_on_warning: false
  max_violations: 0
  severity_default: error
  parallel_execution: false
