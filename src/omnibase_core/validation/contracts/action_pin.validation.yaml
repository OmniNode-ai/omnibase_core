---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: action_pin
  validator_name: Action Pin
  validator_description: |
    Workflow uses refs must be pinned (OMN-17427, OMN-21518). A third-party action is pinned to a full
    commit sha; a first-party action to a dev-merge tag the repository overlay admits. The overlay names
    the organisations, the tag pattern and the known exceptions; this contract carries the extraction
    patterns, the workflow-file filter, the remediation texts and the finding message templates.

  target_patterns:
    - ".github/workflows/*.yml"
    - ".github/workflows/*.yaml"
  exclude_patterns:
    - "**/__pycache__/**"
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/.venv/**"

  rules:
    - rule_id: uses_extraction
      description: Which files are workflow files and how a uses value is read from them.
      severity: error
      enabled: true
      parameters:
        report_validator_name: action-pins
        workflow_dir: .github/workflows
        workflow_suffixes: [".yml", ".yaml"]
        local_prefixes: ["./", ".\\"]
        block_uses_pattern: '^\s*(?:-\s*)?["'']?uses["'']?\s*:\s*(?:"([^"]*)"|''([^'']*)''|(\S+))'
        flow_uses_pattern: '[{,]\s*["'']?uses["'']?\s*:\s*(?:"([^"]*)"|''([^'']*)''|([^\s,}]+))'
    - rule_id: third_party_not_sha
      description: A third-party action ref must be a full commit sha.
      severity: error
      enabled: true
      parameters:
        full_sha_pattern: '[0-9a-fA-F]{40}'
        message_template: >-
          {location}: third-party {value} is not pinned to a full 40-hex commit sha
        remediation: >-
          Pin the action to the full 40-hex commit sha its tag resolves to, with the tag in a trailing
          comment.
    - rule_id: first_party_not_tag
      description: A first-party action ref must be a dev-merge tag matching the overlay's pattern.
      severity: error
      enabled: true
      parameters:
        message_template: >-
          {location}: first-party {value} is not a dev-merge tag matching {tag_pattern}
        remediation: >-
          Reference our own repositories by the dev-merge tag of the commit (dev-YYYYMMDDhhmmss-<sha12>),
          never by a sha or a branch.
        main_ref: main
    - rule_id: first_party_main_allowance
      description: A first-party main ref the overlay still allows is reported for later removal.
      severity: warning
      enabled: true
      parameters:
        message_template: >-
          {location}: first-party {value} rides main; replace it with a dev-merge tag and remove this
          allowance
    - rule_id: known_exception_used
      description: A first-party sha the overlay lists as a known exception.
      severity: warning
      enabled: true
      parameters:
        message_template: '{location}: first-party {value} is a known exception: {reason}'
    - rule_id: known_exception_stale
      description: A known exception no file uses any more is removed from the overlay.
      severity: warning
      enabled: true
      parameters:
        message_template: >-
          known exception {uses} ({reason}) is no longer used; remove it from the overlay #magic___^_^___line
  suppression_comments: []

  fail_on_error: true
  fail_on_warning: false
  max_violations: 0
  severity_default: error
  parallel_execution: true
