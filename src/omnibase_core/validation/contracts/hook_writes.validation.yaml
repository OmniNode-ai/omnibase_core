---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: hook_writes
  validator_name: Hook Writes Validator
  validator_description: Refuses a pre-commit hook whose entry or args rewrite files, and a known rewriting
    hook id run without its check-only argument. The scan set, the signals, the hook ids and the remediation
    text are the rule rows of this file (OMN-21498, plan task T2.6).
  target_patterns:
    - .pre-commit-config.yaml
    - .pre-commit-hooks.yaml
  exclude_patterns:
    - '**/.git/**'
    - '**/node_modules/**'
    - '**/.venv/**'
    - '**/venv/**'
    - '**/__pycache__/**'
  rules:
    - rule_id: hook_writes_zero_hooks
      description: A hook file that yields no hooks is refused, so a scan that reads nothing is never
        a pass.
      severity: error
      enabled: true
      parameters:
        kind: hook_count_floor
        min_hooks: 1
        reason: a scan that reads nothing is an error, never a pass
        remediation: Point the hook at a pre-commit file that declares hooks, or remove the file from
          the hook's scan set.
    - rule_id: hook_writes_ruff_format_writes
      description: Ruff format rewrites the files it is given unless it runs with --check or --diff.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: \bruff\s+format\b
        unless: (?<![\w-])--(?:check|diff)\b
        reason: ruff format rewrites the files it is given unless it runs with --check or --diff
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_fix_flag
      description: A --fix flag makes the tool rewrite the files it is given.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: (?<![\w-])--fix\b
        unless: (?<![\w-])--(?:no-fix|fix=no)\b
        reason: a --fix flag makes the tool rewrite the files it is given
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_write_flag
      description: A --write or --in-place flag makes the tool rewrite the files it is given.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: \s--(?:write|in-place|inplace)\b
        reason: a --write or --in-place flag makes the tool rewrite the files it is given
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_in_place_edit
      description: Sed -i and perl -i edit the named files in place.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: \b(?:sed|perl)\b[^|;&]*\s-[A-Za-z]*i
        reason: sed -i and perl -i edit the named files in place
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_remove_files
      description: Rm deletes files outside a temporary directory the entry itself created.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: \brm\s+(?:-[A-Za-z]+\s+)*+(?![\\"']*\$|/tmp/|/dev/)
        reason: rm deletes files outside a temporary directory the entry itself created
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_git_index_or_tree_write
      description: Git add, rm, mv and restore change the index or the working tree.
      severity: error
      enabled: true
      parameters:
        kind: command_signal
        pattern: \bgit\s+(?:add|rm|mv|restore)\b
        reason: git add, rm, mv and restore change the index or the working tree
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_end_of_file_fixer
      description: Pre-commit-hooks rewrites the final newline.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: end-of-file-fixer
        check_only_args: []
        reason: pre-commit-hooks rewrites the final newline
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_trailing_whitespace
      description: Pre-commit-hooks strips trailing whitespace.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
