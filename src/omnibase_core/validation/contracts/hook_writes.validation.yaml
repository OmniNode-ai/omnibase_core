        reason: pre-commit-hooks rewrites line endings unless --fix=no
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_fix_byte_order_marker
      description: Pre-commit-hooks strips the byte order marker.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: fix-byte-order-marker
        check_only_args: []
        reason: pre-commit-hooks strips the byte order marker
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_fix_encoding_pragma
      description: Pre-commit-hooks rewrites the encoding pragma.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: fix-encoding-pragma
        check_only_args: []
        reason: pre-commit-hooks rewrites the encoding pragma
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_pretty_format_json
      description: Pre-commit-hooks rewrites json files unless --no-autofix.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: pretty-format-json
        check_only_args:
          - --no-autofix
        reason: pre-commit-hooks rewrites json files unless --no-autofix
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_requirements_txt_fixer
      description: Pre-commit-hooks sorts requirements files in place.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: requirements-txt-fixer
        check_only_args: []
        reason: pre-commit-hooks sorts requirements files in place
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_double_quote_string_fixer
      description: Pre-commit-hooks rewrites string quotes.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: double-quote-string-fixer
        check_only_args: []
        reason: pre-commit-hooks rewrites string quotes
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
