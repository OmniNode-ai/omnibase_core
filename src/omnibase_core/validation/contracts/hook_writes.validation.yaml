        reason: pre-commit-hooks strips trailing whitespace
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_mixed_line_ending
      description: Pre-commit-hooks rewrites line endings unless --fix=no.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: mixed-line-ending
        check_only_args:
