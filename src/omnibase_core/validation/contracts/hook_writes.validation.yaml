    - rule_id: hook_writes_id_yamlfmt
      description: Yamlfmt rewrites yaml files unless it runs with -lint.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: yamlfmt
        check_only_args:
          - -lint
        reason: yamlfmt rewrites yaml files unless it runs with -lint
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_black
      description: Black rewrites python files unless it runs with --check or --diff.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: black
        check_only_args:
          - --check
          - --diff
        reason: black rewrites python files unless it runs with --check or --diff
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_isort
      description: Isort rewrites imports unless it runs with --check or --diff.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: isort
        check_only_args:
          - --check
          - --check-only
          - --diff
        reason: isort rewrites imports unless it runs with --check or --diff
        remediation: 'Make the hook check-only: run the tool in its check or diff mode, or refuse with
          a message that names the command that fixes the file. A hook never rewrites the tree it checks.'
    - rule_id: hook_writes_id_ruff_format
      description: Ruff-format rewrites python files unless it runs with --check or --diff.
      severity: error
      enabled: true
      parameters:
        kind: rewriting_hook_id
        hook_id: ruff-format
        check_only_args:
