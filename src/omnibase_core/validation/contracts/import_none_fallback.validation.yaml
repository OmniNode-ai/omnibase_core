---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: import_none_fallback
  validator_name: Import None Fallback Validator
  validator_description: Refuses an ImportError handler that assigns a symbol to None. The scope, the
    names, the annotation marker and the remediation text are the rule rows of this file (OMN-22005, plan
    task T2.4; the report-mode script it replaces was OMN-10819).
  target_patterns:
    - '**/*.py'
  exclude_patterns:
    - '**/tests/**'
    - '**/test/**'
    - '**/__pycache__/**'
    - '**/.git/**'
    - '**/.venv/**'
    - '**/venv/**'
  rules:
    - rule_id: import_none_fallback
      description: An ImportError handler that assigns a symbol to None moves the failure from import
        time to the call site.
      severity: error
      enabled: true
      parameters:
        import_errors: [ImportError, ModuleNotFoundError]
        comment_prefix: '# '
        annotation_marker: 'import-fallback-ok'
        reason: an ImportError handler assigns a symbol to None
        remediation: >-
          Replace the None assignment with a raise of ImportError or a real fallback, or annotate the
          assignment line with the import-fallback-ok comment and a reason.
    - rule_id: baseline_ratchet
      description: The findings that sat in the tree before this refusal are burn-down entries and the
        only ones admitted; the baseline holds exactly those, per file, and only shrinks. An entry follows
        its code when git records a move and is dropped when its file is gone.
      severity: error
      enabled: true
      parameters:
        baseline_path: '.onex_ratchets/import_none_fallback_baseline.yaml'
        base_ref: 'HEAD'
        move_similarity_percent: 10
        missing_message: >-
          {path} is baselined at {count} but the file does not exist: delete the entry; the baseline follows
          moved code and drops removed files.
        grew_message: >-
          {path} holds {count} findings, baselined at {baselined}: a baselined file never grows; fix the
          new finding instead of raising the entry.
        stale_message: >-
          {path} holds {count} findings, baselined at {baselined}: lower the entry to {count} (delete
          it at zero) in the same change; the baseline only shrinks.
        growth_message: "{path} is baselined at {count} and the base revision has {baselined}: the baseline
          only shrinks; fix the findings instead of adding or raising an entry."
  suppression_comments: []
  fail_on_error: true
  fail_on_warning: false
  max_violations: 0
  severity_default: error
  parallel_execution: false
