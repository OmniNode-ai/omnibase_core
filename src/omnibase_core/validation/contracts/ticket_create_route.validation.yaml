---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: ticket_create_route
  validator_name: Ticket create route validator
  validator_description: Refuses a direct Linear create outside the ticket node's handler. The create
    token, the one path that may hold it and the remediation text are the rule rows of this file. There
    is no baseline and no annotation, so a repository adopts the hook only when it holds no site (OMN-23770).
  target_patterns:
    - '**/*.py'
    - '**/*.sh'
  exclude_patterns:
    - '**/tests/**'
    - '**/test/**'
    - '**/__pycache__/**'
    - '**/.git/**'
    - '**/.venv/**'
    - '**/venv/**'
  rules:
    - rule_id: ticket_create_route
      description: A Linear create issued from anywhere but the ticket node's handler skips the admission
        policy, the draft and the receipt the node writes.
      severity: error
      enabled: true
      parameters:
        create_tokens: [issueCreate]
        allowed_path_patterns:
          - '**/nodes/node_create_ticket/handlers/*.py'
        comment_prefix: '#'
        reason: a direct Linear create outside the ticket node's handler
        remediation: >-
          Send the ticket as a typed draft to the ticket node (node_create_ticket) over the bus; the node's
          handler is the only place the create call may stand.
  suppression_comments: []
  fail_on_error: true
  fail_on_warning: false
  max_violations: 0
  severity_default: error
  parallel_execution: false
