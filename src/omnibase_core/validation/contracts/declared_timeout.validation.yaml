---
contract_kind: validation_subcontract
validation:
  version:
    major: 1
    minor: 0
    patch: 0
  validator_id: declared_timeout
  validator_name: Declared Timeout Validator
  validator_description: Refuses a blocking subprocess or network call that carries no time limit inside
    a node whose contract or overlay declares one. The call names, the keyword, the declaring-key pattern,
    the annotation marker and the remediation text are the rule rows of this file (OMN-23187).
  target_patterns:
    - '**/nodes/**/*.py'
  exclude_patterns:
    - '**/tests/**'
    - '**/test/**'
    - '**/__pycache__/**'
    - '**/.git/**'
    - '**/.venv/**'
    - '**/venv/**'
  rules:
    - rule_id: declared_timeout
      description: A limit declared in a node's contract or overlay that never reaches a blocking call
        bounds nothing.
      severity: error
      enabled: true
      parameters:
        contract_file: contract.yaml
        overlay_globs: ['overlays/*.yaml']
        declaring_key_pattern: '(.*_)?timeout(_(ms|s|sec|secs|seconds|min|minutes))?'
        blocking_calls:
          - subprocess.run
          - subprocess.call
          - subprocess.check_call
          - subprocess.check_output
          - urllib.request.urlopen
          - requests.get
          - requests.post
          - requests.put
          - requests.patch
          - requests.delete
          - requests.head
          - requests.request
          - httpx.get
          - httpx.post
          - httpx.put
          - httpx.patch
          - httpx.delete
          - httpx.head
          - httpx.request
          - socket.create_connection
        timeout_keyword: timeout
        comment_prefix: '# '
        annotation_marker: 'timeout-ok'
        reason: the node declares a time limit and this blocking call carries none
        remediation: >-
          Pass the declared limit to the call as timeout=, or annotate the call line with the timeout-ok
          comment and a reason.
    - rule_id: baseline_ratchet
      description: The findings that sat in the tree before this refusal are burn-down entries and the
        only ones admitted; the baseline holds exactly those, per file, and only shrinks. An entry follows
        its code when git records a move and is dropped when its file is gone.
      severity: error
      enabled: true
      parameters:
        baseline_path: '.onex_ratchets/declared_timeout_baseline.yaml'
        base_ref: 'HEAD'
        move_similarity_percent: 10
        missing_message: >-
          {path} is baselined at {count} but the file does not exist: delete the entry; the baseline follows
          moved code and drops removed files.
        grew_message: >-
          {path} holds {count} findings, baselined at {baselined}: a baselined file never grows; fix the
          new finding instead of raising the entry.
        stale_message: >-
          {path} holds {count} findings, baselined at {baselined}: lower the entry to {count} (delete
          it at zero) in the same change; the baseline only shrinks.
        growth_message: "{path} is baselined at {count} and the base revision has {baselined}: the baseline
          only shrinks; fix the findings instead of adding or raising an entry."
  suppression_comments: []
  fail_on_error: true
  fail_on_warning: false
  max_violations: 0
  severity_default: error
  parallel_execution: false
