#
# Inventory of the validators resident in omnimarket (OMN-21503, plan task T-Q6;
# plan section 0a, RULING 2026-10-28T13:48:11Z). Read from the omnimarket dev
# branch on 2026-10-29: the check/validate/detect/verify scripts under
# scripts/ci and scripts/validation, and the validator-shaped nodes.
#
# validator_class
#   validator  judges an artifact (a file, document, contract, manifest, text,
#              reference or code tree): it moves to omnibase_core in the generic
#              validator format and its omnimarket implementation is deleted.
#   decision   admits an action from runtime facts: it stays in omnimarket, and
#              the rules, thresholds and lists it applies are contract or overlay
#              data checked by the hard-coded-value validators.
#   other      neither (an executor, a request builder).
# replacing_core_validator names the existing omnibase_core validator that covers
# a validator entry (replacement_exists: true) or the checker that will replace it
# (replacement_exists: false). child_ticket is the migration child of OMN-21503;
# a validator entry without one is reported at the contract's
# child_ticket_severity until the orchestrator mints the children.
# The first-pass class comes from each artifact's name and opening description; a
# migration child ticket confirms or corrects it.
---
