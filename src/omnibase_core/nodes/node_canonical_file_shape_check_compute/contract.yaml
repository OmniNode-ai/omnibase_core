---
name: node_canonical_file_shape_check_compute
node_id: node_canonical_file_shape_check_compute
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
contract_version: {major: 1, minor: 0, patch: 0}
description: >
  Checks a repository revision against the canonical-file-shape rules (canonical locations, shrink-only
  baseline, suppression growth, handlers and command line entries outside a node, repository lifecycle)
  from supplied facts and the canonical_file_shape validator contract, and returns a ModelValidationReport
  with one finding per refused path and rule id.
input_model: omnibase_core.models.validation.model_canonical_file_shape_check_input.ModelCanonicalFileShapeCheckInput
output_model: omnibase_core.models.validation.model_validation_report.ModelValidationReport
handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  default_handler: handler:NodeCanonicalFileShapeCheckCompute
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 60000
