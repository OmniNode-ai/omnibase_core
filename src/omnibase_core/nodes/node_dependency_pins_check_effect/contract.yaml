---
name: node_dependency_pins_check_effect
node_id: node_dependency_pins_check_effect
node_type: effect
node_version: {major: 1, minor: 0, patch: 0}
contract_version: {major: 1, minor: 0, patch: 0}
tags: [validator_support_node]
description: >
  Reads the facts the dependency-pin check judges (OMN-22360): the release tags of each first-party dependency
  (git ls-remote) and the commit times of the pinned revisions and release tags of each bounded pre-commit
  hook repository (a history clone). The verdict is the pure checker validation/checker_dependency_pins.py;
  runtime_dependency_pins_check.py composes the two and writes the ModelValidationReport through node_validation_report_write_effect.
input_model: omnibase_core.models.dependency_pins.model_dependency_pin_facts_request.ModelDependencyPinFactsRequest
output_model: omnibase_core.models.dependency_pins.model_dependency_pin_facts_result.ModelDependencyPinFactsResult
handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  default_handler: handler:NodeDependencyPinsCheckEffect
descriptor:
  node_archetype: effect
  purity: side_effecting
  idempotent: true
  timeout_ms: 300000
