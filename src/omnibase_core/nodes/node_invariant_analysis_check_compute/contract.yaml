---
name: node_invariant_analysis_check_compute
node_id: node_invariant_analysis_check_compute
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
contract_version: {major: 1, minor: 0, patch: 0}
tags: [validator_node]
description: >
  Checks one plan or authority document against the invariant registry and the repository overlay and
  returns a ModelValidationReport with one finding per violation and rule id (OMN-21565).
input_model: omnibase_core.models.invariant_analysis.model_invariant_analysis_input.ModelInvariantAnalysisInput
output_model: omnibase_core.models.validation.model_validation_report.ModelValidationReport
handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  routing_strategy: payload_type_match
  handlers:
    - operation: invariant_analysis
      handler:
        name: HandlerInvariantAnalysis
        module: omnibase_core.handlers.handler_invariant_analysis
      event_model:
        name: ModelInvariantAnalysisInput
        module: omnibase_core.models.invariant_analysis.model_invariant_analysis_input
    - operation: invariant_analysis_rules
      handler:
        name: analyse_document
        module: omnibase_core.handlers.handler_invariant_analysis_rules
      event_model:
        name: ModelInvariantAnalysisInput
        module: omnibase_core.models.invariant_analysis.model_invariant_analysis_input
  default_handler: handler:NodeInvariantAnalysisCheckCompute
descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 60000
