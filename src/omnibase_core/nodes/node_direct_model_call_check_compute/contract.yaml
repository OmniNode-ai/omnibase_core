---

# ONEX contract for the direct_model_call_check COMPUTE node (OMN-20295).
# A model call must sit inside a sanctioned delegation node package. The
# paired EFFECT node (node_direct_model_call_check_effect) reads the repository,
# the policy and the baseline; this node judges them without I/O. The
# server-side backstop for calls no static gate can see is OMN-20299.

name: node_direct_model_call_check_compute
node_id: node_direct_model_call_check_compute
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
contract_version: {major: 1, minor: 0, patch: 0}

description: >
  Refuse a direct model call outside the sanctioned delegation node packages named in policy.yaml. Reads
  the AST and the repository's import and call graph, not literals: an HTTP request whose URL, body or
  base_url resolves to a model endpoint or provider host; the exec of a model CLI (crush, codex, claude
  -p, llama-cli and others) from Python or shell; a model SDK import; and any function in another file
  that calls one of those. Pre-existing sites live in a shrink-only per-repository baseline; crush sites
  name OMN-20290 for removal. Pure: no filesystem, network, environment or clock access.
input_model: omnibase_core.models.nodes.direct_model_call_check.model_direct_model_call_check_input.ModelDirectModelCallCheckInput
output_model: omnibase_core.models.nodes.direct_model_call_check.model_direct_model_call_check_output.ModelDirectModelCallCheckOutput

handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  default_handler: handler:HandlerDirectModelCallCompute

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 120000
