---

# ONEX contract for the backend_secret_discipline compute node.
# Validates that committed routing-authority config contains no literal credentials
# and that every cloud backend declares a logical secret reference.
#
# See: OMN-13305 — port check_backend_secret_discipline to core COMPUTE validator

name: node_backend_secret_discipline_compute
node_id: node_backend_secret_discipline_compute
node_type: compute
node_version: {major: 1, minor: 0, patch: 0}
contract_version: {major: 1, minor: 0, patch: 0}

description: >
  Backend secret-ref / credential-ref discipline gate (OMN-13305, ported from OMN-12971). Validates that
  committed routing-authority config contains no literal PEM/SA-JSON/bearer credentials, and that every
  authenticated cloud backend declares a logical secret reference (secret_ref / api_key_ref / credential_ref).
  ADC and API-key auth are mutually exclusive. api_key_env is NOT a logical reference (OMN-17931, OMN-17372
  AC3): it names a house environment variable, so a cloud backend declaring only api_key_env is reported
  as missing a reference and api_key_env beside a real reference is reported as migration debt. Returns
  a ModelBackendSecretDisciplineOutput verdict. #magic___^_^___line
handler_routing:
  version: {major: 1, minor: 0, patch: 0}
  routing_strategy: payload_type_match
  handlers:
    - operation: backend_secret_discipline
      handler:
        name: HandlerBackendSecretDisciplineCompute
        module: omnibase_core.nodes.node_backend_secret_discipline_compute.handler_backend_secret_discipline
      event_model:
        name: ModelBackendSecretDisciplineInput
        module: omnibase_core.models.validation.model_backend_secret_discipline_input
    - operation: shared_token_policy
      handler:
        name: HandlerSharedTokenPolicyCompute
        module: omnibase_core.nodes.node_backend_secret_discipline_compute.handler_shared_token_policy
      event_model:
        name: ModelSharedTokenPolicyRequest
        module: omnibase_core.models.validation.model_shared_token_policy_request
  default_handler: handler:NodeBackendSecretDisciplineCompute

input_model: omnibase_core.models.validation.model_backend_secret_discipline_input.ModelBackendSecretDisciplineInput
output_model: omnibase_core.models.validation.model_backend_secret_discipline_output.ModelBackendSecretDisciplineOutput

descriptor:
  node_archetype: compute
  purity: pure
  idempotent: true
  timeout_ms: 10000

# OMN-17427: shared workflow credential policy uses the existing secret-discipline node.
runtime_profiles: [local-dev]
event_bus:
  version: {major: 1, minor: 0, patch: 0}
  subscribe_topics: [onex.cmd.omnibase-core.shared-token-policy-requested.v1]
  publish_topics: [onex.evt.omnibase-core.shared-token-policy-completed.v1]
shared_token_policy:
  entries:
    - workflow: .github/workflows/auto-merge.yml
      location: /jobs/auto-merge/steps/2/env/GH_TOKEN
      reference: CROSS_REPO_PAT
      count: 1
      reason: Auto-merge and branch-update mutations must preserve downstream workflow events; the protection
        read requires administration scope.
    - workflow: .github/workflows/auto-merge.yml
      location: /jobs/auto-merge/steps/3/env/GH_TOKEN
      reference: CROSS_REPO_PAT
      count: 1
      reason: Auto-merge and branch-update mutations must preserve downstream workflow events; the protection
        read requires administration scope.
    - workflow: .github/workflows/ci.yml
      location: /jobs/route/secrets/CROSS_REPO_PAT
      reference: CROSS_REPO_PAT
      count: 1
      reason: Org runner inventory is outside the caller repository; the reusable probes organization
        runner capacity.
    - workflow: .github/workflows/advisory-job-gate.yml
      location: /jobs/advisory-job-gate/secrets
      reference: SECRETS_INHERIT
      count: 1
      reason: The pinned reusable requires inherited org App credentials for administration reads and
        declares no named secret inputs.
    - workflow: .github/workflows/ci.yml
      location: /jobs/public-repo-hygiene/secrets
      reference: SECRETS_INHERIT
      count: 1
      reason: The pinned reusable requires inherited org App credentials to read private vocabulary and
        declares no named secret inputs.
