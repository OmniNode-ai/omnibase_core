---
# OMN-21778: the addresses and ports that omnibase_core's connection models, service
# config defaults and loopback checks use. Each key is a ModelNetworkDefaults field; the
# model requires every key and refuses an unknown one, so this file is the only place
# these values live. A deployment overlays a value by constructing the model with its
# own mapping and injecting it where the module accepts one.
local_hosts:
  - localhost
  - 127.0.0.1
loopback_hosts:
  - localhost
  - 127.0.0.1
  - "::1"
service_bind_host: 0.0.0.0
http_port: 80
grpc_port: 50051
postgres_port: 5432
mysql_port: 3306
sqlite_placeholder_port: 0
node_registry_port: 8081
node_registry_prometheus_port: 9091
