# OMN-21623: wall-clock budgets of the operational probes, subprocess calls and
# lock waits in omnibase_core. Each key is a ModelOperationalTimeouts field; the
# model requires every key and refuses an unknown one, so this file is the only
# place the numbers live. A deployment overlays a value by constructing the model
# with its own mapping and injecting it where the module accepts one.
