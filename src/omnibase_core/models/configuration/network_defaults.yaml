---
# Network defaults omnibase_core models and handlers read instead of holding a
# host, an address or a port in code (OMN-21681). Loaded by ModelNetworkDefaults.
loopback_name: localhost
loopback_ipv4: 127.0.0.1
loopback_ipv6: "::1"
loopback_ipv6_alias: ip6-localhost
service_bind_address: 0.0.0.0
http_port: 80
grpc_port: 50051
postgresql_port: 5432
mysql_port: 3306
sqlite_placeholder_port: 0
node_registry_service_port: 8081
node_registry_prometheus_port: 9091
kafka_bootstrap_servers: localhost:19092
source_control_host: github.com
# URLs and URL templates (OMN-21783). Templates take str.format fields.
redacted_redis_url: "redis://***"
default_project_url_template: "https://github.com/example/{project_name}"
linear_graphql_url: "https://api.linear.app/graphql"
unknown_entrypoint_uri: "python://unknown"
unknown_namespace_uri: "python://omnibase.unknown"
sqlite_connection_url_template: "sqlite:///{database}"
mssql_connection_url_template: "mssql://?{params}"
broadcast_route_destination: "broadcast://all"
kafka_advertised_listener: "PLAINTEXT://localhost:9092"
file_url_prefix: "file:///"
example_telemetry_endpoint: "http://telemetry.example.com"
container_health_check_url_template: "http://{host}:{port}{path}"
yamlfmt_repository_url: "https://github.com/google/yamlfmt"
