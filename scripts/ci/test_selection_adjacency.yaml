# scripts/ci/test_selection_adjacency.yaml
# Selector POLICY config — shared_modules / thresholds / test_infrastructure_paths
# only. Operational-risk decisions that cannot be derived from the import graph.
#
# RETIRED (OMN-14921): this file previously also carried a hand-curated
# `adjacency:` reverse_deps map (module -> modules that import it). A live audit
# against the real `grimp` reverse-import closure found 26 of 40 declarations
# FALSE (e.g. `utils: {reverse_deps: []}` and `logging: {reverse_deps: []}` when
# the real graph shows ~37-38 real reverse deps each) — 1,343 of 1,441 unit test
# files (93%) were wrongly excludable as a result. Selection is now computed
# directly from the live import graph at file grain
# (scripts/ci/test_selection_closure.compute_closure_selection), not from a
# static map. `ModelAdjacencyMap.reject_adjacency_reintroduction` fails LOUD if
# an `adjacency:` key is ever added back to this file — do not add one.

schema_version: 1

# `shared_modules` is a FULL-SUITE ESCALATION POLICY, not an architectural ontology.
# Listing a module here means "if this module changes, run the full suite" — it does
# NOT claim the module is fundamentally more important than others, nor does it map
# to a permanent layering invariant. Curate based on operational risk + import fan-out.
# Removing a module from this list is allowed once we have shadow data showing its
# changes don't surface broad regressions.
#
# `enums` carries a NARROW, STRUCTURALLY-PROVEN discharge (OMN-16321) and is
# otherwise unchanged: a diff whose ONLY shared_modules entry is `enums`, and
# whose every changed enums/ file provably just APPENDS members (AST-compared
# base-vs-head by scripts/ci/enum_additive_diff.py — no rename, no removal, no
# value edit, no non-member edit anywhere in the module), falls through to the
# import-graph closure instead of escalating. Everything else about `enums`
# still escalates, including a diff this classifier cannot parse or has no
# --base-ref to compare against. The entry STAYS in this list: the discharge is
# conditional and evidence-bearing, not a demotion. Do not delete it thinking
# the rule is dead.
shared_modules:
  - models
  - contracts
  - enums
  - validation
  - runtime
  - event_bus

# Per-repo full-suite escalation thresholds.
thresholds:
  modules_changed_for_full_suite: 8

# Test infrastructure — any change to these paths forces the full suite via a
# bare path-prefix / exact match in detect_test_paths.py step 2.
#
# Two triggers are handled specially and are intentionally ABSENT from this list
# (OMN-14081):
#   * pyproject.toml — handled CONTENT-AWARE in detect_test_paths.py
#     (classify_pyproject_dependency_relevant): it escalates only when a
#     dependency-bearing table changed (dependencies / optional-dependencies /
#     dependency-groups / build-system / tool.* except tool.ruff /
#     requires-python), not on a bare `version` bump, entry-point registration,
#     lint-only [tool.ruff.*] edit, or metadata edit. Fail-closed:
#     unparseable/unavailable TOML still escalates.
#   * .github/ — removed to align with omnibase_infra (which omits it), so a
#     workflow change does not force the distributed full suite.
#     CORRECTED (OMN-16917): the old rationale here — "a workflow-only change
#     carries zero test-code delta" — was wrong in the direction that matters.
#     A workflow edit carries zero test-code delta but it CAN break the
#     ENFORCEMENT of tests, which is worse and invisible: OMN-15541 is the live
#     proof, where ci.yml hardcoded a pytest root the selector and pyproject did
#     not name and full-suite escalation itself collected ZERO of the top-level
#     tests/ tree. Per the OMN-16745 ruling (omnibase_infra#2988,
#     docs/reference/selector-workflow-diff-ruling.md), .github/** non-.md paths
#     are now classified CONTENT-AWARE in detect_test_paths.py step 5c: they
#     select the CI-contract class (`ci_contract_test_paths` — tests/ci/ plus the
#     tests/unit/ modules that read .github/** off disk), plus any test module
#     the diff itself touches, at file grain. The class may never be empty; an
#     empty or unenumerable class escalates. Absence from this list is therefore
#     NOT "no proof required" — the proof was substituted, not removed.
#
# scripts/ci/ NARROWED to the SELECTOR'S OWN FILES ONLY (OMN-14910, CI-C1 #1).
# OMN-14081 kept the whole `scripts/ci/` directory here as a "conservative — it
# houses the selector itself" full-suite trigger. Measured over 30 merged PRs,
# 6 of 7 `scripts/ci/` escalations touched files with zero relationship to test
# selection (ci_summary_gate.py, verify_flip_bundle.py, canonical_handler_shape.py,
# product_readiness.py, product_reason_graph.py, adequacy_receipts/*.json) — a
# full 40-way suite for a change the selector cannot be affected by. The list
# below keeps EXACTLY the selector surface as an unconditional trigger, so a
# change to the selection logic or its config still re-runs everything (a selector
# that narrowed on a change to ITSELF would be self-referentially fail-open):
#   - the legacy oracle + its loader/models re-export shims (scripts/ci/)
#   - the adjacency YAML (this file)
#   - the canonical node's pure algorithm (selector_core.py)
# The selector's model/enum deps (models/nodes/test_selector/*, enums/
# enum_full_suite_reason.py) live under `models`/`enums` which are shared_modules,
# so they already force the full suite via step 3 — no need to relist them here.
test_infrastructure_paths:
  - scripts/ci/detect_test_paths.py
  - scripts/ci/test_selection_loader.py
  - scripts/ci/test_selection_models.py
  # OMN-14921: the shadow file-grain closure module is selector surface — a
  # selector that narrowed on a change to its own (even shadow-only) code would
  # be self-referentially fail-open once promoted.
  - scripts/ci/test_selection_closure.py
  - scripts/ci/test_selection_adjacency.yaml
  - src/omnibase_core/nodes/node_test_selector_compute/selector_core.py
  # OMN-15661: this EFFECT boundary now resolves the always-run test paths the
  # closure cannot select (the mirror of the oracle's unnarrowable_test_paths),
  # so it is selection-affecting surface on the same footing as selector_core.py.
  - src/omnibase_core/nodes/node_test_selector_compute/runtime_test_selector.py
  - tests/conftest.py
  - tests/fixtures/
  - tests/pytest.ini
  - pytest.ini

# NO `adjacency:` key below this line — see the retirement note at the top of
# this file. `ModelAdjacencyMap.reject_adjacency_reintroduction` raises at
# load time if one is added back.
