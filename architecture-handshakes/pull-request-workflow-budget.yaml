# Count-locked ratchet over pull_request-triggered workflow files (C7 / OMN-14907).
#
# WHY THIS EXISTS
# ---------------
# Every `.github/workflows/*.yml` file that triggers on `pull_request` /
# `pull_request_target` fires a fresh check-run on every push to every PR. That
# per-commit fan-out is INDEPENDENT of required-status-check count (required
# status gates MERGING, not EXECUTION). omnibase_core's ~49-runs-per-PR standing
# baseline is the C7 cost driver in
# docs/plans/2026-07-21-ci-capacity-recovery-plan.md, and it grew by 7 files in
# five days through ordinary feature PRs — because CLAUDE.md's
# net-negative-surface rule was a RULE, not a MECHANISM.
#
# HOW THE RATCHET WORKS (enforced by
# src/omnibase_core/validation/validator_pull_request_workflow_ratchet.py and
# tests/validation/test_pull_request_workflow_ratchet.py):
#
#   * Every live PR-triggered workflow file MUST appear either in
#     `allowlisted_workflows` or in `waivers`. A new un-enumerated file fails
#     CLOSED (UNREGISTERED).
#   * `budget` is a hard count lock: len(allowlisted_workflows) == budget.
#     Registering a net-new file bumps the list to budget+1 and FAILS
#     (BUDGET_MISMATCH). The budget is frozen a SECOND time in the test suite, so
#     changing it is a deliberate two-file, reviewed edit — never a silent drift.
#     The ratchet is intended to move DOWN only.
#   * The ONLY sanctioned ways to add a PR-triggered workflow are:
#       (a) RETIRE an existing one in the same PR (net-negative: the workflow
#           file's `pull_request` trigger is removed, its allowlist line deleted,
#           and the budget lowered — then the new one takes the freed slot), or
#       (b) add the new file to `waivers` with a ticket + absolute `expires` date
#           + justification + what surface it `retires`. Waivers are TRACKED and
#           EXPIRING — a past-expiry waiver fails (WAIVER_EXPIRED).
#   * Deleting a workflow without removing its registry line fails (STALE), which
#     is how the count ratchets DOWN. An allowlisted file that stops triggering on
#     pull_request fails (NOT_PR_TRIGGERED) — remove it and lower the budget.
#
# This gate runs as a JOB INSIDE ci.yml and as a pre-commit hook — NEVER as its
# own new pull_request-triggered workflow file (that would be self-defeating, and
# a separate workflow's job is structurally invisible to ci.yml's ci-summary
# poller per OMN-14430).
#
# TO LOWER THE BUDGET (the goal — this is what C2/C3/C4 drain toward): remove the
# retired workflow's line here, decrement `budget`, and update EXPECTED_BUDGET in
# tests/validation/test_pull_request_workflow_ratchet.py in the same PR.

schema_version: 1

# Count lock. MUST equal len(allowlisted_workflows). Frozen a second time as
# EXPECTED_BUDGET in the test suite. Intended to move DOWN only.
# baseline captured 2026-07-21 at origin/dev@d09128fc.
budget: 30

# Every live `.github/workflows/*.yml` that triggers on pull_request /
# pull_request_target as of the baseline. This is the frozen ratchet floor: a new
# file may only enter by taking a slot freed by a retirement, or via `waivers`.
allowlisted_workflows:
  - auto-merge.yml
  - auto-tag-on-merge.yml
  - call-occ-preflight.yml
  - call-receipt-gate.yml
  - call-reject-skip.yml
  - canonical-inference-gate.yml
  - check-db-ownership.yml
  - check-handshake.yml
  - ci.yml
  - contract-validation.yml
  - cr-thread-gate-caller.yml
  - dep-provenance-gate.yml
  - deploy-gate.yml
  - main-target-guard.yml
  - no-faked-boundary.yml
  - omni-standards-compliance.yml
  - pr-title-check.yml
  - precommit-parity-gate.yml
  - product-readiness-shadow.yml
  - propagate-config.yml
  - receipt-honesty.yml
  - required-check-skip-guard-caller.yml
  - security-scan.yml
  - semantic-diff-labeler.yml
  - stale-todo-gate.yml
  - todo-audit-on-merge.yml
  - url-authority-gate.yml
  - validator-fsm-handler-drift.yml
  - validator-no-plugin-daemon-classes.yml
  - validator-runtime-profiles.yml

# Tracked, EXPIRING exceptions. A workflow here does NOT count toward `budget`,
# but each entry MUST carry workflow_file + ticket + absolute `expires` (ISO date)
# + justification + `retires` (the surface/manual step it removes, per the
# net-negative rule). A past-expiry waiver fails the gate. Empty at baseline —
# the sanctioned default is retire-one, not waive.
waivers:
  # validator-no-unguarded-git-subprocess.yml waiver (OMN-14891 original,
  # OMN-16280 renewal) PERMANENTLY CLOSED by OMN-16281: the workflow was
  # migrated into ci.yml as the `no-unguarded-git-subprocess` job (Option 1,
  # the OMN-14877 migration pattern). Budget stays flat at 31 -- ci.yml was
  # already an allowlisted_workflows entry, so no new slot was needed. The
  # standalone file is retired to workflow_dispatch-only. The
  # "no-unguarded-git-subprocess" required-context row stays in
  # .github/required-checks.yaml, repointed to `workflow: ci.yml` -- the
  # ci.yml job keeps the byte-identical job name, so the same directly-
  # required dev branch-protection context fires from ci.yml instead, with
  # zero branch-protection mutation. See
  # architecture-handshakes/standalone-validator-debt.yaml
  # (migrated_into_ci_yml).
  # call-occ-companion-effect.yml waiver (OMN-14990 origin, OMN-16359 renewals)
  # PERMANENTLY CLOSED by OMN-16359: #1730 (0e051b49) migrated the caller into
  # ci.yml as the `occ-companion-effect` job, keeping the byte-identical required
  # context "occ-companion-effect / Publish occ-companion-effect command"; its
  # required-checks.yaml row was repointed to ci.yml. ci.yml already carries the
  # same five pull_request activity types with no branches filter, so the trigger-
  # surface gap that blocked migration no longer exists. The 2026-09-21 "restore"
  # (#1731, e2fabbea) misread that migration as collateral deletion and re-added
  # the standalone file, which duplicated the same context in the same
  # concurrency group and cancelled against ci.yml (runs 36236317013 and
  # 36232360053 on omnibase_core#1784). The standalone file is deleted outright, not retired to
  # workflow_dispatch, because this repository's companion caller has no manual
  # replay. Budget stays flat at 30 because ci.yml was already allowlisted. Do NOT
  # restore the standalone file: re-adding it recreates the duplicate producer.
  - workflow_file: advisory-job-gate.yml
    ticket: OMN-18796
    expires: "2026-11-30"
    justification: >-
      The no-new-advisory-job gate (OMN-18777, epic OMN-18775), fanned out to this repository. Thin `uses:`
      caller of an omniclaude-hosted reusable pinned by full commit sha -- own concurrency group, no interaction
      with ci.yml's job graph -- exactly the shape of the two waivers above. It refuses a new `continue-on-error:
      true` that neither the committed census baseline nor a `# advisory-ok:` annotation names, and a
      new pull-request-reachable verification job that sits in neither of this repository's enforcement
      surfaces. Its context is asserted in EXPECTED_EXTERNAL_CONTEXTS in the same change, so it blocks
      a merge rather than reporting advisory-green, which is the failure class the epic exists to close.
      Waived rather than budget-bumped so the count lock stays flat. The natural closure is the OMN-16281
      pattern -- fold the caller into ci.yml as a job -- which is available here because the reusable
      needs no trigger surface wider than ci.yml's own; it is not taken in this change only because the
      fan-out lands the identical caller shape in five repositories at once.
    retires: >-
      The status quo in which a new advisory setting or a new never-enforced verification job lands in
      this repository with nothing naming it and no gate reading it -- the OMN-18775 inventory counted
      5 advisory settings and 1 unenforced pull-request-reachable verification job here, none of which
      any check could have refused.
  - workflow_file: call-occ-autobind.yml
    ticket: OMN-14160
    expires: "2026-11-30"
    justification: >-
      The OCC-autobind born-path caller, fanned out to this repository at last. OMN-14160's own Fix section
      names omnibase_core FIRST among six destinations; the 2026-07-24 fan-out reached the other five
      and skipped this one, and the ticket was marked Done anyway. Same shape as the three waivers above:
      a thin `uses:` caller of an omniclaude-hosted reusable, own concurrency group, no interaction with
      ci.yml's job graph. It is NOT a required status check and is deliberately absent from .github/required-checks.yaml
      -- it publishes a Kafka command for the .201 dev-lane effects runtime to consume out of band and
      can never block a merge, which is also why it can safely carry a job-level `if:` where the sibling
      companion-effect caller cannot (OMN-15120/OMN-14864). Waived rather than budget-bumped so the count
      lock stays flat. The OMN-16281 structural closure (fold the caller into ci.yml as a job) is blocked
      here by exactly the obstacle OMN-16359 already owns for the sibling caller: this workflow's pull_request
      surface is deliberately wider than ci.yml's -- `[opened, synchronize, reopened, ready_for_review]`
      with no `branches:` filter, closing the OMN-14987 draft-PR gap and the stacked-PR vector -- and
      it additionally carries a workflow_dispatch manual-replay job (OMN-14993) that ci.yml has no trigger
      for at all. Reconcile that gap under OMN-16359 and both callers close together.
    retires: >-
      The status quo in which this repository was the single fleet holdout with no autobind caller, and
      was therefore indistinguishable from a repository whose minter is broken. Measured 2026-09-19 over
      the last 200 change-control PRs: seven repositories receive autobind-flavoured evidence companions
      and omnibase_core receives zero, against five companion-effect mints for this same repository over
      the same window -- so the zero was this missing caller, not an unreachable minter. The cost it retires
      is concrete: with nothing binding the evidence-source trailer, an unstamped omnibase_core PR burns
      the full 1500-second occ-preflight eligibility budget and fails closed, and this repository instantiates
      the preflight reusable in 43 workflows, so one unstamped PR replicates that one fact dozens of times
      (live occurrence: omnibase_core#1709, 26 eligibility failures at the deadline to the second).
